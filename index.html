Statement: Emphasis is on recognizing patterns in data and making warranted inferences about changes in populations, and on evaluating empirical evidence supporting arguments about changes to ecosystems.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T13-LO06","x":"4 Reasoning and synthesis\na Students use reasoning to connect the appropriate evidence to the claim and construct an oral or\nwritten argument about the causal relationship between physical and biological components of an\necosystem and changes in organism populations, based on patterns in the evidence. In the argument,\nstudents describe* a chain of reasoning that includes:\ni. Specific changes in the physical or biological components of an ecosystem cause changes that can\naffect the survival and reproductive likelihood of organisms within that ecosystem (e.g.,\nscarcity of food or the elimination of a predator will alter the survival and reproductive\nprobability of some organisms).\nii. Factors that affect the survival and reproduction of organisms can cause changes in the\npopulations of those organisms.\niii. Patterns in the evidence suggest that many different types of changes (e.g., changes in multiple\ntypes of physical and biological components) are correlated with changes in organism\npopulations.\niv. Several consistent correlational patterns, along with the understanding of specific causal\nrelationships between changes in the components of an ecosystem and changes in the survival and\nreproduction of organisms, suggest that many changes in physical or biological components of\necosystems can cause changes in populations of organisms.\nv. Some small changes in physical or biological components of an ecosystem are associated with\nlarge changes in a population, suggesting that small changes in one component of an ecosystem\ncan cause large changes in another component.","k":"Core"}]},{"id":"SCI-G8-U9-L1","sub":"Science","g":8,"u":9,"un":"Evidence of evolution","l":1,"t":"Patterns in embryological development","role":"Single lesson","topic":"LS-G6-8-T21","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core","big":"10. Diversity of Life","dom":"Life Sciences","area":"Evidence of evolution","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-LSu-GRADE-6-8-YEAR 7-9","stmt":"Analyze displays of pictorial data to compare patterns of similarities in the embryological development across multiple species [Clarification Statement: Emphasis is on inferring general patterns of relatedness among embryos of different organisms by comparing the macroscopic appearance of diagrams or pictures.] [Assessment Boundary: Assessment of comparisons is limited to gross appearance of anatomical structures in embryological development.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T21-LO01","x":"1 Organizing data\na Students organize the given displays of pictorial data of embryos by developmental stage and by\norganism (e.g., early, middle, just prior to birth) to allow for the identification, analysis, and\ninterpretation of relationships in the data.","k":"Core"},{"c":"LS-G6–8-T21-LO02","x":"2 Identifying relationships\na Students analyze their organized pictorial displays to identify linear and nonlinear relationships,\nincluding:\ni. Patterns of similarities in embryos across species (e.g., early mammal embryos and early fish\nembryos both contain gill slits, whale embryos and the embryos of land animals — even some\nsnakes — have hind limbs).\nii. Patterns of changes as embryos develop (e.g., mammal embryos lose their gill slits, but the gill\nslits develop into gills in fish).","k":"Core"},{"c":"LS-G6–8-T21-LO03","x":"3 Interpreting data\na Students use patterns of similarities and changes in embryo development to describe* evidence for\nrelatedness among apparently diverse species, including similarities that are not evident in the fully\nformed anatomy (e.g., mammals and fish are more closely related than they appear to be based on their\nadult features, whales are related to land animals).","k":"Core"}]},{"id":"SCI-G8-U10-L1","sub":"Science","g":8,"u":10,"un":"Genetics & inheritance","l":1,"t":"Environmental and genetic factors in growth and variation","role":"Single lesson","topic":"LS-G6-8-T18","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"9. Inheritance","dom":"Life Sciences","area":"Genetics & inheritance","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSr-GRADE-6-8-YEAR 7-9","stmt":"Construct a scientific explanation based on evidence for how environmental and genetic factors influence the growth of organisms exploring the variation between individuals within a species being continuous or discontinuous, to include measurement and graphical representation of variation [Clarification Statement: Examples of local environmental conditions could include availability of food, light, space, and water. Examples of genetic factors could include large breed cattle and species of grass affecting growth of organisms. Examples of evidence could include drought decreasing plant growth, fertilizer increasing plant growth, different varieties of plant seeds growing at different rates in different conditions, and fish growing larger in large ponds than they do in small ponds.] [Assessment Boundary: Assessment does not include genetic mechanisms, gene regulation, or biochemical processes.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T18-LO01","x":"1 Articulating the explanation of phenomena\na Students articulate a statement that relates the given phenomenon to a scientific idea, including the\nidea that both environmental and genetic factors influence the growth of organisms.","k":"Core"},{"c":"LS-G6–8-T18-LO02","x":"b Students use evidence and reasoning to construct a scientific explanation for the given phenomenon.","k":"Core"},{"c":"LS-G6–8-T18-LO03","x":"2 Evidence\na Students identify and describe* evidence (e.g., from students’ own investigations, observations,\nreading material, archived data) necessary for constructing the explanation, including:\ni. Environmental factors (e.g., availability of light, space, water; size of habitat) and that they\ncan influence growth.\nii. Genetic factors (e.g., specific breeds of plants and animals and their typical sizes) and that\nthey can influence growth.\niii. Changes in the growth of organisms as specific environmental and genetic factors change.","k":"Core"},{"c":"LS-G6–8-T18-LO04","x":"b Students use multiple valid and reliable sources of evidence to construct the explanation.","k":"Core"},{"c":"LS-G6–8-T18-LO05","x":"3 Reasoning\na Students use reasoning, along with the assumption that theories and laws that describe the natural\nworld operate today as they did in the past and will continue to do so in the future, to connect the\nevidence and support an explanation for a phenomenon involving genetic and environmental influences on\norganism growth. Students describe* their chain of reasoning that includes:\ni. Organism growth is influenced by multiple environmental (e.g., drought, changes in food\navailability) and genetic (e.g., specific breed) factors.\nii. Because both environmental and genetic factors can influence organisms simultaneously, organism\ngrowth is the result of environmental and genetic factors working together (e.g., water\navailability influences how tall dwarf fruit trees will grow).\niii. Because organism growth can have several genetic and environmental causes, the contributions of\nspecific causes or factors to organism growth can be described only using probability (e.g., not\nevery fish in a large pond grows to the same size).","k":"Core"}]},{"id":"SCI-G8-U11-L1","sub":"Science","g":8,"u":11,"un":"Reproduction","l":1,"t":"Reproduction in humans and plants","role":"Single lesson","topic":"LS-G6-8-T10","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core","big":"9. Inheritance","dom":"Life Sciences","area":"Reproduction","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-LSj-GRADE-6-8-YEAR 7-9","stmt":"Use argument based on empirical evidence and scientific reasoning to support an explanation for how characteristic animal behaviors and specialized plant structures affect the probability of successful reproduction of animals and plants respectively — using reproduction in humans (structure and function of the reproductive systems, fertilization, and birth) and reproduction in plants (flower structure, pollination, fertilization, seed and fruit formation and dispersal) as the evidence base. Reproduction in plants, including flower structure, wind and insect pollination, fertilization, seed and fruit formation and dispersal, including quantitative investigation of some dispersal mechanisms. [Clarification Statement: Examples of behaviors that affect the probability of animal reproduction could include nest building to protect young from cold, herding of animals to protect young from predators, and vocalization of animals and colorful plumage to attract mates for breeding. Examples of animal behaviors that affect the probability of plant reproduction could include transferring pollen or seeds, and creating conditions for seed germination and growth. Examples of plant structures could include bright flowers attracting butterflies that transfer pollen, flower nectar and odors that attract insects that transfer pollen, and hard shells on nuts that squirrels bury.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T10-LO01","x":"1 Supported claims\na Students make a claim to support a given explanation of a phenomenon. In their claim, students include\nthe idea that characteristic animal behaviors and specialized plant structures affect the probability\nof successful reproduction of animals and plants respectively.","k":"Core"},{"c":"LS-G6–8-T10-LO02","x":"2 Identifying scientific evidence\na Students identify the given evidence that supports the claim (e.g., evidence from data and scientific\nliterature), including:\ni. Characteristic animal behaviors that increase the probability of reproduction.\nii. Specialized plant and animal structures that increase the probability of reproduction.\niii. Cause-and-effect relationships between: 1. Specialized plant structures and the probability of\nsuccessful reproduction of plants that have those structures. 2. Animal behaviors and the\nprobability of successful reproduction of animals that exhibit those behaviors. 3. Plant\nreproduction and the animal behaviors related to plant reproduction.","k":"Core"},{"c":"LS-G6–8-T10-LO03","x":"3 Evaluating and critiquing the evidence\na Students evaluate the evidence and identify the strengths and weaknesses of the evidence used to\nsupport the claim, including:\ni. Validity and reliability of sources.\nii. Sufficiency — including relevance, validity, and reliability — of the evidence to make and\ndefend the claim.\niii. Alternative interpretations of the evidence and why the evidence supports the student’s claim,\nas opposed to any other claims.","k":"Core"},{"c":"LS-G6–8-T10-LO04","x":"4 Reasoning and synthesis\na Students use reasoning to connect the appropriate evidence to the claim, using oral or written\narguments. Students describe* the following chain of reasoning in their argumentation:\ni. Many characteristic animal behaviors affect the likelihood of successful reproduction.\nii. Many specialized plant structures affect the likelihood of successful reproduction.\niii. Sometimes, animal behavior plays a role in the likelihood of successful reproduction in plants.\niv. Because successful reproduction has several causes and contributing factors, the cause-\nand-effect relationships between any of these characteristics, separately or together, and\nreproductive likelihood can be accurately reflected only in terms of probability.","k":"Core"}]},{"id":"SCI-G8-U12-L1","sub":"Science","g":8,"u":12,"un":"Variation & natural selection","l":1,"t":"Variation, survival and reproduction","role":"Single lesson","topic":"LS-G6-8-T22","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"10. Diversity of Life","dom":"Life Sciences","area":"Variation & natural selection","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSv-GRADE-6-8-YEAR 7-9","stmt":"Construct an explanation based on evidence that describes how genetic variations of traits in a population increase some individuals' probability of surviving and reproducing in a specific environment. [Clarification Statement: Emphasis is on using simple probability statements and proportional reasoning to construct explanations.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T22-LO01","x":"1 Articulating the explanation for phenomena\na Students articulate a statement that relates the given phenomenon to scientific ideas about the\ncause-and-effect relationship between the inheritance of traits increasing the chances of successful\nreproduction and natural selection.","k":"Core"},{"c":"LS-G6–8-T22-LO02","x":"b Students use evidence and reasoning to construct an explanation for the given phenomenon.","k":"Core"},{"c":"LS-G6–8-T22-LO03","x":"2 Evidence\na Students identify and describe* given evidence (e.g., from students’ own investigations, observations,\nreading materials, archived data) necessary for constructing the explanation, including:\ni. Individuals in a species have genetic variation that can be passed on to their offspring.\nii. The probability of a specific organism surviving and reproducing in a specific environment.\niii. The traits (i.e., specific variations of a characteristic) and the cause-and-effect\nrelationships between those traits and the probability of survival and reproduction of a given\norganism in a specific environment.\niv. The particular genetic variations (associated with those traits) that are carried by that\norganism.","k":"Core"},{"c":"LS-G6–8-T22-LO04","x":"3 Reasoning\na Students use reasoning to connect the evidence and support an explanation that describes* the\nrelationship between genetic variation and the success of organisms in a specific environment.\nStudents describe* a chain of reasoning that includes:\ni. Any population in a given environment contains a variety of available, inheritable genetic\ntraits.\nii. For a specific environment (e.g., different environments may have limited food availability,\npredators, nesting site availability, light availability), some traits confer advantages that\nmake it more probable that an organism will be able to survive and reproduce there.\niii. In a population, there is a cause-and-effect relationship between the variation of traits and\nthe probability that specific organisms will be able to survive and reproduce.\niv. Variation of traits is a result of genetic variations occurring in the population.\nv. The proportion of individual organisms that have genetic variations and traits that are\nadvantageous in a particular environment will increase from generation to generation due to\nnatural selection because the probability that those individuals will survive and reproduce is\ngreater.\nvi. Similarly, the proportion of individual organisms that have genetic variations and traits that\nare disadvantageous in a particular environment will be less likely to survive, and the\ndisadvantageous traits will decrease from generation to generation due to natural selection.","k":"Core"}]},{"id":"SCI-G8-U12-L2","sub":"Science","g":8,"u":12,"un":"Variation & natural selection","l":2,"t":"Natural selection and changing traits in populations — Part 1","role":"Part 1 of 2","topic":"LS-G6-8-T24","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core","big":"10. Diversity of Life","dom":"Life Sciences","area":"Variation & natural selection","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSx-GRADE-6-8-YEAR 7-9","stmt":"Use mathematical representations to support explanations of how natural selection may lead to increases and decreases of specific traits in populations over time — thereby recognizing the importance of maintaining biodiversity. [Clarification Statement: Emphasis is on using mathematical models, probability statements, and proportional reasoning to support explanations of trends in changes to populations over time.] [Assessment Boundary: Assessment does not include Hardy Weinberg calculations.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T24-LO01","x":"1 Representation\na Students identify the explanations for phenomena that they will support, which include:\ni. Characteristics of a species change over time (i.e., over generations) through adaptation by\nnatural selection in response to changes in environmental conditions.","k":"Core"},{"c":"LS-G6–8-T24-LO02","x":"ii. Traits that better support survival and reproduction in a new environment become more common\nwithin a population within that environment.\niii. Traits that do not support survival and reproduction as well become less common within a\npopulation in that environment.\niv. When environmental shifts are too extreme, populations do not have time to adapt and may become\nextinct.","k":"Core"},{"c":"LS-G6–8-T24-LO03","x":"b From given mathematical and/or computational representations of phenomena, students identify the\nrelevant components, including:\ni. Population changes (e.g., trends, averages, histograms, graphs, spreadsheets) gathered from\nhistorical data or simulations.\nii. The distribution of specific traits over time from data and/or simulations.\niii. Environmental conditions (e.g., climate, resource availability) over time from data and/or\nsimulations.","k":"Core"},{"c":"LS-G6–8-T24-LO04","x":"2 Mathematical Modeling\na Students use the given mathematical and/or computational representations (e.g., trends, averages,\nhistograms, graphs, spreadsheets) of the phenomenon to identify relationships in the data and/or\nsimulations, including:\ni. Changes and trends over time in the distribution of traits within a population.\nii. Multiple cause-and-effect relationships between environmental conditions and natural selection\nin a population.\niii. The increases or decreases of some traits within a population can have more than one\nenvironmental cause.","k":"Core"},{"c":"LS-G6–8-T24-LO05","x":"3 Analysis\na Students analyze the mathematical and/or computational representations to provide and describe*\nevidence that distributions of traits in populations change over time in response to changes in\nenvironmental conditions. Students synthesize their analysis together with scientific information\nabout natural selection to describe* that species adapt through natural selection. This results in\nchanges in the distribution of traits within a population and in the probability that any given\norganism will carry a particular trait.","k":"Core"}]},{"id":"SCI-G8-U12-L3","sub":"Science","g":8,"u":12,"un":"Variation & natural selection","l":3,"t":"Natural selection and changing traits in populations — Part 2","role":"Part 2 of 2","topic":"LS-G6-8-T24","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core","big":"10. Diversity of Life","dom":"Life Sciences","area":"Variation & natural selection","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSx-GRADE-6-8-YEAR 7-9","stmt":"Use mathematical representations to support explanations of how natural selection may lead to increases and decreases of specific traits in populations over time — thereby recognizing the importance of maintaining biodiversity. [Clarification Statement: Emphasis is on using mathematical models, probability statements, and proportional reasoning to support explanations of trends in changes to populations over time.] [Assessment Boundary: Assessment does not include Hardy Weinberg calculations.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T24-LO06","x":"b Students use the analysis of the mathematical and/or computational representations (including\nproportional reasoning) as evidence to support the explanations that:\ni. Through natural selection, traits that better support survival and reproduction are more common\nin a population than those traits that are less effective.\nii. Populations are not always able to adapt and survive because adaptation by natural selection\noccurs over generations.\nc Based on their analysis, students describe* that because there are multiple cause-and-effect\nrelationships contributing to the phenomenon, for each different cause it is not possible to predict\nwith 100% certainty what will happen.","k":"Core"}]},{"id":"SCI-G8-U13-L1","sub":"Science","g":8,"u":13,"un":"Chemical reactions","l":1,"t":"Exothermic and endothermic reactions in a device — Part 1","role":"Part 1 of 2","topic":"PS-G6-8-T5","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology","tim":"Essential","pis":"","cls":"Core","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSe-GRADE-6-8-YEAR 7-9","stmt":"Undertake a design project to construct, test, and modify a device that either releases or absorbs thermal energy by chemical processes, draw on exothermic and endothermic chemical reactions (qualitative treatment) and the energy changes that accompany them. [Clarification Statement: Emphasis is on the design, controlling the transfer of energy to the environment, and modification of a device using factors such as type and concentration of a substance. Examples of designs could involve chemical reactions such as dissolving ammonium chloride or calcium chloride.] [Assessment Boundary: Assessment is limited to the criteria of amount, time, and temperature of substance in testing the device.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T5-LO01","x":"1 Using scientific knowledge to generate design solutions\na Given a problem to solve that requires either heating or cooling, students design and construct a\nsolution (i.e., a device). In their designs, students:\ni. Identify the components within the system related to the design solution, including: 1. The\ncomponents within the system to or from which energy will be transferred to solve the problem.\n2. The chemical reaction(s) and the substances that will be used to either release or absorb\nthermal energy via the device.\nii. Describe* how the transfer of thermal energy between the device and other components within the\nsystem will be tracked and used to solve the given problem.","k":"Core"},{"c":"PS-G6–8-T5-LO02","x":"2 Describing* criteria and constraints, including quantification when appropriate\na Students describe* the given criteria, including:\ni. Features of the given problem that are to be solved by the device.\nii. The absorption or release of thermal energy by the device via a chemical reaction.","k":"Core"},{"c":"PS-G6–8-T5-LO03","x":"b Students describe* the given constraints, which may include:\ni. Amount and cost of materials.\nii. Safety.\niii. Amount of time during which the device must function.","k":"Core"},{"c":"PS-G6–8-T5-LO04","x":"3 Evaluating potential solutions\na Students test the solution for its ability to solve the problem via the release or absorption of\nthermal energy to or from the system.","k":"Core"},{"c":"PS-G6–8-T5-LO05","x":"b Students use the results of their tests to systematically determine how well the design solution meets\nthe criteria and constraints, and which characteristics of the design solution performed the best.","k":"Core"}]},{"id":"SCI-G8-U13-L2","sub":"Science","g":8,"u":13,"un":"Chemical reactions","l":2,"t":"Exothermic and endothermic reactions in a device — Part 2","role":"Part 2 of 2","topic":"PS-G6-8-T5","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology","tim":"Essential","pis":"","cls":"Core","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSe-GRADE-6-8-YEAR 7-9","stmt":"Undertake a design project to construct, test, and modify a device that either releases or absorbs thermal energy by chemical processes, draw on exothermic and endothermic chemical reactions (qualitative treatment) and the energy changes that accompany them. [Clarification Statement: Emphasis is on the design, controlling the transfer of energy to the environment, and modification of a device using factors such as type and concentration of a substance. Examples of designs could involve chemical reactions such as dissolving ammonium chloride or calcium chloride.] [Assessment Boundary: Assessment is limited to the criteria of amount, time, and temperature of substance in testing the device.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T5-LO06","x":"4 Modifying the design solution\na Students modify the design of the device based on the results of iterative testing, and improve the\ndesign relative to the criteria and constraints.","k":"Core"}]},{"id":"SCI-G8-U14-L1","sub":"Science","g":8,"u":14,"un":"Matter & materials","l":1,"t":"Particle model, states of matter and diffusion — Part 1","role":"Part 1 of 4","topic":"PS-G6-8-T2","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Matter & materials","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSb-GRADE-6-8-YEAR 7-9","stmt":"Develop a model that predicts and describes changes in particle motion, temperature, and state of a pure substance when thermal energy is added or removed. Furthermore, describe • similarities and differences, including density differences, between solids, liquids and gases; • Brownian motion in gases; diffusion in liquids and gases driven by differences in concentration; atoms and molecules as particles; • the differences in arrangements, in motion and in closeness of particles explaining changes of state, shape and density, the anomaly of ice-water transition; internal energy stored in materials - extending the particle model to gas pressure, conservation of mass and the reversibility of physical changes, with the energy changes that accompany changes of state. Additionally, describe the properties of the different states of matter (solid, liquid and gas) in terms of the particle model, including gas pressure; Energy changes on changes of state (qualitative). [Clarification Statement: Emphasis is on qualitative molecular-level models of solids, liquids, and gases to show that adding or removing thermal energy increases or decreases kinetic energy of the particles until a change of state occurs. Examples of models could include drawing and diagrams. Examples of particles could include molecules or inert atoms. Examples of pure substances could include water, carbon dioxide, and helium.] Relate the rate of melting, evaporation or condensation to the surface area of the substance and the temperature of its surroundings.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T2-LO01","x":"1 Components of the model\na To make sense of a given phenomenon, students develop a model in which they identify the relevant\ncomponents, including:\ni. Particles, including their motion.\nii. The system within which the particles are contained.\niii. The average kinetic energy of particles in the system.\niv. Thermal energy of the system.\nv. Temperature of the system.\nvi. A pure substance in one of the states of matter (e.g., solid, liquid, gas at the macro scale).","k":"Core"},{"c":"PS-G6–8-T2-LO02","x":"2 Relationships\na In the model, students describe* relationships between components, including:\ni. The relationships between: 1. The motion of molecules in a system and the kinetic energy of the\nparticles in the system. 2. The average kinetic energy of the particles and the temperature of\nthe system. 3. The transfer of thermal energy from one system to another and: A. A change in\nkinetic energy of the particles in that new system, or B. A change in state of matter of the\npure substance. 4. The state of matter of the pure substance (gas, liquid, solid) and the\nparticle motion (freely moving and not in contact with other particles, freely moving and in\nloose contact with other particles, vibrating in fixed positions relative to other particles).","k":"Core"},{"c":"PS-G6–8-T2-LO03","x":"3 Connections\na Students use their model to provide a causal account of the relationship between the addition or\nremoval of thermal energy from a substance and the change in the average kinetic energy of the\nparticles in the substance.","k":"Core"},{"c":"PS-G6–8-T2-LO04","x":"b Students use their model to provide a causal account of the relationship between:\ni. The temperature of the system.\nii. Motions of molecules in the gaseous phase.\niii. The collisions of those molecules with other materials, which exerts a force called pressure.","k":"Core"},{"c":"PS-G6–8-T2-LO05","x":"c Students use their model to provide a causal account of what happens when thermal energy is\ntransferred into a system, including that:\ni. An increase in kinetic energy of the particles can cause: 1. An increase in the temperature of\nthe system as the motion of the particles relative to each other increases, or 2. A substance to\nchange state from a solid to a liquid or from a liquid to a gas.\nii. The motion of molecules in a gaseous state increases, causing the moving molecules in the gas to\nhave greater kinetic energy, thereby colliding with molecules in surrounding materials with\ngreater force (i.e., the pressure of the system increases).","k":"Core"}]},{"id":"SCI-G8-U14-L2","sub":"Science","g":8,"u":14,"un":"Matter & materials","l":2,"t":"Particle model, states of matter and diffusion — Part 2","role":"Part 2 of 4","topic":"PS-G6-8-T2","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Matter & materials","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSb-GRADE-6-8-YEAR 7-9","stmt":"Develop a model that predicts and describes changes in particle motion, temperature, and state of a pure substance when thermal energy is added or removed. Furthermore, describe • similarities and differences, including density differences, between solids, liquids and gases; • Brownian motion in gases; diffusion in liquids and gases driven by differences in concentration; atoms and molecules as particles; • the differences in arrangements, in motion and in closeness of particles explaining changes of state, shape and density, the anomaly of ice-water transition; internal energy stored in materials - extending the particle model to gas pressure, conservation of mass and the reversibility of physical changes, with the energy changes that accompany changes of state. Additionally, describe the properties of the different states of matter (solid, liquid and gas) in terms of the particle model, including gas pressure; Energy changes on changes of state (qualitative). [Clarification Statement: Emphasis is on qualitative molecular-level models of solids, liquids, and gases to show that adding or removing thermal energy increases or decreases kinetic energy of the particles until a change of state occurs. Examples of models could include drawing and diagrams. Examples of particles could include molecules or inert atoms. Examples of pure substances could include water, carbon dioxide, and helium.] Relate the rate of melting, evaporation or condensation to the surface area of the substance and the temperature of its surroundings.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T2-LO06","x":"d Students use their model to provide a causal account of what happens when thermal energy is\ntransferred from a substance, including that:\ni. Decreased kinetic energy of the particles can cause: 1. A decrease in the temperature of the\nsystem as the motion of the particles relative to each other decreases, or 2. A substance to\nchange state from a gas to a liquid or from a liquid to a solid.\nii. The pressure that a gas exerts decreases because the kinetic energy of the gas molecules\ndecreases, and the slower molecules exert less force in collisions with other molecules in\nsurrounding materials.","k":"Core"},{"c":"PS-G6–8-T2-LO07","x":"e Students use their model to provide a causal account for the relationship between changes in pressure\nof a system and changes of the states of materials in the system.\ni. With a decrease in pressure, a smaller addition of thermal energy is required for particles of a\nliquid to change to gas because particles in the gaseous state are colliding with the surface of\nthe liquid less frequently and exerting less force on the particles in the liquid, thereby\nallowing the particles in the liquid to break away and move into the gaseous state with the\naddition of less energy.\nii. With an increase in pressure, a greater addition of thermal energy is required for particles of\na liquid to change to gas because particles in the gaseous state are colliding with the surface\nof the liquid more frequently and exerting greater force on the particles in the liquid, thereby\nlimiting the movement of particles from the liquid to gaseous state.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"PS-G6–8-T2-LO08","x":"• describe the similarities and differences between solids, liquids and gases, including the differences in their densities","k":"UK Requirement"},{"c":"PS-G6–8-T2-LO09","x":"• describe Brownian motion in gases, and describe diffusion in liquids and gases as movement driven by a difference in concentration","k":"UK Requirement"},{"c":"PS-G6–8-T2-LO10","x":"• identify atoms and molecules as the particles of which all matter is composed","k":"UK Requirement"}]},{"id":"SCI-G8-U14-L3","sub":"Science","g":8,"u":14,"un":"Matter & materials","l":3,"t":"Particle model, states of matter and diffusion — Part 3","role":"Part 3 of 4","topic nted pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T2-LO11","x":"• explain changes of state, changes of shape and changes of density in terms of the arrangement, the motion and the closeness of the particles","k":"UK Requirement"},{"c":"PS-G6–8-T2-LO12","x":"• describe the anomaly of the ice–water transition, in which the solid is less dense than the liquid so that ice floats","k":"UK Requirement"},{"c":"PS-G6–8-T2-LO13","x":"• describe the internal energy stored in a material, and extend the particle model to account for the pressure a gas exerts","k":"UK Requirement"},{"c":"PS-G6–8-T2-LO14","x":"• state that mass is conserved through a physical change and that such changes are reversible, and account for both with the particle model","k":"UK Requirement"},{"c":"PS-G6–8-T2-LO15","x":"• describe qualitatively the energy changes that accompany each change of state","k":"UK Requirement"}]},{"id":"SCI-G8-U14-L4","sub":"Science","g":8,"u":14,"un":"Matter & materials","l":4,"t":"Particle model, states of matter and diffusion — Part 4","role":"Part 4 of 4","topic":"PS-G6-8-T2","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Matter & materials","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSb-GRADE-6-8-YEAR 7-9","stmt":"Develop a model that predicts and describes changes in particle motion, temperature, and state of a pure substance when thermal energy is added or removed. Furthermore, describe • similarities and differences, including density differences, between solids, liquids and gases; • Brownian motion in gases; diffusion in liquids and gases driven by differences in concentration; atoms and molecules as particles; • the differences in arrangements, in motion and in closeness of particles explaining changes of state, shape and density, the anomaly of ice-water transition; internal energy stored in materials - extending the particle model to gas pressure, conservation of mass and the reversibility of physical changes, with the energy changes that accompany changes of state. Additionally, describe the properties of the different states of matter (solid, liquid and gas) in terms of the particle model, including gas pressure; Energy changes on changes of state (qualitative). [Clarification Statement: Emphasis is on qualitative molecular-level models of solids, liquids, and gases to show that adding or removing thermal energy increases or decreases kinetic energy of the particles until a change of state occurs. Examples of models could include drawing and diagrams. Examples of particles could include molecules or inert atoms. Examples of pure substances could include water, carbon dioxide, and helium.] Relate the rate of melting, evaporation or condensation to the surface area of the substance and the temperature of its surroundings.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T2-LO16","x":"• describe the properties of the solid, liquid and gaseous states in terms of the particle model, including gas pressure","k":"UK Requirement"},{"c":"PS-G6–8-T2-LO17","x":"• relate the rate of melting, evaporation or condensation to the surface area of the substance and the temperature of its surroundings","k":"UK Requirement"}]},{"id":"SCI-G8-U15-L1","sub":"Science","g":8,"u":15,"un":"Electricity & magnetism","l":1,"t":"Fields between objects that do not touch — Part 1","role":"Part 1 of 2","topic":"PS-G6-8-T13","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories, 13. Science and Technology","tim":"Essential","pis":"","cls":"Core","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Electricity & magnetism","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSm-GRADE-6-8-YEAR 7-9","stmt":"Conduct an investigation and evaluate the experimental design to provide evidence that fields exist between objects exerting forces on each other even though the objects are not in contact. explore non-contact forces: magnetic poles and magnetic fields (plotted with a compass and represented by field lines), Earth's magnetism with its use in the compass and navigation, the separation of positive and negative charges when objects are rubbed together — the transfer of electrons and the forces between charged objects — the idea of an electric field with electrostatic attraction and repulsion acting across the space between objects not in contact, and gravity. Clarification Statement: Examples of this phenomenon could include the interactions of magnets, electrically-charged strips of tape, and electrically charged pith balls. Examples of investigations could include first-hand experiences or simulations.] [Assessment Boundary: Assessment is limited to electric and magnetic fields and limited to qualitative evidence for the existence of fields.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T13-LO01","x":"1 Identifying the phenomenon to be investigated\na From the given investigation plan, students identify the phenomenon under investigation, which\nincludes the idea that objects can interact at a distance.","k":"Core"},{"c":"PS-G6–8-T13-LO02","x":"b Students identify the purpose of the investigation, which includes providing evidence that fields\nexist between objects exerting forces on each other even though the objects are not in contact.","k":"Core"},{"c":"PS-G6–8-T13-LO03","x":"2 Identifying evidence to address the purpose of the investigation\na From the given plan, students identify and describe* the data that will be collected to provide\nevidence for each of the following:\ni. Evidence that two interacting objects can exert forces on each other even though the two\ninteracting objects are not in contact with each other.\nii. Evidence that distinguishes between electric and magnetic forces.\niii. Evidence that the cause of a force on one object is the interaction with the second object\n(e.g., evidence for the presence of force disappears when the second object is removed from the\nvicinity of the first).","k":"Core"},{"c":"PS-G6–8-T13-LO04","x":"3 Planning the investigation\na Students describe* the rationale for why the given investigation plan includes:\ni. Changing the distance between objects.\nii. Changing the charge or magnetic orientation of objects.\niii. Changing the magnitude of the charge on an object or the strength of the magnetic field.\niv. A means to indicate or measure the presence of electric or magnetic forces.","k":"Core"},{"c":"PS-G6–8-T13-LO05","x":"4 Collecting the data\na Students make and record observations according to the given plan. The data recorded may include\nobservations of:\ni. Motion of objects.\nii. Suspension of objects.\niii. Simulations of objects that produce either electric or magnetic fields through space and the\neffects of moving those objects closer to or farther away from each other.\niv. A push or pull exerted on the hand of an observer holding an object.","k":"Core"}]},{"id":"SCI-G8-U15-L2","sub":"Science","g":8,"u":15,"un":"Electricity & magnetism","l":2,"t":"Fields between objects that do not touch — Part 2","role":"Part 2 of 2","topic":"PS-G6-8-T13","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories, 13. Science and Technology","tim":"Essential","pis":"","cls":"Core","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Electricity & magnetism","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSm-GRADE-6-8-YEAR 7-9","stmt":"Conduct an investigation and evaluate the experimental design to provide evidence that fields exist between objects exerting forces on each other even though the objects are not in contact. explore non-contact forces: magnetic poles and magnetic fields (plotted with a compass and represented by field lines), Earth's magnetism with its use in the compass and navigation, the separation of positive and negative charges when objects are rubbed together — the transfer of electrons and the forces between charged objects — the idea of an electric field with electrostatic attraction and repulsion acting across the space between objects not in contact, and gravity. Clarification Statement: Examples of this phenomenon could include the interactions of magnets, electrically-charged strips of tape, and electrically charged pith balls. Examples of investigations could include first-hand experiences or simulations.] [Assessment Boundary: Assessment is limited to electric and magnetic fields and limited to qualitative evidence for the existence of fields.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T13-LO06","x":"5 Evaluation of the design\na Students evaluate the experimental design by assessing whether or not the data produced by the\ninvestigation can provide evidence that fields exist between objects that act on each other even\nthough the objects are not in contact.","k":"Core"}]},{"id":"SCI-G8-U16-L1","sub":"Science","g":8,"u":16,"un":"Energy stores & transfers","l":1,"t":"Energy transfer and conservation of energy — Part 1","role":"Part 1 of 2","topic":"PS-G6-8-T19","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Energy stores & transfers","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSs-GRADE-6-8-YEAR 7-9","stmt":"Construct, use, and present arguments to support the claim that when the kinetic energy of an object changes, energy is transferred to or from the object. Furthermore, describe changes in systems, with the total energy having the same value before and after the change (conservation of energy). [Clarification Statement: Examples of empirical evidence used in arguments could include an inventory or other representation of the energy before and after the transfer in the form of temperature changes or motion of object.] [Assessment Boundary: Assessment does not include calculations of energy.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T19-LO01","x":"1 Supported claims\na Students make a claim about a given explanation or model for a phenomenon. In their claim, students\ninclude idea that when the kinetic energy of an object changes, energy is transferred to or from that\nobject.","k":"Core"},{"c":"PS-G6–8-T19-LO02","x":"2 Identifying scientific evidence\na Students identify and describe* the given evidence that supports the claim, including the following\nwhen appropriate:\ni. The change in observable features (e.g., motion, temperature, sound) of an object before and\nafter the interaction that changes the kinetic energy of the object.\nii. The change in observable features of other objects or the surroundings in the defined system.","k":"Core"},{"c":"PS-G6–8-T19-LO03","x":"3 Evaluating and critiquing the evidence\na Students evaluate the evidence and identify its strengths and weaknesses, including:\ni. Types of sources.\nii. Sufficiency, including validity and reliability, of the evidence to make and defend the claim.\niii. Any alternative interpretations of the evidence and why the evidence supports the given claim as\nopposed to any other claims.","k":"Core"},{"c":"PS-G6–8-T19-LO04","x":"4 Reasoning and synthesis\na Students use reasoning to connect the necessary and sufficient evidence and construct the argument.\nStudents describe* a chain of reasoning that includes:\ni. Based on changes in the observable features of the object (e.g., motion, temperature), the\nkinetic energy of the object changed.\nii. When the kinetic energy of the object increases or decreases, the energy (e.g., kinetic,\nthermal, potential) of other objects or the surroundings within the system increases or\ndecreases, indicating that energy was transferred to or from the object.","k":"Core"},{"c":"PS-G6–8-T19-LO05","x":"b Students present oral or written arguments to support or refute the given explanation or model for the\nphenomenon.\nFurthermore (UK Requirement):","k":"UK Requirement"}]},{"id":"SCI-G8-U16-L2","sub":"Science","g":8,"u":16,"un":"Energy stores & transfers","l":2,"t":"Energy transfer and conservation of energy — Part 2","role":"Part 2 of 2","topic":"PS-G6-8-T19","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Energy stores & transfers","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSs-GRADE-6-8-YEAR 7-9","stmt":"Construct, use, and present arguments to support the claim that when the kinetic energy of an object changes, energy is transferred to or from the object. Furthermore, describe changes in systems, with the total energy having the same value before and after the change (conservation of energy). [Clarification Statement: Examples of empirical evidence used in arguments could include an inventory or other representation of the energy before and after the transfer in the form of temperature changes or motion of object.] [Assessment Boundary: Assessment does not include calculations of energy.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T19-LO06","x":"• describe the change in a system by drawing up an inventory of the energy before the change and after it, naming each store","k":"UK Requirement"},{"c":"PS-G6–8-T19-LO07","x":"• show from that inventory that the total energy has the same value before and after the change, so energy is redistributed within the system rather than created or destroyed","k":"UK Requirement"},{"c":"PS-G6–8-T19-LO08","x":"• replace the claim that energy has been lost with a statement of where the energy has gone, identifying the store it has been dissipated into","k":"UK Requirement"}]},{"id":"SCI-G8-U17-L1","sub":"Science","g":8,"u":17,"un":"Forces & motion","l":1,"t":"Moments, pressure in fluids and simple machines — Part 1","role":"Part 1 of 2","topic":"PS-G6-8-T11","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"UK Requirement","big":"3. Forces and Motion","dom":"Physical Sciences — Physics","area":"Forces & motion","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-PSk-GRADE-6-8-YEAR 7-9","stmt":"Furthermore, explore the moment as the turning effect of a force; and pressure in fluids - atmospheric pressure decreasing with height, pressure in liquids increasing with depth, upthrust, floating and sinking, and pressure as force per unit area. Explore Pressure in fluids): Simple machines (force multipliers which give bigger force) but at the expense of smaller movement (and vice versa): product of force and displacement unchanged; Atmospheric pressure, decreases with increase of height as weight of air above decreases with height; Pressure measured by ratio of force over area - acting normal to any surface.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T11-LO01","x":"Furthermore (UK Requirement):\n• explain the moment of a force as its turning effect about a pivot, and describe how the moment changes when the size of the force or its distance from the pivot is changed","k":"UK Requirement"},{"c":"PS-G6–8-T11-LO02","x":"• calculate pressure as the ratio of force to area, using pressure = force ÷ area, and state that the force acts at right angles to the surface it presses on","k":"UK Requirement"},{"c":"PS-G6–8-T11-LO03","x":"• explain why atmospheric pressure decreases as height increases, in terms of the weight of the column of air above that point","k":"UK Requirement"},{"c":"PS-G6–8-T11-LO04","x":"• describe how the pressure in a liquid increases with depth, and use that increase to account for upthrust, floating and sinking","k":"UK Requirement"},{"c":"PS-G6–8-T11-LO05","x":"• explain how a simple machine acts as a force multiplier, giving a larger force at the cost of a smaller movement, and show that the product of force and displacement is unchanged","k":"UK Requirement"}]},{"id":"SCI-G8-U17-L2","sub":"Science","g":8,"u":17,"un":"Forces & motion","l":2,"t":"Moments, pressure in fluids and simple machines — Part 2","role":"Part 2 of 2","topic":"PS-G6-8-T11","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"UK Requirement","big":"3. Forces and Motion","dom":"Physical Sciences — Physics","area":"Forces & motion","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-PSk-GRADE-6-8-YEAR 7-9","stmt":"Furthermore, explore the moment as the turning effect of a force; and pressure in fluids - atmospheric pressure decreasing with height, pressure in liquids increasing with depth, upthrust, floating and sinking, and pressure as force per unit area. Explore Pressure in fluids): Simple machines (force multipliers which give bigger force) but at the expense of smaller movement (and vice versa): product of force and displacement unchanged; Atmospheric pressure, decreases with increase of height as weight of air above decreases with height; Pressure measured by ratio of force over area - acting normal to any surface.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T11-LO06","x":"• take and compare measurements of the pressure produced by the same force acting on different areas, and use the results to justify a design choice","k":"UK Requirement"}]},{"id":"SCI-G8-U18-L1","sub":"Science","g":8,"u":18,"un":"Heating & thermal energy","l":1,"t":"Conduction, radiation and insulation in a device","role":"Single lesson","topic":"PS-G6-8-T17","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology","tim":"Essential","pis":"","cls":"Core","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Heating & thermal energy","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSq-GRADE-6-8-YEAR 7-9","stmt":"Apply scientific principles to design, construct, and test a device that either minimizes or maximizes thermal energy transfer. Apply the idea of energy transfer from a hotter to a cooler object through contact (conduction) or radiation, and the use of insulators. Clarification Statement: Examples of devices could include an insulated box, a solar cooker, and a Styrofoam cup.] [Assessment Boundary: Assessment does not include calculating the total amount of thermal energy transferred.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T17-LO01","x":"1 Using scientific knowledge to generate design solutions\na Given a problem to solve that requires either minimizing or maximizing thermal energy transfer,\nstudents design and build a solution to the problem. In the designs, students:\ni. Identify that thermal energy is transferred from hotter objects to colder objects.\nii. Describe* different types of materials used in the design solution and their properties (e.g.,\nthickness, heat conductivity, reflectivity) and how these materials will be used to minimize or\nmaximize thermal energy transfer.\niii. Specify how the device will solve the problem.","k":"Core"},{"c":"PS-G6–8-T17-LO02","x":"2 Describing* criteria and constraints, including quantification when appropriate\na Students describe* the given criteria and constraints that will be taken into account in the design\nsolution:\ni. Students describe* criteria, including: 1. The minimum or maximum temperature difference that\nthe device is required to maintain. 2. The amount of time that the device is required to\nmaintain this difference. 3. Whether the device is intended to maximize or minimize the transfer\nof thermal energy.\nii. Students describe* constraints, which may include: 1. Materials. 2. Safety. 3. Time. 4. Cost.","k":"Core"},{"c":"PS-G6–8-T17-LO03","x":"3 Evaluating potential solutions\na Students test the device to determine its ability to maximize or minimize the flow of thermal energy,\nusing the rate of temperature change as a measure of success.","k":"Core"},{"c":"PS-G6–8-T17-LO04","x":"b Students use their knowledge of thermal energy transfer and the results of the testing to evaluate the\ndesign systematically against the criteria and constraints.","k":"Core"}]},{"id":"SCI-G8-U18-L2","sub":"Science","g":8,"u":18,"un":"Heating & thermal energy","l":2,"t":"Heating, temperature and thermal equilibrium — Part 1","role":"Part 1 of 2","topic":"PS-G6-8-T18","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Heating & thermal energy","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSr-GRADE-6-8-YEAR 7-9","stmt":"Plan an investigation to determine the relationships among the energy transferred, the type of matter, the mass, and the change in the average kinetic energy of the particles as measured by the temperature of the sample, applying energy changes and transfers. Furthermore, explore heating and the approach to thermal equilibrium: a temperature difference between two objects leading to energy transfer from the hotter to the cooler one, with such transfers tending to reduce the temperature difference. [Clarification Statement: Examples of experiments could include comparing final water temperatures after different masses of ice melted in the same volume of water with the same initial temperature, the temperature change of samples of different materials with the same mass as they cool or heat in the environment, or the same material with different masses when a specific amount of energy is added.] [Assessment Boundary: Assessment does not include calculating the total amount of thermal energy transferred.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T18-LO01","x":"1 Identifying the phenomenon under investigation\na Students identify the phenomenon under investigation involving thermal energy transfer.","k":"Core"},{"c":"PS-G6–8-T18-LO02","x":"b Students describe* the purpose of the investigation, including determining the relationships among the\nfollowing factors:\ni. The transfer of thermal energy.\nii. The type of matter.\niii. The mass of the matter involved in thermal energy transfer.\niv. The change in the average kinetic energy of the particles.","k":"Core"},{"c":"PS-G6–8-T18-LO03","x":"2 Identifying the evidence to address the purpose of the investigation\na Individually or collaboratively, students develop an investigation plan that describes* the data to be\ncollected and the evidence to be derived from the data, including:\ni. That the following data are to be collected: 1. Initial and final temperatures of the materials\nused in the investigation. 2. Types of matter used in the investigation. 3. Mass of matter used\nin the investigation.\nii. How the collected data will be used to: 1. Provide evidence of proportional relationships\nbetween changes in temperature of materials and the mass of those materials. 2. Relate the\nchanges in temperature in the sample to the types of matter and to the change in the average\nkinetic energy of the particles.","k":"Core"},{"c":"PS-G6–8-T18-LO04","x":"3 Planning the investigation\na In the investigation plan, students describe*:\ni. How the mass of the materials are to be measured and in what units.\nii. How and when the temperatures of the materials are to be measured and in what units.\niii. Details of the experimental conditions that will allow the appropriate data to be collected to\naddress the purpose of the investigation (e.g., time between temperature measurements, amounts\nof sample used, types of materials used), including appropriate independent and dependent\nvariables and controls.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"PS-G6–8-T18-LO05","x":"• explain that energy is transferred whenever there is a temperature difference between two objects, and that the transfer always runs from the hotter object to the cooler one","k":"UK Requirement"}]},{"id":"SCI-G8-U18-L3","sub":"Science","g":8,"u":18,"un":"Heating & thermal energy","l":3,"t":"Heating, temperature and thermal equilibrium — Part 2","role":"Part 2 of 2","topic":"PS-G6-8-T18","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Heating & thermal energy","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSr-GRADE-6-8-YEAR 7-9","stmt":"Plan an investigation to determine the relationships among the energy transferred, the type of matter, the mass, and the change in the average kinetic energy of the particles as measured by the temperature of the sample, applying energy changes and transfers. Furthermore, explore heating and the approach to thermal equilibrium: a temperature difference between two objects leading to energy transfer from the hotter to the cooler one, with such transfers tending to reduce the temperature difference. [Clarification Statement: Examples of experiments could include comparing final water temperatures after different masses of ice melted in the same volume of water with the same initial temperature, the temperature change of samples of different materials with the same mass as they cool or heat in the environment, or the same material with different masses when a specific amount of energy is added.] [Assessment Boundary: Assessment does not include calculating the total amount of thermal energy transferred.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T18-LO06","x":"• predict and then describe how the temperatures of two objects placed in contact change over time until they reach thermal equilibrium","k":"UK Requirement"},{"c":"PS-G6–8-T18-LO07","x":"• show, from a cooling or warming curve, that such transfers reduce the temperature difference until there is no difference left to drive them","k":"UK Requirement"}]},{"id":"SCI-G8-U19-L1","sub":"Science","g":8,"u":19,"un":"Waves, light & sound","l":1,"t":"Digital signals and waves that carry information","role":"Single lesson","topic":"PS-G6-8-T22","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories, 13. Science and Technology","tim":"","pis":"","cls":"Core + UK Requirement","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Waves, light & sound","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-PSv-GRADE-6-8-YEAR 7-9","stmt":"Integrate qualitative scientific and technical information to support the claim that digitized signals are a more reliable way to encode and transmit information than analog signals. [Clarification Statement: Emphasis is on a basic understanding that waves can be used for communication purposes.] Furthermore, explore pressure waves transferring energy; use for cleaning and physiotherapy by ultra-sound; waves transferring information for conversion to electrical signals by microphone. Clarification Statement: Emphasis is on a basic understanding that waves can be used for communication purposes. Examples could include using fiber optic cable to transmit light pulses, radio wave pulses in wifi devices, and conversion of stored binary patterns to make sound or text on a computer screen.] [Assessment Boundary: Assessment does not include binary counting. Assessment does not include the specific mechanism of any given device.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T22-LO01","x":"1 Obtaining information\na Given materials from a variety of different types of sources of information (e.g., texts, graphical,\nvideo, digital), students gather evidence sufficient to support a claim about a phenomenon that\nincludes the idea that using waves to carry digital signals is a more reliable way to encode and\ntransmit information than using waves to carry analog signals.","k":"Core"},{"c":"PS-G6–8-T22-LO02","x":"2 Evaluating information\na Students combine the relevant information (from multiple sources) to support the claim by describing*:\ni. Specific features that make digital transmission of signals more reliable than analog\ntransmission of signals, including that, when in digitized form, information can be: 1. Recorded\nreliably. 2. Stored for future recovery. 3. Transmitted over long distances without significant\ndegradation.\nii. At least one technology that uses digital encoding and transmission of information. Students\nshould describe* how the digitization of that technology has advanced science and scientific\ninvestigations (e.g., digital probes, including thermometers and pH probes; audio recordings).\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"PS-G6–8-T22-LO03","x":"• describe how a pressure wave transfers energy from place to place without carrying matter with it, and give the observation that shows this","k":"UK Requirement"},{"c":"PS-G6–8-T22-LO04","x":"• explain two uses of ultrasound that depend on that energy transfer — cleaning and physiotherapy — and state what the transferred energy does in each case","k":"UK Requirement"},{"c":"PS-G6–8-T22-LO05","x":"• explain how a microphone turns a sound wave into an electrical signal through the movement of its diaphragm, and how that electrical signal can then be digitised for storage and transmission","k":"UK Requirement"}]},{"id":"SCI-G9-U1-L1","sub":"Science","g":9,"u":1,"un":"Earth's structure & processes","l":1,"t":"Properties of water and Earth's surface processes — Part 1","role":"Part 1 of 3","topic":"ESS-G9-10-T5","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Earth's structure & processes","seg":"Exact top-level parsing","code":"ADEK-Science-ESSe-GRADE-9-10-YEAR 10-11","stmt":"Plan and conduct an investigation of the properties of water and its effects on Earth materials and surface processes; Furthermore, the Earth's water resources and obtaining potable water. [Clarification Statement: Emphasis is on mechanical and chemical investigations with water and a variety of solid materials to provide the evidence for connections between the hydrologic cycle and system interactions commonly known as the rock cycle. Examples of mechanical investigations include stream transportation and deposition using a stream table, erosion using variations in soil moisture content, or frost wedging by the expansion of water as it freezes. Examples of chemical investigations include chemical weathering and recrystallization (by testing the solubility of different materials) or melt generation (by examining how water lowers the melting temperature of most solids).]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 42; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T5-LO01","x":"1 Identifying the phenomenon to be investigated\na Students describe* the phenomenon under investigation, which includes the following idea: a connection\nbetween the properties of water and its effects on Earth materials and surface processes.","k":"Core"},{"c":"ESS-G9–10-T5-LO02","x":"2 Identifying the evidence to answer this question\na Students develop an investigation plan and describe* the data that will be collected and the evidence\nto be derived from the data, including:\ni. Properties of water, including: a) The heat capacity of water; b) The density of water in its\nsolid and liquid states; and c) The polar nature of the water molecule due to its molecular\nstructure.\nii. The effect of the properties of water on energy transfer that causes the patterns of\ntemperature, the movement of air, and the movement and availability of water at Earth’s surface.\niii. Mechanical effects of water on Earth materials that can be used to infer the effect of water on\nEarth’s surface processes. Examples can include: a) Stream transportation and deposition using a\nstream table, which can be used to infer the ability of water to transport and deposit","k":"Core"},{"c":"ESS-G9–10-T5-LO03","x":"materials; b) Erosion using variations in soil moisture content, which can be used to infer the\nability of water to prevent or facilitate movement of Earth materials; and c) The expansion of\nwater as it freezes, which can be used to infer the ability of water to break rocks into smaller\npieces.\niv. Chemical effects of water on Earth materials that can be used to infer the effect of water on\nEarth’s surface processes. Examples can include: a) The solubility of different materials in\nwater, which can be used to infer chemical weathering and recrystallization; b) The reaction of\niron to rust in water, which can be used to infer the role of water in chemical weathering; c)\nData illustrating that water lowers the melting temperature of most solids, which can be used to\ninfer melt generation; and d) Data illustrating that water decreases the viscosity of melted\nrock, affecting the movement of magma and volcanic eruptions.","k":"Core"},{"c":"ESS-G9–10-T5-LO04","x":"b In their investigation plan, students describe* how the data collected will be relevant to determining\nthe effect of water on Earth materials and surface processes.","k":"Core"},{"c":"ESS-G9–10-T5-LO05","x":"3 Planning for the Investigation\na In their investigation plan, students include a means to indicate or measure the predicted effect of\nwater on Earth’s materials or surface processes. Examples include:\ni. The role of the heat capacity of water to affect the temperature, movement of air and movement\nof water at the Earth’s surface;\nii. The role of flowing water to pick up, move and deposit sediment;\niii. The role of the polarity of water (through cohesion) to prevent or facilitate erosion;\niv. The role of the changing density of water (depending on physical state) to facilitate the\nbreakdown of rock;\nv. The role of the polarity of water in facilitating the dissolution of Earth materials;\nvi. Water as a component in chemical reactions that change Earth materials; and\nvii. The role of the polarity of water in changing the melting temperature and viscosity of rocks.","k":"Core"}]},{"id":"SCI-G9-U1-L2","sub":"Science","g":9,"u":1,"un":"Earth's structure & processes","l":2,"t":"Properties of water and Earth's surface processes — Part 2","role":"Part 2 of 3","topic":"ESS-G9-10-T5","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Earth's structure & processes","seg":"Exact top-level parsing","code":"ADEK-Science-ESSe-GRADE-9-10-YEAR 10-11","stmt":"Plan and conduct an investigation of the properties of water and its effects on Earth materials and surface processes; Furthermore, the Earth's water resources and obtaining potable water. [Clarification Statement: Emphasis is on mechanical and chemical investigations with water and a variety of solid materials to provide the evidence for connections between the hydrologic cycle and system interactions commonly known as the rock cycle. Examples of mechanical investigations include stream transportation and deposition using a stream table, erosion using variations in soil moisture content, or frost wedging by the expansion of water as it freezes. Examples of chemical investigations include chemical weathering and recrystallization (by testing the solubility of different materials) or melt generation (by examining how water lowers the melting temperature of most solids).]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 42; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T5-LO06","x":"b In the plan, students state whether the investigation will be conducted individually or\ncollaboratively.","k":"Core"},{"c":"ESS-G9–10-T5-LO07","x":"4 Collecting the data\na Students collect and record measurements or indications of the predicted effect of a property of water\non Earth’s materials or surface.","k":"Core"},{"c":"ESS-G9–10-T5-LO08","x":"5 Refining the design\na Students evaluate the accuracy and precision of the collected data.","k":"Core"},{"c":"ESS-G9–10-T5-LO09","x":"b Students evaluate whether the data can be used to infer the effect of water on processes in the\nnatural world.\nc If necessary, students refine the plan to produce more accurate and precise data.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"ESS-G9–10-T5-LO10","x":"• quantify the distribution of the Earth's water resources, stating the share held as salt water, as ice and as accessible fresh water, and explain why fresh water is scarce across the Arabian Peninsula","k":"UK Requirement"}]},{"id":"SCI-G9-U1-L3","sub":"Science","g":9,"u":1,"un":"Earth's structure & processes","l":3,"t":"Properties of water and Earth's surface processes — Part 3","role":"Part 3 of 3","topic":"ESS-G9-10-T5","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Earth's structure & processes","seg":"Exact top-level parsing","code":"ADEK-Science-ESSe-GRADE-9-10-YEAR 10-11","stmt":"Plan and conduct an investigation of the properties of water and its effects on Earth materials and surface processes; Furthermore, the Earth's water resources and obtaining potable water. [Clarification Statement: Emphasis is on mechanical and chemical investigations with water and a variety of solid materials to provide the evidence for connections between the hydrologic cycle and system interactions commonly known as the rock cycle. Examples of mechanical investigations include stream transportation and deposition using a stream table, erosion using variations in soil moisture content, or frost wedging by the expansion of water as it freezes. Examples of chemical investigations include chemical weathering and recrystallization (by testing the solubility of different materials) or melt generation (by examining how water lowers the melting temperature of most solids).]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 42; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T5-LO11","x":"• compare methods of obtaining potable water — filtration and sterilisation of fresh water, distillation of sea water, and reverse osmosis — naming the property of water each method exploits and the energy each requires","k":"UK Requirement"},{"c":"ESS-G9–10-T5-LO12","x":"• test a water sample against stated criteria such as pH and dissolved solids, and judge from the results and from a distillation whether the water is potable","k":"UK Requirement"}]},{"id":"SCI-G9-U1-L4","sub":"Science","g":9,"u":1,"un":"Earth's structure & processes","l":4,"t":"Coevolution of Earth's systems and life","role":"Single lesson","topic":"ESS-G9-10-T7","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Earth's structure & processes","seg":"Exact top-level parsing","code":"ADEK-Science-ESSg-GRADE-9-10-YEAR 10-11","stmt":"Construct an argument based on evidence about the simultaneous coevolution of Earth's systems and life on Earth; achieved through evidence for the composition and evolution of the Earth's atmosphere since its formation, including the role of photosynthetic life. Describe the structure of Earth's systems - atmosphere, hydrosphere and geosphere - including plate tectonics and seismology, and interpret evidence of Earth's history from fossils, erosion, deposition, uplift and subduction. [Clarification Statement: Emphasis is on the dynamic causes, effects, and feedbacks between the biosphere and Earth’s other systems, whereby geoscience factors control the evolution of life, which in turn continuously alters Earth’s surface. Examples include how photosynthetic life altered the atmosphere through the production of oxygen, which in turn increased weathering rates and allowed for the evolution of animal life; how microbial life on land increased the formation of soil, which in turn allowed for the evolution of land plants; or how the evolution of corals created reefs that altered patterns of erosion and deposition along coastlines and provided habitats for the evolution of new life forms.] [Assessment Boundary: Assessment does not include a comprehensive understanding of the mechanisms of how the biosphere interacts with all of Earth’s other systems.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 42; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T7-LO01","x":"1 Developing the claim\na Students develop a claim, which includes the following idea: that there is simultaneous coevolution of\nEarth's systems and life on Earth. This claim is supported by generalizing from multiple sources of\nevidence.","k":"Core"},{"c":"ESS-G9–10-T7-LO02","x":"2 Identifying scientific evidence\na Students identify and describe* evidence supporting the claim, including:\ni. Scientific explanations about the composition of Earth’s atmosphere shortly after its formation;\nii. Current atmospheric composition;\niii. Evidence for the emergence of photosynthetic organisms;\niv. Evidence for the effect of the presence of free oxygen on evolution and processes in other Earth\nsystems;\nv. In the context of the selected example(s), other evidence that changes in the biosphere affect\nother Earth systems.","k":"Core"},{"c":"ESS-G9–10-T7-LO03","x":"3 Evaluating and critiquing\na Students evaluate the evidence and include the following in their evaluation:\ni. A statement regarding how variation or uncertainty in the data (e.g., limitations, low\nsignal-to-noise ratio, collection bias, etc.) may affect the usefulness of the data as sources\nof evidence; and\nii. The ability of the data to be used to determine causal or correlational effects between changes\nin the biosphere and changes in Earth’s other systems.","k":"Core"},{"c":"ESS-G9–10-T7-LO04","x":"4 Reasoning and synthesis\na Students use at least two examples to construct oral and written logical arguments. The examples:\ni. Include that the evolution of photosynthetic
