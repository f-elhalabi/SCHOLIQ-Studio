cribe how the total number of atoms does not change in a chemical reaction and thus mass is conserved. Furthermore, represent reactions as the rearrangement of atoms using chemical symbols, formulae and equations; and recognize that mass is likewise conserved in physical changes of state [Clarification Statement: Emphasis is on law of conservation of matter and on physical models or drawings, including digital forms, that represent atoms.] [Assessment Boundary: Assessment does not include the use of atomic masses, balancing symbolic equations, or intermolecular forces.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T4-LO01","x":"1 Components of the model\na To make sense of a given phenomenon, students develop a model in which they identify the relevant\ncomponents for a given chemical reaction, including:\ni. The types and number of molecules that make up the reactants.\nii. The types and number of molecules that make up the products.","k":"Core"},{"c":"PS-G6–8-T4-LO02","x":"2 Relationships\na In the model, students describe* relationships between the components, including:\ni. Each molecule in each of the reactants is made up of the same type(s) and number of atoms.\nii. When a chemical reaction occurs, the atoms that make up the molecules of reactants rearrange and\nform new molecules (i.e., products).\niii. The number and types of atoms that make up the products are equal to the number and types of\natoms that make up the reactants.\niv. Each type of atom has a specific mass, which is the same for all atoms of that type.","k":"Core"},{"c":"PS-G6–8-T4-LO03","x":"3 Connections\na Students use the model to describe* that the atoms that make up the reactants rearrange and come\ntogether in different arrangements to form the products of a reaction.","k":"Core"},{"c":"PS-G6–8-T4-LO04","x":"b Students use the model to provide a causal account that mass is conserved during chemical reactions\nbecause the number and types of atoms that are in the reactants equal the number and types of atoms\nthat are in the products, and all atoms of the same type have the same mass regardless of the molecule\nin which they are found.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"PS-G6–8-T4-LO05","x":"• represent a reaction as the rearrangement of atoms, using chemical symbols, formulae and equations","k":"UK Requirement"}]},{"id":"SCI-G7-U13-L2","sub":"Science","g":7,"u":13,"un":"Chemical reactions","l":2,"t":"Conservation of mass and chemical equations — Part 2","role":"Part 2 of 2","topic":"PS-G6-8-T4","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSd-GRADE-6-8-YEAR 7-9","stmt":"Develop and use a model to describe how the total number of atoms does not change in a chemical reaction and thus mass is conserved. Furthermore, represent reactions as the rearrangement of atoms using chemical symbols, formulae and equations; and recognize that mass is likewise conserved in physical changes of state [Clarification Statement: Emphasis is on law of conservation of matter and on physical models or drawings, including digital forms, that represent atoms.] [Assessment Boundary: Assessment does not include the use of atomic masses, balancing symbolic equations, or intermolecular forces.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T4-LO06","x":"• show that mass is likewise conserved in a physical change of state, by accounting for all the matter present before and after melting, freezing, evaporating or condensing","k":"UK Requirement"}]},{"id":"SCI-G7-U14-L1","sub":"Science","g":7,"u":14,"un":"Electricity & magnetism","l":1,"t":"What affects electric and magnetic forces; electromagnets — Part 1","role":"Part 1 of 2","topic":"PS-G6-8-T12","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Electricity & magnetism","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSl-GRADE-6-8-YEAR 7-9","stmt":"Ask questions about data to determine the factors that affect the strength of electric and magnetic forces. Furthermore, explore static electricity; the magnetic effect of a current, electromagnets, D.C. motors (principles only). [Clarification Statement: Examples of devices that use electric and magnetic forces could include electromagnets, electric motors, or generators. Examples of data could include the effect of the number of turns of wire on the strength of an electromagnet, or the effect of increasing the number or strength of magnets on the speed of an electric motor.] [Assessment Boundary: Assessment about questions that require quantitative answers is limited to proportional reasoning and algebraic thinking.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T12-LO01","x":"1 Addressing phenomena of the natural world or scientific theories\na Students formulate questions that arise from examining given data of objects (which can include\nparticles) interacting through electric and magnetic forces, the answers to which would clarify:\ni. The cause-and-effect relationships that affect magnetic forces due to: 1. The magnitude of any\nelectric current present in the interaction, or other factors related to the effect of the\nelectric current (e.g., number of turns of wire in a coil). 2. The distance between the\ninteracting objects. 3. The relative orientation of the interacting objects. 4. The magnitude of\nthe magnetic strength of the interacting objects.\nii. The cause-and-effect relationship that affect electric forces due to: 1. The magnitude and signs\nof the electric charges on the interacting objects. 2. The distances between the interacting\nobjects. 3. Magnetic forces.","k":"Core"},{"c":"PS-G6–8-T12-LO02","x":"b Based on scientific principles and given data, students frame hypotheses that:\ni. Can be used to predict the strength of electric and magnetic forces due to cause-and-effect\nrelationships.\nii. Can be used to distinguish between possible outcomes, based on an understanding of the\ncause-and-effect relationships driving the system.","k":"Core"},{"c":"PS-G6–8-T12-LO03","x":"2 Identifying the scientific nature of the question\na Students’ questions can be investigated scientifically within the scope of a classroom, outdoor\nenvironment, museum, or other public facility.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"PS-G6–8-T12-LO04","x":"• explain static electricity as the separation of positive and negative charge when two materials are rubbed together, and predict whether two charged objects will attract or repel","k":"UK Requirement"},{"c":"PS-G6–8-T12-LO05","x":"• demonstrate that an electric current in a wire produces a magnetic field, and show that the field disappears when the current is switched off","k":"UK Requirement"}]},{"id":"SCI-G7-U14-L2","sub":"Science","g":7,"u":14,"un":"Electricity & magnetism","l":2,"t":"What affects electric and magnetic forces; electromagnets — Part 2","role":"Part 2 of 2","topic":"PS-G6-8-T12","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Electricity & magnetism","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSl-GRADE-6-8-YEAR 7-9","stmt":"Ask questions about data to determine the factors that affect the strength of electric and magnetic forces. Furthermore, explore static electricity; the magnetic effect of a current, electromagnets, D.C. motors (principles only). [Clarification Statement: Examples of devices that use electric and magnetic forces could include electromagnets, electric motors, or generators. Examples of data could include the effect of the number of turns of wire on the strength of an electromagnet, or the effect of increasing the number or strength of magnets on the speed of an electric motor.] [Assessment Boundary: Assessment about questions that require quantitative answers is limited to proportional reasoning and algebraic thinking.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T12-LO06","x":"• explain how the strength of an electromagnet depends on the current, the number of turns of wire in the coil and the core it is wound on","k":"UK Requirement"},{"c":"PS-G6–8-T12-LO07","x":"• explain, in principle only, how a D.C. motor turns, by describing the force on a current-carrying coil placed in a magnetic field","k":"UK Requirement"}]},{"id":"SCI-G7-U15-L1","sub":"Science","g":7,"u":15,"un":"Energy stores & transfers","l":1,"t":"Potential energy stored in a system — Part 1","role":"Part 1 of 2","topic":"PS-G6-8-T16","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Energy stores & transfers","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-PSp-GRADE-6-8-YEAR 7-9","stmt":"Develop a model to describe that when the arrangement of objects interacting at a distance changes, different amounts of potential energy are stored in the system. Furthermore, compare the starting with the final conditions of a system and describing increases and decreases in the amounts of energy associated with movements, temperatures, changes in positions in a field, in elastic distortions and in chemical compositions; and explore the Work done and energy changes on deformation. [Clarification Statement: Emphasis is on relative amounts of potential energy, not on calculations of potential energy. Examples of objects within systems interacting at varying distances could include: the Earth and either a roller coaster cart at varying positions on a hill or objects at varying heights on shelves, changing the direction/orientation of a magnet, and a balloon with static electrical charge being brought closer to a classmate’s hair. Examples of models could include representations, diagrams, pictures, and written descriptions of systems.] [Assessment Boundary: Assessment is limited to two objects and electric, magnetic, and gravitational interactions.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T16-LO01","x":"1 Components of the model\na To make sense of a given phenomenon involving two objects interacting at a distance, students develop\na model in which they identify the relevant components, including:\ni. A system of two stationary objects that interact.\nii. Forces (electric, magnetic, or gravitational) through which the two objects interact.\niii. Distance between the two objects.\niv. Potential energy.","k":"Core"},{"c":"PS-G6–8-T16-LO02","x":"2 Relationships\na In the model, students identify and describe* relationships between components, including:\ni. When two objects interact at a distance, each one exerts a force on the other that can cause\nenergy to be transferred to or from an object.\nii. As the relative position of two objects (neutral, charged, magnetic) changes, the potential\nenergy of the system (associated with interactions via electric, magnetic, and gravitational\nforces) changes (e.g., when a ball is raised, energy is stored in the gravitational interaction\nbetween the Earth and the ball).","k":"Core"},{"c":"PS-G6–8-T16-LO03","x":"3 Connections\na Students use the model to provide a causal account for the idea that the amount of potential energy in\na system of objects changes when the distance between stationary objects interacting in the system\nchanges because:\ni. A force has to be applied to move two attracting objects farther apart, transferring energy to\nthe system.\nii. A force has to be applied to move two repelling objects closer together, transferring energy to\nthe system.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"PS-G6–8-T16-LO04","x":"• compare the starting and the final conditions of a system and describe the increases and decreases in the amounts of energy associated with movement, with temperature, with position in a field, with elastic distortion and with chemical composition","k":"UK Requirement"},{"c":"PS-G6–8-T16-LO05","x":"• describe the work done on a material when it is deformed by stretching, squashing, bending or twisting, and the energy that the deformation stores in it","k":"UK Requirement"}]},{"id":"SCI-G7-U15-L2","sub":"Science","g":7,"u":15,"un":"Energy stores & transfers","l":2,"t":"Potential energy stored in a system — Part 2","role":"Part 2 of 2","topic":"PS-G6-8-T16","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Energy stores & transfers","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-PSp-GRADE-6-8-YEAR 7-9","stmt":"Develop a model to describe that when the arrangement of objects interacting at a distance changes, different amounts of potential energy are stored in the system. Furthermore, compare the starting with the final conditions of a system and describing increases and decreases in the amounts of energy associated with movements, temperatures, changes in positions in a field, in elastic distortions and in chemical compositions; and explore the Work done and energy changes on deformation. [Clarification Statement: Emphasis is on relative amounts of potential energy, not on calculations of potential energy. Examples of objects within systems interacting at varying distances could include: the Earth and either a roller coaster cart at varying positions on a hill or objects at varying heights on shelves, changing the direction/orientation of a magnet, and a balloon with static electrical charge being brought closer to a classmate’s hair. Examples of models could include representations, diagrams, pictures, and written descriptions of systems.] [Assessment Boundary: Assessment is limited to two objects and electric, magnetic, and gravitational interactions.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T16-LO06","x":"• show that the energy stored by an elastic distortion is released again when the material returns to its original shape, using a stretched band or a compressed spring","k":"UK Requirement"}]},{"id":"SCI-G7-U16-L1","sub":"Science","g":7,"u":16,"un":"Forces & motion","l":1,"t":"Force, mass and motion; Hooke's Law — Part 1","role":"Part 1 of 3","topic":"PS-G6-8-T9","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"3. Forces and Motion","dom":"Physical Sciences — Physics","area":"Forces & motion","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSi-GRADE-6-8-YEAR 7-9","stmt":"Plan an investigation to provide evidence that the change in an object's motion depends on the sum of the forces on the object and the mass of the object, describing forces as pushes or pulls arising from the interaction between objects, applying balanced and unbalanced forces, and measuring force quantitatively in newtons. Furthermore, explore • force–extension behavior, with Hooke's Law as a special case of the linear relation. explore forces being needed to cause objects to stop or start moving, or to change their speed or direction of motion (qualitative only); • Change depending on direction of force and its size; Speed and the quantitative relationship between average speed, distance and time (speed = distance / time); • The representation of a journey on a distance-time graph; Relative motion: trains and cars passing one another; Forces: associated with deforming objects; • stretching and squashing - springs; with rubbing and friction between surfaces, with pushing things out of the way; resistance to motion of air and water; • Forces measured in newtons, measurements of stretch or compression as force is changed; Force-extension linear relation; Hooke's Law as a special case; • Work done and energy changes on deformation. [Clarification Statement: Emphasis is on balanced (Newton’s First Law) and unbalanced forces in a system, qualitative comparisons of forces, mass and changes in motion (Newton’s Second Law), frame of reference, and specification of units.] [Assessment Boundary: Assessment is limited to forces and changes in motion in one-dimension in an inertial reference frame and to change in one variable at a time. Assessment does not include the use of trigonometry.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T9-LO01","x":"1 Identifying the phenomenon to be investigated\na Students identify the phenomenon under investigation, which includes the change in motion of an\nobject.","k":"Core"},{"c":"PS-G6–8-T9-LO02","x":"b Students identify the purpose of the investigation, which includes providing evidence that the change\nin an object’s motion is due to the following factors:\ni. Balanced or unbalanced forces acting on the object.\nii. The mass of the object.","k":"Core"},{"c":"PS-G6–8-T9-LO03","x":"2 Identifying the evidence to address the purpose of the investigation\na Students develop a plan for the investigation individually or collaboratively. In the plan, students\ndescribe*:\ni. That the following data will be collected: 1. Data on the motion of the object. 2. Data on the\ntotal forces acting on the object. 3. Data on the mass of the object.\nii. Which data are needed to provide evidence for each of the following: 1. An object subjected to\nbalanced forces does not change its motion (sum of F=0). 2. An object subjected to unbalanced\nforces changes its motion over time (sum of F≠0). 3. The change in the motion of an object\nsubjected to unbalanced forces depends on the mass of the object.","k":"Core"},{"c":"PS-G6–8-T9-LO04","x":"3 Planning the investigation\na In the investigation plan, students describe*:\ni. How the following factors will be determined and measured: 1. The motion of the object,\nincluding a specified reference frame and appropriate units for distance and time. 2. The mass\nof the object, including appropriate units. 3. The forces acting on the object, including\nbalanced and unbalanced forces.\nii. Which factors will serve as independent and dependent variables in the investigation (e.g., mass\nis an independent variable, forces and motion can be independent or dependent).\niii. The controls for each experimental condition.\niv. The number of trials for each experimental condition.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"PS-G6–8-T9-LO05","x":"• describe how the extension of a spring changes as the force applied to it is changed, and state Hooke's Law as the special case in which extension is proportional to the force","k":"UK Requirement"}]},{"id":"SCI-G7-U16-L2","sub":"Science","g":7,"u":16,"un":"Forces & motion","l":2,"t":"Force, mass and motion; Hooke's Law — Part 2","role":"Part 2 of 3","topic":"PS-G6-8-T9","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"3. Forces and Motion","dom":"Physical Sciences — Physics","area":"Forces & motion","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSi-GRADE-6-8-YEAR 7-9","stmt":"Plan an investigation to provide evidence that the change in an object's motion depends on the sum of the forces on the object and the mass of the object, describing forces as pushes or pulls arising from the interaction between objects, applying balanced and unbalanced forces, and measuring force quantitatively in newtons. Furthermore, explore • force–extension behavior, with Hooke's Law as a special case of the linear relation. explore forces being needed to cause objects to stop or start moving, or to change their speed or direction of motion (qualitative only); • Change depending on direction of force and its size; Speed and the quantitative relationship between average speed, distance and time (speed = distance / time); • The representation of a journey on a distance-time graph; Relative motion: trains and cars passing one another; Forces: associated with deforming objects; • stretching and squashing - springs; with rubbing and friction between surfaces, with pushing things out of the way; resistance to motion of air and water; • Forces measured in newtons, measurements of stretch or compression as force is changed; Force-extension linear relation; Hooke's Law as a special case; • Work done and energy changes on deformation. [Clarification Statement: Emphasis is on balanced (Newton’s First Law) and unbalanced forces in a system, qualitative comparisons of forces, mass and changes in motion (Newton’s Second Law), frame of reference, and specification of units.] [Assessment Boundary: Assessment is limited to forces and changes in motion in one-dimension in an inertial reference frame and to change in one variable at a time. Assessment does not include the use of trigonometry.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T9-LO06","x":"• explain qualitatively that a force is needed to start an object moving, to stop it, to change its speed or to change its direction, and that the change produced depends on the size and the direction of the force","k":"UK Requirement"},{"c":"PS-G6–8-T9-LO07","x":"• calculate average speed from the relationship speed = distance ÷ time, and rearrange it to find a distance or a time","k":"UK Requirement"},{"c":"PS-G6–8-T9-LO08","x":"• interpret and draw a distance–time graph for a journey, reading the speed from the steepness of the line and identifying the intervals in which the object is at rest","k":"UK Requirement"},{"c":"PS-G6–8-T9-LO09","x":"• describe relative motion qualitatively, for example two trains or two cars passing one another","k":"UK Requirement"},{"c":"PS-G6–8-T9-LO10","x":"• identify the forces that act when objects are stretched or squashed, when surfaces rub together, and when an object is pushed through air or water","k":"UK Requirement"}]},{"id":"SCI-G7-U16-L3","sub":"Science","g":7,"u":16,"un":"Forces & motion","l":3,"t":"Force, mass and motion; Hooke's Law — Part 3","role":"Part 3 of 3","topic":"PS-G6-8-T9","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"3. Forces and Motion","dom":"Physical Sciences — Physics","area":"Forces & motion","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSi-GRADE-6-8-YEAR 7-9","stmt":"Plan an investigation to provide evidence that the change in an object's motion depends on the sum of the forces on the object and the mass of the object, describing forces as pushes or pulls arising from the interaction between objects, applying balanced and unbalanced forces, and measuring force quantitatively in newtons. Furthermore, explore • force–extension behavior, with Hooke's Law as a special case of the linear relation. explore forces being needed to cause objects to stop or start moving, or to change their speed or direction of motion (qualitative only); • Change depending on direction of force and its size; Speed and the quantitative relationship between average speed, distance and time (speed = distance / time); • The representation of a journey on a distance-time graph; Relative motion: trains and cars passing one another; Forces: associated with deforming objects; • stretching and squashing - springs; with rubbing and friction between surfaces, with pushing things out of the way; resistance to motion of air and water; • Forces measured in newtons, measurements of stretch or compression as force is changed; Force-extension linear relation; Hooke's Law as a special case; • Work done and energy changes on deformation. [Clarification Statement: Emphasis is on balanced (Newton’s First Law) and unbalanced forces in a system, qualitative comparisons of forces, mass and changes in motion (Newton’s Second Law), frame of reference, and specification of units.] [Assessment Boundary: Assessment is limited to forces and changes in motion in one-dimension in an inertial reference frame and to change in one variable at a time. Assessment does not include the use of trigonometry.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T9-LO11","x":"• take and plot measurements of stretch or compression as the applied force is changed, and identify the linear region of the graph","k":"UK Requirement"},{"c":"PS-G6–8-T9-LO12","x":"• describe the energy change that takes place when an object is deformed, as work done on the object","k":"UK Requirement"}]},{"id":"SCI-G7-U17-L1","sub":"Science","g":7,"u":17,"un":"Gravity","l":1,"t":"Gravity and other non-contact forces","role":"Single lesson","topic":"PS-G6-8-T10","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Gravity","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSj-GRADE-6-8-YEAR 7-9","stmt":"Construct and present arguments using evidence to support the claim that gravitational interactions are attractive and depend on the masses of interacting objects explore Non-contact forces: gravity forces acting at a distance on Earth and in space, forces between magnets and forces due to static electricity; Gravity force, weight = mass x gravitational field strength (g), on Earth g=10 N/kg, different on other planets and stars; gravity forces between Earth and Moon, and between Earth and Sun (qualitative only) [Clarification Statement: Examples of evidence for arguments could include data generated from simulations or digital tools; and charts displaying mass, strength of interaction, distance from the Sun, and orbital periods of objects within the solar system.] [Assessment Boundary: Assessment does not include Newton’s Law of Gravitation or Kepler’s Laws.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T10-LO01","x":"1 Supported claims\na Students make a claim to be supported about a given phenomenon. In their claim, students include the\nfollowing idea: Gravitational interactions are attractive and depend on the masses of interacting\nobjects.","k":"Core"},{"c":"PS-G6–8-T10-LO02","x":"2 Identifying scientific evidence\na Students identify and describe* the given evidence that supports the claim, including:\ni. The masses of objects in the relevant system(s).\nii. The relative magnitude and direction of the forces between objects in the relevant system(s).","k":"Core"},{"c":"PS-G6–8-T10-LO03","x":"3 Evaluating and critiquing the evidence\na Students evaluate the evidence and identify its strengths and weaknesses, including:\ni. Types of sources.\nii. Sufficiency, including validity and reliability, of the evidence to make and defend the claim.\niii. Any alternative interpretations of the evidence, and why the evidence supports the given claim\nas opposed to any other claims.","k":"Core"},{"c":"PS-G6–8-T10-LO04","x":"4 Reasoning and synthesis\na Students use reasoning to connect the appropriate evidence about the forces on objects and construct\nthe argument that gravitational forces are attractive and mass dependent. Students describe* the\nfollowing chain of reasoning:\ni. Systems of objects can be modeled as a set of masses interacting via gravitational forces.\nii. In systems of objects, larger masses experience and exert proportionally larger gravitational\nforces.\niii. In every case for which evidence exists, gravitational force is attractive.","k":"Core"},{"c":"PS-G6–8-T10-LO05","x":"b To support the claim, students present their oral or written argument concerning the direction of\ngravitational forces and the role of the mass of the interacting objects.","k":"Core"}]},{"id":"SCI-G7-U18-L1","sub":"Science","g":7,"u":18,"un":"Waves, light & sound","l":1,"t":"Reflection, absorption and transmission of sound and light — Part 1","role":"Part 1 of 3","topic":"PS-G6-8-T21","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Waves, light & sound","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSu-GRADE-6-8-YEAR 7-9","stmt":"Develop and use a model to describe that waves are reflected, absorbed, or transmitted through various materials. Furthermore, • apply the model to sound waves (longitudinal waves, echoes as reflection, the need for a medium) and light waves (travel through a vacuum, the speed of light, transmission, the ray model, and colours and frequencies). • explore The similarities and differences between light waves and waves in matter; Light waves travelling through a vacuum; speed of light; The transmission of light through materials: absorption, diffuse scattering and specular reflection at a surface; • Use of ray model to explain imaging in mirrors, the pinhole camera, the refraction of light and action of convex lens in focusing (qualitative); the human eye; Light transferring energy from source to absorber leading to chemical and electrical effects; photo-sensitive material in the retina and in cameras; Colours and the different frequencies of light, white light and prisms (qualitative only); differential colour effects in absorption and diffuse reflection. [Clarification Statement: Emphasis is on both light and mechanical waves. Examples of models could include drawings, simulations, and written descriptions.] [Assessment Boundary: Assessment is limited to qualitative applications pertaining to light and mechanical waves.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T21-LO01","x":"1 Components of the model\na Students develop a model to make sense of a given phenomenon. In the model, students identify the\nrelevant components, including:","k":"Core"},{"c":"PS-G6–8-T21-LO02","x":"i. Type of wave. 1. Mechanical waves (e.g., sound or water waves) and their amplitudes and\nfrequencies. 2. Light, including brightness (amplitude) and color (frequency).\nii. Various materials through which the waves are reflected, absorbed, or transmitted.\niii. Relevant characteristics of the wave after it has interacted with a material (e.g., frequency,\namplitude, wavelength).\niv. Position of the source of the wave.","k":"Core"},{"c":"PS-G6–8-T21-LO03","x":"2 Relationships\na In the model, students identify and describe* the relationships between components, including:\ni. Waves interact with materials by being: 1. Reflected. 2. Absorbed. 3. Transmitted.\nii. Light travels in straight lines, but the path of light is bent at the interface between\nmaterials when it travels from one material to another.\niii. Light does not require a material for propagation (e.g., space), but mechanical waves do require\na material for propagation.","k":"Core"},{"c":"PS-G6–8-T21-LO04","x":"3 Connections\na Students use their model to make sense of given phenomena involving reflection, absorption, or\ntransmission properties of different materials for light and mechanical waves.","k":"Core"},{"c":"PS-G6–8-T21-LO05","x":"b Students use their model about phenomena involving light and/or mechanical waves to describe* the\ndifferences between how light and matter waves interact with different materials.\nc Students use the model to describe* why materials with certain properties are well-suited for\nparticular functions (e.g., lenses and mirrors, sound absorbers in concert halls, colored light\nfilters, sound barriers next to highways).\nFurthermore (UK Requirement):","k":"UK Requirement"}]},{"id":"SCI-G7-U18-L2","sub":"Science","g":7,"u":18,"un":"Waves, light & sound","l":2,"t":"Reflection, absorption and transmission of sound and light — Part 2","role":"Part 2 of 3","topic":"PS-G6-8-T21","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Waves, light & sound","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSu-GRADE-6-8-YEAR 7-9","stmt":"Develop and use a model to describe that waves are reflected, absorbed, or transmitted through various materials. Furthermore, • apply the model to sound waves (longitudinal waves, echoes as reflection, the need for a medium) and light waves (travel through a vacuum, the speed of light, transmission, the ray model, and colours and frequencies). • explore The similarities and differences between light waves and waves in matter; Light waves travelling through a vacuum; speed of light; The transmission of light through materials: absorption, diffuse scattering and specular reflection at a surface; • Use of ray model to explain imaging in mirrors, the pinhole camera, the refraction of light and action of convex lens in focusing (qualitative); the human eye; Light transferring energy from source to absorber leading to chemical and electrical effects; photo-sensitive material in the retina and in cameras; Colours and the different frequencies of light, white light and prisms (qualitative only); differential colour effects in absorption and diffuse reflection. [Clarification Statement: Emphasis is on both light and mechanical waves. Examples of models could include drawings, simulations, and written descriptions.] [Assessment Boundary: Assessment is limited to qualitative applications pertaining to light and mechanical waves.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T21-LO06","x":"• apply the model to sound: describe sound as a longitudinal wave, account for an echo as reflection, and explain why sound cannot cross a vacuum","k":"UK Requirement"},{"c":"PS-G6–8-T21-LO07","x":"• state that light travels through a vacuum at about 300 000 000 m/s and compare that speed with the speed of sound in air","k":"UK Requirement"},{"c":"PS-G6–8-T21-LO08","x":"• distinguish specular reflection, diffuse scattering and absorption at a surface, and predict which of the three a given surface will mainly do to light that reaches it","k":"UK Requirement"},{"c":"PS-G6–8-T21-LO09","x":"• use ray diagrams to explain, qualitatively, the image in a plane mirror, the image in a pinhole camera, the refraction of light at a boundary between materials and the focusing action of a convex lens","k":"UK Requirement"},{"c":"PS-G6–8-T21-LO10","x":"• explain how the eye and a camera detect light, naming the photo-sensitive layer of the retina and the sensor of the camera, and describe light transferring energy from a source to an absorber with chemical and electrical effects","k":"UK Requirement"}]},{"id":"SCI-G7-U18-L3","sub":"Science","g":7,"u":18,"un":"Waves, light & sound","l":3,"t":"Reflection, absorption and transmission of sound and light — Part 3","role":"Part 3 of 3","topic":"PS-G6-8-T21","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Waves, light & sound","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSu-GRADE-6-8-YEAR 7-9","stmt":"Develop and use a model to describe that waves are reflected, absorbed, or transmitted through various materials. Furthermore, • apply the model to sound waves (longitudinal waves, echoes as reflection, the need for a medium) and light waves (travel through a vacuum, the speed of light, transmission, the ray model, and colours and frequencies). • explore The similarities and differences between light waves and waves in matter; Light waves travelling through a vacuum; speed of light; The transmission of light through materials: absorption, diffuse scattering and specular reflection at a surface; • Use of ray model to explain imaging in mirrors, the pinhole camera, the refraction of light and action of convex lens in focusing (qualitative); the human eye; Light transferring energy from source to absorber leading to chemical and electrical effects; photo-sensitive material in the retina and in cameras; Colours and the different frequencies of light, white light and prisms (qualitative only); differential colour effects in absorption and diffuse reflection. [Clarification Statement: Emphasis is on both light and mechanical waves. Examples of models could include drawings, simulations, and written descriptions.] [Assessment Boundary: Assessment is limited to qualitative applications pertaining to light and mechanical waves.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T21-LO11","x":"• explain colour in terms of the different frequencies of light, the splitting of white light by a prism, and why a surface looks a particular colour according to which frequencies it absorbs and which it diffusely reflects","k":"UK Requirement"}]},{"id":"SCI-G8-U1-L1","sub":"Science","g":8,"u":1,"un":"Earth's structure & processes","l":1,"t":"Geoscience processes that change Earth's surface","role":"Single lesson","topic":"ESS-G6-8-T3","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Earth's structure & processes","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSc-GRADE-6-8-YEAR 7-9","stmt":"Construct an explanation based on evidence for how geoscience processes have changed Earth's surface at varying time and spatial scales — drawing on the composition and structure of the Earth and the formation of igneous, sedimentary and metamorphic rocks. [Clarification Statement: Emphasis is on how processes change Earth’s surface at time and spatial scales that can be large (such as slow plate motions or the uplift of large mountain ranges) or small (such as rapid landslides or microscopic geochemical reactions), and how many geoscience processes (such as earthquakes, volcanoes, and meteor impacts) usually behave gradually but are punctuated by catastrophic events. Examples of geoscience processes include surface weathering and deposition by the movements of water, ice, and wind. Emphasis is on geoscience processes that shape local geographic features, where appropriate.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T3-LO01","x":"1 Articulating the explanation of phenomena\na Students articulate a statement that relates a given phenomenon to a scientific idea, including that\ngeoscience processes have changed the Earth’s surface at varying time and spatial scales.","k":"Core"},{"c":"ESS-G6–8-T3-LO02","x":"b Students use evidence and reasoning to construct an explanation for the given phenomenon, which\ninvolves changes at Earth’s surface.","k":"Core"},{"c":"ESS-G6–8-T3-LO03","x":"2 Evidence\na Students identify and describe* the evidence necessary for constructing an explanation, including:\ni. The slow and large-scale motion of the Earth’s plates and the results of that motion.\nii. Surface weathering, erosion, movement, and the deposition of sediment ranging from large to\nmicroscopic scales (e.g., sediment consisting of boulders and microscopic grains of sand,\nraindrops dissolving microscopic amounts of minerals).\niii. Rapid catastrophic events (e.g., earthquakes, volcanoes, meteor impacts).","k":"Core"},{"c":"ESS-G6–8-T3-LO04","x":"b Students identify the corresponding timescales for each identified geoscience process.\nc Students use multiple valid and reliable sources, which may include students’ own investigations,\nevidence from data, and observations from conceptual models used to represent changes that occur on\nvery large or small spatial and/or temporal scales (e.g., stream tables to illustrate erosion and\ndeposition, maps and models to show the motion of tectonic plates). Reasoning","k":"Core"},{"c":"ESS-G6–8-T3-LO05","x":"3 a Students use reasoning, along with the assumption that theories and laws that describe the natural world operate today as they did in the past and will continue to do so in the future, to connect the evidence and support an explanation for how geoscience processes have changed the Earth’s surface at a variety of temporal and spatial scales. Students describe* the following chain of reasoning for their explanation:\ni. The motion of the Earth’s plates produces changes on a planetary scale over a range of time\nperiods from millions to billions of years. Evidence for the motion of plates can explain large-\nscale features of the Earth’s surface (e.g., mountains, distribution of continents) and how they\nchange.\nii. Surface processes such as erosion, movement, weathering, and the deposition of sediment can\nmodify surface features, such as mountains, or create new features, such as canyons. These\nprocesses can occur at spatial scales ranging from large to microscopic over time periods\nranging from years to hundreds of millions of years.\niii. Catastrophic changes can modify or create surface features over a very short period of time\ncompared to other geoscience processes, and the results of those catastrophic changes are\nsubject to further changes over time by processes that act on longer time scales (e.g., erosion\nof a meteor crater).\niv. A given surface feature is the result of a broad range of geoscience processes occurring at\ndifferent temporal and spatial scales.\nv. Surface features will continue to change in the future as geoscience processes continue to\noccur.","k":"Core"}]},{"id":"SCI-G8-U2-L1","sub":"Science","g":8,"u":2,"un":"Resources & human impact","l":1,"t":"Monitoring and reducing human impact","role":"Single lesson","topic":"ESS-G6-8-T11","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology, 14. Science and Society","tim":"Essential","pis":"","cls":"Core","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Resources & human impact","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSk-GRADE-6-8-YEAR 7-9","stmt":"Apply scientific principles to design a method for monitoring and minimizing a human impact on the environment. applying the efficacy of recycling and the production of carbon dioxide by human activity. [Clarification Statement: Examples of the design process include examining human environmental impacts, assessing the kinds of solutions that are feasible, and designing and evaluating solutions that could reduce that impact. Examples of human impacts can include water usage (such as the withdrawal of water from streams and aquifers or the construction of dams and levees), land usage (such as urban development, agriculture, or the removal of wetlands), and pollution (such as of the air, water, or land).]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T11-LO01","x":"1 Using scientific knowledge to generate design solutions\na Given a problem related to human impact on the environment, students use scientific information and\nprinciples to generate a design solution that:\ni. Addresses the results of the particular human activity.\nii. Incorporates technologies that can be used to monitor and minimize negative effects that human\nactivities have on the environment.","k":"Core"},{"c":"ESS-G6–8-T11-LO02","x":"b Students identify relationships between the human activity and the negative environmental impact based\non scientific principles, and distinguish between causal and correlational relationships to facilitate\nthe design of the solution.","k":"Core"},{"c":"ESS-G6–8-T11-LO03","x":"2 Describing* criteria and constraints, including quantification when appropriate\na Students define and quantify, when appropriate, criteria and constraints for the solution, including:\ni. Individual or societal needs and desires.\nii. Constraints imposed by economic conditions (e.g., costs of building and maintaining the\nsolution).","k":"Core"},{"c":"ESS-G6–8-T11-LO04","x":"3 Evaluating potential solutions\na Students describe* how well the solution meets the criteria and constraints, including monitoring or\nminimizing a human impact based on the causal relationships between relevant scientific principles\nabout the processes that occur in, as well as among, Earth systems and the human impact on the\nenvironment.","k":"Core"},{"c":"ESS-G6–8-T11-LO05","x":"b Students identify limitations of the use of technologies employed by the solution.","k":"Core"}]},{"id":"SCI-G8-U3-L1","sub":"Science","g":8,"u":3,"un":"Space & the solar system","l":1,"t":"Scale of the solar system and the light year — Part 1","role":"Part 1 of 3","topic":"ESS-G6-8-T15","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"6. The Universe","dom":"Earth & Space Sciences","area":"Space & the solar system","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSo-GRADE-6-8-YEAR 7-9","stmt":"Analyze and interpret data to determine scale properties of objects in the solar system — Further more using the light year as a unit of astronomical distance [Clarification Statement: Emphasis is on the analysis of data from Earth-based instruments, space-based telescopes, and spacecraft to determine similarities and differences among solar system objects. Examples of scale properties include the sizes of an object’s layers (such as crust and atmosphere), surface features (such as volcanoes), and orbital radius. Examples of data include statistical information, drawings and photographs, and models.] [Assessment Boundary: Assessment does not include recalling facts about properties of the planets and other solar system bodies.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T15-LO01","x":"1 Organizing data\na Students organize given data on solar system objects (e.g., surface features, object layers, orbital\nradii) from various Earth- and space-based instruments to allow for analysis and interpretation (e.g.,\ntransforming tabular data into pictures, diagrams, graphs, or physical models that illustrate changes\nin scale).","k":"Core"},{"c":"ESS-G6–8-T15-LO02","x":"b Students describe* that different representations illustrate different characteristics of objects in\nthe solar system, including differences in scale.","k":"Core"},{"c":"ESS-G6–8-T15-LO03","x":"2 Identifying relationships\na Students use quantitative analyses to describe* similarities and differences among solar system\nobjects by describing* patterns of features of those objects at different scales, including:\ni. Distance from the sun.\nii. Diameter.\niii. Surface features (e.g., sizes of volcanoes).\niv. Structure.\nv. Composition (e.g., ice versus rock versus gas).","k":"Core"},{"c":"ESS-G6–8-T15-LO04","x":"b Students identify advances in solar system science made possible by improved engineering (e.g.,\nknowledge of the evolution of the solar system from lunar exploration and space probes) and new\ndevelopments in engineering made possible by advances in science (e.g., space-based telescopes from\nadvances in optics and aerospace engineering).","k":"Core"},{"c":"ESS-G6–8-T15-LO05","x":"3 Interpreting data\na Students use the patterns they find in multiple types of data at varying scales to draw conclusions\nabout the identifying characteristics of different categories of solar system objects (e.g., planets,\nmeteors, asteroids, comets) based on their features, composition, and locations within the solar\nsystem (e.g., most asteroids are rocky bodies between Mars and Jupiter, while most comets reside in\norbits farther from the sun and are composed mostly of ice).","k":"Core"}]},{"id":"SCI-G8-U3-L2","sub":"Science","g":8,"u":3,"un":"Space & the solar system","l":2,"t":"Scale of the solar system and the light year — Part 2","role":"Part 2 of 3","topic":"ESS-G6-8-T15","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"6. The Universe","dom":"Earth & Space Sciences","area":"Space & the solar system","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSo-GRADE-6-8-YEAR 7-9","stmt":"Analyze and interpret data to determine scale properties of objects in the solar system — Further more using the light year as a unit of astronomical distance [Clarification Statement: Emphasis is on the analysis of data from Earth-based instruments, space-based telescopes, and spacecraft to determine similarities and differences among solar system objects. Examples of scale properties include the sizes of an object’s layers (such as crust and atmosphere), surface features (such as volcanoes), and orbital radius. Examples of data include statistical information, drawings and photographs, and models.] [Assessment Boundary: Assessment does not include recalling facts about properties of the planets and other solar system bodies.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T15-LO06","x":"b Students use patterns in data as evidence to describe* that two objects may be similar when viewed at\none scale (e.g., types of surface features) but may appear to be quite different when viewed at a\ndifferent scale (e.g., diameter or number of natural satellites).","k":"Core"},{"c":"ESS-G6–8-T15-LO07","x":"c Students use the organization of data to facilitate drawing conclusions about the patterns of scale\nproperties at more than one scale, such as those that are too large or too small to directly observe.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"ESS-G6–8-T15-LO08","x":"• define the light year as the distance that light travels in one year, and use it as a unit of astronomical distance","k":"Core"},{"c":"ESS-G6–8-T15-LO09","x":"• calculate a distance in kilometres from a distance in light years, and a distance in light years from a distance in kilometres, using a stated speed of light","k":"Core"},{"c":"ESS-G6–8-T15-LO10","x":"• explain why the light year replaces the kilometre beyond the solar system, by comparing the size of the numbers each unit produces for the same distance","k":"Core"}]},{"id":"SCI-G8-U3-L3","sub":"Science","g":8,"u":3,"un":"Space & the solar system","l":3,"t":"Scale of the solar system and the light year — Part 3","role":"Part 3 of 3","topic":"ESS-G6-8-T15","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"6. The Universe","dom":"Earth & Space Sciences","area":"Space & the solar system","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSo-GRADE-6-8-YEAR 7-9","stmt":"Analyze and interpret data to determine scale properties of objects in the solar system — Further more using the light year as a unit of astronomical distance [Clarification Statement: Emphasis is on the analysis of data from Earth-based instruments, space-based telescopes, and spacecraft to determine similarities and differences among solar system objects. Examples of scale properties include the sizes of an object’s layers (such as crust and atmosphere), surface features (such as volcanoes), and orbital radius. Examples of data include statistical information, drawings and photographs, and models.] [Assessment Boundary: Assessment does not include recalling facts about properties of the planets and other solar system bodies.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T15-LO11","x":"• explain that a light year measures distance and not time, and that light arriving from a distant star left it years before it is seen","k":"Core"}]},{"id":"SCI-G8-U4-L1","sub":"Science","g":8,"u":4,"un":"Weather & climate","l":1,"t":"Unequal heating, circulation and climate","role":"Single lesson","topic":"ESS-G6-8-T7","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"Core","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Weather & climate","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSg-GRADE-6-8-YEAR 7-9","stmt":"Develop and use a model to describe how unequal heating and rotation of the Earth cause patterns of atmospheric and oceanic circulation that determine regional climates — drawing on the composition of the atmosphere.[Clarification Statement: Emphasis is on how patterns vary by latitude, altitude, and geographic land distribution. Emphasis of atmospheric circulation is on the sunlight-driven latitudinal banding, the Coriolis effect, and resulting prevailing winds; emphasis of ocean circulation is on the transfer of heat by the global ocean convection cycle, which is constrained by the Coriolis effect and the outlines of continents. Examples of models can be diagrams, maps and globes, or digital representations.] [Assessment Boundary: Assessment does not include the dynamics of the Coriolis effect.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T7-LO01","x":"1 Components of the model\na To make sense of a phenomenon, students develop a model in which they identify the relevant components\nof the system, with inputs and outputs, including:\ni. The rotating Earth.\nii. The atmosphere.\niii. The ocean, including the relative rate of thermal energy transfer of water compared to land or\nair.\niv. Continents and the distribution of landforms on the surface of Earth.\nv. Global distribution of ice.\nvi. Distribution of living things.\nvii. Energy. 1. Radiation from the sun as an input. 2. Thermal energy that exists in the atmosphere,\nwater, land, and ice (as represented by temperature).","k":"Core"},{"c":"ESS-G6–8-T7-LO02","x":"2 Relationships\na In the model, students identify and describe* the relationships between components of the system,\nincluding:\ni. Differences in the distribution of solar energy and temperature changes, including: 1. Higher\nlatitudes receive less solar energy per unit of area than do lower latitudes, resulting in\ntemperature differences based on latitude. 2. Smaller temperature changes tend to occur in\noceans than on land in the same amount of time. 3. In general, areas at higher elevations have\nlower average temperatures than do areas at lower elevations. 4. Features on the Earth’s\nsurface, such as the amount of solar energy reflected back into the atmosphere or the absorption\nof solar energy by living things, affect the amount of solar energy transferred into heat\nenergy.\nii. Motion of ocean waters and air masses (matter): 1. Fluid matter (i.e., air, water) flows from\nareas of higher density to areas of lower density (due to temperature or salinity). The density\nof a fluid can vary for several different reasons (e.g., changes in salinity and temperature of\nwater can each cause changes in density). Differences in salinity and temperature can,\ntherefore, cause fluids to move vertically and, as a result of vertical movement, also\nhorizontally because of density differences.\niii. Factors affecting the motion of wind and currents: 1. The Earth’s rotation causes oceanic and\natmospheric flows to curve when viewed from the rotating surface of Earth (Coriolis force). 2.\nThe geographical distribution of land limits where ocean currents can flow. 3. Landforms affect\natmospheric flows (e.g., mountains deflect wind and/or force it to higher elevation).\niv. Thermal energy transfer: 1. Thermal energy moves from areas of high temperature to areas of\nlower temperature either through the movement of matter, via radiation, or via conduction of\nheat from warmer objects to cooler objects. 2. Absorbing or releasing thermal energy produces a\nmore rapid change in temperature on land compared to in water. 3. Absorbing or releasing thermal\nenergy produces a more rapid change in temperature in the atmosphere compared to either on land\nor in water so the atmosphere is warmed or cooled by being in contact with land or the ocean.","k":"Core"},{"c":"ESS-G6–8-T7-LO03","x":"3 Connections\na Students use the model to describe*:\ni. The general latitudinal pattern in climate (higher average annual temperatures near the equator\nand lower average annual temperatures at higher latitudes) caused by more direct light (greater\nenergy per unit of area) at the equator (more solar energy) and less direct light at the poles\n(less solar energy).\nii. The general latitudinal pattern of drier and wetter climates caused by the shift in the amount\nof air moisture during precipitation from rising moisture-rich air and the sinking of dry air.\niii. The pattern of differing climates in continental areas as compared to the oceans. Because water\ncan absorb more solar energy for every degree change in temperature compared to land, there is a\ngreater and more rapid temperature change on land than in the ocean. At the centers of\nlandmasses, this leads to conditions typical of continental climate patterns.\niv. The pattern that climates near large water bodies, such as marine coasts, have comparatively\nsmaller changes in temperature relative to the center of the landmass. Land near the oceans can\nexchange thermal energy through the air, resulting in smaller changes in temperature. At the\nedges of landmasses, this leads to marine climates.\nv. The pattern that climates at higher altitudes have lower temperatures than climates at lower\naltitudes. Because of the direct relationship between temperature and pressure, given the same\namount of thermal energy, air at lower pressures (higher altitudes) will have lower temperatures\nthan air at higher pressures (lower altitudes).\nvi. Regional patterns of climate (e.g., temperature or moisture) related to a specific pattern of\nwater or air circulation, including the role of the following in contributing to the climate\npattern: 1. Air or water moving from areas of high temperature, density, and/or salinity to\nareas of low temperature, density, and/or salinity. 2. The Earth’s rotation, which affects\natmospheric and oceanic circulation. 3. The transfer of thermal energy with the movement of\nmatter. 4. The presence of landforms (e.g., the rain shadow effect).","k":"Core"},{"c":"ESS-G6–8-T7-LO04","x":"b Students use the model to describe* the role of each of its components in producing a given regional\nclimate.","k":"Core"}]},{"id":"SCI-G8-U5-L1","sub":"Science","g":8,"u":5,"un":"Engineering design","l":1,"t":"Testing designs; planning fair scientific enquiries — Part 1","role":"Part 1 of 3","topic":"ETS-G6-8-T3","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"13. Science and Technology","dom":"Engineering & Technology","area":"Engineering design","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ETSc-GRADE-6-8-YEAR 7-9","stmt":"Analyse data from tests of several design solutions to identify similarities and differences in their performance and determine which characteristics best meet the criteria and constraints for success. Use this evidence to select and combine effective characteristics to develop an improved design solution. Furthermore, select, plan and carry out appropriate scientific enquiries to test predictions; identify independent, dependent and control variables; use appropriate techniques, apparatus and materials safely; make and record observations and measurements using appropriate methods and SI units; present data in tables and graphs; and undertake basic data analysis, including appropriate simple statistical techniques. Analysis and evaluation: Apply mathematical concepts and calculate results Analysis and evaluation: Present observations and data using appropriate methods, including tables and graphs Analysis and evaluation: Interpret observations and data, including identifying patterns and using observations, measurements and data to draw conclusions Measurement: Undertake basic data analysis including simple statistical techniques","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ETS-G6–8-T3-LO01","x":"1 Organizing data\na Students organize given data (e.g., via tables, charts, or graphs) from tests intended to determine\nthe effectiveness of three or more alternative solutions to a problem.","k":"Core"},{"c":"ETS-G6–8-T3-LO02","x":"2 Identifying relationships\na Students use appropriate analysis techniques (e.g., qualitative or quantitative analysis; basic","k":"Core"},{"c":"ETS-G6–8-T3-LO03","x":"statistical techniques of data and error analysis) to analyze the data and identify relationships\nwithin the datasets, including relationships between the design solutions and the given criteria and\nconstraints.","k":"Core"},{"c":"ETS-G6–8-T3-LO04","x":"3 Interpreting data\na Students use the analyzed data to identify evidence of similarities and differences in features of the\nsolutions.","k":"Core"},{"c":"ETS-G6–8-T3-LO05","x":"b Based on the analyzed data, students make a claim for which characteristics of each design best meet\nthe given criteria and constraints.\nc Students use the analyzed data to identify the best features in each design that can be compiled into\na new (improved) redesigned solution.\nFurthermore (UK Requirement):","k":"UK Requirement"}]},{"id":"SCI-G8-U5-L2","sub":"Science","g":8,"u":5,"un":"Engineering design","l":2,"t":"Testing designs; planning fair scientific enquiries — Part 2","role":"Part 2 of 3","topic":"ETS-G6-8-T3","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"13. Science and Technology","dom":"Engineering & Technology","area":"Engineering design","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ETSc-GRADE-6-8-YEAR 7-9","stmt":"Analyse data from tests of several design solutions to identify similarities and differences in their performance and determine which characteristics best meet the criteria and constraints for success. Use this evidence to select and combine effective characteristics to develop an improved design solution. Furthermore, select, plan and carry out appropriate scientific enquiries to test predictions; identify independent, dependent and control variables; use appropriate techniques, apparatus and materials safely; make and record observations and measurements using appropriate methods and SI units; present data in tables and graphs; and undertake basic data analysis, including appropriate simple statistical techniques. Analysis and evaluation: Apply mathematical concepts and calculate results Analysis and evaluation: Present observations and data using appropriate methods, including tables and graphs Analysis and evaluation: Interpret observations and data, including identifying patterns and using observations, measurements and data to draw conclusions Measurement: Undertake basic data analysis including simple statistical techniques","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ETS-G6–8-T3-LO06","x":"• select, plan and carry out the type of scientific enquiry best suited to testing a stated prediction","k":"UK Requirement"},{"c":"ETS-G6–8-T3-LO07","x":"• identify the independent, dependent and control variables in their own enquiry","k":"UK Requirement"},{"c":"ETS-G6–8-T3-LO08","x":"• use appropriate techniques, apparatus and materials safely, with a stated reason for each choice","k":"UK Requirement"},{"c":"ETS-G6–8-T3-LO09","x":"• make and record observations and measurements by appropriate methods and in SI units","k":"UK Requirement"},{"c":"ETS-G6–8-T3-LO10","x":"• present data in tables and graphs chosen to suit the kind of data collected","k":"UK Requirement"}]},{"id":"SCI-G8-U5-L3","sub":"Science","g":8,"u":5,"un":"Engineering design","l":3,"t":"Testing designs; planning fair scientific enquiries — Part 3","role":"Part 3 of 3","topic":"ETS-G6-8-T3","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"13. Science and Technology","dom":"Engineering & Technology","area":"Engineering design","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ETSc-GRADE-6-8-YEAR 7-9","stmt":"Analyse data from tests of several design solutions to identify similarities and differences in their performance and determine which characteristics best meet the criteria and constraints for success. Use this evidence to select and combine effective characteristics to develop an improved design solution. Furthermore, select, plan and carry out appropriate scientific enquiries to test predictions; identify independent, dependent and control variables; use appropriate techniques, apparatus and materials safely; make and record observations and measurements using appropriate methods and SI units; present data in tables and graphs; and undertake basic data analysis, including appropriate simple statistical techniques. Analysis and evaluation: Apply mathematical concepts and calculate results Analysis and evaluation: Present observations and data using appropriate methods, including tables and graphs Analysis and evaluation: Interpret observations and data, including identifying patterns and using observations, measurements and data to draw conclusions Measurement: Undertake basic data analysis including simple statistical techniques","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ETS-G6–8-T3-LO11","x":"• carry out basic data analysis, including simple statistical techniques such as the mean, the range and the identification of anomalous results","k":"UK Requirement"}]},{"id":"SCI-G8-U6-L1","sub":"Science","g":8,"u":6,"un":"Body systems & health","l":1,"t":"Effects of recreational drugs, smoking and alcohol — Part 1","role":"Part 1 of 2","topic":"LS-G6-8-T9","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"14. Science and Society","tim":"Essential","pis":"","cls":"Core* (TIMSS/PISA)","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-LSi-GRADE-6-8-YEAR 7-9","stmt":"Furthermore, explore the effects of recreational drugs, including smoking and alcohol, on behaviour, health and life processes","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T9-LO01","x":"Furthermore (UK Requirement):\nStudents will be able to:\n• identify recreational drugs, including tobacco smoke and alcohol, as substances taken into the body that change how the body and the brain work","k":"UK Requirement"},{"c":"LS-G6–8-T9-LO02","x":"• describe, from secondary data, the effects of smoking on life processes — gas exchange at the alveoli, ventilation and the transport of oxygen in the blood","k":"Core"},{"c":"LS-G6–8-T9-LO03","x":"• describe the effects of alcohol on behaviour — reaction time, coordination, judgement and decision-making — and on the liver","k":"Core"},{"c":"LS-G6–8-T9-LO04","x":"• explain the mechanism of harm for each substance, linking the substance to the tissue or organ it damages and then to the life process that begins to fail","k":"Core"},{"c":"LS-G6–8-T9-LO05","x":"• analyse and interpret published data on recreational drug use and health outcomes, stating the conclusion the data support and the limits of that conclusion","k":"Core"}]},{"id":"SCI-G8-U6-L2","sub":"Science","g":8,"u":6,"un":"Body systems & health","l":2,"t":"Effects of recreational drugs, smoking and alcohol — Part 2","role":"Part 2 of 2","topic":"LS-G6-8-T9","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"14. Science and Society","tim":"Essential","pis":"","cls":"Core* (TIMSS/PISA)","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-LSi-GRADE-6-8-YEAR 7-9","stmt":"Furthermore, explore the effects of recreational drugs, including smoking and alcohol, on behaviour, health and life processes","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T9-LO06","x":"• evaluate a health campaign claim against the evidence available, and improve their own and others' explanations against agreed criteria","k":"Core"}]},{"id":"SCI-G8-U7-L1","sub":"Science","g":8,"u":7,"un":"Cells & organisation","l":1,"t":"Organisation of the body: cells to systems","role":"Single lesson","topic":"LS-G6-8-T3","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"7. Cells and Life","dom":"Life Sciences","area":"Cells & organisation","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSc-GRADE-6-8-YEAR 7-9","stmt":"Use argument supported by evidence for how the body is a system of interacting subsystems composed of groups of cells — the hierarchical organisation of multicellular organisms: from cells to tissues to organs to systems to organisms, with the role of diffusion in the movement of materials in and between cells — using as evidence the skeletal and muscular systems (structure and functions of the human skeleton, biomechanics and antagonistic muscles), the structure and function of the human gas exchange system with the mechanism of breathing understood through a pressure model, and the tissues and organs of the human digestive system, with enzymes understood simply as biological catalysts. [Clarification Statement: Emphasis is on the conceptual understanding that cells form tissues and tissues form organs specialized for particular body functions. Examples could include the interaction of subsystems within a system and the normal functioning of those systems.] [Assessment Boundary: Assessment does not include the mechanism of one body system independent of others. Assessment is limited to the circulatory, excretory, digestive, respiratory, muscular, and nervous systems.] Compare the structure and function of the major human organ systems with those of other vertebrates (e.g., lungs and gills for gas exchange).","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T3-LO01","x":"1 Supported claims\na Students make a claim to be supported, related to a given explanation or model of a phenomenon. In the\nclaim, students include the idea that the body is a system of interacting subsystems composed of\ngroups of cells.\n2 Identifying scientific evidence\na Students identify and describe* the given evidence that supports the claim (e.g., evidence from data\nand scientific literature), including evidence that:\ni. Specialized groups of cells work together to form tissues (e.g., evidence from data about the\nkinds of cells found in different tissues, such as nervous, muscular, and epithelial, and their\nfunctions).\nii. Specialized tissues comprise each organ, enabling the specific organ functions to be carried out\n(e.g., the heart contains muscle, connective, and epithelial tissues that allow the heart to\nreceive and pump blood).\niii. Different organs can work together as subsystems to form organ systems that carry out complex\nfunctions (e.g., the heart and blood vessels work together as the circulatory system to\ntransport blood and materials throughout the body).\niv. The body contains organs and organ systems that interact with each other to carry out all\nnecessary functions for survival and growth of the organism (e.g., the digestive, respiratory,\nand circulatory systems are involved in the breakdown and transport of food and the transport of\noxygen throughout the body to cells, where the molecules can be used for energy, growth, and\nrepair).\n3 Evaluating and critiquing the evidence\na Students evaluate the evidence and identify the strengths and weaknesses of the evidence, including:\ni. Types of sources.\nii. Sufficiency, including validity and reliability, of the evidence to make and defend the claim.\niii. Any alternative interpretations of the evidence and why the evidence supports the student’s\nclaim, as opposed to any other claims.\n4 Reasoning and synthesis\na Students use reasoning to connect the appropriate evidence to the claim. Students describe* the\nfollowing chain of reasoning in their argumentation:\ni. Every scale (e.g., cells, tissues, organs, organ systems) of body function is composed of\nsystems of interacting components.\nii. Organs are composed of interacting tissues. Each tissue is made up of specialized cells. These\ninteractions at the cellular and tissue levels enable the organs to carry out specific\nfunctions.\niii. A body is a system of specialized organs that interact with each other and their subsystems to\ncarry out the functions necessary for life.\nb Students use oral or written arguments to support or refute an explanation or model of a phenomenon.\n• compare the structure and function of the major human organ systems with those of other vertebrates (e.g., lungs and gills for gas exchange)","k":"Core"}]},{"id":"SCI-G8-U8-L1","sub":"Science","g":8,"u":8,"un":"Ecosystems & food webs","l":1,"t":"How changes to an ecosystem affect populations — Part 1","role":"Part 1 of 2","topic":"LS-G6-8-T13","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSm-GRADE-6-8-YEAR 7-9","stmt":"Construct an argument supported by empirical evidence that changes to physical or biological components of an ecosystem affect populations — including how organisms affect and are affected by their environment, with the accumulation of toxic materials as an example. [Clarification Statement: Emphasis is on recognizing patterns in data and making warranted inferences about changes in populations, and on evaluating empirical evidence supporting arguments about changes to ecosystems.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T13-LO01","x":"1 Supported claims\na Students make a claim to be supported about a given explanation or model for a phenomenon. In their\nclaim, students include the idea that changes to physical or biological components of an ecosystem can\naffect the populations living there.","k":"Core"},{"c":"LS-G6–8-T13-LO02","x":"2 Identifying scientific evidence\na Students identify and describe* the given evidence (e.g., evidence from data, scientific literature)\nneeded for supporting the claim, including evidence about:\ni. Changes in the physical or biological components of an ecosystem, including the magnitude of the\nchanges (e.g., data about rainfall, fires, predator removal, species introduction).\nii. Changes in the populations of an ecosystem, including the magnitude of the changes (e.g.,\nchanges in population size, types of species present, and relative prevalence of a species\nwithin the ecosystem).\niii. Evidence of causal and correlational relationships between changes in the components of an\necosystem with the changes in populations.","k":"Core"},{"c":"LS-G6–8-T13-LO03","x":"b Students use multiple valid and reliable sources of evidence.","k":"Core"},{"c":"LS-G6–8-T13-LO04","x":"3 Evaluating and critiquing the evidence\na Students evaluate the given evidence, identifying the necessary and sufficient evidence for supporting\nthe claim.","k":"Core"},{"c":"LS-G6–8-T13-LO05","x":"b Students identify alternative interpretations of the evidence and describe* why the evidence supports\nthe student’s claim.","k":"Core"}]},{"id":"SCI-G8-U8-L2","sub":"Science","g":8,"u":8,"un":"Ecosystems & food webs","l":2,"t":"How changes to an ecosystem affect populations — Part 2","role":"Part 2 of 2","topic":"LS-G6-8-T13","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSm-GRADE-6-8-YEAR 7-9","stmt":"Construct an argument supported by empirical evidence that changes to physical or biological components of an ecosystem affect populations — including how organisms affect and are affected by their environment, with the accumulation of toxic materials as an example. [Clarification
