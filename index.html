nge and associated future impacts to Earth systems; Furthermore, the uncertainties in evidence for additional anthropogenic causes of climate change. [Clarification Statement: Examples of evidence, for both data and climate model outputs, are for climate changes (such as precipitation and temperature) and their associated impacts (such as on sea level, glacial ice volumes, or atmosphere and ocean composition).] [Assessment Boundary: Assessment is limited to one example of a climate change and its associated impacts.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 41; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T4-LO06","x":"c Students describe* whether the predicted effect on the system is reversible or irreversible.\nd Students identify one source of uncertainty in the prediction of the effect in the future of a\nselected aspect of climate change.","k":"Core"},{"c":"ESS-G9–10-T4-LO07","x":"e In their interpretation of the data, students:\ni. Make a statement regarding how variation or uncertainty in the data (e.g., limitations,\naccuracy, any bias in the data resulting from choice of sample, scale, instrumentation, etc.)","k":"Core"},{"c":"ESS-G9–10-T4-LO08","x":"may affect the interpretation of the data; and\nii. Identify the limitations of the models that provided the simulation data and ranges for their\npredictions.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"ESS-G9–10-T4-LO09","x":"• identify the uncertainties in the evidence for additional anthropogenic causes of climate change, separating what the evidence establishes firmly from what remains a range","k":"UK Requirement"},{"c":"ESS-G9–10-T4-LO10","x":"• explain why uncertainty about the size of a change is not uncertainty about its direction","k":"UK Requirement"}]},{"id":"SCI-G10-U4-L3","sub":"Science","g":10,"u":4,"un":"Weather & climate","l":3,"t":"Forecasting climate change from data and models — Part 3","role":"Part 3 of 3","topic":"ESS-G9-10-T4","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories, 14. Science and Society","tim":"","pis":"","cls":"Core + UK Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Weather & climate","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSd-GRADE-9-10-YEAR 10-11","stmt":"Analyze geoscience data and the results from global climate models to make an evidence-based forecast of the current rate of global or regional climate change and associated future impacts to Earth systems; Furthermore, the uncertainties in evidence for additional anthropogenic causes of climate change. [Clarification Statement: Examples of evidence, for both data and climate model outputs, are for climate changes (such as precipitation and temperature) and their associated impacts (such as on sea level, glacial ice volumes, or atmosphere and ocean composition).] [Assessment Boundary: Assessment is limited to one example of a climate change and its associated impacts.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 41; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T4-LO11","x":"• state the limitations of the global climate models that produced the simulation data, including the ranges attached to their predictions and the assumptions behind each scenario","k":"UK Requirement"},{"c":"ESS-G9–10-T4-LO12","x":"• evaluate a public claim about an anthropogenic cause of climate change against the strength and the stated uncertainty of the evidence for it","k":"UK Requirement"}]},{"id":"SCI-G10-U5-L1","sub":"Science","g":10,"u":5,"un":"Body systems & health","l":1,"t":"Homeostasis and feedback — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T3","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-Science-BIOc-GRADE-9-10-YEAR 10-11","stmt":"Plan and conduct an investigation to provide evidence that feedback mechanisms maintain homeostasis; achieved through homeostasis and the principles of nervous and hormonal coordination and control in humans. [Clarification Statement: Examples of investigations could include heart rate response to exercise, stomate response to moisture and temperature, and root development in response to water levels.] [Assessment Boundary: Assessment does not include the cellular processes involved in the feedback mechanism.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 22; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T3-LO01","x":"1 Identifying the phenomenon under investigation\na Students describe* the phenomenon under investigation, which includes the following idea: that\nfeedback mechanisms maintain homeostasis.","k":"Core"},{"c":"BIO-G9–10-T3-LO02","x":"2 Identifying the evidence to answer this question\na Students develop an investigation plan and describe* the data that will be collected and the evidence\nto be derived from the data, including:\ni. Changes within a chosen range in the external environment of a living system; and\nii. Responses of a living system that would stabilize and maintain the system’s internal conditions\n(homeostasis), even though external conditions change, thus establishing the positive or\nnegative feedback mechanism.","k":"Core"},{"c":"BIO-G9–10-T3-LO03","x":"b Students describe* why the data will provide information relevant to the purpose of the investigation.","k":"Core"},{"c":"BIO-G9–10-T3-LO04","x":"3 Planning for the investigation\na In the investigation plan, students describe*:\ni. How the change in the external environment is to be measured or identified;\nii. How the response of the living system will be measured or identified;\niii. How the stabilization or destabilization of the system’s internal conditions will be measured or\ndetermined;\niv. The experimental procedure, the minimum number of different systems (and the factors that affect\nthem) that would allow generalization of results, the evidence derived from the data, and\nidentification of limitations on the precision of data to include types and amounts; and\nv. Whether the investigation will be conducted individually or collaboratively.","k":"Core"},{"c":"BIO-G9–10-T3-LO05","x":"4 Collecting the data\na Students collect and record changes in the external environment and organism responses as a function\nof time.","k":"Core"}]},{"id":"SCI-G10-U5-L2","sub":"Science","g":10,"u":5,"un":"Body systems & health","l":2,"t":"Homeostasis and feedback — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T3","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-Science-BIOc-GRADE-9-10-YEAR 10-11","stmt":"Plan and conduct an investigation to provide evidence that feedback mechanisms maintain homeostasis; achieved through homeostasis and the principles of nervous and hormonal coordination and control in humans. [Clarification Statement: Examples of investigations could include heart rate response to exercise, stomate response to moisture and temperature, and root development in response to water levels.] [Assessment Boundary: Assessment does not include the cellular processes involved in the feedback mechanism.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 22; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T3-LO06","x":"5 Refining the design\na Students evaluate their investigation, including:\ni. Assessment of the accuracy and precision of the data, as well as limitations (e.g., cost, risk,\ntime) of the investigation, and make suggestions for refinement; and\nii. Assessment of the ability of the data to provide the evidence required.","k":"Core"},{"c":"BIO-G9–10-T3-LO07","x":"b If necessary, students refine the investigation plan to produce more generalizable data.","k":"Core"}]},{"id":"SCI-G10-U5-L3","sub":"Science","g":10,"u":5,"un":"Body systems & health","l":3,"t":"Body defences and the immune system — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T25","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"14. Science and Society","tim":"","pis":"Essential","cls":"Core* (TIMSS/PISA)","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-Science-BIOy-GRADE-9-10-YEAR 10-11","stmt":"Explain body defences against pathogens and the role of the immune system against disease and evaluate methods of reducing and preventing the spread of infectious diseases in animals and plants.","pdfm":[],"xchk":"Classification review – Core* (TIMSS/PISA) vs UK Requirement","src":"ADEK CORE STANDARDS 9-10.pdf, p. 29; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T25-LO01","x":"Furthermore (UK Requirement):\n• explain how the body's non-specific defences keep pathogens out, naming the skin as a barrier, the mucus and cilia of the airways, the acid in the stomach and the role of tears","k":"UK Requirement"},{"c":"BIO-G9–10-T25-LO02","x":"• explain the role of white blood cells in the immune response, describing phagocytosis, the production of antibodies specific to the antigens on a pathogen, and the production of antitoxins","k":"Core"},{"c":"BIO-G9–10-T25-LO03","x":"• explain how vaccination produces immunity, describing how a dead or inactivated form of a pathogen stimulates white blood cells to produce antibodies so that a later infection by the same pathogen is met with a rapid response","k":"Core"},{"c":"BIO-G9–10-T25-LO04","x":"• evaluate methods of reducing and preventing the spread of infectious disease in animals, including hygiene, isolation of infected individuals, control of vectors and vaccination, judging each against named criteria","k":"Core"},{"c":"BIO-G9–10-T25-LO05","x":"• evaluate methods of reducing and preventing the spread of infectious disease in plants, including removal of infected plants, crop rotation, resistant varieties, physical barriers and chemical treatment","k":"Core"}]},{"id":"SCI-G10-U5-L4","sub":"Science","g":10,"u":5,"un":"Body systems & health","l":4,"t":"Body defences and the immune system — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T25","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"14. Science and Society","tim":"","pis":"Essential","cls":"Core* (TIMSS/PISA)","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-Science-BIOy-GRADE-9-10-YEAR 10-11","stmt":"Explain body defences against pathogens and the role of the immune system against disease and evaluate methods of reducing and preventing the spread of infectious diseases in animals and plants.","pdfm":[],"xchk":"Classification review – Core* (TIMSS/PISA) vs UK Requirement","src":"ADEK CORE STANDARDS 9-10.pdf, p. 29; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T25-LO06","x":"• justify a recommended combination of prevention methods for a given situation using evidence on effectiveness, cost and practicality","k":"Core"}]},{"id":"SCI-G10-U6-L1","sub":"Science","g":10,"u":6,"un":"Cells & organisation","l":1,"t":"Mitosis and differentiation — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T14","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"7. Cells and Life","dom":"Life Sciences","area":"Cells & organisation","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOn-GRADE-9-10-YEAR 10-11","stmt":"Use a model to illustrate the role of cellular division (mitosis) and differentiation in producing and maintaining complex organisms. Furthermore, explore the adaptations of cells related to their functions, the main sub-cellular structures of eukaryotic and prokaryotic cells, and the roles of stem cells in animals and meristems in plants. [Assessment Boundary: Assessment does not include specific gene control mechanisms or rote memorization of the steps of mitosis.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 26; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T14-LO01","x":"1 Components of the model\na From the given model, students identify and describe* the components of the model relevant for\nillustrating the role of mitosis and differentiation in producing and maintaining complex organisms,\nincluding:\ni. Genetic material containing two variants of each chromosome pair, one from each parent;\nii. Parent and daughter cells (i.e., inputs and outputs of mitosis); and\niii. A multi-cellular organism as a collection of differentiated cells.","k":"Core"},{"c":"BIO-G9–10-T14-LO02","x":"2 Relationships\na Students identify and describe* the relationships between components of the given model, including:\ni. Daughter cells receive identical genetic information from a parent cell or a fertilized egg.\nii. Mitotic cell division produces two genetically identical daughter cells from one parent cell.\niii. Differences between different cell types within a multicellular organism are due to gene\nexpression — not different genetic material within that organism.","k":"Core"},{"c":"BIO-G9–10-T14-LO03","x":"3 Connections\na Students use the given model to illustrate that mitotic cell division results in more cells that:\ni. Allow growth of the organism;\nii. Can then differentiate to create different cell types; and\niii. Can replace dead cells to maintain a complex organism.","k":"Core"},{"c":"BIO-G9–10-T14-LO04","x":"b Students make a distinction between the accuracy of the model and the actual process of cellular\ndivision.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"BIO-G9–10-T14-LO05","x":"• relate the structure of named specialised cells — sperm, nerve, muscle, root hair, xylem and phloem — to the functions each carries out","k":"UK Requirement"}]},{"id":"SCI-G10-U6-L2","sub":"Science","g":10,"u":6,"un":"Cells & organisation","l":2,"t":"Mitosis and differentiation — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T14","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"7. Cells and Life","dom":"Life Sciences","area":"Cells & organisation","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOn-GRADE-9-10-YEAR 10-11","stmt":"Use a model to illustrate the role of cellular division (mitosis) and differentiation in producing and maintaining complex organisms. Furthermore, explore the adaptations of cells related to their functions, the main sub-cellular structures of eukaryotic and prokaryotic cells, and the roles of stem cells in animals and meristems in plants. [Assessment Boundary: Assessment does not include specific gene control mechanisms or rote memorization of the steps of mitosis.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 26; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T14-LO06","x":"• identify the main sub-cellular structures of eukaryotic cells (nucleus, cell membrane, cytoplasm, mitochondria, ribosomes, and in plant cells chloroplasts, a permanent vacuole and a cellulose cell wall) and of prokaryotic cells (cell wall, cell membrane, cytoplasm, circular DNA and plasmids), state the function of each, and compare the two cell types","k":"UK Requirement"},{"c":"BIO-G9–10-T14-LO07","x":"• describe the role of stem cells in embryonic and adult animal tissue and of meristem tissue in plants, and explain how each makes growth, repair and the cloning of plants possible","k":"UK Requirement"}]},{"id":"SCI-G10-U7-L1","sub":"Science","g":10,"u":7,"un":"Ecosystems & food webs","l":1,"t":"The carbon cycle","role":"Single lesson","topic":"BIO-G9-10-T9","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOi-GRADE-9-10-YEAR 10-11","stmt":"Develop a model of the cycling of carbon among the biosphere, atmosphere, hydrosphere and geosphere. [Clarification Statement: Examples of models could include simulations and mathematical models.] [Assessment Boundary: Assessment does not include the specific chemical steps of photosynthesis and respiration.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 24; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T9-LO01","x":"1 Components of the model\na Students use evidence to develop a model in which they identify and describe* the relevant components,\nincluding:\ni. The inputs and outputs of photosynthesis;\nii. The inputs and outputs of cellular respiration; and\niii. The biosphere, atmosphere, hydrosphere, and geosphere.","k":"Core"},{"c":"BIO-G9–10-T9-LO02","x":"2 Relationships\na Students describe* relationships between components of their model, including:\ni. The exchange of carbon (through carbon-containing compounds) between organisms and the\nenvironment; and\nii. The role of storing carbon in organisms (in the form of carbon-containing compounds) as part of\nthe carbon cycle.","k":"Core"},{"c":"BIO-G9–10-T9-LO03","x":"3 Connections\na Students describe* the contribution of photosynthesis and cellular respiration to the exchange of\ncarbon within and among the biosphere, atmosphere, hydrosphere, and geosphere in their model.","k":"Core"},{"c":"BIO-G9–10-T9-LO04","x":"b Students make a distinction between the model’s simulation and the actual cycling of carbon via\nphotosynthesis and cellular respiration.","k":"Core"}]},{"id":"SCI-G10-U7-L2","sub":"Science","g":10,"u":7,"un":"Ecosystems & food webs","l":2,"t":"Factors affecting biodiversity and populations — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T11","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOk-GRADE-9-10-YEAR 10-11","stmt":"Use mathematical representations to support and revise explanations based on evidence about factors affecting biodiversity and populations in ecosystems of different scales; achieved through the importance of biodiversity. Furthermore, explore methods of identifying species and measuring distribution, frequency and abundance of species within a habitat [Clarification Statement: Examples of mathematical representations include finding the average, determining trends, and using graphical comparisons of multiple sets of data.] [Assessment Boundary: Assessment is limited to provided data.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 25; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T11-LO01","x":"1 Representation\na Students identify and describe* the components in the given mathematical representations (which\ninclude trends, averages, and graphs of the number of organisms per unit of area in a stable system)\nthat are relevant to supporting and revising the given explanations about factors affecting\nbiodiversity and ecosystems, including:\ni. Data on numbers and types of organisms are represented.\nii. Interactions between ecosystems at different scales are represented.","k":"Core"},{"c":"BIO-G9–10-T11-LO02","x":"b Students identify the given explanation(s) to be supported of factors affecting biodiversity and\npopulation levels, which include the following ideas:\ni. The populations and number of organisms in ecosystems vary as a function of the physical and\nbiological dynamics of the ecosystem.\nii. The response of an ecosystem to a small change might not significantly affect populations,\nwhereas the response to a large change can have a large effect on populations that then feeds\nback to the ecosystem at a range of scales.\niii. Ecosystems can exist in the same location on a variety of scales (e.g., plants and animals vs.\nmicrobes), and these populations can interact in ways that significantly change these ecosystems\n(e.g., interactions among microbes, plants, and animals can be an important factor in the\nresources available to both a microscopic and macroscopic ecosystem).","k":"Core"},{"c":"BIO-G9–10-T11-LO03","x":"2 Mathematical Modeling\na Students use the given mathematical representations (including trends, averages, and graphs) of\nfactors affecting biodiversity and ecosystems to identify changes over time in the numbers and types\nof organisms in ecosystems of different scales.","k":"Core"},{"c":"BIO-G9–10-T11-LO04","x":"3 Analysis\na Students use the analysis of the given mathematical representations of factors affecting biodiversity\nand ecosystems\ni. To identify the most important factors that determine biodiversity and population numbers of an\necosystem.\nii. As evidence to support explanation(s) for the effects of both living and nonliving factors on\nbiodiversity and population size, as well as the interactions of ecosystems on different scales.\niii. To describe* how, in the model, factors affecting ecosystems at one scale can cause observable\nchanges in ecosystems at a different scale.","k":"Core"},{"c":"BIO-G9–10-T11-LO05","x":"b Students describe* the given mathematical representations in terms of their ability to support\nexplanation(s) for the effects of modest to extreme disturbances on an ecosystems’ capacity to return\nto original status or become a different ecosystem.","k":"Core"}]},{"id":"SCI-G10-U7-L3","sub":"Science","g":10,"u":7,"un":"Ecosystems & food webs","l":3,"t":"Factors affecting biodiversity and populations — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T11","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOk-GRADE-9-10-YEAR 10-11","stmt":"Use mathematical representations to support and revise explanations based on evidence about factors affecting biodiversity and populations in ecosystems of different scales; achieved through the importance of biodiversity. Furthermore, explore methods of identifying species and measuring distribution, frequency and abundance of species within a habitat [Clarification Statement: Examples of mathematical representations include finding the average, determining trends, and using graphical comparisons of multiple sets of data.] [Assessment Boundary: Assessment is limited to provided data.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 25; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T11-LO06","x":"4 Revision\na Students revise the explanation(s) based on new evidence about any factors that affect biodiversity\nand populations (e.g., data illustrating the effect of a disturbance within the ecosystem).\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"BIO-G9–10-T11-LO07","x":"• identify the species present in a habitat using a dichotomous key and a field guide, and record the identifications systematically","k":"UK Requirement"},{"c":"BIO-G9–10-T11-LO08","x":"• measure the distribution, frequency and abundance of species in a habitat using random quadrat sampling and a belt transect, and state which question each method is the right tool for","k":"UK Requirement"},{"c":"BIO-G9–10-T11-LO09","x":"• calculate percentage cover, mean number per quadrat and an estimate of the total population of a species from quadrat data, and state the uncertainty carried by that estimate","k":"UK Requirement"}]},{"id":"SCI-G10-U7-L4","sub":"Science","g":10,"u":7,"un":"Ecosystems & food webs","l":4,"t":"Reducing human impact on biodiversity — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T13","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology, 14. Science and Society","tim":"","pis":"Essential","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOm-GRADE-9-10-YEAR 10-11","stmt":"Design, evaluate and refine a solution for reducing the impacts of human activities on the environment and biodiversity; achieved through positive and negative human interactions with ecosystems. [Clarification Statement: Examples of human activities can include urbanization, building dams, and dissemination of invasive species.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 26; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T13-LO01","x":"1 Using scientific knowledge to generate the design solution\na Students design a solution that involves reducing the negative effects of human activities on the\nenvironment and biodiversity, and that relies on scientific knowledge of the factors affecting changes\nand stability in biodiversity. Examples of factors include but are not limited to:\ni. Overpopulation;\nii. Overexploitation;\niii. Habitat destruction;\niv. Pollution;\nv. Introduction of invasive species; and\nvi. Changes in climate.","k":"Core"},{"c":"BIO-G9–10-T13-LO02","x":"b Students describe* the ways the proposed solution decreases the negative effects of human activity on\nthe environment and biodiversity.","k":"Core"},{"c":"BIO-G9–10-T13-LO03","x":"2 Describing criteria and constraints, including quantification when appropriate\na Students describe* and quantify (when appropriate) the criteria (amount of reduction of impacts and\nhuman activities to be mitigated) and constraints (for example, cost, human needs, and environmental\nimpacts) for the solution to the problem, along with the tradeoffs in the solution.","k":"Core"},{"c":"BIO-G9–10-T13-LO04","x":"3 Evaluating potential solutions\na Students evaluate the proposed solution for its impact on overall environmental stability and changes.","k":"Core"},{"c":"BIO-G9–10-T13-LO05","x":"b Students evaluate the cost, safety, and reliability, as well as social, cultural, and environmental\nimpacts, of the proposed solution for a select human activity that is harmful to an ecosystem.","k":"Core"}]},{"id":"SCI-G10-U7-L5","sub":"Science","g":10,"u":7,"un":"Ecosystems & food webs","l":5,"t":"Reducing human impact on biodiversity — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T13","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology, 14. Science and Society","tim":"","pis":"Essential","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOm-GRADE-9-10-YEAR 10-11","stmt":"Design, evaluate and refine a solution for reducing the impacts of human activities on the environment and biodiversity; achieved through positive and negative human interactions with ecosystems. [Clarification Statement: Examples of human activities can include urbanization, building dams, and dissemination of invasive species.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 26; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T13-LO06","x":"4 Refining and/or optimizing the design solution\na Students refine the proposed solution by prioritizing the criteria and making tradeoffs as necessary\nto further reduce environmental impact and loss of biodiversity while addressing human needs.","k":"Core"}]},{"id":"SCI-G10-U8-L1","sub":"Science","g":10,"u":8,"un":"Evidence of evolution","l":1,"t":"Evidence for common ancestry and evolution — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T18","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"10. Diversity of Life","dom":"Life Sciences","area":"Evidence of evolution","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOr-GRADE-9-10-YEAR 10-11","stmt":"Communicate scientific information that common ancestry and biological evolution are supported by multiple lines of empirical evidence (e.g., DNA sequences, anatomical structures, embryological development, and the fossil record). Furthermore, explore the process of natural selection leading to evolution and how developments in biology have affected classification. Clarification Statement: Emphasis is on a conceptual understanding of the role each line of evidence has relating to common ancestry and biological evolution. Examples of evidence could include similarities in DNA sequences, anatomical structures, and order of appearance of structures in embryological development.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 27; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T18-LO01","x":"1 Communication style and format\na Students use at least two different formats (e.g., oral, graphical, textual and mathematical), to\ncommunicate scientific information, including that common ancestry and biological evolution are\nsupported by multiple lines of empirical evidence. Students cite the origin of the information as\nappropriate.","k":"Core"},{"c":"BIO-G9–10-T18-LO02","x":"2 Connecting the DCIs and the CCCs\na Students identify and communicate evidence for common ancestry and biological evolution, including:\ni. Information derived from DNA sequences, which vary among species but have many similarities\nbetween species;","k":"Core"},{"c":"BIO-G9–10-T18-LO03","x":"ii. Similarities of the patterns of amino acid sequences, even when DNA sequences are slightly\ndifferent, including the fact that multiple patterns of DNA sequences can code for the same\namino acid; iii.Patterns in the fossil record (e.g., presence, location, and inferences possible\nin lines of evolutionary descent for multiple specimens); and\niv. The pattern of anatomical and embryological similarities.","k":"Core"},{"c":"BIO-G9–10-T18-LO04","x":"b Students identify and communicate connections between each line of evidence and the claim of common\nancestry and biological evolution.\nc Students communicate that together, the patterns observed at multiple spatial and temporal scales\n(e.g., DNA sequences, embryological development, fossil records) provide evidence for causal\nrelationships relating to biological evolution and common ancestry.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"BIO-G9–10-T18-LO05","x":"• explain the process of natural selection as a sequence — variation within a population, competition for limited resources, differential survival and reproduction, and inheritance of the advantageous characteristic — leading to evolution across many generations","k":"UK Requirement"}]},{"id":"SCI-G10-U8-L2","sub":"Science","g":10,"u":8,"un":"Evidence of evolution","l":2,"t":"Evidence for common ancestry and evolution — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T18","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"10. Diversity of Life","dom":"Life Sciences","area":"Evidence of evolution","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOr-GRADE-9-10-YEAR 10-11","stmt":"Communicate scientific information that common ancestry and biological evolution are supported by multiple lines of empirical evidence (e.g., DNA sequences, anatomical structures, embryological development, and the fossil record). Furthermore, explore the process of natural selection leading to evolution and how developments in biology have affected classification. Clarification Statement: Emphasis is on a conceptual understanding of the role each line of evidence has relating to common ancestry and biological evolution. Examples of evidence could include similarities in DNA sequences, anatomical structures, and order of appearance of structures in embryological development.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 27; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T18-LO06","x":"• apply that sequence to a named example and distinguish it from the idea that individuals change during their own lifetime","k":"UK Requirement"},{"c":"BIO-G9–10-T18-LO07","x":"• describe how developments in biology, particularly DNA sequencing and molecular biology, have changed the way organisms are classified, including the recognition of three domains","k":"UK Requirement"},{"c":"BIO-G9–10-T18-LO08","x":"• explain why a classification based on molecular evidence can differ from one based on appearance alone, and why the molecular classification is regarded as the better reflection of ancestry","k":"UK Requirement"}]},{"id":"SCI-G10-U9-L1","sub":"Science","g":10,"u":9,"un":"Genetics & inheritance","l":1,"t":"Sources of inheritable variation — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T16","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core","big":"9. Inheritance","dom":"Life Sciences","area":"Genetics & inheritance","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOp-GRADE-9-10-YEAR 10-11","stmt":"Make and defend a claim based on evidence that inheritable genetic variations may result from new genetic combinations through meiosis, viable errors during replication, and/or mutations caused by environmental factors; achieved through exploring genetic variation in populations of a species. [Clarification Statement: Emphasis is on using data to support arguments for the way variation occurs.] [Assessment Boundary: Assessment does not include the phases of meiosis or the biochemical mechanism of specific steps in the process.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 27; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T16-LO01","x":"1 Developing a claim\na Students make a claim that includes the idea that inheritable genetic variations may result from:\ni. New genetic combinations through meiosis;\nii. Viable errors occurring during replication; and\niii. Mutations caused by environmental factors.","k":"Core"},{"c":"BIO-G9–10-T16-LO02","x":"2 Identifying scientific evidence\na Students identify and describe* evidence that supports the claim, including:\ni. Variations in genetic material naturally result during meiosis when corresponding sections of","k":"Core"},{"c":"BIO-G9–10-T16-LO03","x":"chromosome pairs exchange places.\nii. Genetic mutations can occur due to: a) errors during replication; and/or b) environmental\nfactors.\niii. Genetic material is inheritable.","k":"Core"},{"c":"BIO-G9–10-T16-LO04","x":"b Students use scientific knowledge, literature, student-generated data, simulations and/or other\nsources for evidence.","k":"Core"},{"c":"BIO-G9–10-T16-LO05","x":"3 Evaluating and critiquing evidence\na Students identify the following strengths and weaknesses of the evidence used to support the claim:\ni.Types and numbers of sources; ii.Sufficiency to make and defend the claim, and to distinguish\nbetween causal and correlational relationships; and\niii. Validity and reliability of the evidence.","k":"Core"}]},{"id":"SCI-G10-U9-L2","sub":"Science","g":10,"u":9,"un":"Genetics & inheritance","l":2,"t":"Sources of inheritable variation — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T16","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core","big":"9. Inheritance","dom":"Life Sciences","area":"Genetics & inheritance","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOp-GRADE-9-10-YEAR 10-11","stmt":"Make and defend a claim based on evidence that inheritable genetic variations may result from new genetic combinations through meiosis, viable errors during replication, and/or mutations caused by environmental factors; achieved through exploring genetic variation in populations of a species. [Clarification Statement: Emphasis is on using data to support arguments for the way variation occurs.] [Assessment Boundary: Assessment does not include the phases of meiosis or the biochemical mechanism of specific steps in the process.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 27; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T16-LO06","x":"4 Reasoning and synthesis\na Students use reasoning to describe* links between the evidence and claim, such as:\ni. Genetic mutations produce genetic variations between cells or organisms.\nii. Genetic variations produced by mutation and meiosis can be inherited.","k":"Core"},{"c":"BIO-G9–10-T16-LO07","x":"b Students use reasoning and valid evidence to describe* that new combinations of DNA can arise from\nseveral sources, including meiosis, errors during replication, and mutations caused by environmental\nfactors.\nc Students defend a claim against counter-claims and critique by evaluating counter-claims and by\ndescribing* the connections between the relevant and appropriate evidence and the strongest claim.","k":"Core"}]},{"id":"SCI-G10-U10-L1","sub":"Science","g":10,"u":10,"un":"Photosynthesis & respiration","l":1,"t":"Building large molecules from sugars","role":"Single lesson","topic":"BIO-G9-10-T5","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Photosynthesis & respiration","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOe-GRADE-9-10-YEAR 10-11","stmt":"Construct and revise an explanation for how carbon, hydrogen and oxygen from sugar molecules may combine to form amino acids and other large carbon-based molecules; achieved through carbohydrates, proteins, nucleic acids and lipids as key biological molecules. [Clarification Statement: Emphasis is on using evidence from models and simulations to support explanations.] [Assessment Boundary: Assessment does not include the details of the specific chemical reactions or identification of macromolecules.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 23; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T5-LO01","x":"1 Articulating the explanation of phenomena\na Students construct an explanation that includes:\ni. The relationship between the carbon, hydrogen, and oxygen atoms from sugar molecules formed in\nor ingested by an organism and those same atoms found in amino acids and other large\ncarbon-based molecules; and\nii. That larger carbon-based molecules and amino acids can be a result of chemical reactions between\nsugar molecules (or their component atoms) and other atoms.","k":"Core"},{"c":"BIO-G9–10-T5-LO02","x":"2 Evidence\na Students identify and describe* the evidence to construct the explanation, including:\ni. All organisms take in matter (allowing growth and maintenance) and rearrange the atoms in\nchemical reactions.\nii. Cellular respiration involves chemical reactions between sugar molecules and other molecules in\nwhich energy is released that can be used to drive other chemical reactions.\niii. Sugar molecules are composed of carbon, oxygen, and hydrogen atoms.\niv. Amino acids and other complex carbon-based molecules are composed largely of carbon, oxygen, and\nhydrogen atoms.\nv. Chemical reactions can create products that are more complex than the reactants.\nvi. Chemical reactions involve changes in the energies of the molecules involved in the reaction.","k":"Core"},{"c":"BIO-G9–10-T5-LO03","x":"b Students use a variety of valid and reliable sources for the evidence (e.g., theories, simulations,\nstudents’ own investigations).","k":"Core"},{"c":"BIO-G9–10-T5-LO04","x":"3 Reasoning\na Students use reasoning to connect the evidence, along with the assumption that theories and laws that\ndescribe the natural world operate today as they did in the past and will continue to do so in the\nfuture, to construct the explanation that atoms from sugar molecules may combine with other elements\nvia chemical reactions to form other large carbon-based molecules. Students describe* the following\nchain of reasoning for their explanation:\ni. The atoms in sugar molecules can provide most of the atoms that comprise amino acids and other\ncomplex carbon-based molecules.\nii. The energy released in respiration can be used to drive chemical reactions between sugars and\nother substances, and the products of those reactions can include amino acids and other complex\ncarbon-based molecules.\niii. The matter flows in cellular processes are the result of the rearrangement of primarily the\natoms in sugar molecules because those are the molecules whose reactions release the energy\nneeded for cell processes.","k":"Core"},{"c":"BIO-G9–10-T5-LO05","x":"4 Revising the explanation\na Given new evidence or context, students revise or expand their explanation about the relationships\nbetween atoms in sugar molecules and atoms in large carbon-based molecules, and justify their\nrevision.","k":"Core"}]},{"id":"SCI-G10-U10-L2","sub":"Science","g":10,"u":10,"un":"Photosynthesis & respiration","l":2,"t":"Cycling of matter and energy in aerobic and anaerobic conditions","role":"Single lesson","topic":"BIO-G9-10-T7","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Photosynthesis & respiration","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOg-GRADE-9-10-YEAR 10-11","stmt":"Construct and revise an explanation for the cycling of matter and flow of energy in aerobic and anaerobic conditions; achieved through aerobic and anaerobic respiration and the role of decomposers in the cycling of materials through an ecosystem. [Clarification Statement: Emphasis is on conceptual understanding of the role of aerobic and anaerobic respiration in different environments.] [Assessment Boundary: Assessment does not include the specific chemical processes of either aerobic or anaerobic respiration.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 24; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T7-LO01","x":"1 Articulating the explanation of phenomena\na Students construct an explanation that includes that:\ni. Energy from photosynthesis and respiration drives the cycling of matter and flow of energy under\naerobic or anaerobic conditions within an ecosystem.\nii. Anaerobic respiration occurs primarily in conditions where oxygen is not available.","k":"Core"},{"c":"BIO-G9–10-T7-LO02","x":"2 Evidence\na Students identify and describe* the evidence to construct the explanation, including:\ni. All organisms take in matter and rearrange the atoms in chemical reactions.\nii. Photosynthesis captures energy in sunlight to create chemical products that can be used as food\nin cellular respiration.\niii. Cellular respiration is the process by which the matter in food (sugars, fats) reacts chemically\nwith other compounds, rearranging the matter to release energy that is used by the cell for\nessential life processes.","k":"Core"},{"c":"BIO-G9–10-T7-LO03","x":"b Students use a variety of valid and reliable sources for the evidence, which may include theories,\nsimulations, peer review, and students’ own investigations.","k":"Core"},{"c":"BIO-G9–10-T7-LO04","x":"3 Reasoning\na Students use reasoning to connect evidence, along with the assumption that theories and laws that\ndescribe the natural world operate today as they did in the past and will continue to do so in the\nfuture, to construct their explanation. Students describe* the following chain of reasoning used to\nconstruct their explanation:\ni. Energy inputs to cells occur either by photosynthesis or by taking in food.\nii. Since all cells engage in cellular respiration, they must all produce products of respiration.\niii. The flow of matter into and out of cells must therefore be driven by the energy captured by\nphotosynthesis or obtained by taking in food and released by respiration.\niv. The flow of matter and energy must occur whether respiration is aerobic or anaerobic.","k":"Core"},{"c":"BIO-G9–10-T7-LO05","x":"4 Revising the explanation\na Given new data or information, students revise their explanation and justify the revision (e.g.,\nrecent discoveries of life surrounding deep sea ocean vents have shown that photosynthesis is not the\nonly driver for cycling matter and energy in ecosystems).","k":"Core"}]},{"id":"SCI-G10-U11-L1","sub":"Science","g":10,"u":11,"un":"Variation & natural selection — Part 1","l":1,"t":"Advantageous traits and population change — Part 1","role":"Part 1 of 3","topic":"BIO-G9-10-T20","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core + UK Requirement","big":"10. Diversity of Life","dom":"Life Sciences","area":"Variation & natural selection","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOt-GRADE-9-10-YEAR 10-11","stmt":"Apply concepts of statistics and probability to support explanations that organisms with an advantageous heritable trait tend to increase in proportion to organisms lacking this trait. Furthermore, explore genetic variation in populations of a species. [Clarification Statement: Emphasis is on analyzing shifts in numerical distribution of traits and using these shifts as evidence to support explanations.] [Assessment Boundary: Assessment is limited to basic statistical and graphical analysis. Assessment does not include allele frequency calculations.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 28; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T20-LO01","x":"NGSS Evidence Statement for HS-LS4-3, stated verbatim:\n1 Organizing data\na Students organize data (e.g., using tables, graphs and charts) by the distribution of genetic traits\nover time.","k":"Core"},{"c":"BIO-G9–10-T20-LO02","x":"b Students describe* what each dataset represents","k":"Core"},{"c":"BIO-G9–10-T20-LO03","x":"2 Identifying relationships\na Students perform and use appropriate statistical analyses of data, including probability measures, to\ndetermine patterns of change in numerical distribution of traits over various time and population\nscales.","k":"Core"},{"c":"BIO-G9–10-T20-LO04","x":"3 Interpreting data\na Students use the data analyses as evidence to support explanations about the following:\ni. Positive or negative effects on survival and reproduction of individuals as relating to their\nexpression of a variable trait in a population;\nii. Natural selection as the cause of increases and decreases in heritable traits over time in a\npopulation, but only if it affects reproductive success; and\niii. The changes in distribution of adaptations of anatomical, behavioral, and physiological traits\nin a population.\nNGSS Evidence Statement for HS-LS3-3, stated verbatim:","k":"Core"},{"c":"BIO-G9–10-T20-LO05","x":"1 Organizing data\na Students organize the given data by the frequency, distribution, and variation of expressed traits in\nthe population.","k":"Core"}]},{"id":"SCI-G10-U11-L2","sub":"Science","g":10,"u":11,"un":"Variation & natural selection — Part 1","l":2,"t":"Advantageous traits and population change — Part 2","role":"Part 2 of 3","topic":"BIO-G9-10-T20","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core + UK Requirement","big":"10. Diversity of Life","dom":"Life Sciences","area":"Variation & natural selection","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOt-GRADE-9-10-YEAR 10-11","stmt":"Apply concepts of statistics and probability to support explanations that organisms with an advantageous heritable trait tend to increase in proportion to organisms lacking this trait. Furthermore, explore genetic variation in populations of a species. [Clarification Statement: Emphasis is on analyzing shifts in numerical distribution of traits and using these shifts as evidence to support explanations.] [Assessment Boundary: Assessment is limited to basic statistical and graphical analysis. Assessment does not include allele frequency calculations.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 28; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T20-LO06","x":"2 Identifying relationships\na Students perform and use appropriate statistical analyses of data, including probability measures, to\ndetermine the relationship between a trait’s occurrence within a population and environmental factors.","k":"Core"},{"c":"BIO-G9–10-T20-LO07","x":"3 Interpreting data\na Students analyze and interpret data to explain the distribution of expressed traits, including:\ni. Recognition and use of patterns in the statistical analysis to predict changes in trait\ndistribution within a population if environmental variables change; and\nii. Description* of the expression of a chosen trait and its variations as causative or\ncorrelational to some environmental factor based on reliable evidence.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"BIO-G9–10-T20-LO08","x":"• describe the genetic variation present in a population of a single species and state its sources in mutation and sexual reproduction","k":"UK Requirement"},{"c":"BIO-G9–10-T20-LO09","x":"• organise data on an expressed trait across a population by frequency, distribution and variation, and describe the pattern the data shows","k":"UK Requirement"},{"c":"BIO-G9–10-T20-LO10","x":"• use statistical analysis of that variation to predict how the distribution of the trait would change if an environmental variable changed","k":"UK Requirement"}]},{"id":"SCI-G10-U11-L3","sub":"Science","g":10,"u":11,"un":"Variation & natural selection — Part 1","l":3,"t":"Advantageous traits and population change — Part 3","role":"Part 3 of 3","topic":"BIO-G9-10-T20","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core + UK Requirement","big":"10. Diversity of Life","dom":"Life Sciences","area":"Variation & natural selection","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOt-GRADE-9-10-YEAR 10-11","stmt":"Apply concepts of statistics and probability to support explanations that organisms with an advantageous heritable trait tend to increase in proportion to organisms lacking this trait. Furthermore, explore genetic variation in populations of a species. [Clarification Statement: Emphasis is on analyzing shifts in numerical distribution of traits and using these shifts as evidence to support explanations.] [Assessment Boundary: Assessment is limited to basic statistical and graphical analysis. Assessment does not include allele frequency calculations.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 28; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T20-LO11","x":"• distinguish, from reliable evidence, whether the variation in an expressed trait is caused by an environmental factor or is only correlated with it","k":"UK Requirement"}]},{"id":"SCI-G10-U11-L4","sub":"Science","g":10,"u":11,"un":"Variation & natural selection — Part 1","l":4,"t":"Environmental change, speciation and extinction — Part 1","role":"Part 1 of 3","topic":"BIO-G9-10-T22","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories, 13. Science and Technology, 14. Science and Society","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"10. Diversity of Life","dom":"Life Sciences","area":"Variation & natural selection","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOv-GRADE-9-10-YEAR 10-11","stmt":"Evaluate the evidence supporting claims that changes in environmental conditions may result in increases in the number of individuals of some species, the emergence of new species over time, and the extinction of other species. Furthermore, explore the importance of selective breeding of plants and animals in agriculture, and the uses of modern biotechnology, including gene technology, and some of its practical and ethical considerations. [Clarification Statement: Emphasis is on determining cause and effect relationships for how changes to the environment such as deforestation, fishing, application of fertilizers, drought, flood, and the rate of change of the environment affect distribution or disappearance of traits in species.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 28; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T22-LO01","x":"1 Identifying the given claims and evidence to be evaluated\na Students identify the given claims, which include the idea that changes in environmental conditions\nmay result in:\ni. Increases in the number of individuals of some species;\nii. The emergence of new species over time; and\niii. The extinction of other species.","k":"Core"},{"c":"BIO-G9–10-T22-LO02","x":"b Students identify the given evidence to be evaluated.","k":"Core"},{"c":"BIO-G9–10-T22-LO03","x":"2 Identifying any potential additional evidence that is relevant to the evaluation\na Students identify and describe* additional evidence (in the form of data, information, models, or\nother appropriate forms) that was not provided but is relevant to the claims and to evaluating the\ngiven evidence, including:\ni. Data indicating the change over time in: a) The number of individuals in each species; b) The\nnumber of species in an environment; and c) The environmental conditions.\nii. Environmental factors that can determine the ability of individuals in a species to survive and\nreproduce.","k":"Core"},{"c":"BIO-G9–10-T22-LO04","x":"3 Evaluating and critiquing\na Students use their additional evidence to assess the validity, reliability, strengths, and weaknesses\nof the given evidence, along with its ability to support logical and reasonable arguments about the\noutcomes of group behavior.","k":"Core"},{"c":"BIO-G9–10-T22-LO05","x":"b Students assess the ability of the given evidence to be used to determine causal or correlational\neffects between environmental changes, the changes in the number of individuals in each species, the\nnumber of species in an environment, and/or the emergence or extinction of species.","k":"Core"}]},{"id":"SCI-G10-U11-L5","sub":"Science","g":10,"u":11,"un":"Variation & natural selection — Part 1","l":5,"t":"Environmental change, speciation and extinction — Part 2","role":"Part 2 of 3","topic":"BIO-G9-10-T22","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories, 13. Science and Technology, 14. Science and Society","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"10. Diversity of Life","dom":"Life Sciences","area":"Variation & natural selection","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOv-GRADE-9-10-YEAR 10-11","stmt":"Evaluate the evidence supporting claims that changes in environmental conditions may result in increases in the number of individuals of some species, the emergence of new species over time, and the extinction of other species. Furthermore, explore the importance of selective breeding of plants and animals in agriculture, and the uses of modern biotechnology, including gene technology, and some of its practical and ethical considerations. [Clarification Statement: Emphasis is on determining cause and effect relationships for how changes to the environment such as deforestation, fishing, application of fertilizers, drought, flood, and the rate of change of the environment affect distribution or disappearance of traits in species.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 28; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T22-LO06","x":"4 Reasoning and synthesis\na Students evaluate the degree to which the given empirical evidence can be used to construct logical\narguments that identify causal links between environmental changes and changes in the number of\nindividuals or species based on environmental factors that can determine the ability of individuals in\na species to survive and reproduce\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"BIO-G9–10-T22-LO07","x":"• explain how selective breeding of plants and animals is carried out and why it matters in agriculture, naming the trait selected and the generations over which it is fixed","k":"UK Requirement"},{"c":"BIO-G9–10-T22-LO08","x":"• distinguish selective breeding from natural selection by identifying who or what determines which individuals reproduce","k":"UK Requirement"},{"c":"BIO-G9–10-T22-LO09","x":"• describe uses of modern biotechnology, including gene technology, in agriculture and medicine","k":"UK Requirement"},{"c":"BIO-G9–10-T22-LO10","x":"• evaluate the practical considerations of selective breeding and gene technology, including the loss of genetic variation and the vulnerability it creates","k":"UK Requirement"}]},{"id":"SCI-G10-U12-L1","sub":"Science","g":10,"u":12,"un":"Variation & natural selection — Part 2","l":1,"t":"Environmental change, speciation and extinction — Part 3","role":"Part 3 of 3","topic":"BIO-G9-10-T22","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories, 13. Science and Technology, 14. Science and Society","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"10. Diversity of Life","dom":"Life Sciences","area":"Variation & natural selection","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOv-GRADE-9-10-YEAR 10-11","stmt":"Evaluate the evidence supporting claims that changes in environmental conditions may result in increases in the number of individuals of some species, the emergence of new species over time, and the extinction of other species. Furthermore, explore the importance of selective breeding of plants and animals in agriculture, and the uses of modern biotechnology, including gene technology, and some of its practical and ethical considerations. [Clarification Statement: Emphasis is on determining cause and effect relationships for how changes to the environment such as deforestation, fishing, application of fertilizers, drought, flood, and the rate of change of the environment affect distribution or disappearance of traits in species.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 28; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T22-LO11","x":"• discuss the ethical considerations raised by selective breeding and gene technology, setting out more than one position and the evidence or value each rests on","k":"UK Requirement"}]},{"id":"SCI-G10-U13-L1","sub":"Science","g":10,"u":13,"un":"Atoms & the Periodic Table","l":1,"t":"Nuclear processes: fission, fusion and decay — Part 1","role":"Part 1 of 3","topic":"CHE-G9-10-T9","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Atoms & the Periodic Table","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-CHEi-GRADE-9-10-YEAR 10-11","stmt":"Develop models to illustrate the changes in the composition of the nucleus of the atom and the energy released during the processes of fission, fusion, and radioactive decay; achieved through emission of alpha, beta and gamma radiation related to changes in nuclear mass and/or charge, and nuclear fission and fusion. Furthermore, explore half-life, irradiation, contamination and their hazardous effects, and waste disposal. [Clarification Statement: Emphasis is on simple qualitative models, such as pictures or diagrams, and on the scale of energy released in nuclear processes relative to other kinds of transformations.] [Assessment Boundary: Assessment does not include quantitative calculation of energy released. Assessment is limited to alpha, beta, and gamma radioactive decays.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 33; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T9-LO01","x":"1 Components of the model\na Students develop models in which they identify and describe* the relevant components of the models,\nincluding:","k":"Core"},{"c":"CHE-G9–10-T9-LO02","x":"i. Identification of an element by the number of protons;\nii. The number of protons and neutrons in the nucleus before and after the decay;\niii. The identity of the emitted particles (i.e., alpha, beta — both electrons and positrons, and\ngamma); and\niv. The scale of energy changes associated with nuclear processes, relative to the scale of energy\nchanges associated with chemical processes.","k":"Core"},{"c":"CHE-G9–10-T9-LO03","x":"2 Relationships\na Students develop five distinct models to illustrate the relationships between components underlying\nthe nuclear processes of 1) fission, 2) fusion and 3) three distinct types of radioactive decay.","k":"Core"},{"c":"CHE-G9–10-T9-LO04","x":"b Students include the following features, based on evidence, in all five models:\ni. The total number of neutrons plus protons is the same both before and after the nuclear process,\nalthough the total number of protons and the total number of neutrons may be different before\nand after.\nii. The scale of energy changes in a nuclear process is much larger (hundreds of thousands or even\nmillions of times larger) than the scale of energy changes in a chemical process.","k":"Core"},{"c":"CHE-G9–10-T9-LO05","x":"3 Connections\na Students develop a fusion model that illustrates a process in which two nuclei merge to form a single,\nlarger nucleus with a larger number of protons than were in either of the two original nuclei.","k":"Core"}]},{"id":"SCI-G10-U13-L2","sub":"Science","g":10,"u":13,"un":"Atoms & the Periodic Table","l":2,"t":"Nuclear processes: fission, fusion and decay — Part 2","role":"Part 2 of 3","topic":"CHE-G9-10-T9","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Atoms & the Periodic Table","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-CHEi-GRADE-9-10-YEAR 10-11","stmt":"Develop models to illustrate the changes in the composition of the nucleus of the atom and the energy released during the processes of fission, fusion, and radioactive decay; achieved through emission of alpha, beta and gamma radiation related to changes in nuclear mass and/or charge, and nuclear fission and fusion. Furthermore, explore half-life, irradiation, contamination and their hazardous effects, and waste disposal. [Clarification Statement: Emphasis is on simple qualitative models, such as pictures or diagrams, and on the scale of energy released in nuclear processes relative to other kinds of transformations.] [Assessment Boundary: Assessment does not include quantitative calculation of energy released. Assessment is limited to alpha, beta, and gamma radioactive decays.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 33; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T9-LO06","x":"b Students develop a fission model that illustrates a process in which a nucleus splits into two or more\nfragments that each have a smaller number of protons than were in the original nucleus.","k":"Core"},{"c":"CHE-G9–10-T9-LO07","x":"c In both the fission and fusion models, students illustrate that these processes may release energy and\nmay require initial energy for the reaction to take place.\nd Students develop radioactive decay models that illustrate the differences in type of energy (e.g.,\nkinetic energy, electromagnetic radiation) and type of particle (e.g., alpha particle, beta particle)\nreleased during alpha, beta, and gamma radioactive decay, and any change from one element to another\nthat can occur due to the process.","k":"Core"},{"c":"CHE-G9–10-T9-LO08","x":"e Students develop radioactive decay models that describe* that alpha particle emission is a type of\nfission reaction, and that beta and gamma emission are not.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"CHE-G9–10-T9-LO09","x":"• define half-life and use a decay curve or a halving sequence to find the activity or the mass of an isotope remaining after a given number of half-lives","k":"UK Requirement"},{"c":"CHE-G9–10-T9-LO10","x":"• distinguish irradiation from contamination, stating in each case where the radioactive material is and how the exposure is ended","k":"UK Requirement"}]},{"id":"SCI-G10-U13-L3","sub":"Science","g":10,"u":13,"un":"Atoms & the Periodic Table","l":3,"t":"Nuclear processes: fission, fusion and decay — Part 3","role":"Part 3 of 3","topic":"CHE-G9-10-T9","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Atoms & the Periodic Table","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-CHEi-GRADE-9-10-YEAR 10-11","stmt":"Develop models to illustrate the changes in the composition of the nucleus of the atom and the energy released during the processes of fission, fusion, and radioactive decay; achieved through emission of alpha, beta and gamma radiation related to changes in nuclear mass and/or charge, and nuclear fission and fusion. Furthermore, explore half-life, irradiation, contamination and their hazardous effects, and waste disposal. [Clarification Statement: Emphasis is on simple qualitative models, such as pictures or diagrams, and on the scale of energy released in nuclear processes relative to other kinds of transformations.] [Assessment Boundary: Assessment does not include quantitative calculation of energy released. Assessment is limited to alpha, beta, and gamma radioactive decays.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 33; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T9-LO11","x":"• describe the hazardous effects of ionising radiation on living tissue and the precautions that reduce the dose received","k":"UK Requirement"},{"c":"CHE-G9–10-T9-LO12","x":"• explain why radioactive waste is classified by activity and half-life, and justify a disposal or storage route for a given waste on that basis","k":"UK Requirement"}]},{"id":"SCI-G10-U14-L1","sub":"Science","g":10,"u":14,"un":"Chemical reactions","l":1,"t":"Energy changes in chemical reactions","role":"Single lesson","topic":"CHE-G9-10-T5","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Exact top-level parsing","code":"ADEK-Science-CHEe-GRADE-9-10-YEAR 10-11","stmt":"Develop a model to illustrate that the release or absorption of energy from a chemical reaction system depends upon the changes in total bond energy; achieved through qualitative measurement of energy changes, bond breaking and making, activation energy and reaction profiles. Clarification Statement: Emphasis is on the idea that a chemical reaction is a system that affects the energy change. Examples of models could include molecular-level drawings and diagrams of reactions, graphs showing the relative energies of reactants and products, and representations showing energy is conserved.] [Assessment Boundary: Assessment does not include calculating the total bond energy changes during a chemical reaction from the bond energies of reactants and products.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 32; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T5-LO01","x":"1 Components of the model\na Students use evidence to develop a model in which they identify and describe* the relevant components,\nincluding:\ni. The chemical reaction, the system, and the surroundings under study;\nii. The bonds that are broken during the course of the reaction;\niii. The bonds that are formed during the course of the reaction;\niv. The energy transfer between the systems and their components or the system and surroundings;\nv. The transformation of potential energy from the chemical system interactions to kinetic energy\nin the surroundings (or vice versa) by molecular collisions; and\nvi. The relative potential energies of the reactants and the products.","k":"Core"},{"c":"CHE-G9–10-T5-LO02","x":"2 Relationships\na In the model, students include and describe* the relationships between components, including:\ni. The net change of energy within the system is the result of bonds that are broken and formed\nduring the reaction (Note: This does not include calculating the total bond energy changes.);\nii. The energy transfer between system and surroundings by molecular collisions;\niii. The total energy change of the chemical reaction system is matched by an equal but opposite\nchange of energy in the surroundings (Note: This does not include calculating the total bond\nenergy changes.); and iv. The release or absorption of energy depends on whether the relative\npotential energies of the reactants and products decrease or increase.","k":"Core"},{"c":"CHE-G9–10-T5-LO03","x":"3 Connections\na Students use the developed model to illustrate:\ni. The energy change within the system is accounted for by the change in the bond energies of the\nreactants and products. (Note: This does not include calculating the total bond energy changes.)\nii. Breaking bonds requires an input of energy from the system or surroundings, and forming bonds\nreleases energy to the system and the surroundings.\niii. The energy transfer between systems and surroundings is the difference in energy between the\nbond energies of the reactants and the products.\niv. The overall energy of the system and surroundings is unchanged (conserved) during the reaction.\nv. Energy transfer occurs during molecular collisions.\nvi. The relative total potential energies of the reactants and products can be accounted for by the\nchanges in bond energy.","k":"Core"}]},{"id":"SCI-G10-U14-L2","sub":"Science","g":10,"u":14,"un":"Chemical reactions","l":2,"t":"Designing a chemical system for more product","role":"Single lesson","topic":"CHE-G9-10-T7","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology","tim":"","pis":"","cls":"Core","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Exact top-level parsing","code":"ADEK-Science-CHEg-GRADE-9-10-YEAR 10-11","stmt":"Refine the design of a chemical system by specifying a change in conditions that would produce increased amounts of products at equilibrium; achieved through factors affecting reversible reactions. [Clarification Statement: Emphasis is on the application of Le Chatelier’s Principle and on refining designs of chemical reaction systems, including descriptions of the connection between changes made at the macroscopic level and what happens at the molecular level. Examples of designs could include different ways to increase product formation including adding reactants or removing products.] [Assessment Boundary: Assessment is limited to specifying the change in only one variable at a time. Assessment does not include calculating equilibrium constants and concentrations.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 32; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T7-LO01","x":"1 Using scientific knowledge to generate the design solution\na Students identify and describe* potential changes in a component of the given chemical reaction system\nthat will increase the amounts of particular species at equilibrium. Students use evidence to\ndescribe* the relative quantities of a product before and after changes to a given chemical reaction\nsystem (e.g., concentration increases, decreases, or stays the same), and will explicitly use Le\nChatelier’s principle, including:\ni. How, at a molecular level, a stress involving a change to one component of an equilibrium system\naffects other components;\nii. That changing the concentration of one of the components of the equilibrium system will change\nthe rate of the reaction (forward or backward) in which it is a reactant, until the forward and\nbackward rates are again equal; and\niii. A description* of a system at equilibrium that includes the idea that both the forward and\nbackward reactions are occurring at the same rate, resulting in a system that appears stable at\nthe macroscopic level.","k":"Core"},{"c":"CHE-G9–10-T7-LO02","x":"2 Describing criteria and constraints, including quantification when appropriate\na Students describe* the prioritized criteria and constraints, and quantify each when appropriate.\nExamples of constraints to be considered are cost, energy required to produce a product, hazardous\nnature and chemical properties of reactants and products, and availability of resources.","k":"Core"},{"c":"CHE-G9–10-T7-LO03","x":"3 Evaluating potential solutions\na Students systematically evaluate the proposed refinements to the design of the given chemical system.\nThe potential refinements are evaluated by comparing the redesign to the list of criteria (i.e.,\nincreased product) and constraints (e.g., energy required, availability of resources).","k":"Core"},{"c":"CHE-G9–10-T7-LO04","x":"4 Refining and/or optimizing the design solution\na Students refine the given designed system by making tradeoffs that would optimize the designed system\nto increase the amount of product, and describe* the reasoning behind design decisions.","k":"Core"}]},{"id":"SCI-G10-U15-L1","sub":"Science","g":10,"u":15,"un":"Matter & materials","l":1,"t":"Molecular structure and the function of materials — Part 1","role":"Part 1 of 3","topic":"CHE-G9-10-T3","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 13. Science and Technology","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Matter & materials","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-CHEc-GRADE-9-10-YEAR 10-11","stmt":"Communicate scientific and technical information about why the molecular-level structure is important in the functioning of designed materials; achieved through the structures, bonding and properties of diamond, graphite, fullerenes and graphene. Furthermore, explore bonding of carbon leading to the vast array of natural and synthetic organic compounds. [Clarification Statement: Emphasis is on the attractive and repulsive forces that determine the functioning of the material. Examples could include why electrically conductive materials are often made of metal, flexible but durable materials are made up of long chained molecules, and pharmaceuticals are designed to interact with specific receptors.] [Assessment Boundary: Assessment is limited to provided molecular structures of specific designed materials.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 31; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T3-LO01","x":"1 Communication style and format\na Students use at least two different formats (including oral, graphical, textual and mathematical) to\ncommunicate scientific and technical information, including fully describing* the structure,\nproperties, and design of the chosen material(s). Students cite the origin of the information as\nappropriate.","k":"Core"},{"c":"CHE-G9–10-T3-LO02","x":"2 Connecting the DCIs and the CCCs\na Students identify and communicate the evidence for why molecular level structure is important in the\nfunctioning of designed materials, including:","k":"Core"},{"c":"CHE-G9–10-T3-LO03","x":"i. How the structure and properties of matter and the types of interactions of matter at the atomic\nscale determine the function of the chosen designed material(s); and\nii. How the material’s properties make it suitable for use in its designed function.","k":"Core"},{"c":"CHE-G9–10-T3-LO04","x":"b Students explicitly identify the molecular structure of the chosen designed material(s) (using a\nrepresentation appropriate to the specific type of communication — e.g., geometric shapes for drugs\nand receptors, ball and stick models for long-chained molecules).\nc Students describe* the intended function of the chosen designed material(s).","k":"Core"},{"c":"CHE-G9–10-T3-LO05","x":"d Students describe* the relationship between the material’s function and its macroscopic properties\n(e.g., material strength, conductivity, reactivity, state of matter, durability) and each of the\nfollowing:\ni. Molecular level structure of the material;","k":"Core"}]},{"id":"SCI-G10-U15-L2","sub":"Science","g":10,"u":15,"un":"Matter & materials","l":2,"t":"Molecular structure and the function of materials — Part 2","role":"Part 2 of 3","topic":"CHE-G9-10-T3","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 13. Science and Technology","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Matter & materials","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-CHEc-GRADE-9-10-YEAR 10-11","stmt":"Communicate scientific and technical information about why the molecular-level structure is important in the functioning of designed materials; achieved through the structures, bonding and properties of diamond, graphite, fullerenes and graphene. Furthermore, explore bonding of carbon leading to the vast array of natural and synthetic organic compounds. [Clarification Statement: Emphasis is on the attractive and repulsive forces that determine the functioning of the material. Examples could include why electrically conductive materials are often made of metal, flexible but durable materials are made up of long chained molecules, and pharmaceuticals are designed to interact with specific receptors.] [Assessment Boundary: Assessment is limited to provided molecular structures of specific designed materials.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 31; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T3-LO06","x":"ii. Intermolecular forces and polarity of molecules; and\niii. The ability of electrons to move relatively freely in metals.\ne Students describe* the effects that attractive and repulsive electrical forces between molecules have\non the arrangement (structure) of the chosen designed material(s) of molecules (e.g., solids, liquids,\ngases, network solid, polymers).","k":"Core"},{"c":"CHE-G9–10-T3-LO07","x":"f Students describe* that, for all materials, electrostatic forces on the atomic and molecular scale\nresults
