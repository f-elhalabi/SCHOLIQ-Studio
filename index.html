in contact forces (e.g., friction, normal forces, stickiness) on the macroscopic scale.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"CHE-G9–10-T3-LO08","x":"• compare the structures, bonding and properties of diamond, graphite, fullerenes and graphene, and account for the differences from the arrangement of the carbon atoms and the number of covalent bonds each atom forms","k":"UK Requirement"},{"c":"CHE-G9–10-T3-LO09","x":"• explain how the bonding of carbon — four covalent bonds and the ability to bond to itself in chains, rings and sheets — gives rise to the vast array of natural and synthetic organic compounds","k":"UK Requirement"},{"c":"CHE-G9–10-T3-LO10","x":"• describe, from supplied structures, how long chains of carbon atoms give a polymer its flexibility and durability","k":"UK Requirement"}]},{"id":"SCI-G10-U15-L3","sub":"Science","g":10,"u":15,"un":"Matter & materials","l":3,"t":"Molecular structure and the function of materials — Part 3","role":"Part 3 of 3","topic":"CHE-G9-10-T3","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 13. Science and Technology","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Matter & materials","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-CHEc-GRADE-9-10-YEAR 10-11","stmt":"Communicate scientific and technical information about why the molecular-level structure is important in the functioning of designed materials; achieved through the structures, bonding and properties of diamond, graphite, fullerenes and graphene. Furthermore, explore bonding of carbon leading to the vast array of natural and synthetic organic compounds. [Clarification Statement: Emphasis is on the attractive and repulsive forces that determine the functioning of the material. Examples could include why electrically conductive materials are often made of metal, flexible but durable materials are made up of long chained molecules, and pharmaceuticals are designed to interact with specific receptors.] [Assessment Boundary: Assessment is limited to provided molecular structures of specific designed materials.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 31; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T3-LO11","x":"• justify the selection of one carbon material rather than another for a stated engineering job, arguing from the structure provided","k":"UK Requirement"}]},{"id":"SCI-G10-U16-L1","sub":"Science","g":10,"u":16,"un":"Electric circuits","l":1,"t":"Circuit diagrams and resistors in series — Part 1","role":"Part 1 of 2","topic":"PHY-G9-10-T12","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Electric circuits","seg":"Exact top-level parsing","code":"ADEK-Science-PHYl-GRADE-9-10-YEAR 10-11","stmt":"Draw and interpret circuit diagrams and determine equivalent resistance for resistors in series; describe the electical characteristics of the domestic a.c. supply, the live, neutral and earth mains wires and associated safety measures; and calculate power transfer from p.d. and current, or from current and resistance.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 38; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T12-LO01","x":"Furthermore (UK Requirement):\n• draw circuit diagrams using the standard symbols for a cell, battery, switch, fixed and variable resistor, lamp, ammeter, voltmeter, diode, fuse and earth connection, placing ammeters in series and voltmeters in parallel with the component being measured","k":"UK Requirement"},{"c":"PHY-G9–10-T12-LO02","x":"• interpret a given circuit diagram by tracing the path of the current, identifying which components are in series, and stating where potential difference is being measured","k":"UK Requirement"},{"c":"PHY-G9–10-T12-LO03","x":"• determine the equivalent resistance of resistors in series from R(total) = R1 + R2 + R3, and explain from the series arrangement why adding a resistor always raises the total resistance","k":"UK Requirement"},{"c":"PHY-G9–10-T12-LO04","x":"• use the equivalent resistance with V = IR to find the current in a series circuit and the potential difference across each component, showing that the individual potential differences add to the supply potential difference","k":"UK Requirement"},{"c":"PHY-G9–10-T12-LO05","x":"• describe the electrical characteristics of the domestic a.c. mains supply, stating that it alternates, that its frequency is 50 Hz and its potential difference about 230 V, and contrasting it with the direct current supplied by a cell","k":"UK Requirement"}]},{"id":"SCI-G10-U16-L2","sub":"Science","g":10,"u":16,"un":"Electric circuits","l":2,"t":"Circuit diagrams and resistors in series — Part 2","role":"Part 2 of 2","topic":"PHY-G9-10-T12","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Electric circuits","seg":"Exact top-level parsing","code":"ADEK-Science-PHYl-GRADE-9-10-YEAR 10-11","stmt":"Draw and interpret circuit diagrams and determine equivalent resistance for resistors in series; describe the electical characteristics of the domestic a.c. supply, the live, neutral and earth mains wires and associated safety measures; and calculate power transfer from p.d. and current, or from current and resistance.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 38; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T12-LO06","x":"• identify the live, neutral and earth wires by colour and function, stating that the live wire alternates about 230 V from earth potential, that the neutral completes the circuit at close to earth potential, and that the earth wire carries no current in normal operation","k":"UK Requirement"},{"c":"PHY-G9–10-T12-LO07","x":"• explain the associated safety measures — earthing of a metal casing, the fuse or circuit breaker in the live wire, double insulation and the residual current device — in terms of what each one does when a fault occurs","k":"UK Requirement"},{"c":"PHY-G9–10-T12-LO08","x":"• calculate power transfer using P = VI from potential difference and current, and using P = I²R from current and resistance, and select the correct equation for the data given","k":"UK Requirement"}]},{"id":"SCI-G10-U17-L1","sub":"Science","g":10,"u":17,"un":"Electricity & magnetism","l":1,"t":"Electric currents and magnetic fields — Part 1","role":"Part 1 of 2","topic":"PHY-G9-10-T3","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Electricity & magnetism","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYc-GRADE-9-10-YEAR 10-11","stmt":"Plan and conduct an investigation to provide evidence that an electric current can produce a magnetic field and that a changing magnetic field can produce an electric current; achieved through the magnetic fields of permanent and induced magnets and the Earth's field, and the magnetic effects of currents including solenoids. Furthermore, explore how transformers are used in the national grid and the reasons for their use. [Assessment Boundary: Assessment is limited to designing and conducting investigations with provided materials and tools.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 35; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T3-LO01","x":"1 Identifying the phenomenon to be investigated\na Students describe* the phenomenon under investigation, which includes the following idea: that an\nelectric current produces a magnetic field and that a changing magnetic field produces an electric\ncurrent.","k":"Core"},{"c":"PHY-G9–10-T3-LO02","x":"2 Identifying the evidence to answer this question\na Students develop an investigation plan and describe* the data that will be collected and the evidence\nto be derived from the data about 1) an observable effect of a magnetic field that is uniquely related\nto the presence of an electric current in the circuit, and 2) an electric current in the circuit that\nis uniquely related to the presence of a changing magnetic field near the circuit. Students describe*\nwhy these effects seen must be causal and not correlational, citing specific cause-effect\nrelationships.","k":"Core"},{"c":"PHY-G9–10-T3-LO03","x":"3 Planning for the investigation\na In the investigation plan, students include:\ni. The use of an electric circuit through which electric current can flow, a source of electrical\nenergy that can be placed in the circuit, the shape and orientation of the wire, and the types\nand positions of detectors;\nii. A means to indicate or measure when electric current is flowing through the circuit;\niii. A means to indicate or measure the presence of a local magnetic field near the circuit; and\niv. A design of a system to change the magnetic field in a nearby circuit and a means to indicate or\nmeasure when the magnetic field is changing.","k":"Core"},{"c":"PHY-G9–10-T3-LO04","x":"b In the plan, students state whether the investigation will be conducted individually or\ncollaboratively.","k":"Core"},{"c":"PHY-G9–10-T3-LO05","x":"4 Collecting the data\na Students measure and record electric currents and magnetic fields.","k":"Core"}]},{"id":"SCI-G10-U17-L2","sub":"Science","g":10,"u":17,"un":"Electricity & magnetism","l":2,"t":"Electric currents and magnetic fields — Part 2","role":"Part 2 of 2","topic":"PHY-G9-10-T3","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Electricity & magnetism","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYc-GRADE-9-10-YEAR 10-11","stmt":"Plan and conduct an investigation to provide evidence that an electric current can produce a magnetic field and that a changing magnetic field can produce an electric current; achieved through the magnetic fields of permanent and induced magnets and the Earth's field, and the magnetic effects of currents including solenoids. Furthermore, explore how transformers are used in the national grid and the reasons for their use. [Assessment Boundary: Assessment is limited to designing and conducting investigations with provided materials and tools.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 35; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T3-LO06","x":"5 Refining the design\na Students evaluate their investigation, including an evaluation of:\ni. The accuracy and precision of the data collected, as well as limitations of the investigation;\nand\nii. The ability of the data to provide the evidence required.","k":"Core"},{"c":"PHY-G9–10-T3-LO07","x":"b If necessary, students refine the investigation plan to produce more accurate, precise, and useful\ndata such that the measurements or indicators of the presence of an electric current in the circuit\nand a magnetic field near the circuit can provide the required evidence.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"PHY-G9–10-T3-LO08","x":"• describe where step-up and step-down transformers are placed in a national grid and what each one does to the potential difference and the current","k":"UK Requirement"},{"c":"PHY-G9–10-T3-LO09","x":"• explain, in terms of the current in the transmission lines and the power wasted in heating them, why the grid transmits electrical energy at high potential difference and low current","k":"UK Requirement"}]},{"id":"SCI-G10-U18-L1","sub":"Science","g":10,"u":18,"un":"Energy stores & transfers","l":1,"t":"Energy at the macroscopic and particle scales — Part 1","role":"Part 1 of 3","topic":"PHY-G9-10-T5","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Energy stores & transfers","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYe-GRADE-9-10-YEAR 10-11","stmt":"Develop and use models to illustrate that energy at the macroscopic scale can be accounted for as a combination of energy associated with the motions of particles (objects) and energy associated with the relative positions of particles (objects); achieved through calculating work done as force x distance. Furthermore, explore elastic and inelastic stretching, and qualitative electrostatic, magnetic and gravitational fields. [Clarification Statement: Examples of phenomena at the macroscopic scale could include the conversion of kinetic energy to thermal energy, the energy stored due to position of an object above the earth, and the energy stored between two electrically-charged plates. Examples of models could include diagrams, drawings, descriptions, and computer simulations.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 36; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T5-LO01","x":"NGSS Evidence Statement for HS-PS3-2, stated verbatim:\n1 Components of the model\na Students develop models in which they identify and describe* the relevant components, including:\ni. All the components of the system and the surroundings, as well as energy flows between the\nsystem and the surroundings;\nii. Clearly depicting both a macroscopic and a molecular/atomic-level representation of the system;\nand iii.Depicting the forms in which energy is manifested at two different scales: a)\nMacroscopic , such as motion, sound, light, thermal energy, potential energy or energy in\nfields; and b) Molecular/atomic, such as motions (kinetic energy) of particles (e.g., nuclei and\nelectrons), the relative positions of particles in fields (potential energy), and energy in\nfields.","k":"Core"},{"c":"PHY-G9–10-T5-LO02","x":"2 Relationships\na Students describe* the relationships between components in their models, including:\ni. Changes in the relative position of objects in gravitational, magnetic or electrostatic fields\ncan affect the energy of the fields (e.g., charged objects moving away from each other change\nthe field energy).\nii. Thermal energy includes both the kinetic and potential energy of particle vibrations in solids\nor molecules and the kinetic energy of freely moving particles (e.g., inert gas atoms,","k":"Core"},{"c":"PHY-G9–10-T5-LO03","x":"molecules) in liquids and gases.\niii. The total energy of the system and surroundings is conserved at a macroscopic and\nmolecular/atomic level.\niv. Chemical energy can be considered in terms of systems of nuclei and electrons in electrostatic\nfields (bonds).\nv. As one form of energy increases, others must decrease by the same amount as energy is\ntransferred among and between objects and fields.","k":"Core"},{"c":"PHY-G9–10-T5-LO04","x":"3 Connections\na Students use their models to show that in closed systems the energy is conserved on both the\nmacroscopic and molecular/atomic scales so that as one form of energy changes, the total system energy\nremains constant, as evidenced by the other forms of energy changing by the same amount or changes\nonly by the amount of energy that is transferred into or out of the system.","k":"Core"},{"c":"PHY-G9–10-T5-LO05","x":"b Students use their models to illustrate that energy at the macroscopic scale can be accounted for as a\ncombination of energy associated with the motions of particles/objects and energy associated with the\nrelative positions of particles/objects on both the macroscopic and microscopic scales.\nNGSS Evidence Statement for HS-PS3-5, stated verbatim:","k":"Core"}]},{"id":"SCI-G10-U18-L2","sub":"Science","g":10,"u":18,"un":"Energy stores & transfers","l":2,"t":"Energy at the macroscopic and particle scales — Part 2","role":"Part 2 of 3","topic":"PHY-G9-10-T5","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Energy stores & transfers","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYe-GRADE-9-10-YEAR 10-11","stmt":"Develop and use models to illustrate that energy at the macroscopic scale can be accounted for as a combination of energy associated with the motions of particles (objects) and energy associated with the relative positions of particles (objects); achieved through calculating work done as force x distance. Furthermore, explore elastic and inelastic stretching, and qualitative electrostatic, magnetic and gravitational fields. [Clarification Statement: Examples of phenomena at the macroscopic scale could include the conversion of kinetic energy to thermal energy, the energy stored due to position of an object above the earth, and the energy stored between two electrically-charged plates. Examples of models could include diagrams, drawings, descriptions, and computer simulations.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 36; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T5-LO06","x":"1 Components of the model\na Students develop a model in which they identify and describe* the relevant components to illustrate\nthe forces and changes in energy involved when two objects interact, including:\ni. The two objects in the system, including their initial positions and velocities (limited to one\ndimension).\nii. The nature of the interaction (electric or magnetic) between the two objects.\niii. The relative magnitude and the direction of the net force on each of the objects.\niv. Representation of a field as a quantity that has a magnitude and direction at all points in\nspace and which contains energy.","k":"Core"},{"c":"PHY-G9–10-T5-LO07","x":"2 Relationships\na In the model, students describe* the relationships between components, including the change in the\nenergy of the objects, given the initial and final positions and velocities of the objects.","k":"Core"},{"c":"PHY-G9–10-T5-LO08","x":"3 Connections\na Students use the model to determine whether the energy stored in the field increased, decreased, or\nremained the same when the objects interacted.","k":"Core"},{"c":"PHY-G9–10-T5-LO09","x":"b Students use the model to support the claim that the change in the energy stored in the field (which\nis qualitatively determined to be either positive, negative, or zero) is consistent with the change in\nenergy of the objects.\nc Using the model, students describe* the cause and effect relationships on a qualitative level between\nforces produced by electric or magnetic fields and the change of energy of the objects in the system.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"PHY-G9–10-T5-LO10","x":"• distinguish elastic from inelastic stretching by whether the material returns to its original length and whether the energy transferred can be recovered","k":"UK Requirement"}]},{"id":"SCI-G10-U18-L3","sub":"Science","g":10,"u":18,"un":"Energy stores & transfers","l":3,"t":"Energy at the macroscopic and particle scales — Part 3","role":"Part 3 of 3","topic":"PHY-G9-10-T5","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Energy stores & transfers","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYe-GRADE-9-10-YEAR 10-11","stmt":"Develop and use models to illustrate that energy at the macroscopic scale can be accounted for as a combination of energy associated with the motions of particles (objects) and energy associated with the relative positions of particles (objects); achieved through calculating work done as force x distance. Furthermore, explore elastic and inelastic stretching, and qualitative electrostatic, magnetic and gravitational fields. [Clarification Statement: Examples of phenomena at the macroscopic scale could include the conversion of kinetic energy to thermal energy, the energy stored due to position of an object above the earth, and the energy stored between two electrically-charged plates. Examples of models could include diagrams, drawings, descriptions, and computer simulations.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 36; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T5-LO11","x":"• describe qualitatively the electrostatic, magnetic and gravitational field around an object as a region in which a force acts, with a magnitude and direction at every point and with energy stored in it","k":"UK Requirement"},{"c":"PHY-G9–10-T5-LO12","x":"• explain how changing the relative position of two objects in such a field changes the energy stored in the field, and state whether that stored energy has increased, decreased or stayed the same","k":"UK Requirement"},{"c":"PHY-G9–10-T5-LO13","x":"• use a field model to account for the change in the energy of two interacting objects from their initial and final positions","k":"UK Requirement"}]},{"id":"SCI-G10-U19-L1","sub":"Science","g":10,"u":19,"un":"Forces & motion","l":1,"t":"Impulse, momentum and collisions — Part 1","role":"Part 1 of 3","topic":"PHY-G9-10-T2","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology","tim":"","pis":"","cls":"Core","big":"3. Forces and Motion","dom":"Physical Sciences — Physics","area":"Forces & motion","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYb-GRADE-9-10-YEAR 10-11","stmt":"Apply scientific and engineering ideas including Newton’s Second Law and the impulse–momentum relationship, to design, evaluate and refine a device that minimizes the force on a macroscopic object during a collision; achieved through exploring decelerations and braking distances involved on roads and safety. [Clarification Statement: Examples of evaluation and refinement could include determining the success of the device at protecting an object from damage and modifying the design to improve it. Examples of a device could include a football helmet or a parachute.] [Assessment Boundary: Assessment is limited to qualitative evaluations and/or algebraic manipulations.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 35; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T2-LO01","x":"NGSS Evidence Statement for HS-PS2-3, stated verbatim:\n1 Using scientific knowledge to generate the design solution\na Students design a device that minimizes the force on a macroscopic object during a collision. In the","k":"Core"},{"c":"PHY-G9–10-T2-LO02","x":"design, students:\ni. Incorporate the concept that for a given change in momentum, force in the direction of the\nchange in momentum is decreased by increasing the time interval of the collision (FΔt = mΔv);\nand\nii. Explicitly make use of the principle above so that the device has the desired effect of reducing\nthe net force applied to the object by extending the time the force is applied to the object\nduring the collision.","k":"Core"},{"c":"PHY-G9–10-T2-LO03","x":"b In the design plan, students describe* the scientific rationale for their choice of materials and for\nthe structure of the device.","k":"Core"},{"c":"PHY-G9–10-T2-LO04","x":"2 Describing criteria and constraints, including quantification when appropriate\na Students describe* and quantify (when appropriate) the criteria and constraints, along with the\ntradeoffs implicit in these design solutions. Examples of constraints to be considered are cost, mass,\nthe maximum force applied to the object, and requirements set by society for widely used\ncollision-mitigation devices (e.g., seatbelts, football helmets).","k":"Core"},{"c":"PHY-G9–10-T2-LO05","x":"3 Evaluating potential solutions\na Students systematically evaluate the proposed device design or design solution, including describing*\nthe rationales for the design and comparing the design to the list of criteria and constraints.","k":"Core"}]},{"id":"SCI-G10-U19-L2","sub":"Science","g":10,"u":19,"un":"Forces & motion","l":2,"t":"Impulse, momentum and collisions — Part 2","role":"Part 2 of 3","topic":"PHY-G9-10-T2","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology","tim":"","pis":"","cls":"Core","big":"3. Forces and Motion","dom":"Physical Sciences — Physics","area":"Forces & motion","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYb-GRADE-9-10-YEAR 10-11","stmt":"Apply scientific and engineering ideas including Newton’s Second Law and the impulse–momentum relationship, to design, evaluate and refine a device that minimizes the force on a macroscopic object during a collision; achieved through exploring decelerations and braking distances involved on roads and safety. [Clarification Statement: Examples of evaluation and refinement could include determining the success of the device at protecting an object from damage and modifying the design to improve it. Examples of a device could include a football helmet or a parachute.] [Assessment Boundary: Assessment is limited to qualitative evaluations and/or algebraic manipulations.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 35; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T2-LO06","x":"b Students test and evaluate the device based on its ability to minimize the force on the test object\nduring a collision. Students identify any unanticipated effects or design performance issues that the\ndevice exhibits.","k":"Core"},{"c":"PHY-G9–10-T2-LO07","x":"4 Refining and/or optimizing the design solution\na Students use the test results to improve the device performance by extending the impact time, reducing\nthe device mass, and/or considering cost-benefit analysis.\nNGSS Evidence Statement for HS-PS2-1, stated verbatim:","k":"Core"},{"c":"PHY-G9–10-T2-LO08","x":"1 Organizing data\na Students organize data that represent the net force on a macroscopic object, its mass (which is held\nconstant), and its acceleration (e.g., via tables, graphs, charts, vector drawings).","k":"Core"},{"c":"PHY-G9–10-T2-LO09","x":"2 Identifying relationships\na Students use tools, technologies, and/or models to analyze the data and identify relationships within\nthe datasets, including:\ni. A more massive object experiencing the same net force as a less massive object has a smaller\nacceleration, and a larger net force on a given object produces a correspondingly larger\nacceleration; and\nii. The result of gravitation is a constant acceleration on macroscopic objects as evidenced by the\nfact that the ratio of net force to mass remains constant.","k":"Core"},{"c":"PHY-G9–10-T2-LO10","x":"3 Interpreting data\na Students use the analyzed data as evidence to describe* that the relationship between the observed\nquantities is accurately modeled across the range of data by the formula a = F net/m (e.g., double\nforce yields double acceleration, etc.).","k":"Core"}]},{"id":"SCI-G10-U19-L3","sub":"Science","g":10,"u":19,"un":"Forces & motion","l":3,"t":"Impulse, momentum and collisions — Part 3","role":"Part 3 of 3","topic":"PHY-G9-10-T2","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology","tim":"","pis":"","cls":"Core","big":"3. Forces and Motion","dom":"Physical Sciences — Physics","area":"Forces & motion","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYb-GRADE-9-10-YEAR 10-11","stmt":"Apply scientific and engineering ideas including Newton’s Second Law and the impulse–momentum relationship, to design, evaluate and refine a device that minimizes the force on a macroscopic object during a collision; achieved through exploring decelerations and braking distances involved on roads and safety. [Clarification Statement: Examples of evaluation and refinement could include determining the success of the device at protecting an object from damage and modifying the design to improve it. Examples of a device could include a football helmet or a parachute.] [Assessment Boundary: Assessment is limited to qualitative evaluations and/or algebraic manipulations.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 35; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T2-LO11","x":"b Students use the data as empirical evidence to distinguish between causal and correlational\nrelationships linking force, mass, and acceleration.\nc Students express the relationship Fnet=ma in terms of causality, namely that a net force on an object\ncauses the object to accelerate.","k":"Core"}]},{"id":"SCI-G10-U20-L1","sub":"Science","g":10,"u":20,"un":"Heating & thermal energy","l":1,"t":"Thermal energy transfer and equilibrium — Part 1","role":"Part 1 of 2","topic":"PHY-G9-10-T13","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Heating & thermal energy","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYm-GRADE-9-10-YEAR 10-11","stmt":"Plan and conduct an investigation to provide evidence that the transfer of thermal energy when two components of different temperature are combined within a closed system results in a more uniform energy distribution (second law of thermodynamics); calculating energy changes on heating using specific heat capacity and in changes of state using specific latent heat. Furthermore, explore the link between gas pressure and temperature at constant volume. [Clarification Statement: Emphasis is on analyzing data from student investigations and using mathematical thinking to describe the energy changes both quantitatively and conceptually. Examples of investigations could include mixing liquids at different initial temperatures or adding objects at different temperatures to water.] [Assessment Boundary: Assessment is limited to investigations based on materials and tools provided to students.]","pdfm":[],"xchk":"ADEK code not found in the supplied Grades 9–10 PDF","src":"ACS Sciences G1-10 Mapping; PDF counterpart not located","los":[{"c":"PHY-G9–10-T13-LO01","x":"1 Identifying the phenomenon to be investigated\na Students describe* the purpose of the investigation, which includes the following idea, that the\ntransfer of thermal energy when two components of different temperature are combined within a closed\nsystem results in a more uniform energy distribution among the components in the system (second law of\nthermodynamics).","k":"Core"},{"c":"PHY-G9–10-T13-LO02","x":"2 Identifying the evidence to answer this question\na Students develop an investigation plan and describe* the data that will be collected and the evidence\nto be derived from the data, including:\ni. The measurement of the reduction of temperature of the hot object and the increase in","k":"Core"},{"c":"PHY-G9–10-T13-LO03","x":"temperature of the cold object to show that the thermal energy lost by the hot object is equal\nto the thermal energy gained by the cold object and that the distribution of thermal energy is\nmore uniform after the interaction of the hot and cold components; and\nii. The heat capacity of the components in the system (obtained from scientific literature).","k":"Core"},{"c":"PHY-G9–10-T13-LO04","x":"3 Planning for the investigation\na In the investigation plan, students describe*:\ni. How a nearly closed system will be constructed, including the boundaries and initial conditions\nof the system;\nii. The data that will be collected, including masses of components and initial and final\ntemperatures; and\niii. The experimental procedure, including how the data will be collected, the number of trials, the\nexperimental set up, and equipment required.","k":"Core"},{"c":"PHY-G9–10-T13-LO05","x":"4 Collecting the data\na Students collect and record data that can be used to calculate the change in thermal energy of each of\nthe two components of the system.","k":"Core"}]},{"id":"SCI-G10-U20-L2","sub":"Science","g":10,"u":20,"un":"Heating & thermal energy","l":2,"t":"Thermal energy transfer and equilibrium — Part 2","role":"Part 2 of 2","topic":"PHY-G9-10-T13","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Heating & thermal energy","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYm-GRADE-9-10-YEAR 10-11","stmt":"Plan and conduct an investigation to provide evidence that the transfer of thermal energy when two components of different temperature are combined within a closed system results in a more uniform energy distribution (second law of thermodynamics); calculating energy changes on heating using specific heat capacity and in changes of state using specific latent heat. Furthermore, explore the link between gas pressure and temperature at constant volume. [Clarification Statement: Emphasis is on analyzing data from student investigations and using mathematical thinking to describe the energy changes both quantitatively and conceptually. Examples of investigations could include mixing liquids at different initial temperatures or adding objects at different temperatures to water.] [Assessment Boundary: Assessment is limited to investigations based on mater function parseLabelled(text, defs) {
  const map = {}; defs.forEach(d => d.lab.forEach(a => map[a.toLowerCase()] = d.k));
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    if (m) { cur = map[m[1].toLowerCase()]; out[cur] = (out[cur] ? out[cur] + '\n' : '') + (m[2] || '').trim(); }

  }
  Object.keys(out).forEach(k => out[k] = out[k].replace(/^\n+|\n+$/g, '').replace(/\*\*/g, '').trim());

}
function normLevel(s) { s = String(s || ''); if (/know/i.test(s)) return 'Knowing'; if (/appl/i.test(s)) return 'Applying'; if (/reason/i.test(s)) return 'Reasoning'; if (/^k/i.test(s.trim())) return 'Knowing'; if (/^a/i.test(s.trim())) return 'Applying'; if (/^r/i.test(s.trim())) return 'Reasoning'; return ''; }

}

  const map = { option: 'opts', options: 'opts', choices: 'opts', answer: 'a', 'correct answer': 'a', feedback: 'fb', hint: 'fb', lo: 'lo', objective: 'lo', level: 'lvl', tier: 'tier', prerequisite: 'pre', skill: 'pre' };

    const m = line.match(labRe);
    if (m && /^(question|q)$/i.test(m[1])) { if (!cur || cur.q) { cur = newQ(); qs.push(cur); } cur.q = m[2].trim(); last = 'q'; continue; }
    if (!m) { const h = line.match(headRe); if (h) { cur = newQ(); qs.push(cur); if (h[1]) { cur.q = h[1].trim(); last = 'q'; } else last = null; continue; } }

  const l = L(), s = LS(CUR), p = progress(l, s);
  return P('Lesson production document', { style: 'Title' }) + P(`${l.id} · ${l.t}`, { style: 'Subtitle' }) +
    T([['Item', 'Detail'], ['Subject', l.sub], ['Grade', String(l.g)], ['Unit', `${l.u} – ${l.un}`], ['Lesson', `${l.l} – ${l.t}`], ['Lesson ID', l.id], ['ADEK topic', l.topic], ['ADEK standard code', l.code || ''], ['Lesson type', l.role], ['ADEK priority', l.pri || ''], ['TIMSS / PISA marks', marksOf(l).join('\n') || 'None'], ['Performance task', l.pt], ['Author', s.author || ''], ['Exported', new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })], ['Delivery window', l.win], ['Standards version', stdOf(l)], ['Grade assignment', l.prov ? 'Provisional' : 'Confirmed'], ['Status', `${p.done} of ${p.total} required sections marked as finished`]], [2600, 7038], { labelCol: true }) +
    H2('Stages in platform order') + T([['Stage', 'Content'], ...STAGES.map(x => [`${x.n} · ${x.t}`, { card: 'Objectives and notes', diag: 'Prerequisite questions', hook: 'Real-life opening', disc: 'Activity, guided questions, practice', expl: 'Explanation, guided exercises, practice', pt: 'Real-life task and rubric', exit: 'Exit questions', sum: 'Rules, examples, flashcards, mind map' }[x.id]])], [3000, 6638]);
}
function appendixBody() {
  const l = L(), s = LS(CUR), a = analyse(l, s);
  let b = H1('Appendix A – Checks', true) + H2('Coverage by objective') + T([['LO', 'Guided (discovery)', 'Practice (discovery)', 'Explanation', 'Guided exercises', 'Practice (explanation)', 'Exit'], ...l.los.map((o, i) => [`LO${i + 1}`, a.guidedOK[i] ? 'Yes' : 'No', String(a.pD[i]), a.explOK[i] ? 'Yes' : 'No', a.gexOK[i] ? 'Yes' : 'No', String(a.pE[i]), String(a.ex[i])])], [800, 1400, 1500, 1300, 1400, 1700, 1538]);
  b += H2('Cognitive balance (both practice sets and exit ticket)') + T([['Level', 'Questions', 'Share', 'Target'], ...LEVELS.map(k => [k, String(a.lv[k]), a.pct(k) + '%', targetOf(l)[k] + '%']), ['Untagged', String(a.untagged), '', '']], [2800, 2200, 2200, 2438]);
  b += H2('Author checklist') + LN(MANUAL.map(([k, t]) => (s.self[k] ? '☑ ' : '☐ ') + t).join('\n'));
  b += H1('Appendix B – For the production team', true) + T([['Item', 'Notes'], ['Simulation notes', ''], ['Images and assets needed', ''], ['Open questions for the author', '']], [2600, 7038], { labelCol: true });
  return b;
}
const footerText = l => `ADEK ${l.sub} · ${l.id} · ${l.t}`;
function safeName(l, suffix) { return `${l.id}_${suffix}`.replace(/[^A-Za-z0-9_.-]+/g, '-'); }
function exportFull() {
  const l = L(), s = LS(CUR);
  const body = coverBody() + STAGES.map(x => stageBody(x.id, true)).join('') + appendixBody();
  const bytes = D.build(body, footerText(l), { title: `${l.id} ${l.t}`, author: s.author });
  download(safeName(l, 'FULL_' + l.t.slice(0, 40)) + '.docx', [bytes], 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
  toast('Word file exported');
}
const optQ = q => ({ question: q.q, options: q.opts ? q.opts.split('\n').filter(Boolean) : [], answer: q.a, feedback: q.fb, objective: q.lo ? 'LO' + q.lo : null, level: q.lvl || null, tier: q.tier || null, prerequisite: q.pre || null });
const lines = t => String(t || '').split('\n').map(x => x.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, '').trim()).filter(Boolean);
function structureJSON() {
  const l = L(), s = LS(CUR), t = s.disc.types;
  const walk = v => typeof v === 'string' ? MathLib.normalise(v) : Array.isArray(v) ? v.map(walk) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, walk(x)])) : v;
  return walk({
    note: 'Formulas are stored in LaTeX between dollar signs, for example $\\frac{3}{4}$.',
    lesson: { id: l.id, subject: l.sub, grade: l.g, unit: l.un, title: l.t, topic: l.topic, adekCode: l.code || '', adekStatement: l.stmt || '', type: l.role, performanceTask: l.pt, author: s.author },
    objectives: l.los.map((o, i) => ({ id: 'LO' + (i + 1), category: o.k, text: o.x })),
    stages: [
      { order: 1, id: 'lesson-card', notes: s.notes },
      { order: 2, id: 'diagnostic', questions: s.diag.qs.map(optQ) },
      { order: 3, id: 'warm-up', scenario: s.hook.scenario || '', openingQuestion: s.hook.question || '', possibleResponses: s.hook.responses || '', link: s.hook.link || '' },
      { order: 4, id: 'discovery', types: ['sim', 'doc', 'q'].filter(k => t[k]).map(k => ({ sim: 'simulation', doc: 'document', q: 'questions' }[k])), simulation: t.sim ? { ...Object.fromEntries(SIM_FIELDS.map(d => [d.k, s.disc[d.k] || ''])), studentInstructions: s.disc.simIntro || '' } : null, document: t.doc ? { text: s.disc.doc || '', studentInstructions: s.disc.docIntro || '' } : null, guidedQuestions: l.los.map((o, i) => ({ objective: 'LO' + (i + 1), items: lines(s.disc.guided[i + 1]) })), practice: sortByLO(s.discP.qs).map(optQ) },
      { order: 5, id: 'explanation', objectives: l.los.map((o, i) => { const e = s.expl[i + 1] || {}; return { objective: 'LO' + (i + 1), concept: e.concept || '', workedExample: e.example || '', commonMistake: e.mistake || '', guidedExercises: lines(e.guided) }; }), practice: sortByLO(s.explP.qs).map(optQ) },
      { order: 6, id: 'performance-task', included: analyse(l, s).ptHas, task: analyse(l, s).ptHas ? { title: s.pt.title || '', context: s.pt.context || '', task: s.pt.task || '', product: s.pt.product || '', modelSolution: s.pt.model || '', rubric: { level4: s.pt.r4 || '', level3: s.pt.r3 || '', level2: s.pt.r2 || '', level1: s.pt.r1 || '' }, processes: s.pt.procs || [] } : null },
      { order: 7, id: 'exit-ticket', questions: sortByLO(s.exit.qs).map(optQ) },
      { order: 8, id: 'summary', keyRules: lines(s.sum.rules), examples: lines(s.sum.examples), flashcards: (s.sum.cards || []).map(c => ({ front: c.f, back: c.b })), mindMap: s.sum.mindmap || '', commonMistakes: lines(s.sum.mistakes) },
    ],
  });
}
function exportStages() {
  const l = L(), s = LS(CUR), a = analyse(l, s), files = [], mime = 'application/zip';
  const mk = body => D.build(body, footerText(l), { title: `${l.id} ${l.t}`, author: s.author });
  files.push({ name: safeName(l, '00_Full.docx'), data: mk(coverBody() + STAGES.map(x => stageBody(x.id, true)).join('') + appendixBody()) });
  STAGES.forEach(x => {
    if (x.id === 'pt' && !a.ptHas && !isReq(l)) return;
    files.push({ name: safeName(l, `${x.n}_${x.f}.docx`), data: mk(P(`${l.t}`, { style: 'Subtitle', after: 60 }) + stageBody(x.id, false)) });
  });
  files.push({ name: safeName(l, 'structure.json'), data: JSON.stringify(structureJSON(), null, 1) });
  download(safeName(l, 'stages.zip'), [D.zip(files)], mime);
  toast(`${files.length} files exported`);
}

/* ================= Init ================= */
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { $('guide').close(); return; }
  if (e.target.closest('[data-mclose]')) { $('mathdlg').close(); return; }
  if (e.target.closest('[data-minsert]')) { commitMath(); return; }
  const pb = e.target.closest('[data-tpl]'); if (pb) { insertTemplate(pb.dataset.tpl); return; }
  
  const tab = e.target.closest('[data-tab]'); if (tab) { UI.tab = tab.dataset.tab; showGuide(); return; }
  if (e.target.closest('[data-act="copyrules"]')) { copyText(RULES, 'Rules copied'); return; }
  
  onClick(e);
});
document.addEventListener('input', onInput);
document.addEventListener('keydown', e => {
  if (e.target.id === 'mf') {
    if (e.key === 'Enter') { e.preventDefault(); commitMath(); }
    if (e.key === 'Tab' && !e.shiftKey) { const f = e.target, v = f.value, i = f.selectionStart; const m = v.slice(i).search(/\{\}|\[\]/); if (m >= 0) { e.preventDefault(); f.setSelectionRange(i + m + 1, i + m + 1); } else { const c = v.slice(i).search(/[}\]]/); if (c >= 0) { e.preventDefault(); f.setSelectionRange(i + c + 1, i + c + 1); } } }
  }
});
$('file-in').addEventListener('change', e => { if (e.target.files[0]) openFile(e.target.files[0]); e.target.value = ''; });
render();
</script>
