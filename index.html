trol variables, where appropriate Scientific attitudes: Evaluate risks","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ETS-G6–8-T1-LO01","x":"1 Identifying the problem to be solved\na Students describe* a problem that can be solved through the development of an object, tool, process,\nor system.","k":"Core"},{"c":"ETS-G6–8-T1-LO02","x":"2 Defining the process or system boundaries and the components of the process or system\na Students identify the system in which the problem is embedded, including the major components and\nrelationships in the system and its boundaries, to clarify what is and is not part of the problem. In\ntheir definition of the system, students include:\ni. Which individuals or groups need this problem to be solved.\nii. The needs that must be met by solving the problem.\niii. Scientific issues that are relevant to the problem.\niv. Potential societal and environmental impacts of solutions.\nv. The relative importance of the various issues and components of the process or system.","k":"Core"},{"c":"ETS-G6–8-T1-LO03","x":"3 Defining criteria and constraints\na Students define criteria that must be taken into account in the solution that:\ni. Meet the needs of the individuals or groups who may be affected by the problem (including\ndefining who will be the target of the solution).\nii. Enable comparisons among different solutions, including quantitative considerations when\nappropriate.","k":"Core"},{"c":"ETS-G6–8-T1-LO04","x":"b Students define constraints that must be taken into account in the solution, including:\ni. Time, materials, and costs.\nii. Scientific or other issues that are relevant to the problem.\niii. Needs and desires of the individuals or groups involved that may limit acceptable solutions.\niv. Safety considerations.\nv. Potential effect(s) on other individuals or groups.\nvi. Potential negative environmental effects of possible solutions or failure to solve the problem.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"ETS-G6–8-T1-LO05","x":"• make predictions about the outcome of an investigation using scientific knowledge and understanding, stating the reasoning behind the prediction","k":"UK Requirement"}]},{"id":"SCI-G6-U5-L2","sub":"Science","g":6,"u":5,"un":"Engineering design","l":2,"t":"Defining a design problem; predictions, risk and how science develops — Part 2","role":"Part 2 of 2","topic":"ETS-G6-8-T1","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"13. Science and Technology","dom":"Engineering & Technology","area":"Engineering design","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ETSa-GRADE-6-8-YEAR 7-9","stmt":"Define the criteria and constraints of a design problem with sufficient precision to ensure a successful solution, taking into account relevant scientific principles and the potential impacts on people and the natural environment. Furthermore, make predictions using scientific knowledge and understanding; evaluate risks and select appropriate methods for safe and reliable investigations; and recognise that scientific methods, explanations and theories develop as new evidence and ideas emerge, including through the communication, publication and peer review of scientific findings. Experimental skills and investigations: Ask questions and develop a line of enquiry based on observations of the real world, alongside prior knowledge and experience Experimental skills and investigations: Select, plan and carry out the most appropriate types of scientific enquiries to test predictions, including identifying independent, dependent and control variables, where appropriate Scientific attitudes: Evaluate risks","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ETS-G6–8-T1-LO06","x":"• evaluate the risks of a proposed investigation and select methods that make it safe and reliable","k":"UK Requirement"},{"c":"ETS-G6–8-T1-LO07","x":"• ask questions and develop a line of enquiry from their own observations of the real world alongside prior knowledge and experience","k":"UK Requirement"},{"c":"ETS-G6–8-T1-LO08","x":"• select, plan and carry out the most appropriate type of scientific enquiry to test a prediction, identifying the independent, dependent and control variables where appropriate","k":"UK Requirement"},{"c":"ETS-G6–8-T1-LO09","x":"• explain that scientific methods, explanations and theories change as new evidence and ideas emerge, and describe the part played by communication, publication and peer review in that change","k":"UK Requirement"}]},{"id":"SCI-G6-U5-L3","sub":"Science","g":6,"u":5,"un":"Engineering design","l":3,"t":"Iterative modelling; calculating and analysing results — Part 1","role":"Part 1 of 3","topic":"ETS-G6-8-T4","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core + UK Requirement","big":"13. Science and Technology","dom":"Engineering & Technology","area":"Engineering design","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ETSd-GRADE-6-8-YEAR 7-9","stmt":"Develop and use models to generate data for the iterative testing, evaluation and modification of a proposed object, tool or process, using the results to optimise the design and meet defined criteria and constraints. Furthermore, apply appropriate mathematical concepts to calculate and interpret results; use SI units; use and derive simple equations; and undertake basic data analysis, including appropriate simple statistical techniques. Experimental skills and investigations: Make predictions using scientific knowledge and understanding Analysis and evaluation: Identify further questions arising from their results Experimental skills and investigations: Make and record observations and measurements using a range of methods for different investigations; and evaluate the reliability of methods and suggest possible improvements","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ETS-G6–8-T4-LO01","x":"1 Components of the model\na Students develop a model in which they identify the components relevant to testing ideas about the\ndesigned system, including:\ni. The given problem being solved, including criteria and constraints.\nii. The components of the given proposed solution (e.g., object, tools, or process), including\ninputs and outputs of the designed system.","k":"Core"},{"c":"ETS-G6–8-T4-LO02","x":"2 Relationships\na Students identify and describe* the relationships between components, including:\ni. The relationships between each component of the proposed solution and the functionality of the\nsolution.","k":"Core"},{"c":"ETS-G6–8-T4-LO03","x":"ii. The relationship between the problem being solved and the proposed solution.\niii. The relationship between each of the components of the given proposed solution and the problem\nbeing solved.\niv. The relationship between the data generated by the model and the functioning of the proposed\nsolution.","k":"Core"},{"c":"ETS-G6–8-T4-LO04","x":"3 Connections\na Students use the model to generate data representing the functioning of the given proposed solution\nand each of its iterations as components of the model are modified.","k":"Core"},{"c":"ETS-G6–8-T4-LO05","x":"b Students identify the limitations of the model with regards to representing the proposed solution.\nc Students describe* how the data generated by the model, along with criteria and constraints that the\nproposed solution must meet, can be used to optimize the design solution through iterative testing and\nmodification.\nFurthermore (UK Requirement):","k":"UK Requirement"}]},{"id":"SCI-G6-U5-L4","sub":"Science","g":6,"u":5,"un":"Engineering design","l":4,"t":"Iterative modelling; calculating and analysing results — Part 2","role":"Part 2 of 3","topic":"ETS-G6-8-T4","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core + UK Requirement","big":"13. Science and Technology","dom":"Engineering & Technology","area":"Engineering design","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ETSd-GRADE-6-8-YEAR 7-9","stmt":"Develop and use models to generate data for the iterative testing, evaluation and modification of a proposed object, tool or process, using the results to optimise the design and meet defined criteria and constraints. Furthermore, apply appropriate mathematical concepts to calculate and interpret results; use SI units; use and derive simple equations; and undertake basic data analysis, including appropriate simple statistical techniques. Experimental skills and investigations: Make predictions using scientific knowledge and understanding Analysis and evaluation: Identify further questions arising from their results Experimental skills and investigations: Make and record observations and measurements using a range of methods for different investigations; and evaluate the reliability of methods and suggest possible improvements","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ETS-G6–8-T4-LO06","x":"• make predictions about each iteration using scientific knowledge and understanding, and state the reasoning behind them","k":"UK Requirement"},{"c":"ETS-G6–8-T4-LO07","x":"• apply mathematical concepts to calculate and interpret results from the model, expressing quantities in SI units","k":"UK Requirement"},{"c":"ETS-G6–8-T4-LO08","x":"• use and derive simple equations relating the quantities measured in the model","k":"UK Requirement"},{"c":"ETS-G6–8-T4-LO09","x":"• carry out basic data analysis, including simple statistical techniques such as the mean, the range and the percentage change between iterations","k":"UK Requirement"},{"c":"ETS-G6–8-T4-LO10","x":"• make and record observations and measurements by a range of methods suited to different investigations","k":"UK Requirement"}]},{"id":"SCI-G6-U5-L5","sub":"Science","g":6,"u":5,"un":"Engineering design","l":5,"t":"Iterative modelling; calculating and analysing results — Part 3","role":"Part 3 of 3","topic":"ETS-G6-8-T4","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core + UK Requirement","big":"13. Science and Technology","dom":"Engineering & Technology","area":"Engineering design","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ETSd-GRADE-6-8-YEAR 7-9","stmt":"Develop and use models to generate data for the iterative testing, evaluation and modification of a proposed object, tool or process, using the results to optimise the design and meet defined criteria and constraints. Furthermore, apply appropriate mathematical concepts to calculate and interpret results; use SI units; use and derive simple equations; and undertake basic data analysis, including appropriate simple statistical techniques. Experimental skills and investigations: Make predictions using scientific knowledge and understanding Analysis and evaluation: Identify further questions arising from their results Experimental skills and investigations: Make and record observations and measurements using a range of methods for different investigations; and evaluate the reliability of methods and suggest possible improvements","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ETS-G6–8-T4-LO11","x":"• evaluate the reliability of the methods used and suggest specific improvements","k":"UK Requirement"},{"c":"ETS-G6–8-T4-LO12","x":"• identify the further questions that arise from their results","k":"UK Requirement"}]},{"id":"SCI-G6-U6-L1","sub":"Science","g":6,"u":6,"un":"Body systems & health","l":1,"t":"Gas exchange, breathing and stable internal conditions — Part 1","role":"Part 1 of 2","topic":"LS-G6-8-T7","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"14. Science and Society","tim":"Essential","pis":"","cls":"Core","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-LSg-GRADE-6-8-YEAR 7-9","stmt":"Furthermore, investigate gas exchange in humans, including the structure and function of the gas exchange system, the mechanism of breathing, and the effects of exercise, asthma and smoking on gas exchange and respiratory health. Explain how the body maintains stable internal conditions — temperature, water balance and blood sugar — in response to exercise and to changes in the surroundings.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T7-LO01","x":"Furthermore (UK Requirement):\n• identify the parts of the human gas exchange system — nasal cavity, trachea, bronchi, bronchioles, alveoli, lungs, pleural membranes, diaphragm, intercostal muscles and ribs — and state the function of each","k":"UK Requirement"},{"c":"LS-G6–8-T7-LO02","x":"• explain how the structure of an alveolus suits its function, relating the very large total surface area, the wall one cell thick, the moist lining and the dense capillary network to the diffusion of oxygen and carbon dioxide","k":"Core"},{"c":"LS-G6–8-T7-LO03","x":"• describe the mechanism of breathing, relating the contraction and relaxation of the diaphragm and the intercostal muscles to the change in the volume and the pressure of the thorax, and so to the movement of air in and out","k":"Core"},{"c":"LS-G6–8-T7-LO04","x":"• plan and carry out an investigation into gas exchange, measuring breathing rate in breaths per minute and recording the results in SI units","k":"Core"},{"c":"LS-G6–8-T7-LO05","x":"• analyse data on the effect of exercise on breathing rate and depth, and explain the change in terms of the oxygen needed for respiration in the muscles and the carbon dioxide that has to be removed","k":"Core"}]},{"id":"SCI-G6-U6-L2","sub":"Science","g":6,"u":6,"un":"Body systems & health","l":2,"t":"Gas exchange, breathing and stable internal conditions — Part 2","role":"Part 2 of 2","topic":"LS-G6-8-T7","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"14. Science and Society","tim":"Essential","pis":"","cls":"Core","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-LSg-GRADE-6-8-YEAR 7-9","stmt":"Furthermore, investigate gas exchange in humans, including the structure and function of the gas exchange system, the mechanism of breathing, and the effects of exercise, asthma and smoking on gas exchange and respiratory health. Explain how the body maintains stable internal conditions — temperature, water balance and blood sugar — in response to exercise and to changes in the surroundings.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T7-LO06","x":"• explain the effect of asthma on the bronchioles and of smoking on the cilia, the alveoli and the blood, and relate each effect to a measurable reduction in gas exchange","k":"Core"},{"c":"LS-G6–8-T7-LO07","x":"• distinguish breathing from respiration, stating what each process is, where in the body it happens, and why one supplies the other","k":"Core"},{"c":"LS-G6–8-T7-LO08","x":"• explain how the body maintains stable internal conditions — temperature, water balance and blood sugar — in response to exercise and to changes in the surroundings","k":"Core"}]},{"id":"SCI-G6-U7-L1","sub":"Science","g":6,"u":7,"un":"Cells & organisation","l":1,"t":"Living things are made of cells — Part 1","role":"Part 1 of 2","topic":"LS-G6-8-T1","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"7. Cells and Life","dom":"Life Sciences","area":"Cells & organisation","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSa-GRADE-6-8-YEAR 7-9","stmt":"Conduct an investigation to provide evidence that living things are made of cells — either one cell or many different numbers and types of cells — recognizing cells as the fundamental unit of living organisms, including how to observe, interpret and record cell structure using a light microscope; the similarities and differences between plant and animal cells; and the structural adaptations of some unicellular organisms. [Clarification Statement: Emphasis is on developing evidence that living things are made of cells, distinguishing between living and non-living things, and understanding that living things may be made of one cell or many and varied cells.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T1-LO01","x":"1 Identifying the phenomenon under investigation\na From the given investigation plan, students identify and describe* the phenomenon under investigation,\nwhich includes the idea that living things are made up of cells.","k":"Core"},{"c":"LS-G6–8-T1-LO02","x":"b Students identify and describe* the purpose of the investigation, which includes providing evidence\nfor the following ideas: that all living things are made of cells (either one cell or many different\nnumbers and types of cells) and that the cell is the smallest unit that can be said to be alive.","k":"Core"},{"c":"LS-G6–8-T1-LO03","x":"2 Identifying the evidence to address the purpose of the investigation\na From the given investigation plan, students describe* the data that will be collected and the evidence\nto be derived from the data, including:\ni. The presence or absence of cells in living and nonliving things.","k":"Core"},{"c":"LS-G6–8-T1-LO04","x":"ii. The presence or absence of any part of a living thing that is not made up of cells.\niii. The presence or absence of cells in a variety of organisms, including unicellular and\nmulticellular organisms.\niv. Different types of cells within one multicellular organism.","k":"Core"},{"c":"LS-G6–8-T1-LO05","x":"b Students describe* how the evidence collected will be relevant to the purpose of the investigation.","k":"Core"}]},{"id":"SCI-G6-U7-L2","sub":"Science","g":6,"u":7,"un":"Cells & organisation","l":2,"t":"Living things are made of cells — Part 2","role":"Part 2 of 2","topic":"LS-G6-8-T1","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"7. Cells and Life","dom":"Life Sciences","area":"Cells & organisation","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSa-GRADE-6-8-YEAR 7-9","stmt":"Conduct an investigation to provide evidence that living things are made of cells — either one cell or many different numbers and types of cells — recognizing cells as the fundamental unit of living organisms, including how to observe, interpret and record cell structure using a light microscope; the similarities and differences between plant and animal cells; and the structural adaptations of some unicellular organisms. [Clarification Statement: Emphasis is on developing evidence that living things are made of cells, distinguishing between living and non-living things, and understanding that living things may be made of one cell or many and varied cells.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T1-LO06","x":"3 Planning the investigation\na From the given investigation plan, students describe* how the tools and methods included in the\nexperimental design will provide the evidence necessary to address the purpose of the investigation,\nincluding that due to their small-scale size, cells are unable to be seen with the unaided eye and\nrequire engineered magnification devices to be seen.","k":"Core"},{"c":"LS-G6–8-T1-LO07","x":"b Students describe* how the tools used in the investigation are an example of how science depends on\nengineering advances.","k":"Core"},{"c":"LS-G6–8-T1-LO08","x":"4 Collecting the data\na According to the given investigation plan, students collect and record data on the cellular\ncomposition of living organisms.","k":"Core"},{"c":"LS-G6–8-T1-LO09","x":"b Students identify the tools used for observation at different magnifications and describe* that\ndifferent tools are required to observe phenomena related to cells at different scales.\nc Students evaluate the data they collect to determine whether the resulting evidence meets the goals of\nthe investigation, including cellular composition as a distinguishing feature of living things.","k":"Core"}]},{"id":"SCI-G6-U7-L3","sub":"Science","g":6,"u":7,"un":"Cells & organisation","l":3,"t":"Sensory receptors and the brain — Part 1","role":"Part 1 of 2","topic":"LS-G6-8-T4","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"US Requirement","big":"7. Cells and Life","dom":"Life Sciences","area":"Cells & organisation","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSd-GRADE-6-8-YEAR 7-9","stmt":"In addition, gather and synthesize information that sensory receptors respond to stimuli by sending messages to the brain for immediate behavior or storage as memories. [Assessment Boundary: Assessment does not include mechanisms for the transmission of this information.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T4-LO01","x":"In addition (US Requirement):\n1 Obtaining information\na Students gather and synthesize information from at least two sources (e.g., text, media, visual\ndisplays, data) about a phenomenon that includes the relationship between sensory receptors and the\nstorage and usage of sensory information by organisms. Students gather information about:\ni. Different types of sensory receptors and the types of inputs to which they respond (e.g.,\nelectromagnetic, mechanical, chemical stimuli).\nii. Sensory information transmission along nerve cells from receptors to the brain.\niii. Sensory information processing by the brain as: 1. Memories (i.e., stored information). 2.\nImmediate behavioral responses (i.e., immediate use).\nb Students gather sufficient information to provide evidence that illustrates the causal relationships\nbetween information received by sensory receptors and behavior, both immediate and over longer time\nscales (e.g., a loud noise processed via auditory receptors may cause an animal to startle immediately\nor may be encoded as a memory, which can later be used to help the animal react appropriately in\nsimilar situations).\n2 Evaluating information\na Students evaluate the information based on:\ni. The credibility, accuracy, and possible bias of each publication and the methods used to\ngenerate and collect the evidence.\nii. The ability of the information to provide evidence that supports or does not support the idea\nthat sensory receptors send signals to the brain, resulting in immediate behavioral changes or\nstored memories.\niii. Whether the information is sufficient to allow prediction of the response of an organism to\ndifferent stimuli based on cause and effect relationships between the responses of sensory\nreceptors and behavioral responses.\nStudents will be able to:","k":"US Requirement"},{"c":"LS-G6–8-T4-LO02","x":"• gather information from at least two different sources about sensory receptors and the types of stimulus each kind responds to — light, sound and touch, chemical, temperature","k":"US Requirement"},{"c":"LS-G6–8-T4-LO03","x":"• describe the pathway by which a stimulus detected by a receptor results in a message travelling along nerve cells to the brain\n• distinguish an immediate behavioural response from the storage of the same information as a memory, giving a named example of each","k":"US Requirement"},{"c":"LS-G6–8-T4-LO04","x":"• synthesise the information gathered into one causal account that links stimulus, receptor, message, brain and response, including responses over longer time scales","k":"US Requirement"},{"c":"LS-G6–8-T4-LO05","x":"• evaluate each source for credibility, accuracy and possible bias, and for whether the information supports the idea that receptors send messages to the brain","k":"US Requirement"}]},{"id":"SCI-G6-U7-L4","sub":"Science","g":6,"u":7,"un":"Cells & organisation","l":4,"t":"Sensory receptors and the brain — Part 2","role":"Part 2 of 2","topic":"LS-G6-8-T4","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"US Requirement","big":"7. Cells and Life","dom":"Life Sciences","area":"Cells & organisation","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSd-GRADE-6-8-YEAR 7-9","stmt":"In addition, gather and synthesize information that sensory receptors respond to stimuli by sending messages to the brain for immediate behavior or storage as memories. [Assessment Boundary: Assessment does not include mechanisms for the transmission of this information.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T4-LO06","x":"• judge whether the information gathered is sufficient to predict how an organism would respond to a different stimulus, and improve their own and others' accounts against agreed criteria","k":"US Requirement"}]},{"id":"SCI-G6-U8-L1","sub":"Science","g":6,"u":8,"un":"Ecosystems & food webs","l":1,"t":"Resources and populations in an ecosystem","role":"Single lesson","topic":"LS-G6-8-T11","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSk-GRADE-6-8-YEAR 7-9","stmt":"Analyze and interpret data to provide evidence for the effects of resource availability on organisms and populations of organisms in an ecosystem — by applying the interdependence of organisms in an ecosystem and how organisms affect, and are affected by, their environment. [Clarification Statement: Emphasis is on cause and effect relationships between resources and growth of individual organisms and the numbers of organisms in ecosystems during periods of abundant and scarce resources.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T11-LO01","x":"1 Organizing data\na Students organize the given data (e.g., using tables, graphs, and charts) to allow for analysis and\ninterpretation of relationships between resource availability and organisms in an ecosystem,\nincluding:\ni. Populations (e.g., sizes, reproduction rates, growth information) of organisms as a function of\nresource availability.\nii. Growth of individual organisms as a function of resource availability.","k":"Core"},{"c":"LS-G6–8-T11-LO02","x":"2 Identifying relationships\na Students analyze the organized data to determine the relationships between the size of a population,\nthe growth and survival of individual organisms, and resource availability.","k":"Core"},{"c":"LS-G6–8-T11-LO03","x":"b Students determine whether the relationships provide evidence of a causal link between these factors.","k":"Core"},{"c":"LS-G6–8-T11-LO04","x":"3 Interpreting data\na Students analyze and interpret the organized data to make predictions based on evidence of causal\nrelationships between resource availability, organisms, and organism populations. Students make\nrelevant predictions, including:\ni. Changes in the amount and availability of a given resource (e.g., less food) may result in\nchanges in the population of an organism (e.g., less food results in fewer organisms).\nii. Changes in the amount or availability of a resource (e.g., more food) may result in changes in\nthe growth of individual organisms (e.g., more food results in faster growth).\niii. Resource availability drives competition among organisms, both within a population as well as\nbetween populations.\niv. Resource availability may have effects on a population’s rate of reproduction.","k":"Core"}]},{"id":"SCI-G6-U8-L2","sub":"Science","g":6,"u":8,"un":"Ecosystems & food webs","l":2,"t":"Food webs, pollinators and food security — Part 1","role":"Part 1 of 2","topic":"LS-G6-8-T14","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 14. Science and Society","tim":"Essential","pis":"","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSn-GRADE-6-8-YEAR 7-9","stmt":"Construct an explanation that predicts patterns of interactions among organisms across multiple ecosystems — by applying the interdependence of organisms, including food webs and insect-pollinated crops, the importance of plant reproduction in human food security, and how organisms affect and are affected by their environment. [Clarification Statement: Emphasis is on predicting consistent patterns of interactions in different ecosystems in terms of the relationships among and between organisms and abiotic components of ecosystems. Examples of types of interactions could include competitive, predatory, and mutually beneficial.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T14-LO01","x":"1 Articulating the explanation of phenomena\na Students articulate a statement that relates the given phenomenon to a scientific idea, including that\nsimilar patterns of interactions occur between organisms and their environment, regardless of the\necosystem or the species involved.","k":"Core"},{"c":"LS-G6–8-T14-LO02","x":"b Students use evidence and reasoning to construct an explanation for the given phenomenon.","k":"Core"},{"c":"LS-G6–8-T14-LO03","x":"2 Evidence\na Students identify and describe* the evidence (e.g., from students’ own investigations, observations,\nreading material, archived data) necessary for constructing the explanation, including evidence that:\ni. Competitive relationships occur when organisms within an ecosystem compete for shared resources\n(e.g., data about the change in population of a given species when a competing species is\nintroduced).\nii. Predatory interactions occur between organisms within an ecosystem.","k":"Core"},{"c":"LS-G6–8-T14-LO04","x":"iii. Mutually beneficial interactions occur between organisms within an ecosystem. Organisms involved\nin these mutually beneficial interactions can become so dependent upon one another that they\ncannot survive alone.\niv. Resource availability, or lack thereof, can affect interactions between organisms (e.g.,\norganisms in a resource-limited environment may have a competitive relationship, while those\nsame organisms may not be in competition in a resource-rich environment).\nv. Competitive, predatory, and mutually beneficial interactions occur across multiple, different,\necosystems","k":"Core"},{"c":"LS-G6–8-T14-LO05","x":"b Students use multiple valid and reliable sources for the evidence.","k":"Core"}]},{"id":"SCI-G6-U8-L3","sub":"Science","g":6,"u":8,"un":"Ecosystems & food webs","l":3,"t":"Food webs, pollinators and food security — Part 2","role":"Part 2 of 2","topic":"LS-G6-8-T14","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 14. Science and Society","tim":"Essential","pis":"","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSn-GRADE-6-8-YEAR 7-9","stmt":"Construct an explanation that predicts patterns of interactions among organisms across multiple ecosystems — by applying the interdependence of organisms, including food webs and insect-pollinated crops, the importance of plant reproduction in human food security, and how organisms affect and are affected by their environment. [Clarification Statement: Emphasis is on predicting consistent patterns of interactions in different ecosystems in terms of the relationships among and between organisms and abiotic components of ecosystems. Examples of types of interactions could include competitive, predatory, and mutually beneficial.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T14-LO06","x":"3 Reasoning\na Students identify and describe* quantitative or qualitative patterns of interactions among organisms\nthat can be used to identify causal relationships within ecosystems, related to the given phenomenon.","k":"Core"},{"c":"LS-G6–8-T14-LO07","x":"b Students describe* that regardless of the ecosystem or species involved, the patterns of interactions\n(competitive, mutually beneficial, predator/prey) are similar.\nc Students use reasoning to connect the evidence and support an explanation. In their reasoning,\nstudents use patterns in the evidence to predict common interactions among organisms in ecosystems as\nthey relate to the phenomenon, (e.g., given specific organisms in a given environment with specified\nresource availability, which organisms in the system will exhibit competitive interactions). Students\npredict the following types of interactions:\ni. Predatory interactions.\nii. Competitive interactions.\niii. Mutually beneficial interactions.","k":"Core"}]},{"id":"SCI-G6-U9-L1","sub":"Science","g":6,"u":9,"un":"Evidence of evolution","l":1,"t":"The fossil record: change and extinction over time","role":"Single lesson","topic":"LS-G6-8-T19","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"10. Diversity of Life","dom":"Life Sciences","area":"Evidence of evolution","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSs-GRADE-6-8-YEAR 7-9","stmt":"Analyze and interpret data for patterns in the fossil record that document the existence, diversity, extinction, and change of life forms throughout the history of life on Earth under the assumption that natural laws operate today as in the past — thereby recognising that living things have changed over time and that extinction occurs. [Clarification Statement: Emphasis is on finding patterns of changes in the level of complexity of anatomical structures in organisms and the chronological order of fossil appearance in the rock layers.] [Assessment Boundary: Assessment does not include the names of individual species or geological eras in the fossil record.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T19-LO01","x":"1 Organizing data\na Students organize the given data (e.g., using tables, graphs, charts, images), including the\nappearance of specific types of fossilized organisms in the fossil record as a function of time, as\ndetermined by their locations in the sedimentary layers or the ages of rocks.","k":"Core"},{"c":"LS-G6–8-T19-LO02","x":"b Students organize the data in a way that allows for the identification, analysis, and interpretation\nof similarities and differences in the data.","k":"Core"},{"c":"LS-G6–8-T19-LO03","x":"2 Identifying relationships\na Students identify:\ni. Patterns between any given set of sedimentary layers and the relative ages of those layers.\nii. The time period(s) during which a given fossil organism is present in the fossil record.\niii. Periods of time for which changes in the presence or absence of large numbers of organisms or\nspecific types of organisms can be observed in the fossil record (e.g., a fossil layer with very\nfew organisms immediately next to a fossil layer with many types of organisms).\niv. Patterns of changes in the level of complexity of anatomical structures in organisms in the\nfossil record, as a function of time.","k":"Core"},{"c":"LS-G6–8-T19-LO04","x":"3 Interpreting data\na Students analyze and interpret the data to determine evidence for the existence, diversity,\nextinction, and change in life forms throughout the history of Earth, using the assumption that\nnatural laws operate today as they would have in the past. Students use similarities and differences\nin the observed patterns to provide evidence for:\ni. When mass extinctions occurred.\nii. When organisms or types of organisms emerged, went extinct, or evolved.\niii. The long-term increase in the diversity and complexity of organisms on Earth.","k":"Core"}]},{"id":"SCI-G6-U10-L1","sub":"Science","g":6,"u":10,"un":"Genetics & inheritance","l":1,"t":"Chromosomes, genes, DNA and mutations","role":"Single lesson","topic":"LS-G6-8-T16","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"Core","big":"9. Inheritance","dom":"Life Sciences","area":"Genetics & inheritance","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSp-GRADE-6-8-YEAR 7-9","stmt":"Develop and use a model to describe why structural changes to genes (mutations) located on chromosomes may affect proteins and may result in harmful, beneficial, or neutral effects to the structure and function of the organism — using heredity as the process by which genetic information is transmitted, through a simple model of chromosomes, genes and DNA. [Clarification Statement: Emphasis is on conceptual understanding that changes in genetic material may result in making different proteins.] [Assessment Boundary: Assessment does not include specific changes at the molecular level, mechanisms for protein synthesis, or specific types of mutations.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T16-LO01","x":"1 Components of the model\na Students develop a model in which they identify the relevant components for making sense of a given\nphenomenon involving the relationship between mutations and the effects on the organism, including:\ni. Genes, located on chromosomes.\nii. Proteins.\niii. Traits of organisms.","k":"Core"},{"c":"LS-G6–8-T16-LO02","x":"2 Relationships\na In their model, students describe* the relationships between components, including:\ni. Every gene has a certain structure, which determines the structure of a specific set of\nproteins.\nii. Protein structure influences protein function (e.g., the structure of some blood proteins allows\nthem to attach to oxygen, the structure of a normal digestive protein allows it break down\nparticular food molecules).\niii. Observable organism traits (e.g., structural, functional, behavioral) result from the activity\nof proteins.","k":"Core"},{"c":"LS-G6–8-T16-LO03","x":"3 Connections\na Students use the model to describe* that structural changes to genes (i.e., mutations) may result in\nobservable effects at the level of the organism, including why structural changes to genes:\ni. May affect protein structure and function.\nii. May affect how proteins contribute to observable structures and functions in organisms.\niii. May result in trait changes that are beneficial, harmful, or neutral for the organism.","k":"Core"},{"c":"LS-G6–8-T16-LO04","x":"b Students use the model to describe* that beneficial, neutral, or harmful changes to protein function\ncan cause beneficial, neutral, or harmful changes in the structure and function of organisms.","k":"Core"}]},{"id":"SCI-G6-U10-L2","sub":"Science","g":6,"u":10,"un":"Genetics & inheritance","l":2,"t":"Technologies that influence inheritance — Part 1","role":"Part 1 of 2","topic":"LS-G6-8-T23","pt":"Optional","pri":"—","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology, 14. Science and Society","tim":"","pis":"","cls":"Core","big":"9. Inheritance","dom":"Life Sciences","area":"Genetics & inheritance","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSw-GRADE-6-8-YEAR 7-9","stmt":"Gather and synthesize information about the technologies that have changed the way humans influence the inheritance of desired traits in organisms — including the use of gene banks to preserve hereditary material. [Clarification Statement: Emphasis is on synthesizing information from reliable sources about the influence of humans on genetic outcomes in artificial selection (such as genetic modification, animal husbandry, gene therapy); and, on the impacts these technologies have on society as well as the technologies leading to these scientific discoveries.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T23-LO01","x":"1 Obtaining information\na Students gather information about at least two technologies that have changed the way humans influence\nthe inheritance of desired traits in plants and animals through artificial selection by choosing\ndesired parental traits determined by genes, which are then often passed on to offspring. Examples\ncould include gene therapy, genetic modification, and selective breeding of plants and animals.","k":"Core"},{"c":"LS-G6–8-T23-LO02","x":"b Students use at least two appropriate and reliable sources of information for investigating each\ntechnology.","k":"Core"},{"c":"LS-G6–8-T23-LO03","x":"2 Evaluating information\na Students assess the credibility, accuracy, and possible bias of each publication and method used in\nthe information they gather.","k":"Core"},{"c":"LS-G6–8-T23-LO04","x":"b Students use their knowledge of artificial selection and additional sources to describe* how the\ninformation they gather is or is not supported by evidence.","k":"Core"},{"c":"LS-G6–8-T23-LO05","x":"c Students synthesize the information from multiple sources to provide examples of how technologies have\nchanged the ways that humans are able to influence the inheritance of desired traits in organisms.","k":"Core"}]},{"id":"SCI-G6-U10-L3","sub":"Science","g":6,"u":10,"un":"Genetics & inheritance","l":3,"t":"Technologies that influence inheritance — Part 2","role":"Part 2 of 2","topic":"LS-G6-8-T23","pt":"Recommended","pri":"—","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology, 14. Science and Society","tim":"","pis":"","cls":"Core","big":"9. Inheritance","dom":"Life Sciences","area":"Genetics & inheritance","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSw-GRADE-6-8-YEAR 7-9","stmt":"Gather and synthesize information about the technologies that have changed the way humans influence the inheritance of desired traits in organisms — including the use of gene banks to preserve hereditary material. [Clarification Statement: Emphasis is on synthesizing information from reliable sources about the influence of humans on genetic outcomes in artificial selection (such as genetic modification, animal husbandry, gene therapy); and, on the impacts these technologies have on society as well as the technologies leading to these scientific discoveries.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T23-LO06","x":"d Students use the information to identify and describe* how a better understanding of cause-and- effect\nrelationships in how traits occur in organisms has led to advances in technology that provide a higher\nprobability of being able to influence the inheritance of desired traits in organisms.","k":"Core"}]},{"id":"SCI-G6-U11-L1","sub":"Science","g":6,"u":11,"un":"Atoms & the Periodic Table","l":1,"t":"Atoms, elements, compounds and the Periodic Table","role":"Single lesson","topic":"PS-G6-8-T1","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"Core","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Atoms & the Periodic Table","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-PSa-GRADE-6-8-YEAR 7-9","stmt":"Develop models to describe the atomic composition of simple molecules and extended structures, using a simple (Dalton) atomic model and chemical symbols and formulae, and drawing on the differences between atoms, elements and compounds, including whether elements are metals or non-metals. including describe how elements are organized by their varying physical and chemical properties in the Periodic Table (periods and groups). [Clarification Statement: Emphasis is on developing models of molecules that vary in complexity. Examples of simple molecules could include ammonia and methanol. Examples of extended structures could include sodium chloride or diamonds. Examples of molecular-level models could include drawings, 3D ball and stick structures, or computer representations showing different molecules with different types of atoms.] [Assessment Boundary: Assessment does not include valence electrons and bonding energy, discussing the ionic nature of subunits of complex structures, or a complete description of all individual atoms in a complex molecule or extended structure is not required.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T1-LO01","x":"1 Components of the model\na Students develop models of atomic composition of simple molecules and extended structures that vary in\ncomplexity. In the models, students identify the relevant components, including:\ni. Individual atoms.\nii. Molecules.\niii. Extended structures with repeating subunits.\niv. Substances (e.g., solids, liquids, and gases at the macro level).","k":"Core"},{"c":"PS-G6–8-T1-LO02","x":"2 Relationships\na In the model, students describe* relationships between components, including:\ni. Individual atoms, from two to thousands, combine to form molecules, which can be made up of the\nsame type or different types of atom.\nii. Some molecules can connect to each other.\niii. In some molecules, the same atoms of different elements repeat; in other molecules, the same\natom of a single element repeats.","k":"Core"},{"c":"PS-G6–8-T1-LO03","x":"3 Connections\na Students use models to describe* that:\ni. Pure substances are made up of a bulk quantity of individual atoms or molecules. Each pure\nsubstance is made up of one of the following: 1. Individual atoms of the same type that are\nconnected to form extended structures. 2. Individual atoms of different types that repeat to\nform extended structures (e.g., sodium chloride). 3. Individual atoms that are not attracted to\neach other (e.g., helium). 4. Molecules of different types of atoms that are not attracted to\neach other (e.g., carbon dioxide). 5. Molecules of different types of atoms that are attracted\nto each other to form extended structures (e.g., sugar, nylon). 6. Molecules of the same type of\natom that are not attracted to each other (e.g., oxygen).\nii. Students use the models to describe* how the behavior of bulk substances depends on their\nstructures at atomic and molecular levels, which are too small to see.","k":"Core"}]},{"id":"SCI-G6-U12-L1","sub":"Science","g":6,"u":12,"un":"Chemical reactions","l":1,"t":"Chemical reactions, mixtures and separation — Part 1","role":"Part 1 of 3","topic":"PS-G6-8-T3","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories, 13. Science and Technology","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSc-GRADE-6-8-YEAR 7-9","stmt":"Analyze and interpret data on the properties of substances before and after the substances interact to determine if a chemical reaction has occurred. Furthermore, • distinguish pure substances from mixtures (including dissolving and diffusion), and use simple separation techniques — filtration, evaporation, distillation and chromatography — to show that mixing is a reversible physical change, in contrast with chemical reactions, which form new substances. • analyze before-and-after property data across a range of reaction types — combustion, thermal decomposition, oxidation and displacement reactions — and the reactions of acids with metals (producing a salt plus hydrogen) and with alkalis (producing a salt plus water: neutralization), using the pH scale and indicators as evidence of chemical change; and describe the order of metals and carbon in the reactivity series. • explore the concept of a pure substance; Diffusion in terms of the particle model; The identification of pure substances; Chemical reactions as the rearrangement of atoms; Representing chemical reactions using formulae and using equations; The pH scale for measuring acidity/alkalinity; and indicators; The use of carbon in obtaining metals from metal oxides. [Clarification Statement: Examples of reactions could include burning sugar or steel wool, and mixing zinc with hydrogen chloride.] [Assessment boundary: Assessment is limited to analysis of the following properties: density, melting point, boiling point, solubility, flammability, and odor.] Distinguish physical properties (e.g., melting point, density, solubility) from chemical properties (e.g., reactivity, flammability); describe solutions in terms of solute and solvent and compare the concentration of solutions.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T3-LO01","x":"1 Organizing data\na Students organize given data about the characteristic physical and chemical properties (e.g., density,\nmelting point, boiling point, solubility, flammability, odor) of pure substances before and after they\ninteract.","k":"Core"},{"c":"PS-G6–8-T3-LO02","x":"b Students organize the given data in a way that facilitates analysis and interpretation.","k":"Core"},{"c":"PS-G6–8-T3-LO03","x":"2 Identifying relationships\na Students analyze the data to identify patterns (i.e., similarities and differences), including the\nchanges in physical and chemical properties of each substance before and after the interaction (e.g.,\nbefore the interaction, a substance burns, while after the interaction, the resulting substance does\nnot burn).","k":"Core"},{"c":"PS-G6–8-T3-LO04","x":"3 Interpreting data\na Students use the analyzed data to determine whether a chemical reaction has occurred.","k":"Core"},{"c":"PS-G6–8-T3-LO05","x":"b Students support their interpretation of the data by describing* that the change in properties of\nsubstances is related to the rearrangement of atoms in the reactants and products in a chemical\nreaction (e.g., when a reaction has occurred, atoms from the substances present before the interaction\nmust have been rearranged into new configurations, resulting in the properties of new substances).\nFurthermore (UK Requirement):","k":"UK Requirement"}]},{"id":"SCI-G6-U12-L2","sub":"Science","g":6,"u":12,"un":"Chemical reactions","l":2,"t":"Chemical reactions, mixtures and separation — Part 2","role":"Part 2 of 3","topic":"PS-G6-8-T3","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories, 13. Science and Technology","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSc-GRADE-6-8-YEAR 7-9","stmt":"Analyze and interpret data on the properties of substances before and after the substances interact to determine if a chemical reaction has occurred. Furthermore, • distinguish pure substances from mixtures (including dissolving and diffusion), and use simple separation techniques — filtration, evaporation, distillation and chromatography — to show that mixing is a reversible physical change, in contrast with chemical reactions, which form new substances. • analyze before-and-after property data across a range of reaction types — combustion, thermal decomposition, oxidation and displacement reactions — and the reactions of acids with metals (producing a salt plus hydrogen) and with alkalis (producing a salt plus water: neutralization), using the pH scale and indicators as evidence of chemical change; and describe the order of metals and carbon in the reactivity series. • explore the concept of a pure substance; Diffusion in terms of the particle model; The identification of pure substances; Chemical reactions as the rearrangement of atoms; Representing chemical reactions using formulae and using equations; The pH scale for measuring acidity/alkalinity; and indicators; The use of carbon in obtaining metals from metal oxides. [Clarification Statement: Examples of reactions could include burning sugar or steel wool, and mixing zinc with hydrogen chloride.] [Assessment boundary: Assessment is limited to analysis of the following properties: density, melting point, boiling point, solubility, flammability, and odor.] Distinguish physical properties (e.g., melting point, density, solubility) from chemical properties (e.g., reactivity, flammability); describe solutions in terms of solute and solvent and compare the concentration of solutions.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T3-LO06","x":"• distinguish a pure substance from a mixture, including the cases of dissolving and diffusion, and identify a pure substance from its properties, such as a sharp melting or boiling point","k":"UK Requirement"},{"c":"PS-G6–8-T3-LO07","x":"• use filtration, evaporation, distillation and chromatography to separate mixtures, and show from the results that mixing is a reversible physical change while a chemical reaction forms new substances","k":"UK Requirement"},{"c":"PS-G6–8-T3-LO08","x":"• explain diffusion in terms of the particle model","k":"UK Requirement"},{"c":"PS-G6–8-T3-LO09","x":"• analyse before-and-after property data across combustion, thermal decomposition, oxidation and displacement reactions, and identify in each case the evidence of chemical change","k":"UK Requirement"},{"c":"PS-G6–8-T3-LO10","x":"• describe the reaction of an acid with a metal as producing a salt and hydrogen, and the reaction of an acid with an alkali as producing a salt and water, which is neutralisation","k":"UK Requirement"}]},{"id":"SCI-G6-U12-L3","sub":"Science","g":6,"u":12,"un":"Chemical reactions","l":3,"t":"Chemical reactions, mixtures and separation — Part 3","role":"Part 3 of 3","topic":"PS-G6-8-T3","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories, 13. Science and Technology","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSc-GRADE-6-8-YEAR 7-9","stmt":"Analyze and interpret data on the properties of substances before and after the substances interact to determine if a chemical reaction has occurred. Furthermore, • distinguish pure substances from mixtures (including dissolving and diffusion), and use simple separation techniques — filtration, evaporation, distillation and chromatography — to show that mixing is a reversible physical change, in contrast with chemical reactions, which form new substances. • analyze before-and-after property data across a range of reaction types — combustion, thermal decomposition, oxidation and displacement reactions — and the reactions of acids with metals (producing a salt plus hydrogen) and with alkalis (producing a salt plus water: neutralization), using the pH scale and indicators as evidence of chemical change; and describe the order of metals and carbon in the reactivity series. • explore the concept of a pure substance; Diffusion in terms of the particle model; The identification of pure substances; Chemical reactions as the rearrangement of atoms; Representing chemical reactions using formulae and using equations; The pH scale for measuring acidity/alkalinity; and indicators; The use of carbon in obtaining metals from metal oxides. [Clarification Statement: Examples of reactions could include burning sugar or steel wool, and mixing zinc with hydrogen chloride.] [Assessment boundary: Assessment is limited to analysis of the following properties: density, melting point, boiling point, solubility, flammability, and odor.] Distinguish physical properties (e.g., melting point, density, solubility) from chemical properties (e.g., reactivity, flammability); describe solutions in terms of solute and solvent and compare the concentration of solutions.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T3-LO11","x":"• use the pH scale and indicators as evidence of chemical change, reading acidity and alkalinity from a measured or indicated pH","k":"UK Requirement"},{"c":"PS-G6–8-T3-LO12","x":"• represent chemical reactions as the rearrangement of atoms, using chemical symbols, formulae and equations","k":"UK Requirement"},{"c":"PS-G6–8-T3-LO13","x":"• state the order of the metals and of carbon in the reactivity series, and explain the use of carbon to obtain a metal from its oxide","k":"UK Requirement"},{"c":"PS-G6–8-T3-LO14","x":"• distinguish physical properties (e.g., melting point, density, solubility) from chemical properties (e.g., reactivity, flammability); describe solutions in terms of solute and solvent and compare the concentration of solutions","k":"UK Requirement"}]},{"id":"SCI-G6-U12-L4","sub":"Science","g":6,"u":12,"un":"Chemical reactions","l":4,"t":"Materials from natural resources: ceramics, polymers, composites, metals — Part 1","role":"Part 1 of 2","topic":"PS-G6-8-T6","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"14. Science and Society","tim":"","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSf-GRADE-6-8-YEAR 7-9","stmt":"Gather and make sense of information to describe that synthetic materials come from natural resources and impact society, drawing on the properties and uses of ceramics, polymers and composites. Furthermore, explain the use of carbon in obtaining metals from metal oxides, as an example of transforming natural resources into useful materials. Furthermore, as stated in NC KS3 (Materials): Properties of ceramics, polymers and composites (qualitative). [Clarification Statement: Emphasis is on natural resources that undergo a chemical process to form the synthetic material. Examples of new materials could include new medicine, foods, and alternative fuels.] [Assessment Boundary: Assessment is limited to qualitative information.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T6-LO01","x":"1 Obtaining information\na Students obtain information from published, grade-level appropriate material from at least two sources\n(e.g., text, media, visual displays, data) about:\ni. Synthetic materials and the natural resources from which they are derived.\nii. Chemical processes used to create synthetic materials from natural resources (e.g., burning of\nlimestone for the production of concrete).\niii. The societal need for the synthetic material (e.g., the need for concrete as a building\nmaterial).","k":"Core"},{"c":"PS-G6–8-T6-LO02","x":"2 Evaluating information\na Students determine and describe* whether the gathered information is relevant for determining:\ni. That synthetic materials, via chemical reactions, come from natural resources.\nii. The effects of the production and use of synthetic resources on society.","k":"Core"},{"c":"PS-G6–8-T6-LO03","x":"b Students determine the credibility, accuracy, and possible bias of each source of information,\nincluding the ideas included and methods described.\nc Students synthesize information that is presented in various modes (e.g., graphs, diagrams,\nphotographs, text, mathematical, verbal) to describe*:\ni. How synthetic materials are formed, including the natural resources and chemical processes used.\nii. The properties of the synthetic material(s) that make it different from the natural resource(s)","k":"Core"},{"c":"PS-G6–8-T6-LO04","x":"from which it was derived.\niii. How those physical and chemical properties contribute to the function of the synthetic material.\niv. How the synthetic material satisfies a societal need or desire through the properties of its\nstructure and function.\nv. The effects of making and using synthetic materials on natural resources and society.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"PS-G6–8-T6-LO05","x":"• explain qualitatively how carbon is used to obtain a metal from its oxide, naming carbon as the substance that takes the oxygen away from the metal","k":"UK Requirement"}]},{"id":"SCI-G6-U12-L5","sub":"Science","g":6,"u":12,"un":"Chemical reactions","l":5,"t":"Materials from natural resources: ceramics, polymers, composites, metals — Part 2","role":"Part 2 of 2","topic":"PS-G6-8-T6","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"14. Science and Society","tim":"","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSf-GRADE-6-8-YEAR 7-9","stmt":"Gather and make sense of information to describe that synthetic materials come from natural resources and impact society, drawing on the properties and uses of ceramics, polymers and composites. Furthermore, explain the use of carbon in obtaining metals from metal oxides, as an example of transforming natural resources into useful materials. Furthermore, as stated in NC KS3 (Materials): Properties of ceramics, polymers and composites (qualitative). [Clarification Statement: Emphasis is on natural resources that undergo a chemical process to form the synthetic material. Examples of new materials could include new medicine, foods, and alternative fuels.] [Assessment Boundary: Assessment is limited to qualitative information.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T6-LO06","x":"• identify the metal oxide as the substance reduced and the carbon as the substance oxidised, and name the useful product and the waste gas produced","k":"UK Requirement"},{"c":"PS-G6–8-T6-LO07","x":"• compare the properties of ceramics, polymers and composites qualitatively, and select one of the three for a stated use, giving the property that decides the choice","k":"UK Requirement"},{"c":"PS-G6–8-T6-LO08","x":"• describe a composite as two or more materials combined so that the combination has properties neither material has alone, using one named example","k":"UK Requirement"}]},{"id":"SCI-G6-U13-L1","sub":"Science","g":6,"u":13,"un":"Electric circuits","l":1,"t":"Current, potential difference, resistance and circuits — Part 1","role":"Part 1 of 2","topic":"PS-G6-8-T14","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Electric circuits","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-PSn-GRADE-6-8-YEAR 7-9","stmt":"Furthermore, explore electric current, measured in amperes, in circuits, series and parallel circuits, currents add where branches meet and current as flow of charge; potential difference, measured in volts, battery and bulb ratings; resistance, measured in ohms, as the ratio of potential difference (p.d.) to current; differences in resistance between conducting and insulating components (quantitative); and calculate domestic fuel uses and costs","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T14-LO01","x":"Furthermore (UK Requirement):\n• measure electric current in amperes with an ammeter connected in series, and describe current as the rate of flow of electric charge round a complete circuit","k":"UK Requirement"},{"c":"PS-G6–8-T14-LO02","x":"• show, from ammeter readings taken at several points, that the current is the same all the way round a series circuit, and that where branches meet in a parallel circuit the branch currents add to give the current in the main line","k":"UK Requirement"},{"c":"PS-G6–8-T14-LO03","x":"• measure potential difference in volts with a voltmeter connected across a component, and read battery and bulb ratings to state the potential difference each is designed to work at","k":"UK Requirement"},{"c":"PS-G6–8-T14-LO04","x":"• calculate resistance in ohms as the ratio of potential difference to current, using R = V ÷ I, and compare the resistance of a conducting component with that of an insulating one","k":"UK Requirement"},{"c":"PS-G6–8-T14-LO05","x":"• predict, then measure, what happens to the current, the potential difference and the brightness of the lamps when a component is added to or removed from a series circuit and from a parallel circuit","k":"UK Requirement"}]},{"id":"SCI-G6-U13-L2","sub":"Science","g":6,"u":13,"un":"Electric circuits","l":2,"t":"Current, potential difference, resistance and circuits — Part 2","role":"Part 2 of 2","topic":"PS-G6-8-T14","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Electric circuits","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-PSn-GRADE-6-8-YEAR 7-9","stmt":"Furthermore, explore electric current, measured in amperes, in circuits, series and parallel circuits, currents add where branches meet and current as flow of charge; potential difference, measured in volts, battery and bulb ratings; resistance, measured in ohms, as the ratio of potential difference (p.d.) to current; differences in resistance between conducting and insulating components (quantitative); and calculate domestic fuel uses and costs","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T14-LO06","x":"• calculate the energy a domestic appliance uses in kilowatt-hours from its power rating and running time, and calculate the cost of that energy from a given ADDC tariff","k":"UK Requirement"}]},{"id":"SCI-G6-U14-L1","sub":"Science","g":6,"u":14,"un":"Energy stores & transfers","l":1,"t":"Kinetic energy, speed and distance–time graphs — Part 1","role":"Part 1 of 2","topic":"PS-G6-8-T15","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Energy stores & transfers","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSo-GRADE-6-8-YEAR 7-9","stmt":"Construct and interpret graphical displays of data to describe the relationships of kinetic energy to the mass of an object and to the speed of an object; calculate speed from the relationship between average speed, distance and time (speed = distance ÷ time); represent a journey on a distance–time graph; and describe relative motion (e.g. trains and cars passing one another). Furthermore, Compare energy values of different foods (from labels) (kJ); Compare power ratings of appliances in watts (W, kW); Compare amounts of energy transferred (J, kJ, kW hour); Explore Fuels and energy resources; Energy as a quantity that can be quantified and calculated; the total energy has the same value before and after a change. [Clarification Statement: Emphasis is on descriptive relationships between kinetic energy and mass separately from kinetic energy and speed. Examples could include riding a bicycle at different speeds, rolling different sizes of rocks downhill, and getting hit by a wiffle ball versus a tennis ball.] Identify renewable energy sources (solar, wind, hydroelectric, geothermal, biomass) and non-renewable sources (coal, oil, natural gas, nuclear) and compare their advantages and disadvantages.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T15-LO01","x":"1 Organizing data\na Students use graphical displays to organize the following given data:\ni. Mass of the object.\nii. Speed of the object.\niii. Kinetic energy of the object.","k":"Core"},{"c":"PS-G6–8-T15-LO02","x":"b Students organize the data in a way that facilitates analysis and interpretation.","k":"Core"},{"c":"PS-G6–8-T15-LO03","x":"2 Identifying relationships\na Using the graphical display, students identify that kinetic energy:\ni. Increases if either the mass or the speed of the object increases or if both increase.\nii. Decreases if either the mass or the speed of the object decreases or if both decrease.","k":"Core"},{"c":"PS-G6–8-T15-LO04","x":"3 Interpreting data\na Using the analyzed data, students describe*:\ni. The relationship between kinetic energy and mass as a linear proportional relationship (KE ∝ m)\nin which: 1. The kinetic energy doubles as the mass of the object doubles. 2. The kinetic energy\nhalves as the mass of the object halves.\nii. The relationship between kinetic energy and speed as a nonlinear (square) proportional\nrelationship (KE ∝ v2) in which: 1. The kinetic energy quadruples as the speed of the object\ndoubles. 2. The kinetic energy decreases by a factor of four as the speed of the object is cut\nin half.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"PS-G6–8-T15-LO05","x":"• compare the energy values of different foods in kilojoules by reading the nutrition labels","k":"UK Requirement"}]},{"id":"SCI-G6-U14-L2","sub":"Science","g":6,"u":14,"un":"Energy stores & transfers","l":2,"t":"Kinetic energy, speed and distance–time graphs — Part 2","role":"Part 2 of 2","topic":"PS-G6-8-T15","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Energy stores & transfers","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSo-GRADE-6-8-YEAR 7-9","stmt":"Construct and interpret graphical displays of data to describe the relationships of kinetic energy to the mass of an object and to the speed of an object; calculate speed from the relationship between average speed, distance and time (speed = distance ÷ time); represent a journey on a distance–time graph; and describe relative motion (e.g. trains and cars passing one another). Furthermore, Compare energy values of different foods (from labels) (kJ); Compare power ratings of appliances in watts (W, kW); Compare amounts of energy transferred (J, kJ, kW hour); Explore Fuels and energy resources; Energy as a quantity that can be quantified and calculated; the total energy has the same value before and after a change. [Clarification Statement: Emphasis is on descriptive relationships between kinetic energy and mass separately from kinetic energy and speed. Examples could include riding a bicycle at different speeds, rolling different sizes of rocks downhill, and getting hit by a wiffle ball versus a tennis ball.] Identify renewable energy sources (solar, wind, hydroelectric, geothermal, biomass) and non-renewable sources (coal, oil, natural gas, nuclear) and compare their advantages and disadvantages.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T15-LO06","x":"• compare the power ratings of household appliances in watts and kilowatts, and state which of two appliances transfers energy faster","k":"UK Requirement"},{"c":"PS-G6–8-T15-LO07","x":"• compare amounts of energy transferred in joules, kilojoules and kilowatt-hours, converting between the units","k":"UK Requirement"},{"c":"PS-G6–8-T15-LO08","x":"• compare fuels and energy resources by the energy they can supply and by the effects of using them","k":"UK Requirement"},{"c":"PS-G6–8-T15-LO09","x":"• state that energy can be quantified and calculated, and that the total energy of a system has the same value before and after a change","k":"UK Requirement"},{"c":"PS-G6–8-T15-LO10","x":"• identify renewable energy sources (solar, wind, hydroelectric, geothermal, biomass) and non-renewable sources (coal, oil, natural gas, nuclear) and compare their advantages and disadvantages","k":"UK Requirement"}]},{"id":"SCI-G6-U15-L1","sub":"Science","g":6,"u":15,"un":"Forces & motion","l":1,"t":"Newton's Third Law, force arrows and equilibrium","role":"Single lesson","topic":"PS-G6-8-T8","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology","tim":"Essential","pis":"","cls":"Core","big":"3. Forces and Motion","dom":"Physical Sciences — Physics","area":"Forces & motion","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSh-GRADE-6-8-YEAR 7-9","stmt":"Apply Newton's Third Law to design a solution to a problem involving the motion of two colliding objects, explore and apply forces as pushes or pulls, arising from the interaction between two objects; Using force arrows in diagrams, adding forces in one dimension, balanced and unbalanced forces; Opposing forces and equilibrium: weight held by stretched spring or supported on a compressed surface. [Clarification Statement: Examples of practical problems could include the impact of collisions between two cars, between a car and stationary objects, and between a meteor and a space vehicle.] [Assessment Boundary: Assessment is limited to vertical or horizontal interactions in one dimension.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T8-LO01","x":"1 Using scientific knowledge to generate design solutions\na Given a problem to solve involving a collision of two objects, students design a solution (e.g., an","k":"Core"},{"c":"PS-G6–8-T8-LO02","x":"object, tool, process, or system). In their designs, students identify and describe*:\ni. The components within the system that are involved in the collision.\nii. The force that will be exerted by the first object on the second object.\niii. How Newton’s third law will be applied to design the solution to the problem.\niv. The technologies (i.e., any human-made material or device) that will be used in the solution.","k":"Core"},{"c":"PS-G6–8-T8-LO03","x":"2 Describing* criteria and constraints, including quantification when appropriate\na Students describe* the given criteria and constraints, including how they will be taken into account\nwhen designing the solution.\ni. Students describe* how the criteria are appropriate to solve the given problem.\nii. Students describe* the constraints, which may include: 1. Cost. 2. Mass and speed of objects. 3.\nTime. 4. Materials.","k":"Core"},{"c":"PS-G6–8-T8-LO04","x":"3 Evaluating potential solutions\na Students use their knowledge of Newton’s third law to systematically determine how well the design\nsolution meets the criteria and constraints.","k":"Core"},{"c":"PS-G6–8-T8-LO05","x":"b Students identify the value of the device for society.\nc Students determine how the choice of technologies that are used in the design is affected by the\nconstraints of the problem and the limits of technological advances.","k":"Core"}]},{"id":"SCI-G6-U16-L1","sub":"Science","g":6,"u":16,"un":"Waves, light & sound","l":1,"t":"Waves: amplitude, frequency and energy — Part 1","role":"Part 1 of 2","topic":"PS-G6-8-T20","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Waves, light & sound","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSt-GRADE-6-8-YEAR 7-9","stmt":"Use mathematical representations to describe a simple model for waves that includes how the amplitude of a wave is related to the energy in a wave. Furthermore, use the relationship between loudness and amplitude, with the frequencies of sound waves (measured in hertz) and the human auditory range as further measured examples. Furthermore, explore Waves on water as undulations which travel through water with transverse motion; these waves can be reflected, and add or cancel - superposition; Frequencies of sound waves, measured in hertz (Hz); echoes, reflection and absorption of sound; Sound needs a medium to travel, the speed of sound in air, in water, in solids; Sound produced by vibrations of objects, in loud speakers, detected by their effects on microphone diaphragm and the ear drum; sound waves are longitudinal; Auditory range of humans and animals. [Clarification Statement: Emphasis is on describing waves with both qualitative and quantitative thinking.] [Assessment Boundary: Assessment does not include electromagnetic waves and is limited to standard repeating waves.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T20-LO01","x":"1 Representation\na Students identify the characteristics of a simple mathematical wave model of a phenomenon, including:\ni. Waves represent repeating quantities.\nii. Frequency, as the number of times the pattern repeats in a given amount of time (e.g., beats per\nsecond).\niii. Amplitude, as the maximum extent of the repeating quantity from equilibrium (e.g., height or\ndepth of a water wave from average sea level).\niv. Wavelength, as a certain distance
