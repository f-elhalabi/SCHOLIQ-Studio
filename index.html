ience-CHEa-GRADE-9-10-YEAR 10-11","stmt":"Use the periodic table as a model to predict the relative properties of elements based on the patterns of electrons in the outermost energy level of atoms; achieved through exploring the simple atomic model (nucleus, electrons, relative atomic mass, isotopes), the modern Periodic Table arranged by atomic number, and trends in properties within groups. Furthermore, explore the characteristic properties of metals and non-metals. [Clarification Statement: Examples of properties that could be predicted from patterns could include reactivity of metals, types of bonds formed, numbers of bonds formed, and reactions with oxygen.] [Assessment Boundary: Assessment is limited to main group elements. Assessment does not include quantitative understanding of ionization energy beyond relative trends.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 30; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T1-LO06","x":"• describe the characteristic properties of non-metals — brittleness when solid, poor conductivity, and the tendency to gain or share electrons","k":"UK Requirement"},{"c":"CHE-G9–10-T1-LO07","x":"• classify an unfamiliar main-group element as a metal or a non-metal from its position in the periodic table and from given property data, and justify the classification","k":"UK Requirement"}]},{"id":"SCI-G9-U14-L1","sub":"Science","g":9,"u":14,"un":"Chemical reactions — Part 1","l":1,"t":"Explaining reactions from outer electrons — Part 1","role":"Part 1 of 3","topic":"CHE-G9-10-T4","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 13. Science and Technology","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-CHEd-GRADE-9-10-YEAR 10-11","stmt":"Construct and revise an explanation for the outcome of a simple chemical reaction based on the outermost electron states of atoms, trends in the periodic table, and knowledge of the patterns of chemical properties; achieved through chemical reactivity of elements in relation to their position in the Periodic Table. Furthermore, explore the chemistry of acids including reactions with some metals and carbonates, and reduction and oxidation in terms of loss or gain of oxygen. Use pH as a measure of hydrogen ion concentration and its numerical scale, and describe and predict the products of electrolysis of molten ionic liquids and aqueous ionic solutions. [Clarification Statement: Examples of chemical reactions could include the reaction of sodium and chlorine, of carbon and oxygen, or of carbon and hydrogen.] [Assessment Boundary: Assessment is limited to chemical reactions involving main group elements and combustion reactions.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 31; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T4-LO01","x":"1 Articulating the explanation of phenomena\na Students construct an explanation of the outcome of the given reaction, including:\ni. The idea that the total number of atoms of each element in the reactant and products is the\nsame;\nii. The numbers and types of bonds (i.e., ionic, covalent) that each atom forms, as determined by\nthe outermost (valence) electron states and the electronegativity;\niii. The outermost (valence) electron state of the atoms that make up both the reactants and the\nproducts of the reaction is based on their position in the periodic table; and\niv. A discussion of how the patterns of attraction allow the prediction of the type of reaction that\noccurs (e.g., formation of ionic compounds, combustion of hydrocarbons).","k":"Core"},{"c":"CHE-G9–10-T4-LO02","x":"2 Evidence\na Students identify and describe* the evidence to construct the explanation, including:\ni. Identification of the products and reactants, including their chemical formulas and the\narrangement of their outermost (valence) electrons;\nii. Identification that the number and types of atoms are the same both before and after a reaction;\niii. Identification of the numbers and types of bonds (i.e., ionic, covalent) in both the reactants\nand the products;\niv. The patterns of reactivity (e.g., the high reactivity of alkali metals) at the macroscopic level\nas determined by using the periodic table; and\nv. The outermost (valence) electron configuration and the relative electronegativity of the atoms\nthat make up both the reactants and the products of the reaction based on their position in the\nperiodic table.","k":"Core"},{"c":"CHE-G9–10-T4-LO03","x":"3 Reasoning\na Students describe* their reasoning that connects the evidence, along with the assumption that theories\nand laws that describe their natural world operate today as they did in the past and will continue to\ndo so in the future, to construct an explanation for how the patterns of outermost electrons and the\nelectronegativity of elements can be used to predict the number and types of bonds each element forms.","k":"Core"},{"c":"CHE-G9–10-T4-LO04","x":"b In the explanation, students describe* the causal relationship between the observable macroscopic\npatterns of reactivity of elements in the periodic table and the patterns of outermost electrons for\neach atom and its relative electronegativity.","k":"Core"},{"c":"CHE-G9–10-T4-LO05","x":"4 Revising the explanation\na Given new evidence or context, students construct a revised or expanded explanation about the outcome\nof a chemical reaction and justify the revision.\nFurthermore (UK Requirement):","k":"UK Requirement"}]},{"id":"SCI-G9-U14-L2","sub":"Science","g":9,"u":14,"un":"Chemical reactions — Part 1","l":2,"t":"Explaining reactions from outer electrons — Part 2","role":"Part 2 of 3","topic":"CHE-G9-10-T4","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 13. Science and Technology","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-CHEd-GRADE-9-10-YEAR 10-11","stmt":"Construct and revise an explanation for the outcome of a simple chemical reaction based on the outermost electron states of atoms, trends in the periodic table, and knowledge of the patterns of chemical properties; achieved through chemical reactivity of elements in relation to their position in the Periodic Table. Furthermore, explore the chemistry of acids including reactions with some metals and carbonates, and reduction and oxidation in terms of loss or gain of oxygen. Use pH as a measure of hydrogen ion concentration and its numerical scale, and describe and predict the products of electrolysis of molten ionic liquids and aqueous ionic solutions. [Clarification Statement: Examples of chemical reactions could include the reaction of sodium and chlorine, of carbon and oxygen, or of carbon and hydrogen.] [Assessment Boundary: Assessment is limited to chemical reactions involving main group elements and combustion reactions.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 31; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T4-LO06","x":"• predict and write word and symbol equations for the reaction of a dilute acid with a metal (salt + hydrogen) and with a carbonate (salt + water + carbon dioxide), and identify each product by its laboratory test","k":"UK Requirement"},{"c":"CHE-G9–10-T4-LO07","x":"• identify oxidation as the gain of oxygen and reduction as the loss of oxygen in a given equation, and name the substance oxidised and the substance reduced","k":"UK Requirement"},{"c":"CHE-G9–10-T4-LO08","x":"• state that pH measures the concentration of hydrogen ions in a solution, and use the numerical scale to compare two solutions, including that each whole pH unit is a tenfold change in hydrogen ion concentration","k":"UK Requirement"},{"c":"CHE-G9–10-T4-LO09","x":"• measure the pH of a solution with universal indicator or a pH probe and classify it as acidic, neutral or alkaline","k":"UK Requirement"},{"c":"CHE-G9–10-T4-LO10","x":"• predict and describe the products formed at each electrode when a molten ionic compound is electrolysed, naming the metal at the cathode and the non-metal at the anode","k":"UK Requirement"}]},{"id":"SCI-G9-U14-L3","sub":"Science","g":9,"u":14,"un":"Chemical reactions — Part 1","l":3,"t":"Explaining reactions from outer electrons — Part 3","role":"Part 3 of 3","topic":"CHE-G9-10-T4","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 13. Science and Technology","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-CHEd-GRADE-9-10-YEAR 10-11","stmt":"Construct and revise an explanation for the outcome of a simple chemical reaction based on the outermost electron states of atoms, trends in the periodic table, and knowledge of the patterns of chemical properties; achieved through chemical reactivity of elements in relation to their position in the Periodic Table. Furthermore, explore the chemistry of acids including reactions with some metals and carbonates, and reduction and oxidation in terms of loss or gain of oxygen. Use pH as a measure of hydrogen ion concentration and its numerical scale, and describe and predict the products of electrolysis of molten ionic liquids and aqueous ionic solutions. [Clarification Statement: Examples of chemical reactions could include the reaction of sodium and chlorine, of carbon and oxygen, or of carbon and hydrogen.] [Assessment Boundary: Assessment is limited to chemical reactions involving main group elements and combustion reactions.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 31; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T4-LO11","x":"• predict and describe the products formed at each electrode when an aqueous ionic solution is electrolysed, applying the rules that hydrogen is released at the cathode unless the metal is less reactive than hydrogen, and that a halogen is released at the anode from a concentrated halide solution, otherwise oxygen","k":"UK Requirement"}]},{"id":"SCI-G9-U14-L4","sub":"Science","g":9,"u":14,"un":"Chemical reactions — Part 1","l":4,"t":"Changing conditions and reaction rate","role":"Single lesson","topic":"CHE-G9-10-T6","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"","pis":"","cls":"Core","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-CHEf-GRADE-9-10-YEAR 10-11","stmt":"Apply scientific principles and evidence to provide an explanation about the effects of changing the temperature or concentration of the reacting particles on the rate at which a reaction occurs. Explore the effect of changing the surface area of a solid reactant or by adding a catalyst [Clarification Statement: Emphasis is on student reasoning that focuses on the number and energy of collisions between molecules.] [Assessment Boundary: Assessment is limited to simple reactions in which there are only two reactants; evidence from temperature, concentration, and rate data; and qualitative relationships between rate and temperature.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 32; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T6-LO01","x":"1 Articulating the explanation of phenomena\na Students construct an explanation that includes the idea that as the kinetic energy of colliding\nparticles increases and the number of collisions increases, the reaction rate increases.","k":"Core"},{"c":"CHE-G9–10-T6-LO02","x":"2 Evidence\na Students identify and describe* evidence to construct the explanation, including:\ni. Evidence (e.g., from a table of data) of a pattern that increases in concentration (e.g., a\nchange in one concentration while the other concentration is held constant) increase the\nreaction rate, and vice versa; and\nii. Evidence of a pattern that increases in temperature usually increase the reaction rate, and vice\nversa.","k":"Core"},{"c":"CHE-G9–10-T6-LO03","x":"3 Reasoning\na Students use and describe* the following chain of reasoning that integrates evidence, facts, and\nscientific principles to construct the explanation:\ni. Molecules that collide can break bonds and form new bonds, producing new molecules.\nii. The probability of bonds breaking in the collision depends on the kinetic energy of the\ncollision being sufficient to break the bond, since bond breaking requires energy.\niii. Since temperature is a measure of average kinetic energy, a higher temperature means that\nmolecular collisions will, on average, be more likely to break bonds and form new bonds.\niv. At a fixed concentration, molecules that are moving faster also collide more frequently, so\nmolecules with higher kinetic energy are likely to collide more often.\nv. A high concentration means that there are more molecules in a given volume and thus more\nparticle collisions per unit of time at the same temperature.","k":"Core"}]},{"id":"SCI-G9-U14-L5","sub":"Science","g":9,"u":14,"un":"Chemical reactions — Part 1","l":5,"t":"Conservation of mass in chemical reactions — Part 1","role":"Part 1 of 2","topic":"CHE-G9-10-T8","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories, 13. Science and Technology","tim":"","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-CHEh-GRADE-9-10-YEAR 10-11","stmt":"Use mathematical representations to support the claim that atoms, and therefore mass, are conserved during a chemical reaction; achieved through balanced chemical equations, ionic equations and state symbols and their quantitative interpretation. Furthermore, determination of empirical formulae, the number of particles in a given mass, and concentrations of solutions in relation to mass of solute and volume of solvent. [Clarification Statement: Emphasis is on using mathematical ideas to communicate the proportional relationships between masses of atoms in the reactants and the products, and the translation of these relationships to the macroscopic scale using the mole as the conversion from the atomic to the macroscopic scale. Emphasis is on assessing students’ use of mathematical thinking and not on memorization and rote application of problem-solving techniques.] [Assessment Boundary: Assessment does not include complex chemical reactions.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 33; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T8-LO01","x":"1 Representation\na Students identify and describe* the relevant components in the mathematical representations:","k":"Core"},{"c":"CHE-G9–10-T8-LO02","x":"i. Quantities of reactants and products of a chemical reaction in terms of atoms, moles, and mass;\nii. Molar mass of all components of the reaction;\niii. Use of balanced chemical equation(s); and\niv. Identification of the claim that atoms, and therefore mass, are conserved during a chemical\nreaction.","k":"Core"},{"c":"CHE-G9–10-T8-LO03","x":"b The mathematical representations may include numerical calculations, graphs, or other pictorial\ndepictions of quantitative information.\nc Students identify the claim to be supported: that atoms, and therefore mass, are conserved during a\nchemical reaction.","k":"Core"},{"c":"CHE-G9–10-T8-LO04","x":"2 Mathematical modeling\na Students use the mole to convert between the atomic and macroscopic scale in the analysis.","k":"Core"},{"c":"CHE-G9–10-T8-LO05","x":"b Given a chemical reaction, students use the mathematical representations to\ni. Predict the relative number of atoms in the reactants versus the products at the atomic\nmolecular scale; and\nii. Calculate the mass of any component of a reaction, given any other component.","k":"Core"}]},{"id":"SCI-G9-U15-L1","sub":"Science","g":9,"u":15,"un":"Chemical reactions — Part 2","l":1,"t":"Conservation of mass in chemical reactions — Part 2","role":"Part 2 of 2","topic":"CHE-G9-10-T8","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories, 13. Science and Technology","tim":"","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-CHEh-GRADE-9-10-YEAR 10-11","stmt":"Use mathematical representations to support the claim that atoms, and therefore mass, are conserved during a chemical reaction; achieved through balanced chemical equations, ionic equations and state symbols and their quantitative interpretation. Furthermore, determination of empirical formulae, the number of particles in a given mass, and concentrations of solutions in relation to mass of solute and volume of solvent. [Clarification Statement: Emphasis is on using mathematical ideas to communicate the proportional relationships between masses of atoms in the reactants and the products, and the translation of these relationships to the macroscopic scale using the mole as the conversion from the atomic to the macroscopic scale. Emphasis is on assessing students’ use of mathematical thinking and not on memorization and rote application of problem-solving techniques.] [Assessment Boundary: Assessment does not include complex chemical reactions.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 33; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T8-LO06","x":"3 Analysis\na Students describe* how the mathematical representations (e.g., stoichiometric calculations to show\nthat the number of atoms or number of moles is unchanged after a chemical reaction where a specific\nmass of reactant is converted to product) support the claim that atoms, and therefore mass, are\nconserved during a chemical reaction.","k":"Core"},{"c":"CHE-G9–10-T8-LO07","x":"b Students describe* how the mass of a substance can be used to determine the number of atoms,\nmolecules, or ions using moles and mole relationships (e.g., macroscopic to atomic molecular scale\nconversion using the number of moles and Avogadro’s number).\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"CHE-G9–10-T8-LO08","x":"• determine the empirical formula of a compound from the masses of the elements that combine, by converting each mass to moles and finding the simplest whole-number ratio","k":"UK Requirement"},{"c":"CHE-G9–10-T8-LO09","x":"• calculate the number of particles in a given mass of a substance using the mole and the Avogadro constant, and the mass that contains a given number of particles","k":"UK Requirement"},{"c":"CHE-G9–10-T8-LO10","x":"• calculate the concentration of a solution in grams per cubic decimetre and in moles per cubic decimetre from the mass of solute and the volume of solution, and use it to find an unknown mass or volume","k":"UK Requirement"}]},{"id":"SCI-G9-U16-L1","sub":"Science","g":9,"u":16,"un":"Matter & materials","l":1,"t":"Bulk properties and electrical forces between particles — Part 1","role":"Part 1 of 3","topic":"CHE-G9-10-T2","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Matter & materials","seg":"Exact top-level parsing","code":"ADEK-Science-CHEb-GRADE-9-10-YEAR 10-11","stmt":"Plan and conduct an investigation to gather evidence to compare the structure of substances at the bulk scale to infer the strength of electrical forces between particles; achieved through changes of state in terms of particle kinetics and the relative strength of bonds and intermolecular forces, and bulk properties related to bonding. Furthermore, explore the types of chemical bonding: ionic, covalent and metallic; relate models of arrangements and motions of the molecules in solid, liquid and gas phases to their densities; and describe melting, evaporation, and sublimation as reversible changes [Clarification Statement: Emphasis is on understanding the strengths of forces between particles, not on naming specific intermolecular forces (such as dipole-dipole). Examples of particles could include ions, atoms, molecules, and networked materials (such as graphite). Examples of bulk properties of substances could include the melting point and boiling point, vapor pressure, and surface tension.] [Assessment Boundary: Assessment does not include Raoult’s law calculations of vapor pressure.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 30; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T2-LO01","x":"1 Identifying the phenomenon to be investigated\na Students describe* the phenomenon under investigation, which includes the following idea: the\nrelationship between the measurable properties (e.g., melting point, boiling point, vapor pressure,\nsurface tension) of a substance and the strength of the electrical forces between the particles of the\nsubstance.","k":"Core"},{"c":"CHE-G9–10-T2-LO02","x":"2 Identifying the evidence to answer this question\na Students develop an investigation plan and describe* the data that will be collected and the evidence\nto be derived from the data, including bulk properties of a substance (e.g., melting point and boiling\npoint, volatility, surface tension) that would allow inferences to be made about the strength of\nelectrical forces between particles.","k":"Core"},{"c":"CHE-G9–10-T2-LO03","x":"b Students describe* why the data about bulk properties would provide information about strength of the\nelectrical forces between the particles of the chosen substances, including the following\ndescriptions*:\ni. The spacing of the particles of the chosen substances can change as a result of the experimental\nprocedure even if the identity of the particles does not change (e.g., when water is boiled the\nmolecules are still present but further apart).\nii. Thermal (kinetic) energy has an effect on the ability of the electrical attraction between\nparticles to keep the particles close together. Thus, as more energy is added to the system, the\nforces of attraction between the particles can no longer keep the particles close together.\niii. The patterns of interactions between particles at the molecular scale are reflected in the\npatterns of behavior at the macroscopic scale.\niv. Together, patterns observed at multiple scales can provide evidence of the causal relationships\nbetween the strength of the electrical forces between particles and the structure of substances\nat the bulk scale.","k":"Core"},{"c":"CHE-G9–10-T2-LO04","x":"3 Planning for the investigation\na In the investigation plan, students include:\ni. A rationale for the choice of substances to compare and a description* of the composition of\nthose substances at the atomic molecular scale.\nii. A description* of how the data will be collected, the number of trials, and the experimental set\nup and equipment required.","k":"Core"},{"c":"CHE-G9–10-T2-LO05","x":"b Students describe* how the data will be collected, the number of trials, the experimental set up, and\nthe equipment required.","k":"Core"}]},{"id":"SCI-G9-U16-L2","sub":"Science","g":9,"u":16,"un":"Matter & materials","l":2,"t":"Bulk properties and electrical forces between particles — Part 2","role":"Part 2 of 3","topic":"CHE-G9-10-T2","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Matter & materials","seg":"Exact top-level parsing","code":"ADEK-Science-CHEb-GRADE-9-10-YEAR 10-11","stmt":"Plan and conduct an investigation to gather evidence to compare the structure of substances at the bulk scale to infer the strength of electrical forces between particles; achieved through changes of state in terms of particle kinetics and the relative strength of bonds and intermolecular forces, and bulk properties related to bonding. Furthermore, explore the types of chemical bonding: ionic, covalent and metallic; relate models of arrangements and motions of the molecules in solid, liquid and gas phases to their densities; and describe melting, evaporation, and sublimation as reversible changes [Clarification Statement: Emphasis is on understanding the strengths of forces between particles, not on naming specific intermolecular forces (such as dipole-dipole). Examples of particles could include ions, atoms, molecules, and networked materials (such as graphite). Examples of bulk properties of substances could include the melting point and boiling point, vapor pressure, and surface tension.] [Assessment Boundary: Assessment does not include Raoult’s law calculations of vapor pressure.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 30; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T2-LO06","x":"4 Collecting the data\na Students collect and record data — quantitative and/or qualitative — on the bulk properties of\nsubstances.","k":"Core"},{"c":"CHE-G9–10-T2-LO07","x":"5 Refining the design\na Students evaluate their investigation, including evaluation of:\ni. Assessing the accuracy and precision of the data collected, as well as the limitations of the\ninvestigation; and\nii. The ability of the data to provide the evidence required.","k":"Core"},{"c":"CHE-G9–10-T2-LO08","x":"b If necessary, students refine the plan to produce more accurate, precise, and useful data.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"CHE-G9–10-T2-LO09","x":"• describe and distinguish ionic, covalent and metallic bonding in terms of the particles involved and the electrical attraction between them","k":"UK Requirement"},{"c":"CHE-G9–10-T2-LO10","x":"• relate a model of the arrangement and motion of molecules in the solid, liquid and gas phases to the density of each phase, and use the model to account for the density order observed","k":"UK Requirement"}]},{"id":"SCI-G9-U16-L3","sub":"Science","g":9,"u":16,"un":"Matter & materials","l":3,"t":"Bulk properties and electrical forces between particles — Part 3","role":"Part 3 of 3","topic":"CHE-G9-10-T2","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Matter & materials","seg":"Exact top-level parsing","code":"ADEK-Science-CHEb-GRADE-9-10-YEAR 10-11","stmt":"Plan and conduct an investigation to gather evidence to compare the structure of substances at the bulk scale to infer the strength of electrical forces between particles; achieved through changes of state in terms of particle kinetics and the relative strength of bonds and intermolecular forces, and bulk properties related to bonding. Furthermore, explore the types of chemical bonding: ionic, covalent and metallic; relate models of arrangements and motions of the molecules in solid, liquid and gas phases to their densities; and describe melting, evaporation, and sublimation as reversible changes [Clarification Statement: Emphasis is on understanding the strengths of forces between particles, not on naming specific intermolecular forces (such as dipole-dipole). Examples of particles could include ions, atoms, molecules, and networked materials (such as graphite). Examples of bulk properties of substances could include the melting point and boiling point, vapor pressure, and surface tension.] [Assessment Boundary: Assessment does not include Raoult’s law calculations of vapor pressure.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 30; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T2-LO11","x":"• describe melting, evaporation and sublimation as reversible changes in which the particles themselves are unchanged and only their spacing and motion alter","k":"UK Requirement"},{"c":"CHE-G9–10-T2-LO12","x":"• predict the bulk properties of a given substance — for example sodium chloride, iodine, copper or graphite — from the bonding and structure supplied for it","k":"UK Requirement"}]},{"id":"SCI-G9-U16-L4","sub":"Science","g":9,"u":16,"un":"Matter & materials","l":4,"t":"Pure and impure substances; separation techniques — Part 1","role":"Part 1 of 2","topic":"CHE-G9-10-T10","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Matter & materials","seg":"Exact top-level parsing","code":"ADEK-Science-CHEk-GRADE-9-10-YEAR 10-11","stmt":"Distinguish between pure and impure substances; select and apply separation techniques for mixtures - filtration, crystallisation, chromatography, simple and fractional distillation; and identify common gases using standard laboratory tests.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 34; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T10-LO01","x":"Furthermore (UK Requirement):\n• distinguish a pure substance from an impure one, using the evidence that a pure substance melts and boils at a single fixed temperature while a mixture melts or boils over a range","k":"UK Requirement"},{"c":"CHE-G9–10-T10-LO02","x":"• interpret a heating or cooling curve to decide whether a sample is pure, identifying the flat section as the melting or boiling point","k":"UK Requirement"},{"c":"CHE-G9–10-T10-LO03","x":"• select the appropriate separation technique for a given mixture — filtration, crystallisation, chromatography, simple distillation or fractional distillation — and justify the choice by naming the physical property it exploits","k":"UK Requirement"},{"c":"CHE-G9–10-T10-LO04","x":"• carry out each technique safely and correctly, using the apparatus in the right arrangement and describing what is collected at each stage","k":"UK Requirement"},{"c":"CHE-G9–10-T10-LO05","x":"• explain how fractional distillation separates two miscible liquids with different boiling points, and why a fractionating column is needed where simple distillation would not succeed","k":"UK Requirement"}]},{"id":"SCI-G9-U16-L5","sub":"Science","g":9,"u":16,"un":"Matter & materials","l":5,"t":"Pure and impure substances; separation techniques — Part 2","role":"Part 2 of 2","topic":"CHE-G9-10-T10","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Matter & materials","seg":"Exact top-level parsing","code":"ADEK-Science-CHEk-GRADE-9-10-YEAR 10-11","stmt":"Distinguish between pure and impure substances; select and apply separation techniques for mixtures - filtration, crystallisation, chromatography, simple and fractional distillation; and identify common gases using standard laboratory tests.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 34; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T10-LO06","x":"• interpret a chromatogram, calculate an Rf value as the distance moved by the spot divided by the distance moved by the solvent front, and use it to compare an unknown with known reference substances","k":"UK Requirement"},{"c":"CHE-G9–10-T10-LO07","x":"• identify hydrogen, oxygen, carbon dioxide, chlorine and ammonia using the standard laboratory tests, stating both the procedure and the positive result for each","k":"UK Requirement"}]},{"id":"SCI-G9-U17-L1","sub":"Science","g":9,"u":17,"un":"Electric circuits","l":1,"t":"Resistance, current and potential difference — Part 1","role":"Part 1 of 2","topic":"PHY-G9-10-T11","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Electric circuits","seg":"Exact top-level parsing","code":"ADEK-Science-PHYk-GRADE-9-10-YEAR 10-11","stmt":"Measure resistance using p.d. and current measurements; explore and represent graphically the current, resistance and voltage relationships for different circuit elements; and calculate the quantity of charge flowing as the product of current and time.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 38; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T11-LO01","x":"Furthermore (UK Requirement):\n• set up a circuit with an ammeter in series and a voltmeter in parallel with a component, and measure the potential difference across it and the current through it","k":"UK Requirement"},{"c":"PHY-G9–10-T11-LO02","x":"• calculate the resistance of a component from paired readings using R = V / I, and state the unit","k":"UK Requirement"},{"c":"PHY-G9–10-T11-LO03","x":"• obtain a set of paired current and potential difference readings for a component across a range of values, including reversed polarity, and plot them as a graph","k":"UK Requirement"},{"c":"PHY-G9–10-T11-LO04","x":"• interpret the graph for a fixed resistor, a filament lamp and a diode, describing the shape of each and what it shows about how the resistance of that component changes","k":"UK Requirement"},{"c":"PHY-G9–10-T11-LO05","x":"• explain why a straight line through the origin means constant resistance, and why a curve does not, using calculated values of V / I at two points as evidence","k":"UK Requirement"}]},{"id":"SCI-G9-U17-L2","sub":"Science","g":9,"u":17,"un":"Electric circuits","l":2,"t":"Resistance, current and potential difference — Part 2","role":"Part 2 of 2","topic":"PHY-G9-10-T11","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Electric circuits","seg":"Exact top-level parsing","code":"ADEK-Science-PHYk-GRADE-9-10-YEAR 10-11","stmt":"Measure resistance using p.d. and current measurements; explore and represent graphically the current, resistance and voltage relationships for different circuit elements; and calculate the quantity of charge flowing as the product of current and time.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 38; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T11-LO06","x":"• calculate the quantity of charge that flows past a point as the product of current and time, Q = I x t, with the unit of each quantity stated","k":"UK Requirement"}]},{"id":"SCI-G9-U18-L1","sub":"Science","g":9,"u":18,"un":"Energy stores & transfers","l":1,"t":"Computational models of energy change — Part 1","role":"Part 1 of 2","topic":"PHY-G9-10-T4","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Energy stores & transfers","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYd-GRADE-9-10-YEAR 10-11","stmt":"Create a computational model to calculate the change in the energy of one component in a system when the change in energy of the other component(s) and energy flows in and out of the system are known; achieved through calculating stored energies and energy changes involving heating, mechanical work and electrical work, and conservation of energy in a closed system with dissipation. Furthermore, power as the rate of transfer of energy. [Clarification Statement: Emphasis is on explaining the meaning of mathematical expressions used in the model.] [Assessment Boundary: Assessment is limited to basic algebraic expressions or computations; to systems of two or three components; and to thermal energy, kinetic energy, and/or the energies in gravitational, magnetic, or electric fields.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 36; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T4-LO01","x":"1 Representation\na Students identify and describe* the components to be computationally modeled, including:\ni. The boundaries of the system and that the reference level for potential energy = 0 (the\npotential energy of the initial or final state does not have to be zero);\nii. The initial energies of the system’s components (e.g., energy in fields, thermal energy, kinetic\nenergy, energy stored in springs — all expressed as a total amount of Joules in each component),\nincluding a quantification in an algebraic description to calculate the total initial energy of\nthe system;\niii. The energy flows in or out of the system, including a quantification in an algebraic description\nwith flow into the system defined as positive; and\niv. The final energies of the system components, including a quantification in an algebraic\ndescription to calculate the total final energy of the system.","k":"Core"},{"c":"PHY-G9–10-T4-LO02","x":"2 Computational Modeling\na Students use the algebraic descriptions of the initial and final energy state of the system, along\nwith the energy flows to create a computational model (e.g., simple computer program, spreadsheet,\nsimulation software package application) that is based on the principle of the conservation of energy.","k":"Core"},{"c":"PHY-G9–10-T4-LO03","x":"b Students use the computational model to calculate changes in the energy of one component of the system\nwhen changes in the energy of the other components and the energy flows are known.","k":"Core"},{"c":"PHY-G9–10-T4-LO04","x":"3 Analysis\na Students use the computational model to predict the maximum possible change in the energy of one\ncomponent of the system for a given set of energy flows.","k":"Core"},{"c":"PHY-G9–10-T4-LO05","x":"b Students identify and describe* the limitations of the computational model, based on the assumptions\nthat were made in creating the algebraic descriptions of energy changes and flows in the system.\nFurthermore (UK Requirement):","k":"UK Requirement"}]},{"id":"SCI-G9-U18-L2","sub":"Science","g":9,"u":18,"un":"Energy stores & transfers","l":2,"t":"Computational models of energy change — Part 2","role":"Part 2 of 2","topic":"PHY-G9-10-T4","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Energy stores & transfers","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYd-GRADE-9-10-YEAR 10-11","stmt":"Create a computational model to calculate the change in the energy of one component in a system when the change in energy of the other component(s) and energy flows in and out of the system are known; achieved through calculating stored energies and energy changes involving heating, mechanical work and electrical work, and conservation of energy in a closed system with dissipation. Furthermore, power as the rate of transfer of energy. [Clarification Statement: Emphasis is on explaining the meaning of mathematical expressions used in the model.] [Assessment Boundary: Assessment is limited to basic algebraic expressions or computations; to systems of two or three components; and to thermal energy, kinetic energy, and/or the energies in gravitational, magnetic, or electric fields.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 36; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T4-LO06","x":"• calculate stored energies and energy changes for heating, for mechanical work and for electrical work, using the appropriate relationship in each case","k":"UK Requirement"},{"c":"PHY-G9–10-T4-LO07","x":"• account for the energy of a closed system in which some energy is dissipated, showing that the total is conserved while the useful share falls","k":"UK Requirement"},{"c":"PHY-G9–10-T4-LO08","x":"• define power as the rate of transfer of energy and calculate it from the energy transferred and the time taken","k":"UK Requirement"},{"c":"PHY-G9–10-T4-LO09","x":"• compare two transfers by their power rather than by their total energy, and say what the comparison tells a designer","k":"UK Requirement"}]},{"id":"SCI-G9-U18-L3","sub":"Science","g":9,"u":18,"un":"Energy stores & transfers","l":3,"t":"Designing a device that converts energy — Part 1","role":"Part 1 of 2","topic":"PHY-G9-10-T6","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Energy stores & transfers","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYf-GRADE-9-10-YEAR 10-11","stmt":"Design, build and refine a device that works within given constraints to convert one form of energy into another form of energy; achieved through calculating energy efficiency for any energy transfer. Furthermore, explore renewable and non-renewable energy sources used on Earth and changes in how these are used. [Clarification Statement: Emphasis is on both qualitative and quantitative evaluations of devices. Examples of devices could include Rube Goldberg devices, wind turbines, solar cells, solar ovens, and generators. Examples of constraints could include use of renewable energy forms and efficiency.] [Assessment Boundary: Assessment for quantitative evaluations is limited to total output for a given input. Assessment is limited to devices constructed with materials provided to students.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 37; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T6-LO01","x":"1 Using scientific knowledge to generate the design solution\na Students design a device that converts one form of energy into another form of energy.","k":"Core"},{"c":"PHY-G9–10-T6-LO02","x":"b Students develop a plan for the device in which they:\ni. Identify what scientific principles provide the basis for the energy conversion design;\nii. Identify the forms of energy that will be converted from one form to another in the designed\nsystem;\niii. Identify losses of energy by the design system to the surrounding environment;\niv. Describe* the scientific rationale for choices of materials and structure of the device,\nincluding how student-generated evidence influenced the design; and\nv. Describe* that this device is an example of how the application of scientific knowledge and\nengineering design can increase benefits for modern civilization while decreasing costs and\nrisk.","k":"Core"},{"c":"PHY-G9–10-T6-LO03","x":"2 Describing criteria and constraints, including quantification when appropriate\na Students describe* and quantify (when appropriate) prioritized criteria and constraints for the design\nof the device, along with the tradeoffs implicit in these design solutions. Examples of constraints to\nbe considered are cost and efficiency of energy conversion.","k":"Core"},{"c":"PHY-G9–10-T6-LO04","x":"3 Evaluating potential solutions\na Students build and test the device according to the plan.","k":"Core"},{"c":"PHY-G9–10-T6-LO05","x":"b Students systematically and quantitatively evaluate the performance of the device against the criteria\nand constraints.","k":"Core"}]},{"id":"SCI-G9-U18-L4","sub":"Science","g":9,"u":18,"un":"Energy stores & transfers","l":4,"t":"Designing a device that converts energy — Part 2","role":"Part 2 of 2","topic":"PHY-G9-10-T6","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"4. Energy","dom":"Physical Sciences — Physics","area":"Energy stores & transfers","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYf-GRADE-9-10-YEAR 10-11","stmt":"Design, build and refine a device that works within given constraints to convert one form of energy into another form of energy; achieved through calculating energy efficiency for any energy transfer. Furthermore, explore renewable and non-renewable energy sources used on Earth and changes in how these are used. [Clarification Statement: Emphasis is on both qualitative and quantitative evaluations of devices. Examples of devices could include Rube Goldberg devices, wind turbines, solar cells, solar ovens, and generators. Examples of constraints could include use of renewable energy forms and efficiency.] [Assessment Boundary: Assessment for quantitative evaluations is limited to total output for a given input. Assessment is limited to devices constructed with materials provided to students.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 37; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T6-LO06","x":"4 Refining and/or optimizing the design solution\na Students use the results of the tests to improve the device performance by increasing the efficiency\nof energy conversion, keeping in mind the criteria and constraints, and noting any modifications in\ntradeoffs.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"PHY-G9–10-T6-LO07","x":"• classify the energy resources used on Earth as renewable or non-renewable and state the basis of the classification","k":"UK Requirement"},{"c":"PHY-G9–10-T6-LO08","x":"• describe how the pattern of energy resource use has changed over time, and identify the reasons for the change","k":"UK Requirement"},{"c":"PHY-G9–10-T6-LO09","x":"• evaluate a renewable and a non-renewable resource for a stated use in the UAE, weighing reliability, cost and environmental effect","k":"UK Requirement"},{"c":"PHY-G9–10-T6-LO10","x":"• explain why a device built within a renewable-energy constraint may be less efficient yet still the better design choice","k":"UK Requirement"}]},{"id":"SCI-G9-U19-L1","sub":"Science","g":9,"u":19,"un":"Forces & motion","l":1,"t":"Newton's second law — Part 1","role":"Part 1 of 2","topic":"PHY-G9-10-T1","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"3. Forces and Motion","dom":"Physical Sciences — Physics","area":"Forces & motion","seg":"Exact top-level parsing","code":"ADEK-Science-PHYa-GRADE-9-10-YEAR 10-11","stmt":"Analyze data to support the claim that Newton's second law of motion describes the mathematical relationship among the net force on a macroscopic object, its mass, and its acceleration; achieved through acceleration caused by forces, Newton's First Law, and quantitative interpretation of distance-time and speed graphs. Furthermore, explore forces as vectors, and weight and gravitational field strength. [Clarification Statement: Examples of data could include tables or graphs of position or velocity as a function of time for objects subject to a net unbalanced force, such as a falling object, an object sliding down a ramp, or a moving object being pulled by a constant force.] [Assessment Boundary: Assessment is limited to one-dimensional motion and to macroscopic objects moving at non-relativistic speeds.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 35; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T1-LO01","x":"1 Organizing data\na Students organize data that represent the net force on a macroscopic object, its mass (which is held\nconstant), and its acceleration (e.g., via tables, graphs, charts, vector drawings).","k":"Core"},{"c":"PHY-G9–10-T1-LO02","x":"2 Identifying relationships\na Students use tools, technologies, and/or models to analyze the data and identify relationships within\nthe datasets, including:\ni. A more massive object experiencing the same net force as a less massive object has a smaller","k":"Core"},{"c":"PHY-G9–10-T1-LO03","x":"acceleration, and a larger net force on a given object produces a correspondingly larger\nacceleration; and\nii. The result of gravitation is a constant acceleration on macroscopic objects as evidenced by the\nfact that the ratio of net force to mass remains constant.","k":"Core"},{"c":"PHY-G9–10-T1-LO04","x":"3 Interpreting data\na Students use the analyzed data as evidence to describe* that the relationship between the observed\nquantities is accurately modeled across the range of data by the formula a = F net/m (e.g., double\nforce yields double acceleration, etc.).","k":"Core"},{"c":"PHY-G9–10-T1-LO05","x":"b Students use the data as empirical evidence to distinguish between causal and correlational\nrelationships linking force, mass, and acceleration.\nc Students express the relationship Fnet=ma in terms of causality, namely that a net force on an object\ncauses the object to accelerate.\nFurthermore (UK Requirement):","k":"UK Requirement"}]},{"id":"SCI-G9-U19-L2","sub":"Science","g":9,"u":19,"un":"Forces & motion","l":2,"t":"Newton's second law — Part 2","role":"Part 2 of 2","topic":"PHY-G9-10-T1","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"3. Forces and Motion","dom":"Physical Sciences — Physics","area":"Forces & motion","seg":"Exact top-level parsing","code":"ADEK-Science-PHYa-GRADE-9-10-YEAR 10-11","stmt":"Analyze data to support the claim that Newton's second law of motion describes the mathematical relationship among the net force on a macroscopic object, its mass, and its acceleration; achieved through acceleration caused by forces, Newton's First Law, and quantitative interpretation of distance-time and speed graphs. Furthermore, explore forces as vectors, and weight and gravitational field strength. [Clarification Statement: Examples of data could include tables or graphs of position or velocity as a function of time for objects subject to a net unbalanced force, such as a falling object, an object sliding down a ramp, or a moving object being pulled by a constant force.] [Assessment Boundary: Assessment is limited to one-dimensional motion and to macroscopic objects moving at non-relativistic speeds.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 35; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T1-LO06","x":"• represent a force as a vector with magnitude and direction, and find the resultant of two or more forces acting along the same straight line","k":"UK Requirement"},{"c":"PHY-G9–10-T1-LO07","x":"• calculate weight from W = mg and explain why mass is an unchanging property of an object while weight depends on the gravitational field the object sits in","k":"UK Requirement"},{"c":"PHY-G9–10-T1-LO08","x":"• state and use gravitational field strength g in N/kg, and show from free-fall data that the numerical value of g in N/kg equals the free-fall acceleration in m/s²","k":"UK Requirement"}]},{"id":"SCI-G9-U19-L3","sub":"Science","g":9,"u":19,"un":"Forces & motion","l":3,"t":"Pressure in fluids","role":"Single lesson","topic":"PHY-G9-10-T10","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"UK Requirement","big":"3. Forces and Motion","dom":"Physical Sciences — Physics","area":"Forces & motion","seg":"Exact top-level parsing","code":"ADEK-Science-PHYj-GRADE-9-10-YEAR 10-11","stmt":"Explain that pressure in fluids acts in all directions; describe its variation with height in the Earth's atmosphere and with depth in liquids; and explain up-thrust qualitatively.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 38; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T10-LO01","x":"Furthermore (UK Requirement):\n• explain that the pressure in a fluid at a point acts equally in all directions, and support the explanation with an observation such as water jetting horizontally from a side hole in a container","k":"UK Requirement"},{"c":"PHY-G9–10-T10-LO02","x":"• describe how the pressure of the Earth's atmosphere varies with height, and account for the variation by the weight of the air above","k":"UK Requirement"},{"c":"PHY-G9–10-T10-LO03","x":"• describe how the pressure in a liquid varies with depth, and account for the variation by the weight of the liquid above the point","k":"UK Requirement"},{"c":"PHY-G9–10-T10-LO04","x":"• state and apply the qualitative rule that pressure in a liquid depends on depth and on the density of the liquid, and not on the width or shape of the container","k":"UK Requirement"},{"c":"PHY-G9–10-T10-LO05","x":"• explain up-thrust qualitatively as the result of the pressure on the bottom of a submerged object being greater than the pressure on its top, and use it to predict whether an object will float or sink","k":"UK Requirement"}]},{"id":"SCI-G9-U20-L1","sub":"Science","g":9,"u":20,"un":"Waves, light & sound","l":1,"t":"Frequency, wavelength and wave speed — Part 1","role":"Part 1 of 2","topic":"PHY-G9-10-T7","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Waves, light & sound","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYg-GRADE-9-10-YEAR 10-11","stmt":"Use mathematical representations to support a claim regarding relationships among the frequency, wavelength, and speed of waves travelling in various media; achieved through amplitude, wavelength and frequency, relating velocity to frequency and wavelength. Explore transverse and longitudinal waves, and the speed of sound with estimation of speeds in everyday contexts. [Clarification Statement: Examples of data could include electromagnetic radiation traveling in a vacuum and glass, sound waves traveling through air and water, and seismic waves traveling through the Earth.] [Assessment Boundary: Assessment is limited to algebraic relationships and describing those relationships qualitatively.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 37; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T7-LO01","x":"1 Representation\na Students identify and describe* the relevant components in the mathematical representations:\ni. Mathematical values for frequency, wavelength, and speed of waves traveling in various specified\nmedia; and\nii. The relationships between frequency, wavelength, and speed of waves traveling in various\nspecified media.","k":"Core"},{"c":"PHY-G9–10-T7-LO02","x":"2 Mathematical modeling\na Students show that the product of the frequency and the wavelength of a particular type of wave in a\ngiven medium is constant, and identify this relationship as the wave speed according to the\nmathematical relationship 𝑣 = 𝑓𝜆.","k":"Core"},{"c":"PHY-G9–10-T7-LO03","x":"b Students use the data to show that the wave speed for a particular type of wave changes as the medium\nthrough which the wave travels changes.\nc Students predict the relative change in the wavelength of a wave when it moves from one medium to","k":"Core"},{"c":"PHY-G9–10-T7-LO04","x":"another (thus different wave speeds using the mathematical relationship 𝑣 = 𝑓𝜆). Students express the\nrelative change in terms of cause (different media) and effect (different wavelengths but same\nfrequency).","k":"Core"},{"c":"PHY-G9–10-T7-LO05","x":"3 Analysis\na Using the mathematical relationship 𝑣 = 𝑓𝜆, students assess claims about any of the three quantities\nwhen the other two quantities are known for waves travelling in various specified media.","k":"Core"}]},{"id":"SCI-G9-U20-L2","sub":"Science","g":9,"u":20,"un":"Waves, light & sound","l":2,"t":"Frequency, wavelength and wave speed — Part 2","role":"Part 2 of 2","topic":"PHY-G9-10-T7","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Waves, light & sound","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYg-GRADE-9-10-YEAR 10-11","stmt":"Use mathematical representations to support a claim regarding relationships among the frequency, wavelength, and speed of waves travelling in various media; achieved through amplitude, wavelength and frequency, relating velocity to frequency and wavelength. Explore transverse and longitudinal waves, and the speed of sound with estimation of speeds in everyday contexts. [Clarification Statement: Examples of data could include electromagnetic radiation traveling in a vacuum and glass, sound waves traveling through air and water, and seismic waves traveling through the Earth.] [Assessment Boundary: Assessment is limited to algebraic relationships and describing those relationships qualitatively.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 37; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T7-LO06","x":"b Students use the mathematical relationships to distinguish between cause and correlation with respect\nto the supported claims.","k":"Core"}]},{"id":"SCI-G9-U20-L3","sub":"Science","g":9,"u":20,"un":"Waves, light & sound","l":3,"t":"Devices that use waves — Part 1","role":"Part 1 of 2","topic":"PHY-G9-10-T9","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Waves, light & sound","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYi-GRADE-9-10-YEAR 10-11","stmt":"Communicate technical information about how some technological devices use the principles of wave behavior and wave interactions with matter to transmit and capture information and energy; achieved through electromagnetic waves and their vacuum velocity, energy transfer, and uses across the radio-to-gamma regions. Furthermore, explore velocities differing between media (absorption, reflection, refraction) and production and detection by electrical circuits or by changes in atoms and nuclei. [Clarification Statement: Examples could include solar cells capturing light and converting it to electricity; medical imaging; and communications technology.] [Assessment Boundary: Assessments are limited to qualitative information. Assessments do not include band theory.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 38; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T9-LO01","x":"1 Communication style and format\na Students use at least two different formats (e.g., oral, graphical, textual, and mathematical) to\ncommunicate technical information and ideas, including fully describing* at least two devices and the\nphysical principles upon which the devices depend. One of the devices must depend on the photoelectric\neffect for its operation. Students cite the origin of the information as appropriate.","k":"Core"},{"c":"PHY-G9–10-T9-LO02","x":"2 Connecting the DCIs and the CCCs\na When describing* how each device operates, students identify the wave behavior utilized by the device\nor the absorption of photons and production of electrons for devices that rely on the photoelectric","k":"Core"},{"c":"PHY-G9–10-T9-LO03","x":"effect, and qualitatively describe* how the basic physics principles were utilized in the design\nthrough research and development to produce this functionality (e.g., absorbing electromagnetic energy\nand converting it to thermal energy to heat an object; using the photoelectric effect to produce an\nelectric current).","k":"Core"},{"c":"PHY-G9–10-T9-LO04","x":"b For each device, students discuss the real-world problem it solves or need it addresses, and how\ncivilization now depends on the device.\nc Students identify and communicate the cause and effect relationships that are used to produce the\nfunctionality of the device.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"PHY-G9–10-T9-LO05","x":"• explain that the speed of an electromagnetic wave differs between media, and account for absorption, reflection and refraction at a boundary in terms of that change in speed","k":"UK Requirement"}]},{"id":"SCI-G9-U20-L4","sub":"Science","g":9,"u":20,"un":"Waves, light & sound","l":4,"t":"Devices that use waves — Part 2","role":"Part 2 of 2","topic":"PHY-G9-10-T9","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Waves, light & sound","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-PHYi-GRADE-9-10-YEAR 10-11","stmt":"Communicate technical information about how some technological devices use the principles of wave behavior and wave interactions with matter to transmit and capture information and energy; achieved through electromagnetic waves and their vacuum velocity, energy transfer, and uses across the radio-to-gamma regions. Furthermore, explore velocities differing between media (absorption, reflection, refraction) and production and detection by electrical circuits or by changes in atoms and nuclei. [Clarification Statement: Examples could include solar cells capturing light and converting it to electricity; medical imaging; and communications technology.] [Assessment Boundary: Assessments are limited to qualitative information. Assessments do not include band theory.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 38; ACS Sciences Mapping","los":[{"c":"PHY-G9–10-T9-LO06","x":"• describe how electromagnetic waves in the radio-to-microwave region are produced and detected by oscillations in electrical circuits","k":"UK Requirement"},{"c":"PHY-G9–10-T9-LO07","x":"• describe how radiation in the ultraviolet-to-gamma region is produced by and detected through changes in atoms and in atomic nuclei","k":"UK Requirement"}]},{"id":"SCI-G10-U1-L1","sub":"Science","g":10,"u":1,"un":"Earth's structure & processes","l":1,"t":"The carbon cycle across Earth's spheres","role":"Single lesson","topic":"ESS-G9-10-T6","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Earth's structure & processes","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSf-GRADE-9-10-YEAR 10-11","stmt":"Develop a model to describe the cycling of carbon among the hydrosphere, atmosphere, geosphere and biosphere, exploring potential effects of, and mitigation of, increased levels of carbon dioxide and methane on the Earth’s climate. [Clarification Statement: Emphasis is on modeling biogeochemical cycles that include the cycling of carbon through the ocean, atmosphere, soil, and biosphere (including humans), providing the foundation for living organisms.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 42; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T6-LO01","x":"1 Components of the model\na Students use evidence to develop a model in which they:\ni. Identify the relative concentrations of carbon present in the hydrosphere, atmosphere, geosphere\nand biosphere; and\nii. Represent carbon cycling from one sphere to another.","k":"Core"},{"c":"ESS-G9–10-T6-LO02","x":"2 Relationships\na In the model, students represent and describe* the following relationships between components of the\nsystem, including:\ni. The biogeochemical cycles that occur as carbon flows from one sphere to another;\nii. The relative amount of and the rate at which carbon is transferred between spheres;\niii. The capture of carbon dioxide by plants; and\niv. The increase in carbon dioxide concentration in the atmosphere due to human activity and the\neffect on climate.","k":"Core"},{"c":"ESS-G9–10-T6-LO03","x":"3 Connections\na Students use the model to explicitly identify the conservation of matter as carbon cycles through\nvarious components of Earth’s systems.","k":"Core"},{"c":"ESS-G9–10-T6-LO04","x":"b Students identify the limitations of the model in accounting for all of Earth’s carbon.","k":"Core"}]},{"id":"SCI-G10-U2-L1","sub":"Science","g":10,"u":2,"un":"Resources & human impact","l":1,"t":"Managing energy and mineral resources — Part 1","role":"Part 1 of 2","topic":"ESS-G9-10-T9","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology, 14. Science and Society","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Resources & human impact","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSi-GRADE-9-10-YEAR 10-11","stmt":"Evaluate competing design solutions for developing, managing and utilizing energy and mineral resources based on cost-benefit ratios; achieved through life cycle assessment and recycling to assess environmental impacts across a product's life and the viability of recycling. Furthermore, extraction and purification of metals related to the position of carbon in a reactivity series. [Clarification Statement: Emphasis is on the conservation, recycling, and reuse of resources (such as minerals and metals) where possible, and on minimizing impacts where it is not. Examples include developing best practices for agricultural soil use, mining (for coal, tar sands, and oil shales), and pumping (for petroleum and natural gas). Science knowledge indicates what can happen in natural systems—not what should happen.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 43; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T9-LO01","x":"1 Supported claims\na Students describe* the nature of the problem each design solution addresses.","k":"Core"},{"c":"ESS-G9–10-T9-LO02","x":"b Students identify the solution that has the most preferred cost-benefit ratios.","k":"Core"},{"c":"ESS-G9–10-T9-LO03","x":"2 Identifying scientific evidence\na Students identify evidence for the design solutions, including:\ni. Societal needs for that energy or mineral resource;\nii. The cost of extracting or developing the energy reserve or mineral resource;\niii. The costs and benefits of the given design solutions; and\niv. The feasibility, costs, and benefits of recycling or reusing the mineral resource, if\napplicable.","k":"Core"},{"c":"ESS-G9–10-T9-LO04","x":"3 Evaluation and critique\na Students evaluate the given design solutions, including:\ni. The relative strengths of the given design solutions, based on associated economic,\nenvironmental, and geopolitical costs, risks, and benefits;\nii. The reliability and validity of the evidence used to evaluate the design solutions; and\niii. Constraints, including cost, safety, reliability, aesthetics, cultural effects environmental\neffects.","k":"Core"},{"c":"ESS-G9–10-T9-LO05","x":"4 Reasoning/synthesis\na Students use logical arguments based on their evaluation of the design solutions, costs and benefits,\nempirical evidence, and scientific ideas to support one design over the other(s) in their evaluation.","k":"Core"}]},{"id":"SCI-G10-U2-L2","sub":"Science","g":10,"u":2,"un":"Resources & human impact","l":2,"t":"Managing energy and mineral resources — Part 2","role":"Part 2 of 2","topic":"ESS-G9-10-T9","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology, 14. Science and Society","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Resources & human impact","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSi-GRADE-9-10-YEAR 10-11","stmt":"Evaluate competing design solutions for developing, managing and utilizing energy and mineral resources based on cost-benefit ratios; achieved through life cycle assessment and recycling to assess environmental impacts across a product's life and the viability of recycling. Furthermore, extraction and purification of metals related to the position of carbon in a reactivity series. [Clarification Statement: Emphasis is on the conservation, recycling, and reuse of resources (such as minerals and metals) where possible, and on minimizing impacts where it is not. Examples include developing best practices for agricultural soil use, mining (for coal, tar sands, and oil shales), and pumping (for petroleum and natural gas). Science knowledge indicates what can happen in natural systems—not what should happen.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 43; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T9-LO06","x":"b Students describe* that a decision on the “best” solution may change over time as engineers and\nscientists work to increase the benefits of design solutions while decreasing costs and risks.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"ESS-G9–10-T9-LO07","x":"• relate the method used to extract a metal to the position of that metal relative to carbon in the reactivity series","k":"UK Requirement"},{"c":"ESS-G9–10-T9-LO08","x":"• explain, with a word equation, the reduction of a metal oxide by carbon for metals less reactive than carbon, such as iron oxide in the blast furnace","k":"UK Requirement"},{"c":"ESS-G9–10-T9-LO09","x":"• explain why metals more reactive than carbon, such as aluminium, must be extracted by electrolysis of the molten compound, and why this makes them expensive in energy terms","k":"UK Requirement"},{"c":"ESS-G9–10-T9-LO10","x":"• explain how purification and recycling of a metal avoids most of the extraction energy, and use that to strengthen a cost-benefit argument","k":"UK Requirement"}]},{"id":"SCI-G10-U3-L1","sub":"Science","g":10,"u":3,"un":"Space & the solar system","l":1,"t":"The solar system and our place in the Universe — Part 1","role":"Part 1 of 2","topic":"ESS-G9-10-T2","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core* + US Requirement","big":"6. The Universe","dom":"Earth & Space Sciences","area":"Space & the solar system","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSb-GRADE-9-10-YEAR 10-11","stmt":"Describe the main features of the solar system, the phases of the Moon, and the place of the solar system within the Milky Way and in relation to other galaxies. In addition, use mathematical or computational representations to predict the motion of orbiting objects in the solar system, including planets, moons and human-made satellites. [Clarification Statement: Emphasis is on Newtonian gravitational laws governing orbital motions, which apply to human-made satellites as well as planets and moons.] [Assessment Boundary: Mathematical representations for the gravitational attraction of bodies and Kepler's laws of orbital motions should not deal with more than two bodies, nor involve calculus.]","pdfm":["Core* in ADEK PDF: required for TIMSS/PISA; framework-specific attribution not stated"],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 40; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T2-LO01","x":"1 Representation\na Students identify and describe* the following relevant components in the given mathematical or\ncomputational representations of orbital motion: the trajectories of orbiting bodies, including\nplanets, moons, or human-made spacecraft; each of which depicts a revolving body’s eccentricity e =\nf/d, where f is the distance between foci of an ellipse, and d is the ellipse’s major axis length\n(Kepler’s first law of planetary motion).","k":"Core"},{"c":"ESS-G9–10-T2-LO02","x":"2 Mathematical or computational modeling\na Students use the given mathematical or computational representations of orbital motion to depict that\nthe square of a revolving body’s period of revolution is proportional to the cube of its distance to a\ngravitational center ( 𝑇 2 ∝ 𝑅 3 , where T is the orbital period and R is the semi- major axis of the\norbit — Kepler’s third law of planetary motion).","k":"Core"},{"c":"ESS-G9–10-T2-LO03","x":"3 Analysis\na Students use the given mathematical or computational representation of Kepler’s second law of\nplanetary motion (an orbiting body sweeps out equal areas in equal time) to predict the relationship\nbetween the distance between an orbiting body and its star, and the object’s orbital velocity (i.e.,\nthat the closer an orbiting body is to a star, the larger its orbital velocity will be).","k":"Core"},{"c":"ESS-G9–10-T2-LO04","x":"b Students use the given mathematical or computational representation of Kepler’s third law of planetary\nmotion (𝑇 2 ∝ 𝑅 3 , where T is the orbital period and R is the semi-major axis of the orbit) to\npredict how either the orbital distance or orbital period changes given a change in the other\nvariable.","k":"Core"},{"c":"ESS-G9–10-T2-LO05","x":"c Students use Newton’s law of gravitation plus his third law of motion to predict how the acceleration\nof a planet towards the sun varies with its distance from the sun, and to argue qualitatively about\nhow this relates to the observed orbits.\nIn addition (US Requirement):","k":"US Requirement"}]},{"id":"SCI-G10-U3-L2","sub":"Science","g":10,"u":3,"un":"Space & the solar system","l":2,"t":"The solar system and our place in the Universe — Part 2","role":"Part 2 of 2","topic":"ESS-G9-10-T2","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core* + US Requirement","big":"6. The Universe","dom":"Earth & Space Sciences","area":"Space & the solar system","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSb-GRADE-9-10-YEAR 10-11","stmt":"Describe the main features of the solar system, the phases of the Moon, and the place of the solar system within the Milky Way and in relation to other galaxies. In addition, use mathematical or computational representations to predict the motion of orbiting objects in the solar system, including planets, moons and human-made satellites. [Clarification Statement: Emphasis is on Newtonian gravitational laws governing orbital motions, which apply to human-made satellites as well as planets and moons.] [Assessment Boundary: Mathematical representations for the gravitational attraction of bodies and Kepler's laws of orbital motions should not deal with more than two bodies, nor involve calculus.]","pdfm":["Core* in ADEK PDF: required for TIMSS/PISA; framework-specific attribution not stated"],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 40; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T2-LO06","x":"• identify in a given mathematical or computational representation of orbital motion the trajectories of planets, moons and human-made satellites, and the eccentricity of an ellipse as e = f divided by d, where f is the distance between the foci and d is the length of the major axis","k":"US Requirement"},{"c":"ESS-G9–10-T2-LO07","x":"• use the relationship that the square of the orbital period is proportional to the cube of the orbital radius to predict the period of an orbiting body from its distance, or its distance from its period","k":"US Requirement"},{"c":"ESS-G9–10-T2-LO08","x":"• predict from the equal-areas-in-equal-times relationship that an orbiting body moves faster the closer it is to the body it orbits, and apply this to a comet or an elliptical satellite orbit","k":"US Requirement"},{"c":"ESS-G9–10-T2-LO09","x":"• use Newton's law of gravitation together with his third law of motion to predict how a planet's acceleration towards the Sun varies with its distance, and argue qualitatively how this accounts for the orbits actually observed","k":"US Requirement"}]},{"id":"SCI-G10-U4-L1","sub":"Science","g":10,"u":4,"un":"Weather & climate","l":1,"t":"Forecasting climate change from data and models — Part 1","role":"Part 1 of 3","topic":"ESS-G9-10-T4","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories, 14. Science and Society","tim":"","pis":"","cls":"Core + UK Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Weather & climate","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSd-GRADE-9-10-YEAR 10-11","stmt":"Analyze geoscience data and the results from global climate models to make an evidence-based forecast of the current rate of global or regional climate change and associated future impacts to Earth systems; Furthermore, the uncertainties in evidence for additional anthropogenic causes of climate change. [Clarification Statement: Examples of evidence, for both data and climate model outputs, are for climate changes (such as precipitation and temperature) and their associated impacts (such as on sea level, glacial ice volumes, or atmosphere and ocean composition).] [Assessment Boundary: Assessment is limited to one example of a climate change and its associated impacts.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 41; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T4-LO01","x":"1 Organizing data\na Students organize data (e.g., with graphs) from global climate models (e.g., computational\nsimulations) and climate observations over time that relate to the effect of climate change on the\nphysical parameters or chemical composition of the atmosphere, geosphere, hydrosphere, or cryosphere.","k":"Core"},{"c":"ESS-G9–10-T4-LO02","x":"b Students describe* what each data set represents.","k":"Core"},{"c":"ESS-G9–10-T4-LO03","x":"2 Identifying relationships\na Students analyze the data and identify and describe* relationships within the datasets, including:\ni. Changes over time on multiple scales; and\nii. Relationships between quantities in the given data.","k":"Core"},{"c":"ESS-G9–10-T4-LO04","x":"3 Interpreting data\na Students use their analysis of the data to describe* a selected aspect of present or past climate and\nthe associated physical parameters (e.g., temperature, precipitation, sea level) or chemical\ncomposition (e.g., ocean pH) of the atmosphere, geosphere, hydrosphere or cryosphere.","k":"Core"},{"c":"ESS-G9–10-T4-LO05","x":"b Students use their analysis of the data to predict the future effect of a selected aspect of climate\nchange on the physical parameters (e.g., temperature, precipitation, sea level) or chemical\ncomposition (e.g., ocean pH) of the atmosphere, geosphere, hydrosphere or cryosphere.","k":"Core"}]},{"id":"SCI-G10-U4-L2","sub":"Science","g":10,"u":4,"un":"Weather & climate","l":2,"t":"Forecasting climate change from data and models — Part 2","role":"Part 2 of 3","topic":"ESS-G9-10-T4","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories, 14. Science and Society","tim":"","pis":"","cls":"Core + UK Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Weather & climate","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSd-GRADE-9-10-YEAR 10-11","stmt":"Analyze geoscience data and the results from global climate models to make an evidence-based forecast of the current rate of global or regional climate cha
