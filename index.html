in which the quantity repeats its value (e.g., the distance\nbetween the tops of a series of water waves).","k":"Core"},{"c":"PS-G6–8-T20-LO02","x":"2 Mathematical modeling\na Students apply the simple mathematical wave model to a physical system or phenomenon to identify how\nthe wave model characteristics correspond with physical observations (e.g., frequency corresponds to\nsound pitch, amplitude corresponds to sound volume).","k":"Core"},{"c":"PS-G6–8-T20-LO03","x":"3 Analysis\na Given data about a repeating physical phenomenon that can be represented as a wave, and amounts of\nenergy present or transmitted, students use their simple mathematical wave models to identify\npatterns, including:\ni. That the energy of the wave is proportional to the square of the amplitude (e.g., if the height\nof a water wave is doubled, each wave will have four times the energy).\nii. That the amount of energy transferred by waves in a given time is proportional to frequency\n(e.g., if twice as many water waves hit the shore each minute, then twice as much energy will be\ntransferred to the shore).","k":"Core"},{"c":"PS-G6–8-T20-LO04","x":"b Students predict the change in the energy of the wave if any one of the parameters of the wave is\nchanged.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"PS-G6–8-T20-LO05","x":"• measure and state the frequency of a sound in hertz, state the limits of the human auditory range as about 20 Hz to 20 000 Hz, and compare that range with the range of a named animal","k":"UK Requirement"}]},{"id":"SCI-G6-U16-L2","sub":"Science","g":6,"u":16,"un":"Waves, light & sound","l":2,"t":"Waves: amplitude, frequency and energy — Part 2","role":"Part 2 of 2","topic":"PS-G6-8-T20","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"2. Action at a Distance","dom":"Physical Sciences — Physics","area":"Waves, light & sound","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSt-GRADE-6-8-YEAR 7-9","stmt":"Use mathematical representations to describe a simple model for waves that includes how the amplitude of a wave is related to the energy in a wave. Furthermore, use the relationship between loudness and amplitude, with the frequencies of sound waves (measured in hertz) and the human auditory range as further measured examples. Furthermore, explore Waves on water as undulations which travel through water with transverse motion; these waves can be reflected, and add or cancel - superposition; Frequencies of sound waves, measured in hertz (Hz); echoes, reflection and absorption of sound; Sound needs a medium to travel, the speed of sound in air, in water, in solids; Sound produced by vibrations of objects, in loud speakers, detected by their effects on microphone diaphragm and the ear drum; sound waves are longitudinal; Auditory range of humans and animals. [Clarification Statement: Emphasis is on describing waves with both qualitative and quantitative thinking.] [Assessment Boundary: Assessment does not include electromagnetic waves and is limited to standard repeating waves.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T20-LO06","x":"• describe water waves as undulations that travel through the water with transverse motion, with the water itself staying in place while energy moves on, and show by observation that such waves reflect and that two waves meeting can add or cancel by superposition","k":"UK Requirement"},{"c":"PS-G6–8-T20-LO07","x":"• describe sound as a longitudinal wave produced by the vibration of an object, and trace that vibration through a loudspeaker cone, a microphone diaphragm and the eardrum","k":"UK Requirement"},{"c":"PS-G6–8-T20-LO08","x":"• explain why sound needs a medium to travel, and compare the speed of sound in air, in water and in solids using given values","k":"UK Requirement"},{"c":"PS-G6–8-T20-LO09","x":"• account for an echo as the reflection of sound, compare how different surfaces reflect and absorb sound, and use that comparison to choose a material for a stated acoustic job","k":"UK Requirement"}]},{"id":"SCI-G7-U1-L1","sub":"Science","g":7,"u":1,"un":"Earth's structure & processes","l":1,"t":"The rock cycle and Earth's materials","role":"Single lesson","topic":"ESS-G6-8-T2","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"Core","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Earth's structure & processes","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSb-GRADE-6-8-YEAR 7-9","stmt":"Develop a model to describe the cycling of Earth's materials and the flow of energy that drives this process — by modelling the composition and structure of the Earth, the rock cycle with the formation of igneous, sedimentary and metamorphic rocks, and the carbon cycle. [Clarification Statement: Emphasis is on the processes of melting, crystallization, weathering, deformation, and sedimentation, which act together to form minerals and rocks through the cycling of Earth’s materials.] [Assessment Boundary: Assessment does not include the identification and naming of minerals.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T2-LO01","x":"1 Components of the model\na To make sense of a given phenomenon, students develop a model in which they identify the relevant\ncomponents, including:\ni. General types of Earth materials that can be found in different locations, including: 1. Those\nlocated at the surface (exterior) and/or in the interior 2. Those that exist(ed) before and/or\nafter chemical and/or physical changes that occur during Earth processes (e.g., melting,\nsedimentation, weathering).\nii. Energy from the sun.\niii. Energy from the Earth’s hot interior.\niv. Relevant earth processes\nv. The temporal and spatial scales for the system.","k":"Core"},{"c":"ESS-G6–8-T2-LO02","x":"2 Relationships\na In the model, students describe* relationships between components, including:\ni. Different Earth processes (e.g., melting, sedimentation, crystallization) drive matter cycling\n(i.e., from one type of Earth material to another) through observable chemical and physical\nchanges.\nii. The movement of energy that originates from the Earth’s hot interior and causes the cycling of\nmatter through the Earth processes of melting, crystallization, and deformation.\niii. Energy flows from the sun cause matter cycling via processes that produce weathering, erosion,\nand sedimentation (e.g., wind, rain).\niv. The temporal and spatial scales over which the relevant Earth processes operate.","k":"Core"},{"c":"ESS-G6–8-T2-LO03","x":"3 Connections\na Students use the model to describe* (based on evidence for changes over time and processes at\ndifferent scales) that energy from the Earth’s interior and the sun drive Earth processes that\ntogether cause matter cycling through different forms of Earth materials.","k":"Core"},{"c":"ESS-G6–8-T2-LO04","x":"b Students use the model to account for interactions between different Earth processes, including:\ni. The Earth’s internal heat energy drives processes such as melting, crystallization, and\ndeformation that change the atomic arrangement of elements in rocks and that move and push rock\nmaterial to the Earth’s surface where it is subject to surface processes like weathering and\nerosion.","k":"Core"},{"c":"ESS-G6–8-T2-LO05","x":"ii. Energy from the sun drives the movement of wind and water that causes the erosion, movement, and\nsedimentation of weathered Earth materials.\niii. Given the right setting, any rock on Earth can be changed into a new type of rock by processes\ndriven by the Earth’s internal energy or by energy from the sun.\nc Students describe* that these changes are consistently occurring but that landforms appear stable to\nhumans because they are changing on time scales much longer than human lifetimes.","k":"Core"}]},{"id":"SCI-G7-U2-L1","sub":"Science","g":7,"u":2,"un":"Resources & human impact","l":1,"t":"Forecasting natural hazards — Part 1","role":"Part 1 of 2","topic":"ESS-G6-8-T10","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology","tim":"","pis":"","cls":"Core","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Resources & human impact","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSj-GRADE-6-8-YEAR 7-9","stmt":"Analyze and interpret data on natural hazards to forecast future catastrophic events and inform the development of technologies to mitigate their effects — locating geologic hazards such as earthquakes and volcanic eruptions using the composition and structure of the Earth. [Clarification Statement: Emphasis is on how some natural hazards, such as volcanic eruptions and severe weather, are preceded by phenomena that allow for reliable predictions, but others, such as earthquakes, occur suddenly and with no notice, and thus are not yet predictable. Examples of natural hazards can be taken from interior processes (such as earthquakes and volcanic eruptions), surface processes (such as mass wasting and tsunamis), or severe weather events (such as hurricanes, tornadoes, and floods). Examples of data can include the locations, magnitudes, and frequencies of the natural hazards. Examples of technologies can be global (such as satellite systems to monitor hurricanes or forest fires) or local (such as building basements in tornado-prone regions or reservoirs to mitigate droughts).]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T10-LO01","x":"1 Organizing data\na Students organize given data that represent the type of natural hazard event and features associated\nwith that type of event, including the location, magnitude, frequency, and any associated precursor\nevent or geologic forces.","k":"Core"},{"c":"ESS-G6–8-T10-LO02","x":"b Students organize data in a way that facilitates analysis and interpretation.\nc Students describe* what each dataset represents.","k":"Core"},{"c":"ESS-G6–8-T10-LO03","x":"2 Identifying relationships\na Students analyze data to identify and describe* patterns in the datasets, including:\ni. The location of natural hazard events relative to geographic and/or geologic features.\nii. Frequency of natural hazard events.\niii. Severity of natural hazard events.\niv. Types of damage caused by natural hazard events.\nv. Location or timing of features and phenomena (e.g., aftershocks, flash floods) associated with\nnatural hazard events.","k":"Core"},{"c":"ESS-G6–8-T10-LO04","x":"b Students describe* similarities and differences among identified patterns.","k":"Core"},{"c":"ESS-G6–8-T10-LO05","x":"3 Interpreting data\na Students use the analyzed data to describe*:\ni. Areas that are susceptible to the natural hazard events, including areas designated as at the\ngreatest and least risk for severe events.","k":"Core"}]},{"id":"SCI-G7-U2-L2","sub":"Science","g":7,"u":2,"un":"Resources & human impact","l":2,"t":"Forecasting natural hazards — Part 2","role":"Part 2 of 2","topic":"ESS-G6-8-T10","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology","tim":"","pis":"","cls":"Core","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Resources & human impact","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSj-GRADE-6-8-YEAR 7-9","stmt":"Analyze and interpret data on natural hazards to forecast future catastrophic events and inform the development of technologies to mitigate their effects — locating geologic hazards such as earthquakes and volcanic eruptions using the composition and structure of the Earth. [Clarification Statement: Emphasis is on how some natural hazards, such as volcanic eruptions and severe weather, are preceded by phenomena that allow for reliable predictions, but others, such as earthquakes, occur suddenly and with no notice, and thus are not yet predictable. Examples of natural hazards can be taken from interior processes (such as earthquakes and volcanic eruptions), surface processes (such as mass wasting and tsunamis), or severe weather events (such as hurricanes, tornadoes, and floods). Examples of data can include the locations, magnitudes, and frequencies of the natural hazards. Examples of technologies can be global (such as satellite systems to monitor hurricanes or forest fires) or local (such as building basements in tornado-prone regions or reservoirs to mitigate droughts).]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T10-LO06","x":"ii. How frequently areas, including areas experiencing the highest and lowest frequency of events,\nare at risk.\niii. What type of damage each area is at risk of during a given natural hazard event.\niv. What features, if any, occur before a given natural hazard event that can be used to predict the\noccurrence of the natural hazard event and when and where they can be observed.","k":"Core"},{"c":"ESS-G6–8-T10-LO07","x":"b Using patterns in the data, students make a forecast for the potential of a natural hazard event to\naffect an area in the future, including information on frequency and/or probability of event\noccurrence; how severe the event is likely to be; where the event is most likely to cause the most","k":"Core"},{"c":"ESS-G6–8-T10-LO08","x":"damage; and what events, if any, are likely to precede the event.\nc Students give at least three examples of the technologies that engineers have developed to mitigate\nthe effects of natural hazards (e.g., the design of buildings and bridges to resist earthquakes,\nwarning sirens for tsunamis, storm shelters for tornados, levees along rivers to prevent flooding).","k":"Core"}]},{"id":"SCI-G7-U3-L1","sub":"Science","g":7,"u":3,"un":"Space & the solar system","l":1,"t":"Gravity in the solar system and galaxies — Part 1","role":"Part 1 of 2","topic":"ESS-G6-8-T14","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"6. The Universe","dom":"Earth & Space Sciences","area":"Space & the solar system","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSn-GRADE-6-8-YEAR 7-9","stmt":"Develop and use models to describe how gravity governs the motion of objects within the solar system and galaxies, including the gravitational interactions between Earth and the Moon and between Earth and the Sun. Apply the relationship between weight, mass and gravitational field strength (weight = mass × gravitational field strength) to explain how gravity affects objects. Locate the Sun as a star within the Milky Way galaxy and recognize that the Milky Way is one of many galaxies in the Universe. [Clarification Statement: Emphasis for the model is on gravity as the force that holds together the solar system and Milky Way galaxy and controls orbital motions within them. Examples of models can be physical (such as the analogy of distance along a football field or computer visualizations of elliptical orbits) or conceptual (such as mathematical proportions relative to the size of familiar objects such as students' school or state).] [Assessment Boundary: Assessment does not include Kepler’s Laws of orbital motion or the apparent retrograde motion of the planets as viewed from Earth.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T14-LO01","x":"1 Components of the model\na To make sense of a given phenomenon, students develop a model in which they identify the relevant\ncomponents of the system, including:\ni. Gravity.\nii. The solar system as a collection of bodies, including the sun, planets, moons, and asteroids.\niii. The Milky Way galaxy as a collection of stars (e.g., the sun) and their associated systems of\nobjects.\niv. Other galaxies in the universe","k":"Core"},{"c":"ESS-G6–8-T14-LO02","x":"b Students indicate the relative spatial scales of solar systems and galaxies in the model.","k":"Core"},{"c":"ESS-G6–8-T14-LO03","x":"2 Relationships\na Students describe* the relationships and interactions between components of the solar and galaxy\nsystems, including:\ni. Gravity as an attractive force between solar system and galaxy objects that: 1. Increases with\nthe mass of the interacting objects increases. 2. Decreases as the distances between objects\nincreases.","k":"Core"},{"c":"ESS-G6–8-T14-LO04","x":"ii. The orbital motion of objects in our solar system (e.g., moons orbit around planets, all objects\nwithin the solar system orbit the sun).\niii. The orbital motion, in the form of a disk, of vast numbers of stars around the center of the\nMilky Way.\niv. That our solar system is one of many systems orbiting the center of the larger system of the\nMilky Way galaxy.\nv. The Milky Way is one of many galaxy systems in the universe.","k":"Core"},{"c":"ESS-G6–8-T14-LO05","x":"3 Connections\na Students use the model to describe* that gravity is a predominantly inward-pulling force that can keep\nsmaller/less massive objects in orbit around larger/more massive objects.","k":"Core"}]},{"id":"SCI-G7-U3-L2","sub":"Science","g":7,"u":3,"un":"Space & the solar system","l":2,"t":"Gravity in the solar system and galaxies — Part 2","role":"Part 2 of 2","topic":"ESS-G6-8-T14","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"6. The Universe","dom":"Earth & Space Sciences","area":"Space & the solar system","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSn-GRADE-6-8-YEAR 7-9","stmt":"Develop and use models to describe how gravity governs the motion of objects within the solar system and galaxies, including the gravitational interactions between Earth and the Moon and between Earth and the Sun. Apply the relationship between weight, mass and gravitational field strength (weight = mass × gravitational field strength) to explain how gravity affects objects. Locate the Sun as a star within the Milky Way galaxy and recognize that the Milky Way is one of many galaxies in the Universe. [Clarification Statement: Emphasis for the model is on gravity as the force that holds together the solar system and Milky Way galaxy and controls orbital motions within them. Examples of models can be physical (such as the analogy of distance along a football field or computer visualizations of elliptical orbits) or conceptual (such as mathematical proportions relative to the size of familiar objects such as students' school or state).] [Assessment Boundary: Assessment does not include Kepler’s Laws of orbital motion or the apparent retrograde motion of the planets as viewed from Earth.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T14-LO06","x":"b Students use the model to describe* that gravity causes a pattern of smaller/less massive objects\norbiting around larger/more massive objects at all system scales in the universe, including that:\ni. Gravitational forces from planets cause smaller objects (e.g., moons) to orbit around planets.\nii. The gravitational force of the sun causes the planets and other bodies to orbit around it,\nholding the solar system together.\niii. The gravitational forces from the center of the Milky Way cause stars and stellar systems to\norbit around the center of the galaxy.\niv. The hierarchy pattern of orbiting systems in the solar system was established early in its\nhistory as the disk of dust and gas was driven by gravitational forces to form moon-planet and\nplanet-sun orbiting systems.","k":"Core"},{"c":"ESS-G6–8-T14-LO07","x":"c Students use the model to describe* that objects too far away from the sun do not orbit it because the\nsun’s gravitational force on those objects is too weak to pull them into orbit.\nd Students use the model to describe* what a given phenomenon might look like without gravity (e.g.,\nsmaller planets would move in straight paths through space, rather than orbiting a more massive body).","k":"Core"}]},{"id":"SCI-G7-U4-L1","sub":"Science","g":7,"u":4,"un":"Weather & climate","l":1,"t":"Air masses, clouds and weather — Part 1","role":"Part 1 of 3","topic":"ESS-G6-8-T6","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core* (TIMSS/PISA)","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Weather & climate","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSf-GRADE-6-8-YEAR 7-9","stmt":"Collect data to provide evidence for how the motions and complex interactions of air masses results in changes in weather conditions. [Clarification Statement: Emphasis is on how air masses flow from regions of high pressure to low pressure, causing weather (defined by temperature, pressure, humidity, precipitation, and wind) at a fixed location to change over time, and how sudden changes in weather can result when different air masses collide. Emphasis is on how weather can be predicted within probabilistic ranges. Examples of data can be provided to students (such as weather maps, diagrams, and visualizations) or obtained through laboratory experiments (such as with condensation).] [Assessment Boundary: Assessment does not include recalling the names of cloud types or weather symbols used on weather maps or the reported diagrams from weather stations.] Explain that clouds and precipitation form when air rises and cools so that water vapour condenses, including why air rises over warm surfaces, mountain ridges and colliding air masses.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T6-LO01","x":"1 Identifying the phenomenon under investigation\na From the given investigation plan, students describe* the phenomenon under investigation, which\nincludes the relationships between air mass interactions and weather conditions.","k":"Core"},{"c":"ESS-G6–8-T6-LO02","x":"b Students identify the purpose of the investigation, which includes providing evidence to answer\nquestions about how motions and complex interactions of air masses result in changes in weather\nconditions [note: expectations of students regarding mechanisms are limited to relationships between\npatterns of activity of air masses and changes in weather].","k":"Core"},{"c":"ESS-G6–8-T6-LO03","x":"2 Identifying the evidence to address the purpose of the investigation\na From a given investigation plan, students describe* the data to be collected and the evidence to be\nderived from the data that would indicate relationships between air mass movement and changes in\nweather, including:\ni. Patterns in weather conditions in a specific area (e.g., temperature, air pressure, humidity,","k":"Core"},{"c":"ESS-G6–8-T6-LO04","x":"wind speed) over time.\nii. The relationship between the distribution and movement of air masses and landforms, ocean\ntemperatures, and currents.\niii. The relationship between observed, large-scale weather patterns and the location or movement of\nair masses, including patterns that develop between air masses (e.g., cold fronts may be\ncharacterized by thunderstorms).","k":"Core"},{"c":"ESS-G6–8-T6-LO05","x":"b Students describe* how the evidence to be collected will be relevant to determining the relationship\nbetween patterns of activity of air masses and changes in weather conditions.\nc Students describe* that because weather patterns are so complex and have multiple causes, weather can\nbe predicted only probabilistically.","k":"Core"}]},{"id":"SCI-G7-U4-L2","sub":"Science","g":7,"u":4,"un":"Weather & climate","l":2,"t":"Air masses, clouds and weather — Part 2","role":"Part 2 of 3","topic":"ESS-G6-8-T6","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core* (TIMSS/PISA)","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Weather & climate","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSf-GRADE-6-8-YEAR 7-9","stmt":"Collect data to provide evidence for how the motions and complex interactions of air masses results in changes in weather conditions. [Clarification Statement: Emphasis is on how air masses flow from regions of high pressure to low pressure, causing weather (defined by temperature, pressure, humidity, precipitation, and wind) at a fixed location to change over time, and how sudden changes in weather can result when different air masses collide. Emphasis is on how weather can be predicted within probabilistic ranges. Examples of data can be provided to students (such as weather maps, diagrams, and visualizations) or obtained through laboratory experiments (such as with condensation).] [Assessment Boundary: Assessment does not include recalling the names of cloud types or weather symbols used on weather maps or the reported diagrams from weather stations.] Explain that clouds and precipitation form when air rises and cools so that water vapour condenses, including why air rises over warm surfaces, mountain ridges and colliding air masses.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T6-LO06","x":"3 Planning the investigation\na Students describe* the tools and methods used in the investigation, including how they are relevant to\nthe purpose of the investigation.","k":"Core"},{"c":"ESS-G6–8-T6-LO07","x":"4 Collecting the data\na According to the provided investigation plan, students make observations and record data, either\nfirsthand and/or from professional weather monitoring services.\nIn addition (US Requirement):","k":"Core"},{"c":"ESS-G6–8-T6-LO08","x":"• describe the phenomenon under investigation — how the motion and interaction of air masses produce changes in weather conditions at a fixed place — and state the purpose of the data collection that will provide evidence for it","k":"Core"},{"c":"ESS-G6–8-T6-LO09","x":"• describe the data to be collected and the instruments and methods used, including temperature, air pressure, humidity, wind speed and direction, and precipitation, recorded at the same fixed location at set times over a period of days","k":"Core"},{"c":"ESS-G6–8-T6-LO10","x":"• collect and record weather data firsthand at that fixed location, and obtain matching data for the same days from a professional weather monitoring service","k":"Core"}]},{"id":"SCI-G7-U4-L3","sub":"Science","g":7,"u":4,"un":"Weather & climate","l":3,"t":"Air masses, clouds and weather — Part 3","role":"Part 3 of 3","topic":"ESS-G6-8-T6","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core* (TIMSS/PISA)","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Weather & climate","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSf-GRADE-6-8-YEAR 7-9","stmt":"Collect data to provide evidence for how the motions and complex interactions of air masses results in changes in weather conditions. [Clarification Statement: Emphasis is on how air masses flow from regions of high pressure to low pressure, causing weather (defined by temperature, pressure, humidity, precipitation, and wind) at a fixed location to change over time, and how sudden changes in weather can result when different air masses collide. Emphasis is on how weather can be predicted within probabilistic ranges. Examples of data can be provided to students (such as weather maps, diagrams, and visualizations) or obtained through laboratory experiments (such as with condensation).] [Assessment Boundary: Assessment does not include recalling the names of cloud types or weather symbols used on weather maps or the reported diagrams from weather stations.] Explain that clouds and precipitation form when air rises and cools so that water vapour condenses, including why air rises over warm surfaces, mountain ridges and colliding air masses.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T6-LO11","x":"• analyse the recorded data for patterns that connect a change in the weather at the location to air flowing from a region of higher pressure towards a region of lower pressure","k":"Core"},{"c":"ESS-G6–8-T6-LO12","x":"• explain, using the collected evidence, how sudden changes in weather result when air masses of different temperature and humidity meet, and relate the distribution and movement of air masses to landforms, sea temperature and currents","k":"Core"},{"c":"ESS-G6–8-T6-LO13","x":"• explain why weather can be predicted only within probabilistic ranges, and interpret a stated probability of precipitation correctly rather than as a promise that it will or will not rain","k":"Core"},{"c":"ESS-G6–8-T6-LO14","x":"• explain that clouds and precipitation form when air rises and cools so that water vapour condenses, including why air rises over warm surfaces, mountain ridges and colliding air masses","k":"Core"}]},{"id":"SCI-G7-U5-L1","sub":"Science","g":7,"u":5,"un":"Engineering design","l":1,"t":"Evaluating solutions; error, accuracy and reliability — Part 1","role":"Part 1 of 3","topic":"ETS-G6-8-T2","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core + UK Requirement","big":"13. Science and Technology","dom":"Engineering & Technology","area":"Engineering design","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ETSb-GRADE-6-8-YEAR 7-9","stmt":"Evaluate competing design solutions using a systematic process to determine how well they meet the specified criteria and constraints of a problem, using evidence and reasoned explanations to justify conclusions. Furthermore, evaluate and interpret data by identifying potential sources of random and systematic error, and demonstrate objectivity and an understanding of the importance of accuracy, precision, repeatability and reproducibility when evaluating the reliability of evidence. Analysis and evaluation: Present reasoned explanations, including explaining data in relation to predictions and hypotheses Analysis and evaluation: Evaluate data, showing awareness of potential sources of random and systematic error","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ETS-G6–8-T2-LO01","x":"1 Identifying the given design solution and associated claims and evidence\na Students identify the given supported design solution.","k":"Core"},{"c":"ETS-G6–8-T2-LO02","x":"b Students identify scientific knowledge related to the problem and each proposed solution.\nc Students identify how each solution would solve the problem.","k":"Core"},{"c":"ETS-G6–8-T2-LO03","x":"2 Identifying additional evidence\na Students identify and describe* additional evidence necessary for their evaluation, including:\ni. Knowledge of how similar problems have been solved in the past.\nii. Evidence of possible societal and environmental impacts of each proposed solution.","k":"Core"},{"c":"ETS-G6–8-T2-LO04","x":"b Students collaboratively define and describe* criteria and constraints for the evaluation of the\ndesign solution.","k":"Core"},{"c":"ETS-G6–8-T2-LO05","x":"3 Evaluating and critiquing evidence\na Students use a systematic method (e.g., a decision matrix) to identify the strengths and weaknesses of\neach solution. In their evaluation, students:","k":"Core"}]},{"id":"SCI-G7-U5-L2","sub":"Science","g":7,"u":5,"un":"Engineering design","l":2,"t":"Evaluating solutions; error, accuracy and reliability — Part 2","role":"Part 2 of 3","topic":"ETS-G6-8-T2","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core + UK Requirement","big":"13. Science and Technology","dom":"Engineering & Technology","area":"Engineering design","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ETSb-GRADE-6-8-YEAR 7-9","stmt":"Evaluate competing design solutions using a systematic process to determine how well they meet the specified criteria and constraints of a problem, using evidence and reasoned explanations to justify conclusions. Furthermore, evaluate and interpret data by identifying potential sources of random and systematic error, and demonstrate objectivity and an understanding of the importance of accuracy, precision, repeatability and reproducibility when evaluating the reliability of evidence. Analysis and evaluation: Present reasoned explanations, including explaining data in relation to predictions and hypotheses Analysis and evaluation: Evaluate data, showing awareness of potential sources of random and systematic error","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ETS-G6–8-T2-LO06","x":"i. Evaluate each solution against each criterion and constraint.\nii. Compare solutions based on the results of their performance against the defined criteria and\nconstraints.","k":"Core"},{"c":"ETS-G6–8-T2-LO07","x":"b Students use the evidence and reasoning to make a claim about the relative effectiveness of each\nproposed solution based on the strengths and weaknesses of each.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"ETS-G6–8-T2-LO08","x":"• present reasoned explanations of data, relating the results obtained to the prediction or hypothesis that was made","k":"UK Requirement"},{"c":"ETS-G6–8-T2-LO09","x":"• identify potential sources of random error and of systematic error in a set of measurements, and distinguish between them","k":"UK Requirement"},{"c":"ETS-G6–8-T2-LO10","x":"• explain and use accuracy, precision, repeatability and reproducibility correctly when judging how far a set of evidence can be relied on","k":"UK Requirement"}]},{"id":"SCI-G7-U5-L3","sub":"Science","g":7,"u":5,"un":"Engineering design","l":3,"t":"Evaluating solutions; error, accuracy and reliability — Part 3","role":"Part 3 of 3","topic":"ETS-G6-8-T2","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core + UK Requirement","big":"13. Science and Technology","dom":"Engineering & Technology","area":"Engineering design","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ETSb-GRADE-6-8-YEAR 7-9","stmt":"Evaluate competing design solutions using a systematic process to determine how well they meet the specified criteria and constraints of a problem, using evidence and reasoned explanations to justify conclusions. Furthermore, evaluate and interpret data by identifying potential sources of random and systematic error, and demonstrate objectivity and an understanding of the importance of accuracy, precision, repeatability and reproducibility when evaluating the reliability of evidence. Analysis and evaluation: Present reasoned explanations, including explaining data in relation to predictions and hypotheses Analysis and evaluation: Evaluate data, showing awareness of potential sources of random and systematic error","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ETS-G6–8-T2-LO11","x":"• demonstrate objectivity by reporting results that do not support the preferred design as fully as those that do","k":"UK Requirement"}]},{"id":"SCI-G7-U6-L1","sub":"Science","g":7,"u":6,"un":"Body systems & health","l":1,"t":"Skeleton, muscles and movement — Part 1","role":"Part 1 of 2","topic":"LS-G6-8-T8","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"Core* (TIMSS/PISA)","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-LSh-GRADE-6-8-YEAR 7-9","stmt":"Furthermore, explore the structure and functions of the human skeleton — support, protection, movement and blood production — and how muscles work in antagonistic pairs, including measurement of the force they exert","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T8-LO01","x":"Furthermore (UK Requirement):\n• identify the main parts of the human skeleton and state its four functions — support, protection, movement and the production of blood cells","k":"UK Requirement"},{"c":"LS-G6–8-T8-LO02","x":"• explain how the structure of named bones suits each function, including the ribcage and skull as protection, the long bones as levers, and the red marrow inside bones as the site where blood cells are made","k":"Core"},{"c":"LS-G6–8-T8-LO03","x":"• explain how bones, joints, tendons and muscles act together to produce movement at a hinge joint such as the elbow and at a ball-and-socket joint such as the shoulder","k":"Core"},{"c":"LS-G6–8-T8-LO04","x":"• explain why muscles must be arranged in antagonistic pairs, stating that a muscle can only exert a force by contracting and pulling, never by pushing","k":"Core"},{"c":"LS-G6–8-T8-LO05","x":"• describe the action of the biceps and triceps in flexing and extending the arm, naming which muscle contracts and which relaxes in each movement","k":"Core"}]},{"id":"SCI-G7-U6-L2","sub":"Science","g":7,"u":6,"un":"Body systems & health","l":2,"t":"Skeleton, muscles and movement — Part 2","role":"Part 2 of 2","topic":"LS-G6-8-T8","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"Core* (TIMSS/PISA)","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-LSh-GRADE-6-8-YEAR 7-9","stmt":"Furthermore, explore the structure and functions of the human skeleton — support, protection, movement and blood production — and how muscles work in antagonistic pairs, including measurement of the force they exert","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T8-LO06","x":"• measure the force a muscle group exerts, in newtons, using a force meter or hand dynamometer, taking repeat readings and calculating a mean","k":"Core"},{"c":"LS-G6–8-T8-LO07","x":"• analyse force measurements to compare muscle groups, arms or conditions, and explain the pattern in terms of muscle size, the joint acted on and the distance of the muscle's attachment from the pivot","k":"Core"}]},{"id":"SCI-G7-U7-L1","sub":"Science","g":7,"u":7,"un":"Cells & organisation","l":1,"t":"Cell parts and their functions","role":"Single lesson","topic":"LS-G6-8-T2","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"Core","big":"7. Cells and Life","dom":"Life Sciences","area":"Cells & organisation","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSb-GRADE-6-8-YEAR 7-9","stmt":"Develop and use a model to describe the function of a cell as a whole and ways parts of cells contribute to the function — the functions of the cell wall, cell membrane, cytoplasm, nucleus, vacuole, mitochondria and chloroplasts, as observed in plant and animal cells. [Clarification Statement: Emphasis is on the cell functioning as a whole system and the primary role of identified parts of the cell, specifically the nucleus, chloroplasts, mitochondria, cell membrane, and cell wall.] [Assessment Boundary: Assessment of organelle structure/function relationships is limited to the cell wall and cell membrane. Assessment of the function of the other organelles is limited to their relationship to the whole cell. Assessment does not include the biochemical function of cells or cell parts.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T2-LO01","x":"1 Components of the model\na To make sense of a phenomenon, students develop a model in which they identify the parts (i.e.,\ncomponents; e.g., nucleus, chloroplasts, cell wall, mitochondria, cell membrane, the function of a\ncell as a whole) of cells relevant for the given phenomenon.","k":"Core"},{"c":"LS-G6–8-T2-LO02","x":"2 Relationships\na In the model, students describe* the relationships between components, including:\ni. The particular functions of parts of cells in terms of their contributions to overall cellular\nfunctions (e.g., chloroplasts’ involvement in photosynthesis and energy production,\nmitochondria’s involvement in cellular respiration).\nii. The structure of the cell membrane or cell wall and its relationship to the function of the\norganelles and the whole cell.","k":"Core"},{"c":"LS-G6–8-T2-LO03","x":"3 Connections\na Students use the model to describe* a causal account for the phenomenon, including how different parts\nof a cell contribute to how the cell functions as a whole, both separately and together with other\nstructures. Students include how components, separately and together, contribute to:\ni. Maintaining a cell’s internal processes, for which it needs energy.\nii. Maintaining the structure of the cell and controlling what enters and leaves the cell.\niii. Functioning together as parts of a system that determines cellular function.","k":"Core"},{"c":"LS-G6–8-T2-LO04","x":"b Students use the model to identify key differences between plant and animal cells based on structure\nand function, including:\ni. Plant cells have a cell wall in addition to a cell membrane, whereas animal cells have only a\ncell membrane. Plants use cell walls to provide structure to the plant.\nii. Plant cells contain organelles called chloroplasts, while animal cells do not. Chloroplasts\nallow plants to make the food they need to live using photosynthesis.","k":"Core"}]},{"id":"SCI-G7-U8-L1","sub":"Science","g":7,"u":8,"un":"Ecosystems & food webs","l":1,"t":"Cycling of matter and flow of energy in ecosystems","role":"Single lesson","topic":"LS-G6-8-T12","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSl-GRADE-6-8-YEAR 7-9","stmt":"Develop a model to describe the cycling of matter and flow of energy among living and nonliving parts of an ecosystem — including the carbon cycle. [Clarification Statement: Emphasis is on describing the conservation of matter and flow of energy into and out of various ecosystems, and on defining the boundaries of the system.] [Assessment Boundary: Assessment does not include the use of chemical reactions to describe the processes.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T12-LO01","x":"1 Components of the model\na To make sense of a given phenomenon, students develop a model in which they identify the relevant\ncomponents, including:\ni. Organisms that can be classified as producers, consumers, and/or decomposers.\nii. Nonliving parts of an ecosystem (e.g., water, minerals, air) that can provide matter to living\norganisms or receive matter from living organisms.\niii. Energy","k":"Core"},{"c":"LS-G6–8-T12-LO02","x":"b Students define the boundaries of the ecosystem under consideration in their model (e.g., pond, part\nof a forest, meadow; a whole forest, which contains a meadow, pond, and stream).","k":"Core"},{"c":"LS-G6–8-T12-LO03","x":"2 Relationships\na In the model, students describe* relationships between components within the ecosystem, including:\ni. Energy transfer into and out of the system.\nii. Energy transfer and matter cycling (cycling of atoms): 1. Among producers, consumers, and\ndecomposers (e.g., decomposers break down consumers and producers via chemical reactions and use\nthe energy released from rearranging those molecules for growth and development). 2. Between\norganisms and the nonliving parts of the system (e.g., producers use matter from the nonliving\nparts of the ecosystem and energy from the sun to produce food from nonfood materials).","k":"Core"},{"c":"LS-G6–8-T12-LO04","x":"3 Connections\na Students use the model to describe* the cycling of matter and flow of energy among living and\nnonliving parts of the defined system, including: i.When organisms consume other organisms, there is a\ntransfer of energy and a cycling of atoms that were originally captured from the nonliving parts of\nthe ecosystem by producers.\nii. The transfer of matter (atoms) and energy between living and nonliving parts of the ecosystem at\nevery level within the system, which allows matter to cycle and energy to flow within and\noutside of the system.","k":"Core"},{"c":"LS-G6–8-T12-LO05","x":"b Students use the model to track energy transfer and matter cycling in the system based on consistent\nand measureable patterns, including:\ni. That the atoms that make up the organisms in an ecosystem are cycled repeatedly between the\nliving and nonliving parts of the ecosystem.\nii. That matter and energy are conserved through transfers within and outside of the ecosystem.","k":"Core"}]},{"id":"SCI-G7-U8-L2","sub":"Science","g":7,"u":8,"un":"Ecosystems & food webs","l":2,"t":"Maintaining biodiversity and ecosystem services — Part 1","role":"Part 1 of 2","topic":"LS-G6-8-T15","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology, 14. Science and Society","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSo-GRADE-6-8-YEAR 7-9","stmt":"Evaluate competing design solutions for maintaining biodiversity and ecosystem services by applying the importance of maintaining biodiversity and the use of gene banks to preserve hereditary material. Furthermore, explore use of gene banks to preserve hereditary material Clarification Statement: Examples of ecosystem services could include water purification, nutrient recycling, and prevention of soil erosion. Examples of design solution constraints could include scientific, economic, and social considerations.] Compare natural ecosystems with rural and urban ecosystems in terms of the living things and resources they contain and the human activity they support.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T15-LO01","x":"1 Identifying the given design solution and supporting evidence\na Students identify and describe*:\ni. The given competing design solutions for maintaining biodiversity and ecosystem services.\nii. The given problem involving biodiversity and/or ecosystem services that is being solved by the\ngiven design solutions, including information about why biodiversity and/or ecosystem services\nare necessary to maintaining a healthy ecosystem.\niii. The given evidence about performance of the given design solutions.","k":"Core"},{"c":"LS-G6–8-T15-LO02","x":"2 Identifying any potential additional evidence that is relevant to the evaluation\na Students identify and describe* the additional evidence (in the form of data, information, or other\nappropriate forms) that is relevant to the problem, design solutions, and evaluation of the solutions,\nincluding:\ni. The variety of species (biodiversity) found in the given ecosystem.\nii. Factors that affect the stability of the biodiversity of the given ecosystem.\niii. Ecosystem services (e.g., water purification, nutrient recycling, prevention of soil erosion)\nthat affect the stability of the system.","k":"Core"},{"c":"LS-G6–8-T15-LO03","x":"b Students collaboratively define and describe* criteria and constraints for the evaluation of the\ndesign solution.","k":"Core"},{"c":"LS-G6–8-T15-LO04","x":"3 Evaluating and critiquing the design solution\na In their evaluations, students use scientific evidence to:\ni. Compare the ability of each of the competing design solutions to maintain ecosystem stability\nand biodiversity.\nii. Clarify the strengths and weaknesses of the competing designs with respect to each criterion and\nconstraint (e.g., scientific, social, and economic considerations).\niii. Assess possible side effects of the given design solutions on other aspects of the ecosystem,\nincluding the possibility that a small change in one component of an ecosystem can produce a\nlarge change in another component of the ecosystem.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"LS-G6–8-T15-LO05","x":"• explain how a gene bank preserves hereditary material, and state what is stored in one — seed, pollen, tissue cultures and frozen gametes","k":"UK Requirement"}]},{"id":"SCI-G7-U8-L3","sub":"Science","g":7,"u":8,"un":"Ecosystems & food webs","l":3,"t":"Maintaining biodiversity and ecosystem services — Part 2","role":"Part 2 of 2","topic":"LS-G6-8-T15","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology, 14. Science and Society","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSo-GRADE-6-8-YEAR 7-9","stmt":"Evaluate competing design solutions for maintaining biodiversity and ecosystem services by applying the importance of maintaining biodiversity and the use of gene banks to preserve hereditary material. Furthermore, explore use of gene banks to preserve hereditary material Clarification Statement: Examples of ecosystem services could include water purification, nutrient recycling, and prevention of soil erosion. Examples of design solution constraints could include scientific, economic, and social considerations.] Compare natural ecosystems with rural and urban ecosystems in terms of the living things and resources they contain and the human activity they support.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T15-LO06","x":"• explain why stored hereditary material can protect variety that has already been lost from the wild, and state what it cannot replace","k":"UK Requirement"},{"c":"LS-G6–8-T15-LO07","x":"• evaluate a gene bank against living, in-place conservation as two competing solutions, giving the limits of each","k":"UK Requirement"},{"c":"LS-G6–8-T15-LO08","x":"• compare natural ecosystems with rural and urban ecosystems in terms of the living things and resources they contain and the human activity they support","k":"UK Requirement"}]},{"id":"SCI-G7-U9-L1","sub":"Science","g":7,"u":9,"un":"Evidence of evolution","l":1,"t":"Anatomical similarities between modern and fossil organisms — Part 1","role":"Part 1 of 2","topic":"LS-G6-8-T20","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"Essential","pis":"","cls":"US Requirement","big":"10. Diversity of Life","dom":"Life Sciences","area":"Evidence of evolution","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSt-GRADE-6-8-YEAR 7-9","stmt":"In addition, apply scientific ideas to construct an explanation for the anatomical similarities and differences among modern organisms and between modern and fossil organisms. [Clarification Statement: Emphasis is on explanations of the evolutionary relationships among organisms in terms of similarity or differences of the gross appearance of anatomical structures.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T20-LO01","x":"In addition (US Requirement):\n1 Articulating the explanation of phenomena\na Students articulate a statement that relates a given phenomenon to scientific ideas, including the\nfollowing ideas about similarities and differences in organisms and their evolutionary relationships:\ni. Anatomical similarities and differences among organisms can be used to infer evolutionary\nrelationships, including: 1. Among modern organisms. 2. Between modern and fossil organisms.\nb Students use evidence and reasoning to construct an explanation for the given phenomenon.\n2 Evidence\na Students identify and describe* evidence (e.g., from students’ own investigations, observations,\nreading material, archived data, simulations) necessary for constructing the explanation, including\nsimilarities and differences in anatomical patterns in and between:\ni. Modern, living organisms (e.g., skulls of modern crocodiles, skeletons of birds; features of\nmodern whales and elephants).\nii. Fossilized organisms (e.g., skulls of fossilized crocodiles, fossilized dinosaurs).\n3 Reasoning\na Students use reasoning to connect the evidence to support an explanation. Students describe* the\nfollowing chain of reasoning for the explanation:\ni. Organisms that share a pattern of anatomical features are likely to be more closely related than\nare organisms that do not share a pattern of anatomical features, due to the cause-and- effect\nrelationship between genetic makeup and anatomy (e.g., although birds and insects both have\nwings, the organisms are structurally very different and not very closely related; the wings of\nbirds and bats are structurally similar, and the organisms are more closely related; the limbs\nof horses and zebras are structurally very similar, and they are more closely related than are\nbirds and bats or birds and insects).\nii. Changes over time in the anatomical features observable in the fossil record can be used to\ninfer lines of evolutionary descent by linking extinct organisms to living organisms through a\nseries of fossilized organisms that share a basic set of anatomical features.","k":"US Requirement"},{"c":"LS-G6–8-T20-LO02","x":"• apply scientific ideas to construct an explanation for the anatomical similarities and differences found among modern organisms\n• apply the same ideas to construct an explanation for the anatomical similarities and differences between modern organisms and fossil organisms","k":"US Requirement"},{"c":"LS-G6–8-T20-LO03","x":"• identify and describe the shared and unshared patterns in the gross appearance of anatomical structures that serve as the evidence for the explanation","k":"US Requirement"},{"c":"LS-G6–8-T20-LO04","x":"• reason that organisms sharing a pattern of anatomical features are likely to be more closely related than organisms that do not share it, because of the relationship between genetic makeup and anatomy","k":"US Requirement"},{"c":"LS-G6–8-T20-LO05","x":"• infer a line of evolutionary descent by linking an extinct organism to a living one through a series of fossil organisms that share a basic set of anatomical features","k":"US Requirement"}]},{"id":"SCI-G7-U9-L2","sub":"Science","g":7,"u":9,"un":"Evidence of evolution","l":2,"t":"Anatomical similarities between modern and fossil organisms — Part 2","role":"Part 2 of 2","topic":"LS-G6-8-T20","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"Essential","pis":"","cls":"US Requirement","big":"10. Diversity of Life","dom":"Life Sciences","area":"Evidence of evolution","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSt-GRADE-6-8-YEAR 7-9","stmt":"In addition, apply scientific ideas to construct an explanation for the anatomical similarities and differences among modern organisms and between modern and fossil organisms. [Clarification Statement: Emphasis is on explanations of the evolutionary relationships among organisms in terms of similarity or differences of the gross appearance of anatomical structures.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T20-LO06","x":"• distinguish a shared pattern of structure from a mere similarity of function, as in the wing of a bird compared with the wing of an insect","k":"US Requirement"}]},{"id":"SCI-G7-U10-L1","sub":"Science","g":7,"u":10,"un":"Genetics & inheritance","l":1,"t":"Asexual and sexual reproduction and variation","role":"Single lesson","topic":"LS-G6-8-T17","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"Core","big":"9. Inheritance","dom":"Life Sciences","area":"Genetics & inheritance","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-LSq-GRADE-6-8-YEAR 7-9","stmt":"Develop and use a model to describe why asexual reproduction results in offspring with identical genetic information and sexual reproduction results in offspring with genetic variation — applying heredity as the process by which genetic information is transmitted from one generation to the next, through gametes and fertilisation. where Heredity as the process by which genetic information is transmitted from one generation to the next [Clarification Statement: Emphasis is on using models such as Punnett squares, diagrams, and simulations to describe the cause and effect relationship of gene transmission from parent(s) to offspring and resulting genetic variation.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T17-LO01","x":"1 Components of the model\na Students develop a model (e.g., Punnett squares, diagrams, simulations) for a given phenomenon\ninvolving the differences in genetic variation that arise from sexual and asexual reproduction. In the\nmodel, students identify and describe* the relevant components, including:\ni. Chromosome pairs, including genetic variants, in asexual reproduction: 1. Parents. 2. Offspring.\nii. Chromosome pairs, including genetic variants, in sexual reproduction: 1. Parents. 2. Offspring.","k":"Core"},{"c":"LS-G6–8-T17-LO02","x":"2 Relationships\na In their model, students describe* the relationships between components, including:\ni. During reproduction (both sexual and asexual), parents transfer genetic information in the form\nof genes to their offspring.\nii. Under normal conditions, offspring have the same number of chromosomes, and therefore genes, as\ntheir parents.\niii. During asexual reproduction, a single parent’s chromosomes (one set) are the source of genetic\nmaterial in the offspring.\niv. During sexual reproduction, two parents (two sets of chromosomes) contribute genetic material to\nthe offspring.","k":"Core"},{"c":"LS-G6–8-T17-LO03","x":"3 Connections\na Students use the model to describe* a causal account for why sexual and asexual reproduction result in\ndifferent amounts of genetic variation in offspring relative to their parents, including that:\ni. In asexual reproduction: 1. Offspring have a single source of genetic information, and their\nchromosomes are complete copies of each single parent pair of chromosomes. 2. Offspring\nchromosomes are identical to parent chromosomes.\nii. In sexual reproduction: 1. Offspring have two sources of genetic information (i.e., two sets of\nchromosomes) that contribute to each final pair of chromosomes in the offspring. 2. Because both\nparents are likely to contribute different genetic information, offspring chromosomes reflect a\ncombination of genetic material from two sources and therefore contain new combinations of genes\n(genetic variation) that make offspring chromosomes distinct from those of either parent.","k":"Core"},{"c":"LS-G6–8-T17-LO04","x":"b Students use cause-and-effect relationships found in the model between the type of reproduction and\nthe resulting genetic variation to predict that more genetic variation occurs in organisms that\nreproduce sexually compared to organisms that reproduce asexually.","k":"Core"}]},{"id":"SCI-G7-U11-L1","sub":"Science","g":7,"u":11,"un":"Photosynthesis & respiration","l":1,"t":"Photosynthesis and the flow of energy into organisms","role":"Single lesson","topic":"LS-G6-8-T5","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Photosynthesis & respiration","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-LSe-GRADE-6-8-YEAR 7-9","stmt":"Construct a scientific explanation based on evidence for the role of photosynthesis in the cycling of matter and flow of energy into and out of organisms, representing photosynthesis through its reactants and products, with a word summary; explain that plants make carbohydrates in their leaves and that almost all life on Earth depends on photosynthetic organisms, such as plants and algae, using sunlight to build organic molecules that serve as an essential energy store and maintain levels of oxygen and carbon dioxide in the atmosphere. Describe the adaptations of leaves for photosynthesis, including the role of leaf stomata, and how plants gain mineral nutrients and water from the soil via their roots. [Clarification Statement: Emphasis is on tracing movement of matter and flow of energy.] [Assessment Boundary: Assessment does not include the biochemical mechanisms of photosynthesis.] Describe how plants take in water through their roots and release it by transpiration through the leaves, and how animals take in and release water.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T5-LO01","x":"1 Articulating the explanation of phenomena\na Students articulate a statement that relates the given phenomenon to a scientific idea, including the\nidea that photosynthesis results in the cycling of matter and energy into and out of organisms.\nb Students use evidence and reasoning to construct a scientific explanation for the given phenomenon.\n2 Evidence\na Students identify and describe* evidence (e.g., from students’ own investigations, observations,\nreading material, archived data) necessary to constructing the explanation, including that:\ni. Plants, algae, and photosynthetic microorganisms require energy (in the form of sunlight) and\nmust take in carbon dioxide and water to survive.\nii. Energy from sunlight is used to combine simple nonfood molecules (e.g., carbon dioxide and\nwater) into food molecules (e.g., sugar) and oxygen, which can be used immediately or stored by\nthe plant.\niii. Animals take in food and oxygen to provide energy and materials for growth and survival.\niv. Some animals eat plants, algae, and photosynthetic microorganisms, and some animals eat other\nanimals, which have themselves eaten photosynthetic organisms.\nb Students use multiple valid and reliable sources of evidence.\n3 Reasoning\na Students use reasoning, along with the assumption that theories and laws that describe the natural\nworld operate today as they did in the past and will continue to do so in the future, to connect the\nevidence and support an explanation for energy and matter cycling during photosynthesis. Students\ndescribe* a chain of reasoning for their explanation, including:\ni. Plants, algae, and photosynthetic microorganisms take in matter (in the form of carbon dioxide\nand water) and use energy from the sun to produce carbon-based organic molecules (food), which\nthey can use immediately or store, and release oxygen into the environment through\nphotosynthesis.\nii. Plants use the food they have made for energy, growth, and other necessary functions (e.g.,\nrepair, seed production).\niii. Animals depend on matter from plants for growth and survival, including: 1. Eating\nphotosynthetic organisms (or other organisms that have eaten photosynthetic organisms), thus\nacquiring the matter they contain, the production of which was driven by photosynthesis. 2.\nBreathing in oxygen, which was released when plants used energy to rearrange carbon dioxide and\nwater during photosynthesis.\niv. Because animals acquire their food from photosynthetic organisms (or from other animals that\nhave eaten those organisms) and their oxygen from the products of photosynthesis, all food and\nmost of the oxygen animals use for life processes are the results of energy from the sun driving\nmatter flows through the process of photosynthesis.\nv. The process of photosynthesis has an important role in energy and matter cycling within plants\n(i.e., the conversion of carbon dioxide and water into complex carbon-based molecules (sugars)\nand oxygen, the contribution of sugars to plant growth and internal processes) as well as from\nplants to other organisms.\n• describe how plants take in water through their roots and release it by transpiration through the leaves, and how animals take in and release water","k":"Core"}]},{"id":"SCI-G7-U11-L2","sub":"Science","g":7,"u":11,"un":"Photosynthesis & respiration","l":2,"t":"Food, respiration and a healthy diet — Part 1","role":"Part 1 of 3","topic":"LS-G6-8-T6","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 14. Science and Society","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Photosynthesis & respiration","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-LSf-GRADE-6-8-YEAR 7-9","stmt":"Develop a model to describe how food is rearranged through chemical reactions forming new molecules that support growth and/or release energy as this matter moves through an organism with food broken down as it moves through the organism and energy released by aerobic respiration: the breakdown of organic molecules to enable all the other chemical processes necessary for life. Furthermore, explore and identify • Content of a healthy human diet: carbohydrates, lipids (fats and oils), proteins, vitamins, minerals, dietary fibre and water, and why each is needed; Calculations of energy requirements in a healthy daily diet; The consequences of imbalances in the diet, including obesity, starvation and deficiency diseases; • The tissues and organs of the human digestive system, including adaptations to function and how the digestive system digests food (enzymes simply as biological catalysts); • The importance of bacteria in the human digestive system; A word summary for aerobic respiration; The process of anaerobic respiration in humans and micro-organisms, including fermentation, and a word summary for anaerobic respiration; • The differences between aerobic and anaerobic respiration in terms of the reactants, the products formed and the implications for the organism. [Clarification Statement: Emphasis is on describing that molecules are broken apart and put back together and that in this process, energy is released.] [Assessment Boundary: Assessment does not include details of the chemical reactions for photosynthesis or respiration.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T6-LO01","x":"1 Components of the model\na To make sense of a phenomenon, students develop a model in which they identify the relevant components\nfor describing* how food molecules are rearranged as matter moves through an organism, including:\ni. Molecules of food, which are complex carbon-containing molecules.\nii. Oxygen.\niii. Energy that is released or absorbed during chemical reactions between food and oxygen.\niv. New types of molecules produced through chemical reactions involving food.","k":"Core"},{"c":"LS-G6–8-T6-LO02","x":"2 Relationships\na In the model, students identify and describe* the relationships between components, including:\ni. During cellular respiration, molecules of food undergo chemical reactions with oxygen, releasing\nstored energy.\nii. The atoms in food are rearranged through chemical reactions to form new molecules.","k":"Core"},{"c":"LS-G6–8-T6-LO03","x":"3 Connections\na Students use the model to describe*:\ni. The number of each type of atom being the same before and after chemical reactions, indicating\nthat the matter ingested as food is conserved as it moves through an organism to support growth.\nii. That all matter (atoms) used by the organism for growth comes from the products of the chemical\nreactions involving the matter taken in by the organism.\niii. Food molecules taken in by the organism are broken down and can then be rearranged to become the\nmolecules that comprise the organism (e.g., the proteins and other molecules in a hamburger can\nbe broken down and used to make a variety of tissues in humans).\niv. As food molecules are rearranged, energy is released and can be used to support other processes\nwithin the organism.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"LS-G6–8-T6-LO04","x":"• identify the components of a healthy human diet — carbohydrates, lipids (fats and oils), proteins, vitamins, minerals, dietary fibre and water — and state why each is needed","k":"UK Requirement"},{"c":"LS-G6–8-T6-LO05","x":"• calculate the energy requirement for a healthy daily diet and compare the energy supplied by a meal with that requirement","k":"UK Requirement"}]},{"id":"SCI-G7-U11-L3","sub":"Science","g":7,"u":11,"un":"Photosynthesis & respiration","l":3,"t":"Food, respiration and a healthy diet — Part 2","role":"Part 2 of 3","topic":"LS-G6-8-T6","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 14. Science and Society","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Photosynthesis & respiration","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-LSf-GRADE-6-8-YEAR 7-9","stmt":"Develop a model to describe how food is rearranged through chemical reactions forming new molecules that support growth and/or release energy as this matter moves through an organism with food broken down as it moves through the organism and energy released by aerobic respiration: the breakdown of organic molecules to enable all the other chemical processes necessary for life. Furthermore, explore and identify • Content of a healthy human diet: carbohydrates, lipids (fats and oils), proteins, vitamins, minerals, dietary fibre and water, and why each is needed; Calculations of energy requirements in a healthy daily diet; The consequences of imbalances in the diet, including obesity, starvation and deficiency diseases; • The tissues and organs of the human digestive system, including adaptations to function and how the digestive system digests food (enzymes simply as biological catalysts); • The importance of bacteria in the human digestive system; A word summary for aerobic respiration; The process of anaerobic respiration in humans and micro-organisms, including fermentation, and a word summary for anaerobic respiration; • The differences between aerobic and anaerobic respiration in terms of the reactants, the products formed and the implications for the organism. [Clarification Statement: Emphasis is on describing that molecules are broken apart and put back together and that in this process, energy is released.] [Assessment Boundary: Assessment does not include details of the chemical reactions for photosynthesis or respiration.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T6-LO06","x":"• describe the consequences of imbalance in the diet, including obesity, starvation and deficiency diseases","k":"UK Requirement"},{"c":"LS-G6–8-T6-LO07","x":"• identify the tissues and organs of the human digestive system, describe how each is adapted to its function, and explain the role of enzymes as biological catalysts in digestion","k":"UK Requirement"},{"c":"LS-G6–8-T6-LO08","x":"• explain the importance of bacteria in the human digestive system","k":"UK Requirement"},{"c":"LS-G6–8-T6-LO09","x":"• write the word summary for aerobic respiration: glucose + oxygen → carbon dio n; • The differences between aerobic and anaerobic respiration in terms of the reactants, the products formed and the implications for the organism. [Clarification Statement: Emphasis is on describing that molecules are broken apart and put back together and that in this process, energy is released.] [Assessment Boundary: Assessment does not include details of the chemical reactions for photosynthesis or respiration.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"LS-G6–8-T6-LO11","x":"• compare aerobic and anaerobic respiration in terms of their reactants, their products and the implications for the organism","k":"UK Requirement"}]},{"id":"SCI-G7-U12-L1","sub":"Science","g":7,"u":12,"un":"Atoms & the Periodic Table","l":1,"t":"Periodic Table patterns, oxides, catalysts and reaction rate — Part 1","role":"Part 1 of 2","topic":"PS-G6-8-T7","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Atoms & the Periodic Table","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-PSg-GRADE-6-8-YEAR 7-9","stmt":"Furthermore, explore the Periodic Table in depth - the principles underpinning Mendeleev's Periodic Table, predicting patterns in the reactions of elements from their position in the table, and the chemical properties of metal and non-metal oxides with respect to acidity; and explore the role of catalysts, together with the effect of temperature, concentration and surface area on reaction rate. Furthermore, explore the Periodic Table: periods and groups; metals and non-metals; How patterns in reactions can be predicted with reference to the Periodic Table; The properties of metals and non-metals. Explain how temperature, stirring and the surface area of the solid affect the rate at which a solid dissolves.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T7-LO01","x":"Furthermore (UK Requirement):\n• state the principles Mendeleev used to build his Periodic Table — ordering the known elements by atomic mass, placing elements with similar chemical properties in the same column, and leaving a gap rather than breaking a group — and explain how one of those gaps allowed him to predict the properties of an element that had not yet been discovered","k":"UK Requirement"},{"c":"PS-G6–8-T7-LO02","x":"• locate any element from its period and its group, and classify it as a metal or a non-metal from that position","k":"UK Requirement"},{"c":"PS-G6–8-T7-LO03","x":"• compare the properties of metals and non-metals (appearance, electrical and thermal conductivity, malleability, melting point, and the acidity of the oxide) and use the comparison to decide which side of the table an unidentified element belongs to","k":"UK Requirement"},{"c":"PS-G6–8-T7-LO04","x":"• predict the pattern in the reaction of an element from its position in the table — for example, predict how potassium reacts with water from the observed reaction of sodium one period above — and justify the prediction from the trend down the group","k":"UK Requirement"},{"c":"PS-G6–8-T7-LO05","x":"• classify metal and non-metal oxides by the acidity of the solution they form with water, test the pH to obtain that evidence, and state the general pattern that metal oxides are basic while non-metal oxides are acidic","k":"UK Requirement"}]},{"id":"SCI-G7-U12-L2","sub":"Science","g":7,"u":12,"un":"Atoms & the Periodic Table","l":2,"t":"Periodic Table patterns, oxides, catalysts and reaction rate — Part 2","role":"Part 2 of 2","topic":"PS-G6-8-T7","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"Essential","pis":"","cls":"UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Atoms & the Periodic Table","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-PSg-GRADE-6-8-YEAR 7-9","stmt":"Furthermore, explore the Periodic Table in depth - the principles underpinning Mendeleev's Periodic Table, predicting patterns in the reactions of elements from their position in the table, and the chemical properties of metal and non-metal oxides with respect to acidity; and explore the role of catalysts, together with the effect of temperature, concentration and surface area on reaction rate. Furthermore, explore the Periodic Table: periods and groups; metals and non-metals; How patterns in reactions can be predicted with reference to the Periodic Table; The properties of metals and non-metals. Explain how temperature, stirring and the surface area of the solid affect the rate at which a solid dissolves.","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"PS-G6–8-T7-LO06","x":"• explain, and show by investigation, how temperature, concentration and surface area each change the rate of a reaction, and describe the role of a catalyst in raising the rate without being used up","k":"UK Requirement"},{"c":"PS-G6–8-T7-LO07","x":"• explain how temperature, stirring and the surface area of the solid affect the rate at which a solid dissolves","k":"UK Requirement"}]},{"id":"SCI-G7-U13-L1","sub":"Science","g":7,"u":13,"un":"Chemical reactions","l":1,"t":"Conservation of mass and chemical equations — Part 1","role":"Part 1 of 2","topic":"PS-G6-8-T4","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Chemical reactions","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-PSd-GRADE-6-8-YEAR 7-9","stmt":"Develop and use a model to des
