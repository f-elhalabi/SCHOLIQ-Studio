<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schol-IQ Lesson Studio V5 · Mathematics and Science Grades 6–10</title>
<style>:root{--navy:#142E69;--navy2:#0E2250;--ink:#172B40;--mut:#5B6B7F;--line:#DCE5EE;--bg:#F3F6FA;--card:#fff;--gold:#E4A83E;--goldd:#8A5A06;--green:#18794E;--red:#AD3434;--soft:#EDF2FF;--warnbg:#FFF6E0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{line-height:1.25;margin:0;color:var(--navy);font-weight:650}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px;margin:26px 0 10px}
h3 small{font-weight:400;color:var(--mut);font-size:13px;margin-left:6px}
p{margin:0 0 10px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font-size:18px;letter-spacing:.2px}.brand span{color:#C9D5F0;font-size:13px}
.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold);margin-right:2px;transform:translateY(0)}
#top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.saved{color:#C9D5F0;font-size:13px;margin-right:6px}
.btn{border:1px solid transparent;border-radius:8px;padding:8px 15px;font-weight:600;font-size:14px;line-height:1.2}
.btn.primary{background:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy2)}
.btn.secondary{background:#fff;color:var(--navy);border-color:var(--navy)}.btn.secondary:hover{background:var(--soft)}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line)}
.top .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}.top .btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.big{padding:12px 22px;font-size:15px}
.btn.primary.big{background:var(--gold);color:#1b2433}.btn.primary.big:hover{background:#d49a30}
.link{background:none;border:0;color:var(--navy);text-decoration:underline;padding:0;font-size:13px}
/* home */
.home{max-width:1120px;margin:0 auto;padding:34px 22px 60px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:34px}
.lead{color:var(--mut);max-width:62ch;margin:8px 0 22px}
.selrow{display:grid;grid-template-columns:150px 1fr 1fr;gap:12px;margin-bottom:18px}
label{font-weight:600;font-size:14px;color:var(--ink)}
.selrow label,.teacher{display:block}
select,input[type=text],textarea{width:100%;border:1px solid #C5D1E0;border-radius:8px;padding:9px 11px;font:inherit;background:#fff;color:var(--ink);margin-top:5px}
textarea{resize:vertical;line-height:1.5;overflow:hidden}
select:focus,input:focus,textarea:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px rgba(20,46,105,.15)}
.preview{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:20px}
.pv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.pv-id{font-size:13px;color:var(--goldd);font-weight:700}
.meta{color:var(--mut);font-size:13px;margin:10px 0 12px}
.los{margin:0;padding:0;list-style:none;counter-reset:lo}
.los li{counter-increment:lo;padding:8px 0 8px 40px;border-top:1px solid var(--line);position:relative}
.los li::before{content:"LO" counter(lo);position:absolute;left:0;top:8px;font-weight:700;color:var(--navy);font-size:13px}
.los.big li{padding:10px 0 10px 44px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:5px;padding:1px 7px;margin-right:8px;vertical-align:1px}
.tag.core{background:var(--soft);color:var(--navy)}.tag.ext{background:var(--warnbg);color:var(--goldd)}
.teacher{max-width:420px}.note{color:var(--mut);font-size:13px;margin-top:14px;max-width:66ch}
.mine h2{margin-bottom:12px}.empty{color:var(--mut)}
.mine-list{display:grid;gap:8px}
.mine-row{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:left}
.mine-row:hover{border-color:var(--navy)}.mr-id{font-weight:700;color:var(--goldd);font-size:13px}.mr-t{color:var(--ink);font-weight:550}
.mr-p{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.bar{display:inline-block;width:70px;height:6px;border-radius:4px;background:#E3EAF3;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
/* workspace */
.work{max-width:1240px;margin:0 auto;padding:22px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:76px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 16px;max-height:calc(100vh - 96px);overflow:auto}
.rail-t{font-weight:650;color:var(--navy);margin:2px 0 6px;line-height:1.3}
.prog{margin:14px 0 12px;font-size:13px;color:var(--mut)}.prog .bar{display:block;width:100%;margin-bottom:6px;height:7px}
.steps{display:flex;flex-direction:column;position:relative;margin-top:6px}
.steps::before{content:"";position:absolute;left:21px;top:20px;bottom:20px;width:2px;background:var(--line)}
.step{position:relative;display:flex;align-items:center;gap:11px;background:none;border:0;text-align:left;padding:7px 8px;border-radius:9px;color:var(--ink)}
.step:hover{background:var(--soft)}.step.cur{background:var(--soft);font-weight:650}
.dot{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#fff;border:2px solid #C5D1E0;color:var(--mut);z-index:1}
.step.progress .dot{border-color:var(--gold);color:var(--goldd)}
.step.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.step.optional .dot{border-style:dashed}
.step.cur .dot{box-shadow:0 0 0 3px rgba(228,168,62,.45)}
.st-t em{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--mut)}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 30px 24px;min-width:0}
.ph{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.ph-n{font-size:13px;color:var(--goldd);font-weight:650;margin-bottom:4px}.ph p{color:var(--mut);margin:8px 0 0;max-width:68ch}
.tray{border:1px solid var(--line);border-left:4px solid var(--gold);background:#FFFCF5;border-radius:10px;padding:14px 16px;margin:0 0 16px}
.tray-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tray-s{color:var(--mut);font-size:13px;margin:6px 0 0}
details{margin-top:8px}summary{cursor:pointer;color:var(--navy);font-size:13px;font-weight:600}
pre{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Consolas,monospace;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0 0;max-height:340px;overflow:auto}
.paste{background:var(--soft);border-radius:10px;padding:14px 16px;margin-bottom:18px}
.paste-a{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}.pmsg{font-size:13px;color:var(--green)}.pmsg.bad{color:var(--red)}
.form{display:grid;gap:14px}
.fr label{display:block}.hint{display:block;font-weight:400;font-size:12.5px;color:var(--mut);margin-top:1px}
.count{font-size:13px;color:var(--mut);margin:10px 0}.count.ok{color:var(--green);font-weight:600}.count.low{color:var(--goldd);font-weight:600}
.cov{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:6px 0 4px;font-size:13px}
.chip{border-radius:20px;padding:2px 10px;font-weight:600;font-size:12.5px}.chip.ok{background:#E3F4EB;color:var(--green)}.chip.low{background:var(--warnbg);color:var(--goldd)}.covn{color:var(--mut)}
.qc,.loc{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px;background:#fff}
.qc-h,.loc-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.qc-h .x{margin-left:auto}
.warn{color:var(--goldd);font-size:12.5px;font-weight:600}.okk{color:var(--green);font-size:12.5px;font-weight:600}
.x{background:none;border:0;color:var(--red);font-size:13px;padding:2px 4px;text-decoration:underline}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.qgrid .c1{grid-column:1/-1}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;grid-column:1/-1}
.lo-n{font-weight:800;color:var(--navy)}.lo-x{margin:0 0 10px;color:var(--mut)}
.checks{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.chk{display:flex;align-items:flex-start;gap:9px;font-weight:500}.chk input{margin-top:4px;width:17px;height:17px;accent-color:var(--navy);flex:none}
.cards{display:grid;gap:10px;margin:8px 0}.card-row{display:grid;grid-template-columns:24px 1fr 1fr auto;gap:10px;align-items:start}.cn{color:var(--mut);padding-top:14px;font-weight:700}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.facts div{background:var(--bg);border-radius:9px;padding:10px 12px}.facts span{display:block;font-size:12px;color:var(--mut)}.facts strong{font-weight:600;font-size:14px}
.banner{background:var(--soft);border-radius:9px;padding:10px 14px;color:var(--navy);font-size:13.5px;margin:0 0 14px}
.banner.req{background:var(--warnbg);color:var(--goldd)}.banner.ok{background:#E3F4EB;color:var(--green)}
.checks-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks-list li{display:flex;gap:11px;align-items:flex-start;padding:8px 12px;border-radius:9px;background:var(--bg)}
.checks-list em{display:block;font-style:normal;font-size:12.5px;color:var(--mut)}
.ci{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--gold)}
.checks-list li.ok .ci{background:var(--green)}
.balance{display:grid;gap:8px}.brow{display:grid;grid-template-columns:90px 1fr 150px;gap:12px;align-items:center;font-size:13.5px}
.bbar{position:relative;height:12px;background:#E3EAF3;border-radius:7px}.bbar i{position:absolute;left:0;top:0;bottom:0;background:var(--navy);border-radius:7px}.bbar b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--gold);border-radius:2px}
.bn small{color:var(--mut)}
.manual{display:grid;gap:9px}.exp{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.donebox{display:flex;align-items:center;gap:10px;font-weight:600;background:var(--bg);padding:9px 14px;border-radius:9px;cursor:pointer}.donebox input{width:18px;height:18px;accent-color:var(--green)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
dialog{border:0;border-radius:14px;padding:0;max-width:760px;width:calc(100vw - 32px);box-shadow:0 20px 60px rgba(14,34,80,.35)}
dialog::backdrop{background:rgba(14,34,80,.55)}
.dlg{padding:22px 26px 24px;max-height:86vh;overflow:auto}.dlg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:600;color:var(--mut)}.tab.cur{color:var(--navy);border-color:var(--gold)}
.rules{max-height:300px}.dlg-a{display:flex;gap:16px;align-items:center;margin-top:14px;flex-wrap:wrap}.how{padding-left:22px}.how li{margin-bottom:10px}
@media (max-width:920px){.home{grid-template-columns:1fr}.work{grid-template-columns:1fr;padding:14px}.rail{position:static;max-height:none}.steps{flex-direction:row;overflow-x:auto;gap:4px}.steps::before{display:none}.step{flex:none}.panel{padding:20px 18px}.selrow{grid-template-columns:1fr}.qgrid{grid-template-columns:1fr}.mini{grid-template-columns:1fr}.card-row{grid-template-columns:1fr}.brow{grid-template-columns:70px 1fr 110px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media print{.top,.rail,.pfoot,.tray,.paste{display:none}}
/* v5 additions */
.fx{float:right;background:var(--soft);color:var(--navy);border:1px solid #C5D1E0;border-radius:6px;padding:1px 9px;font-size:12px;font-weight:700;font-style:italic}
.fx:hover{background:#dfe8ff}
.fr label{display:block}
.mprev{margin-top:6px;padding:8px 12px;background:#F8FAFD;border:1px dashed #C5D1E0;border-radius:8px;font-size:15.5px;line-height:2}
.math{font-family:"Cambria Math",Cambria,"STIX Two Math","Times New Roman",serif;font-size:1.08em;white-space:nowrap}
.math i{font-style:italic}.math sup,.math sub{font-size:.72em;line-height:0}
.math .mo{margin:0 .22em}.math .mfn{margin:0 .12em}
.mf{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.15}
.mfn1{padding:0 .25em;border-bottom:1.5px solid currentColor}.mfd{padding:0 .25em}
.msq{display:inline-flex;align-items:stretch;vertical-align:middle}
.mrad{font-size:1.25em;line-height:1;margin-right:-.05em}.mrc{border-top:1.5px solid currentColor;padding:0 .2em;margin-top:.12em}
.mdeg{margin-right:-.4em;align-self:flex-start}
.mss{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1}
.sub{font-size:19px;margin:30px 0 4px;padding-top:6px}.subhelp{color:var(--mut);font-size:13.5px;margin:0 0 12px;max-width:70ch}
h4,.gq{font-size:15px;color:var(--navy);margin:20px 0 8px}
.ticks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 14px}
.tick{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;background:#fff;font-weight:500}
.tick.on{border-color:var(--navy);background:var(--soft)}.tick input{width:18px;height:18px;margin-top:3px;accent-color:var(--navy);flex:none}
.tick strong{display:block;color:var(--navy)}.tick small{display:block;color:var(--mut);font-weight:400;font-size:12.5px}
#mathdlg{max-width:680px}
.pal{display:grid;gap:10px;margin:8px 0 14px}.pal-g{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start}.pal-g>span{font-size:12.5px;color:var(--mut);padding-top:9px}
.pal-g>div{display:flex;flex-wrap:wrap;gap:6px}
.pb{min-width:44px;height:40px;padding:0 10px;border:1px solid #C5D1E0;background:#fff;border-radius:8px;font-size:16px;color:var(--ink)}.pb:hover{background:var(--soft);border-color:var(--navy)}
.mlab{display:block}.mlab input{font-family:ui-monospace,Consolas,monospace;font-size:15px}
.mpreview{min-height:70px;margin-top:10px;border:1px solid var(--line);background:#F8FAFD;border-radius:10px;padding:14px 18px;font-size:22px;display:flex;align-items:center;overflow-x:auto}
.mph{color:var(--mut);font-size:14px;font-family:inherit}
.mnote{color:var(--mut);font-size:12.5px;max-width:34ch}
kbd,code{background:#EEF2F8;border-radius:4px;padding:1px 6px;font-size:12.5px}
@media (max-width:920px){.ticks{grid-template-columns:1fr}.pal-g{grid-template-columns:1fr}.pal-g>span{padding-top:0}}

.otx{display:block;white-space:pre-line;max-height:9.5em;overflow:auto}
.los.big .otx{max-height:14em}
.selrow{grid-template-columns:130px 130px 1fr 1fr}
.introbox{margin-top:12px;padding:12px 14px;background:#FFFCF5;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px}
@media (max-width:920px){.selrow{grid-template-columns:1fr}}

.stmt{margin:10px 0 14px;background:#F8FAFD;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stmt summary{font-weight:650;color:var(--navy);font-size:14px}
.stmt p{margin:8px 0 0;white-space:pre-line;font-size:14px}.stmt .srcl{color:var(--mut);font-size:12.5px}

.pasteh{margin:2px 0 8px;font-size:12.5px;color:var(--mut)}
</style>
</head>

"Single lesson","topic":"SP-G7-T4","pt":"Optional","pri":"Supporting","prov":false,"win":"13 Nov – 4 Jan","added":false,"ideas":"16 Mathematics in Society","tim":"","pis":"","cls":"Core","big":"12. Chance","code":"ADEK-Mathematics-SPd-GRADE-7-YEAR 8","stmt":"Understand that the probability of a chance event is a number between 0 and 1 on the probability scale that expresses the likelihood of the event occurring, where larger numbers indicate greater likelihood: 0 indicates an impossible event, a probability near 0 an unlikely event, a probability around 1/2 an event that is neither unlikely nor likely, a probability near 1 a likely event, and 1 a certain event; understand that the probabilities of all possible outcomes sum to 1. Record, describe and analyse the frequency of outcomes of simple probability experiments involving randomness, fairness, equally and unequally likely outcomes, using appropriate language and the 0–1 probability scale","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 6-8.pdf (Sep 2026), PDF p. 24","los":[{"c":"SP-G7-T4-LO01","x":"explain that the probability of a chance event is a number between 0 and 1 expressing how likely the event is to occur, with larger numbers indicating greater likelihood","k":"Core"},{"c":"SP-G7-T4-LO02","x":"interpret positions on the 0–1 probability scale, recognising 0 as impossible, a probability near 0 as unlikely, around 1/2 as neither unlikely nor likely, near 1 as likely, and 1 as certain","k":"Core"},{"c":"SP-G7-T4-LO03","x":"explain that the probabilities of all the possible outcomes of an experiment sum to 1","k":"Core"},{"c":"SP-G7-T4-LO04","x":"record, describe and analyse the frequency of outcomes of simple probability experiments","k":"Core"},{"c":"SP-G7-T4-LO05","x":"use appropriate language to describe randomness, fairness, and equally and unequally likely outcomes","k":"Core"}]},{"id":"G7-U10-L2","sub":"Mathematics","g":7,"u":10,"un":"Probability and Compound Events","l":2,"t":"Experimental Probabilit orised, completed- square, growth/decay form), and compare properties of two functions each represented differently (algebraically, graphically, numerically, or verbally).","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 14","los":[{"c":"F-G9-10-T3-LO01","x":"graph linear, quadratic, simple cubic and reciprocal functions, identifying key features including intercepts, zeros, maximum and minimum values and end behaviour","k":"Core"},{"c":"F-G9-10-T3-LO02","x":"graph exponential and trigonometric functions for angles of any size (in degrees), identifying key features including period, midline and amplitude (higher tier)","k":"Core"},{"c":"F-G9-10-T3-LO03","x":"write a quadratic function in an equivalent form (factorised or completed-square) to reveal its zeros, extreme values and line of symmetry","k":"Core"},{"c":"F-G9-10-T3-LO04","x":"compare the properties of two functions each represented in a different way (algebraically, graphically, numerically in tables, or verbally)","k":"Core"},{"c":"F-G9-10-T3-LO05","x":"graph square root, cube root, absolute value and piecewise-defined functions, including step functions","k":"US Requirement"}]},{"id":"G10-U2-L2","sub":"Mathematics","g":10,"u":2,"un":"Function Graphs and Mathematical Models","l":2,"t":"Sketching and Interpreting Function Graphs — Part 2: Practice and Applications","role":"Part 2 – Practice and Applications","topic":"F-G9–10-T3","pt":"Optional","pri":"Essential","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"16 Mathematics in Society","tim":"","pis":"Essential – named in PISA 2022 (ADEK v1.2)","cls":"Core","big":"7. Functions and Change","code":"ADEK-Mathematics-Fc-GRADE-9-10-YEAR 10-11","stmt":"Graph functions and show key features — linear, quadratic, simple cubic, reciprocal {, exponential and trigonometric} — write functions in equivalent forms to reveal properties (factorised, completed- square, growth/decay form), and compare properties of two functions each repre higher tier)","k":"Core"},{"c":"F-G9-10-T5-LO04","x":"interpret an inverse function, relating its graph to that of the original function (higher tier)","k":"Core"}]},{"id":"G10-U2-L4","sub":"Mathematics","g":10,"u":2,"un":"Function Graphs and Mathematical Models","l":4,"t":"Linear and Exponential Models","role":"Single lesson","topic":"F-G9–10-T6","pt":"Required","pri":"Essential","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"15 Problem Solving and Modelling; 16 Mathematics in Society","tim":"","pis":"Essential – named in PISA 2022 (ADEK v1.2)","cls":"Core + UK Requirement","big":"7. Functions and Change","code":"ADEK-Mathematics-Ff-GRADE-9-10-YEAR 10-11","stmt":"Distinguish situations modelled by linear functions from those modelled by exponential functions; construct such models from graphs, tables, or descriptions; observe that exponentially growing quantities eventually exceed polynomial ones; and interpret the parameters of a model in context. Furthermore, apply growth and decay problems, including compound interest and direct and inverse proportion graphs, with the exponential function (y=k^x).","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 15","los":[{"c":"F-G9-10-T6-LO01","x":"distinguish situations that can be modelled by linear functions from those that can be modelled by exponential functions","k":"Core"},{"c":"F-G9-10-T6-LO02","x":"construct linear and exponential models from graphs, tables of values or verbal descriptions","k":"Core"},{"c":"F-G9-10-T6-LO03","x":"observe that a quantity growing exponentially eventually exceeds one growing as a polynomial function","k":"Core"},{"c":"F-G9-10-T6-LO04","x":"interpret the parameters of a linear or exponential model in terms of the context","k":"Core"},{"c":"F-G9-10-T6-LO05","x":"solve growth and decay problems, including compound interest,","k":"UK Requirement"}]},{"id":"G10-U3-L1","sub":"Mathematics","g":10,"u":3,"un":"Geometric Proofs and Similarity","l":1,"t":"Proving Theorems About Lines, Angles and Triangles","role":"Single lesson","topic":"GEO-G9–10-T4","pt":"Optional","pri":"Supporting","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"13 Reasoning and Proof; 16 Mathematics in Society","tim":"","pis":"","cls":"Core","big":"8. Shape and Space","code":"ADEK-Mathematics-GEOd-GRADE-9-10-YEAR 10-11","stmt":"Prove theorems about lines and angles (vertical angles, angles formed with parallel lines), about triangles (angle sum, base angles of isosceles triangles, the midsegment relationship), and about parallelograms (opposite sides and angles, bisecting diagonals); achieved through applying angle facts, triangle congruence, similarity and properties of quadrilaterals to derive results and obtain simple proofs, and reasoning deductively in geometry.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 16","los":[{"c":"GEO-G9-10-T4-LO01","x":"prove theorems about lines and angles, including the equality of vertically opposite angles and the angle relationships formed when a transversal crosses parallel lines","k":"Core"},{"c":"GEO-G9-10-T4-LO02","x":"prove theorems about triangles, including the angle sum, the equality of the base angles of an isosceles triangle, and the midsegment relationship","k":"Core"},{"c":"GEO-G9-10-T4-LO03","x":"prove theorems about parallelograms, including the equality of opposite sides and angles and the bisection of the diagonals","k":"Core"},{"c":"GEO-G9-10-T4-LO04","x":"apply angle facts, triangle congruence, similarity and the properties of quadrilaterals to derive results and obtain simple proofs","k":"Core"},{"c":"GEO-G9-10-T4-LO05","x":"reason deductively in geometry, setting out each step of an argument with its justification","k":"Core"}]},{"id":"G10-U3-L2","sub":"Mathematics","g":10,"u":3,"un":"Geometric Proofs and Similarity","l":2,"t":"Similarity Transformations","role":"Single lesson","topic":"GEO-G9–10-T6","pt":"Optional","pri":"Essential","prov":true,"win":"1 ns and areas of triangles and rectangles using coordinates, including the distance formula, achieved through using the equation of a line through two given points and the form (y=mx+c) to identify parallel and perpendicular lines and find the equation of a line through a given point with a given gradient.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 18","los":[{"c":"GEO-G9-10-T11-LO01","x":"use coordinates to prove simple geometric theorems algebraically","k":"Core"},{"c":"GEO-G9-10-T11-LO02","x":"use the gradient criteria for parallel and perpendicular lines to solve geometric problems","k":"Core"},{"c":"GEO-G9-10-T11-LO03","x":"find the coordinates of the point that partitions a line segment in a given ratio","k":"Core"}]},{"id":"G10-U3-L5","sub":"Mathematics","g":10,"u":3,"un":"Geometric Proofs and Similarity","l":5,"t":"Coordinate Proofs and Parallel/Perpendicular Lines — Part 2: Practice and Applications","role":"Part 2 – Practice and Applications","topic":"GEO-G9–10-T11","pt":"Required","pri":"Essential","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"13 Reasoning and Proof; 16 Mathematics in Society","tim":"","pis":"Essential – named in PISA 2022 (ADEK v1.2)","cls":"Core","big":"8. Shape and Space","code":"ADEK-Mathematics-GEOk-GRADE-9-10-YEAR 10-11","stmt":"Use coordinates to prove simple geometric theorems algebraically; use the slope criteria for parallel and perpendicular lines to solve geometric problems; find the point that partitions a line segment in a given ratio; and compute perimeters of polygons and areas of triangles and rectangles using coordinates, including the distance formula, achieved through using the equation of a line through two given points and the form (y=mx+c) to identify parallel and perpendicular lines and find the equation of a line through a given point with a given gradient.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 18","los":[{"c":"GEO-G9-10-T11-LO04","x":"compute the perimeters of polygons and the areas of triangles and rectangles using coordinates and the distance formula","k":"Core"},{"c":"GEO-G9-10-T11-LO05","x":"find the equation of the straight line through two given points and write it in the form y = mx + c","k":"Core"},{"c":"GEO-G9-10-T11-LO06","x":"use the form y = mx + c to identify parallel and perpendicular lines and to find the equation of a line through a given point with a given gradient","k":"Core"}]},{"id":"G10-U4-L1","sub":"Mathematics","g":10,"u":4,"un":"Trigonometry","l":1,"t":"Trigonometric Ratios in Right Triangles","role":"Single lesson","topic":"GEO-G9–10-T8","pt":"Optional","pri":"Essential","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"16 Mathematics in Society","tim":"","pis":"Essential – named in PISA 2022 (ADEK v1.2)","cls":"Core + UK Requirement","big":"8. Shape and Space","code":"ADEK-Mathematics-GEOh-GRADE-9-10-YEAR 10-11","stmt":"Understand that side ratios in right triangles are properties of the angles, defining the trigonometric ratios; explain the relationship between the sine and cosine of complementary angles; and use trigonometric ratios and the Pythagorean Theorem to solve right triangles in applied problems. Use exact values of (\\sin), (\\cos), and (\\tan) for key angles in two dimensions. Furthermore, apply trigonometric ratios to solve problems involving three-dimensional figures.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 17","los":[{"c":"GEO-G9-10-T8-LO01","x":"explain that the side ratios in a right triangle are properties of its angles, and use them to define sine, cosine and tangent","k":"Core"},{"c":"GEO-G9-10-T8-LO02","x":"explain the relationship between the sine and cosine of complementary angles","k":"Core"},{"c":"GEO-G9-10-T8-LO03","x":"use trigonometric ratios and the Pythagorean Theorem to find unknown sides and angles of right triangles in applied problems","k":"Core"},{"c":"GEO-G9-10-T8-LO04","x":"use the exact values of sin, cos and tan for key angles in two dimensions","k":"Core"},{"c":"GEO-G9-10-T8-LO05","x":"apply trigonometric ratios to solve problems involving three-dimensional figures","k":"UK Requirement"}]},{"id":"G10-U4-L2","sub":"Mathematics","g":10,"u":4,"un":"Trigonometry","l":2,"t":"Sine and Cosine Rules","role":"Single lesson","topic":"GEO-G9–10-T14","pt":"Required","pri":"Supporting","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"13 Reasoning and Proof; 16 Mathematics in Society","tim":"","pis":"","cls":"UK Requirement","big":"8. Shape and Space","code":"ADEK-Mathematics-GEOn-GRADE-9-10-YEAR 10-11","stmt":"Furthermore, derive the formula Derive the formula A = 1/2 ab sin(C)for the area of a triangle; prove and use the Laws of Sines and Cosines to solve problems; and understand and apply the Laws of Sines and Cosines to find unknown measurements in right and non-right triangles, including in applied problems such as surveying and resultant forces.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 19","los":[{"c":"GEO-G9-10-T14-LO01","x":"derive the formula A = ½ab sin C for the area of a triangle","k":"UK Requirement"},{"c":"GEO-G9-10-T14-LO02","x":"prove the Laws of Sines and Cosines and use them to solve problems","k":"UK Requirement"},{"c":"GEO-G9-10-T14-LO03","x":"apply the Laws of Sines and Cosines to find unknown measurements in right and non-right triangles","k":"UK Requirement"},{"c":"GEO-G9-10-T14-LO04","x":"use these laws in applied problems such as surveying and finding resultant forces","k":"UK Requirement"}]},{"id":"G10-U5-L1","sub":"Mathematics","g":10,"u":5,"un":"Circle Geometry","l":1,"t":"Circle Theorems","role":"Single lesson","topic":"GEO-G9–10-T9","pt":"Optional","pri":"Essential","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"13 Reasoning and Proof; 16 Mathematics in Society","tim":"","pis":"Essential – named in PISA 2022 (ADEK v1.2)","cls":"Core","big":"8. Shape and Space","code":"ADEK-Mathematics-GEOi-GRADE-9-10-YEAR 10-11","stmt":"Understand that all circles are similar; identify and apply circle theorem relationships among inscribed angles, radii, chords, and tangents, including proving the standard circle theorems and using them to prove related results; construct inscribed and circumscribed circles of a triangle; and calculate arc lengths, angles, and areas of sectors. Circle definitions, arcs, and sectors are statutory.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 17","los":[{"c":"GEO-G9-10-T9-LO01","x":"explain why all circles are similar","k":"Core"},{"c":"GEO-G9-10-T9-LO02","x":"identify and apply the circle theorem relationships among inscribed angles, radii, chords and tangents","k":"Core"},{"c":"GEO-G9-10-T9-LO03","x":"prove the standard circle theorems and use them to prove related results","k":"Core"},{"c":"GEO-G9-10-T9-LO04","x":"construct the inscribed and circumscribed circles of a triangle","k":"Core"},{"c":"GEO-G9-10-T9-LO05","x":"calculate arc lengths, the angles they subtend at the centre, and the areas of sectors","k":"Core"}]},{"id":"G10-U5-L2","sub":"Mathematics","g":10,"u":5,"un":"Circle Geometry","l":2,"t":"Equation of a Circle","role":"Single lesson","topic":"GEO-G9–10-T10","pt":"Required","pri":"Supporting","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"16 Mathematics in Society","tim":"","pis":"","cls":"Core + UK Requirement","big":"8. Shape and Space","code":"ADEK-Mathematics-GEOj-GRADE-9-10-YEAR 10-11","stmt":"Derive the equation of a circle of given centre and radius using the Pythagorean Theorem, and complete the square to find the centre and radius of a circle given by an equation. Furthermore, recognise and use the equation of a circle with centre at the origin and find the equation of a tangent to a circle at a given point; extend to circles with a general centre.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 18","los":[{"c":"GEO-G9-10-T10-LO01","x":"derive the equation of a circle of given centre and radius using the Pythagorean Theorem","k":"Core"},{"c":"GEO-G9-10-T10-LO02","x":"complete the square on a given equation to find the centre and the radius of the circle it describes","k":"Core"},{"c":"GEO-G9-10-T10-LO03","x":"recognise and use the equation of a circle with its centre at the origin","k":"UK Requirement"},{"c":"GEO-G9-10-T10-LO04","x":"find the equation of the tangent to a circle at a given point, extending this to circles with a general centre","k":"UK Requirement"}]},{"id":"G10-U6-L1","sub":"Mathematics","g":10,"u":6,"un":"Vectors in Geometry","l":1,"t":"Vectors","role":"Single lesson","topic":"GEO-G9–10-T15","pt":"Required","pri":"Supporting","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"14 Representation; 16 Mathematics in Society","tim":"","pis":"","cls":"UK Requirement","big":"9. Transformation and Symmetry","code":"ADEK-Mathematics-GEOo-GRADE-9-10-YEAR 10-11","stmt":"Furthermore, Describe translations as 2-D vectors; apply addition and subtraction of vectors, multiplication of a vector by a scalar, and diagrammatic and column representations of vectors {and use vectors to construct geometric arguments and proofs}","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 19","los":[{"c":"GEO-G9-10-T15-LO01","x":"describe translations as 2-D vectors","k":"UK Requirement"},{"c":"GEO-G9-10-T15-LO02","x":"apply addition and subtraction of vectors and multiplication of a vector by a scalar","k":"UK Requirement"},{"c":"GEO-G9-10-T15-LO03","x":"use diagrammatic and column representations of vectors interchangeably","k":"UK Requirement"},{"c":"GEO-G9-10-T15-LO04","x":"use vectors to construct geometric arguments and proofs (higher tier)","k":"UK Requirement"}]},{"id":"G10-U7-L1","sub":"Mathematics","g":10,"u":7,"un":"Geometric Measurement and Modelling","l":1,"t":"Volume Formulas and Mathematical Arguments","role":"Single lesson","topic":"GEO-G9–10-T12","pt":"Optional","pri":"Essential","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"13 Reasoning and Proof; 16 Mathematics in Society","tim":"","pis":"Essential – named in PISA 2022 (ADEK v1.2)","cls":"Core","big":"10. Measurement","code":"ADEK-Mathematics-GEOl-GRADE-9-10-YEAR 10-11","stmt":"Give informal arguments for circumference, area and volume formulas (dissection and informal limit arguments), use volume formulas for cylinders, pyramids, cones and spheres to solve problems, and identify the shapes of cross-sections of three- dimensional objects; achieved through statutory surface areas and volumes of spheres, pyramids, cones and composite solids, and plans and elevations of 3-D shapes.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 18","los":[{"c":"GEO-G9-10-T12-LO01","x":"give informal arguments for the formulas for circumference, area and volume, using dissection and informal limit arguments","k":"Core"},{"c":"GEO-G9-10-T12-LO02","x":"use the volume formulas for cylinders, pyramids, cones and spheres to solve problems","k":"Core"},{"c":"GEO-G9-10-T12-LO03","x":"calculate the surface areas and volumes of spheres, pyramids, cones and composite solids","k":"Core"},{"c":"GEO-G9-10-T12-LO04","x":"identify the shapes of cross-sections of three-dimensional objects","k":"Core"},{"c":"GEO-G9-10-T12-LO05","x":"draw and interpret plans and elevations of 3-D shapes","k":"Core"}]},{"id":"G10-U7-L2","sub":"Mathematics","g":10,"u":7,"un":"Geometric Measurement and Modelling","l":2,"t":"Modelling with Geometry","role":"Single lesson","topic":"GEO-G9–10-T13","pt":"Required","pri":"Essential","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"15 Problem Solving and Modelling; 16 Mathematics in Society","tim":"","pis":"Essential – named in PISA 2022 (ADEK v1.2)","cls":"Core + UK Requirement","big":"10. Measurement","code":"ADEK-Mathematics-GEOm-GRADE-9-10-YEAR 10-11","stmt":"Use geometric shapes, their measures, and their properties to describe real objects; apply concepts of density based on area and volume in modelling situations; and apply geometric methods to solve design problems. Furthermore, interpret and use bearings.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 19","los":[{"c":"GEO-G9-10-T13-LO01","x":"use geometric shapes, their measures and their properties to describe real objects","k":"Core"},{"c":"GEO-G9-10-T13-LO02","x":"apply concepts of density based on area and volume in modelling situations","k":"Core"},{"c":"GEO-G9-10-T13-LO03","x":"apply geometric methods to solve design problems, working within given constraints","k":"Core"},{"c":"GEO-G9-10-T13-LO04","x":"interpret and use bearings to describe direction and to solve problems","k":"UK Requirement"}]},{"id":"G10-U8-L1","sub":"Mathematics","g":10,"u":8,"un":"Statistical Inference","l":1,"t":"Statistical Inference from Samples","role":"Single lesson","topic":"SP-G9–10-T4","pt":"Required","pri":"Essential","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"15 Problem Solving and Modelling; 16 Mathematics in Society","tim":"","pis":"Essential – named in PISA 2022 (ADEK v1.2)","cls":"Core","big":"11. Data","code":"ADEK-Mathematics-SPd-GRADE-9-10-YEAR 10-11","stmt":"Understand statistics as a process for making inferences about population parameters from a random sample, and decide whether a specified model is consistent with results from a data- generating process; achieved through the statutory requirements to infer properties of populations from a sample while knowing the limitations of sampling, and to understand that empirical unbiased samples tend towards theoretical probability distributions with increasing sample size.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 20","los":[{"c":"SP-G9-10-T4-LO01","x":"explain statistics as a process for making inferences about population parameters from a random sample","k":"Core"},{"c":"SP-G9-10-T4-LO02","x":"decide whether a specified model is consistent with the results from a data-generating process","k":"Core"},{"c":"SP-G9-10-T4-LO03","x":"infer properties of a population from a sample, recognising the limitations of sampling","k":"Core"},{"c":"SP-G9-10-T4-LO04","x":"explain that empirical unbiased samples tend towards the theoretical probability distribution as the sample size increases","k":"Core"}]},{"id":"G10-U9-L1","sub":"Mathematics","g":10,"u":9,"un":"Probability and Decision-Making","l":1,"t":"Sample Spaces and Independence — Part 1: Concepts and Foundations","role":"Part 1 – Concepts and Foundations","topic":"SP-G9–10-T5","pt":"Optional","pri":"Essential","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"15 Problem Solving and Modelling; 16 Mathematics in Society","tim":"","pis":"Essential – named in PISA 2022 (ADEK v1.2)","cls":"Core + UK Requirement","big":"12. Chance","code":"ADEK-Mathematics-SPe-GRADE-9-10-YEAR 10-11","stmt":"Describe events as subsets of a sample space using unions, intersections, and complements; understand independence of events as the product condition; understand and compute conditional probabilities and interpret independence through conditional probabilities, including using two-way frequency tables; and recognise and explain these concepts in everyday situations. Achieved through calculating the probability of independent and dependent combined events, including using tree diagrams and Venn diagrams, and calculating and interpreting conditional probabilities using expected frequencies with two-way tables, tree diagrams, and Venn diagrams.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 20","los":[{"c":"SP-G9-10-T5-LO01","x":"describe events as subsets of a sample space using unions, intersections and complements","k":"Core"},{"c":"SP-G9-10-T5-LO02","x":"show that two events are independent by testing the condition that the probability of both occurring is the product of their probabilities","k":"Core"},{"c":"SP-G9-10-T5-LO03","x":"compute conditional probabilities and interpret independence through them, including by using two-way frequency tables","k":"Core"},{"c":"SP-G9-10-T5-LO04","x":"recognise and explain conditional probability and independence in everyday situations","k":"Core"}]},{"id":"G10-U9-L2","sub":"Mathematics","g":10,"u":9,"un":"Probability and Decision-Making","l":2,"t":"Sample Spaces and Independence — Part 2: Practice and Applications","role":"Part 2 – Practice and Applications","topic":"SP-G9–10-T5","pt":"Optional","pri":"Essential","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"15 Problem Solving and Modelling; 16 Mathematics in Society","tim":"","pis":"Essential – named in PISA 2022 (ADEK v1.2)","cls":"Core + UK Requirement","big":"12. Chance","code":"ADEK-Mathematics-SPe-GRADE-9-10-YEAR 10-11","stmt":"Describe events as subsets of a sample space using unions, intersections, and complements; understand independence of events as the product condition; understand and compute conditional probabilities and interpret independence through conditional probabilities, including using two-way frequency tables; and recognise and explain these concepts in everyday situations. Achieved through calculating the probability of independent and dependent combined events, including using tree diagrams and Venn diagrams, and calculating and interpreting conditional probabilities using expected frequencies with two-way tables, tree diagrams, and Venn diagrams.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 20","los":[{"c":"SP-G9-10-T5-LO05","x":"calculate the probability of independent and dependent combined events, using tree diagrams and Venn diagrams","k":"Core"},{"c":"SP-G9-10-T5-LO06","x":"calculate and interpret conditional probabilities from expected frequencies in two-way tables, tree diagrams and Venn diagrams","k":"Core"},{"c":"SP-G9-10-T5-LO07","x":"apply systematic listing strategies, including the product rule for counting, to enumerate outcomes systematically","k":"UK Requirement"}]},{"id":"G10-U9-L3","sub":"Mathematics","g":10,"u":9,"un":"Probability and Decision-Making","l":3,"t":"Conditional Probability and the Addition Rule","role":"Single lesson","topic":"SP-G9–10-T6","pt":"Optional","pri":"Essential","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"14 Representation; 15 Problem Solving and Modelling; 16 Mathematics in Society","tim":"","pis":"Essential – named in PISA 2022 (ADEK v1.2)","cls":"Core + UK Requirement","big":"12. Chance","code":"ADEK-Mathematics-SPf-GRADE-9-10-YEAR 10-11","stmt":"Find the conditional probability of A given B as the fraction of B's outcomes that also belong to A, and apply the Addition Rule P(A or B) = P(A) + P(B) − P(A and B), interpreting the answers in terms of the model; achieved through the statutory property that the probabilities of an exhaustive set of mutually exclusive events sum to 1 and the use of combined-event probability. Furthermore, calculate and interpret conditional probabilities using expected frequencies with two- way tables, tree diagrams, and Venn diagrams.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 21","los":[{"c":"SP-G9-10-T6-LO01","x":"find the conditional probability of A given B as the fraction of B's outcomes that also belong to A","k":"Core"},{"c":"SP-G9-10-T6-LO02","x":"apply the Addition Rule P(A or B) = P(A) + P(B) − P(A and B) and interpret the answer in terms of the model","k":"Core"},{"c":"SP-G9-10-T6-LO03","x":"use the property that the probabilities of an exhaustive set of mutually exclusive events sum to 1","k":"Core"},{"c":"SP-G9-10-T6-LO04","x":"calculate the probability of combined events, choosing an appropriate representation","k":"Core"},{"c":"SP-G9-10-T6-LO05","x":"calculate and interpret conditional probabilities from expected frequencies in two-way tables, tree diagrams and Venn diagrams","k":"UK Requirement"}]},{"id":"G10-U9-L4","sub":"Mathematics","g":10,"u":9,"un":"Probability and Decision-Making","l":4,"t":"Probability and Fair Decisions","role":"Single lesson","topic":"SP-G9–10-T7","pt":"Required","pri":"Essential","prov":true,"win":"13 Nov – 5 Jan","added":false,"ideas":"15 Problem Solving and Modelling; 16 Mathematics in Society","tim":"","pis":"Essential – named in PISA 2022 (ADEK v1.2)","cls":"Core","big":"12. Chance","code":"ADEK-Mathematics-SPg-GRADE-9-10-YEAR 10-11","stmt":"Use probabilities to make fair decisions (for example, drawing by lots or using a random number generator) and analyse decisions and strategies using probability concepts (product testing, medical testing, game strategy); achieved through the statutory use of probability models to predict the outcomes of future experiments and the relative- frequency view of probability.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf (Sep 2026), PDF p. 21","los":[{"c":"SP-G9-10-T7-LO01","x":"use probabilities to make fair decisions, for example by drawing lots or using a random number generator","k":"Core"},{"c":"SP-G9-10-T7-LO02","x":"analyse decisions and strategies using probability concepts, in contexts such as product testing, medical testing and game strategy","k":"Core"},{"c":"SP-G9-10-T7-LO03","x":"use a probability model to predict the outcomes of future experiments","k":"Core"},{"c":"SP-G9-10-T7-LO04","x":"relate relative frequency from experiments to theoretical probability, recognising how the two converge as the number of trials increases","k":"Core"}]},{"id":"SCI-G6-U1-L1","sub":"Science","g":6,"u":1,"un":"Earth's structure & processes","l":1,"t":"The geologic time scale and rock strata","role":"Single lesson","topic":"ESS-G6-8-T1","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Earth's structure & processes","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSa-GRADE-6-8-YEAR 7-9","stmt":"Construct a scientific explanation based on evidence from rock strata for how the geologic time scale is used to organize Earth's 4.6-billion-year-old history — using the rock cycle and the formation of sedimentary rocks as the source of strata. [Clarification Statement: Emphasis is on how analyses of rock formations and the fossils they contain are used to establish relative ages of major events in Earth’s history. Examples of Earth’s major events could range from being very recent (such as the last Ice Age or the earliest fossils of homo sapiens) to very old (such as the formation of Earth or the earliest evidence of life). Examples can include the formation of mountain chains and ocean basins, the evolution or extinction of particular living organisms, or significant volcanic eruptions.] [Assessment Boundary: Assessment does not include recalling the names of specific periods or epochs and events within them.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T1-LO01","x":"1 Articulating the explanation of phenomena\na Students articulate a statement that relates the given phenomenon to a scientific idea, including how\nevents in the Earth’s 4.6 billion-year-old history are organized relative to one another using the\ngeologic time scale.","k":"Core"},{"c":"ESS-G6–8-T1-LO02","x":"b Students use evidence and reasoning to construct an explanation. In their explanation, students\ndescribe* how the relative order of events is determined on the geologic time scale using:\ni. Rock strata and relative ages of rock units (e.g., patterns of layering).\nii. Major events in the Earth’s history and/or specific changes in fossils over time (e.g.,\nformation of mountain chains, formation of ocean basins, volcanic eruptions, glaciations,\nasteroid impacts, extinctions of groups of organism).","k":"Core"},{"c":"ESS-G6–8-T1-LO03","x":"2 Evidence\na Students identify and describe* the evidence necessary for constructing the explanation, including:\ni. Types and order of rock strata.\nii. The fossil record.\niii. Identification of and evidence for major event(s) in the Earth’s history (e.g., volcanic\neruptions, asteroid impacts, etc.).\nb Students use multiple valid and reliable sources of evidence, which may include students’ own\nexperiments. Reasoning","k":"Core"},{"c":"ESS-G6–8-T1-LO04","x":"3 a Students use reasoning, along with the assumption that theories and laws that describe the natural world operate today as they did in the past and will continue to do so in the future, to connect the evidence and support an explanation for how the geologic time scale is used to construct a timeline of the Earth’s history. Students describe* the following chain of reasoning for their explanation:\ni. Unless they have been disturbed by subsequent activity, newer rock layers sit on top of older\nrock layers, allowing for a relative ordering in time of the formation of the layers (i.e.,\nolder sedimentary rocks lie beneath younger sedimentary rocks).\nii. Any rocks or features that cut existing rock strata are younger than the rock strata that they\ncut (e.g., a younger fault cutting across older, existing rock strata).\niii. The fossil record can provide relative dates based on the appearance or disappearance of\norganisms (e.g., fossil layers that contain only extinct animal groups are usually older than\nfossil layers that contain animal groups that are still alive today, and layers with only\nmicrobial fossils are typical of the earliest evidence of life).\niv. Specific major events (e.g., extensive lava flows, volcanic eruptions, asteroid impacts) can be\nused to indicate periods of time that occurred before a given event from periods that occurred\nafter it.\nv. Using a combination of the order of rock layers, the fossil record, and evidence of major\ngeologic events, the relative time ordering of events can be constructed as a model for Earth’s\nhistory, even though the timescales involved are immensely vaster than the lifetimes of humans\nor the entire history of humanity.","k":"Core"}]},{"id":"SCI-G6-U1-L2","sub":"Science","g":6,"u":1,"un":"Earth's structure & processes","l":2,"t":"Evidence for plate tectonics","role":"Single lesson","topic":"ESS-G6-8-T4","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"","cls":"Core","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Earth's structure & processes","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSd-GRADE-6-8-YEAR 7-9","stmt":"Analyze and interpret data on the distribution of fossils and rocks, continental shapes, and seafloor structures to provide evidence of the past plate motions — drawing on the composition and structure of the Earth and the rock cycle. Note on alignment: plate tectonics is not named in the NC KS3 science programme — the ADEK core brings it forward; KS3 provides the Earth-structure foundation. [Clarification Statement: Examples of data include similarities of rock and fossil types on different continents, the shapes of the continents (including continental shelves), and the locations of ocean structures (such as ridges, fracture zones, and trenches).] [Assessment Boundary: Paleomagnetic anomalies in oceanic and continental crust are not assessed.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T4-LO01","x":"1 Organizing data\na Students organize given data that represent the distribution and ages of fossils and rocks,\ncontinental shapes, seafloor structures, and/or age of oceanic crust.","k":"Core"},{"c":"ESS-G6–8-T4-LO02","x":"b Students describe* what each dataset represents.\nc Students organize the given data in a way that facilitates analysis and interpretation.","k":"Core"},{"c":"ESS-G6–8-T4-LO03","x":"2 Identifying relationships\na Students analyze the data to identify relationships (including relationships that can be used to infer\nnumerical rates of change, such as patterns of age of seafloor) in the datasets about Earth features.","k":"Core"},{"c":"ESS-G6–8-T4-LO04","x":"3 Interpreting data\na Students use the analyzed data to provide evidence for past plate motion. Students describe*:\ni. Regions of different continents that share similar fossils and similar rocks suggest that, in\nthe geologic past, those sections of continent were once attached and have since separated.\nii. The shapes of continents, which roughly fit together (like pieces in a jigsaw puzzle) suggest\nthat those land masses were once joined and have since separated.\niii. The separation of continents by the sequential formation of new seafloor at the center of the","k":"Core"},{"c":"ESS-G6–8-T4-LO05","x":"ocean is inferred by age patterns in oceanic crust that increase in age from the center of the\nocean to the edges of the ocean.\niv. The distribution of seafloor structures (e.g., volcanic ridges at the centers of oceans,\ntrenches at the edges of continents) combined with the patterns of ages of rocks of the seafloor\n(youngest ages at the ridge, oldest ages at the trenches) supports the interpretation that new\ncrust forms at the ridges and then moves away from the ridges as new crust continues to form and\nthat the oldest crust is being destroyed at seafloor trenches.","k":"Core"}]},{"id":"SCI-G6-U2-L1","sub":"Science","g":6,"u":2,"un":"Resources & human impact","l":1,"t":"Uneven distribution of Earth's resources","role":"Single lesson","topic":"ESS-G6-8-T9","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories, 14. Science and Society","tim":"Essential","pis":"","cls":"Core","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Resources & human impact","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSi-GRADE-6-8-YEAR 7-9","stmt":"Construct a scientific explanation based on evidence for how the uneven distributions of Earth's mineral, energy, and groundwater resources are the result of past and current geoscience processes — by applying the idea of Earth as a source of limited resources [Clarification Statement: Emphasis is on how these resources are limited and typically non-renewable, and how their distributions are significantly changing as a result of removal by humans. Examples of uneven distributions of resources as a result of past processes include but are not limited to petroleum (locations of the burial of organic marine sediments and subsequent geologic traps), metal ores (locations of past volcanic and hydrothermal activity associated with subduction zones), and soil (locations of active weathering and/or deposition of rock).]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T9-LO01","x":"1 Articulating the explanation of phenomena\na Students articulate a statement relating a given phenomenon to scientific ideas, including that past\nand current geoscience processes have caused the uneven distribution of the Earth’s resources,\nincluding:\ni. That the uneven distributions of the Earth’s mineral, energy, and groundwater resources are the\nresults of past and current geologic processes.\nii. That resources are typically limited and nonrenewable due to factors such as the long amounts of\ntime required for some resources to form or the environment in which resources were created\nforming once or only rarely in the Earth’s history.","k":"Core"},{"c":"ESS-G6–8-T9-LO02","x":"b Students use evidence and reasoning to construct a scientific explanation of the phenomenon.","k":"Core"},{"c":"ESS-G6–8-T9-LO03","x":"2 Identifying the scientific evidence to construct the explanation\na Students identify and describe* the evidence necessary for constructing the explanation, including:\ni. Type and distribution of an example of each type of Earth resource: mineral, energy, and\ngroundwater.\nii. Evidence for the past and current geologic processes (e.g., volcanic activity, sedimentary\nprocesses) that have resulted in the formation of each of the given resources.\niii. The ways in which the extraction of each type of resource by humans changes how much and where\nmore of that resource can be found.","k":"Core"},{"c":"ESS-G6–8-T9-LO04","x":"b Students use multiple valid and reliable sources of evidence.","k":"Core"},{"c":"ESS-G6–8-T9-LO05","x":"3 Reasoning\na Students use reasoning to connect the evidence and support an explanation. Students describe* a chain\nof reasoning that includes:\ni. The Earth’s resources are formed as a result of past and current geologic processes.\nii. The environment or conditions that formed the resources are specific to certain areas and/or\ntimes on Earth, thus identifying why those resources are found only in those specific\nplaces/periods.\niii. As resources as used, they are depleted from the sources until they can be replenished, mainly\nthrough geologic processes.\niv. Because many resources continue to be formed in the same ways that they were in the past, and\nbecause the amount of time required to form most of these resources (e.g., minerals, fossil\nfuels) is much longer than timescales of human lifetimes, these resources are limited to current\nand near-future generations. Some resources (e.g., groundwater) can be replenished on human\ntimescales and are limited based on distribution.\nv. The extraction and use of resources by humans decreases the amounts of these resources available\nin some locations and changes the overall distribution of these resources on Earth.","k":"Core"}]},{"id":"SCI-G6-U2-L2","sub":"Science","g":6,"u":2,"un":"Resources & human impact","l":2,"t":"Population, consumption and Earth's systems — Part 1","role":"Part 1 of 2","topic":"ESS-G6-8-T12","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories, 14. Science and Society","tim":"","pis":"","cls":"Core","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Resources & human impact","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSl-GRADE-6-8-YEAR 7-9","stmt":"Construct an argument supported by evidence for how increases in human population and per-capita consumption of natural resources impact Earth's systems — building on Earth as a source of limited resources. [Clarification Statement: Examples of evidence include grade-appropriate databases on human populations and the rates of consumption of food and natural resources (such as freshwater, mineral, and energy). Examples of impacts can include changes to the appearance, composition, and structure of Earth’s systems as well as the rates at which they change. The consequences of increases in human populations and consumption of natural resources are described by science, but science does not make the decisions for the actions society takes.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T12-LO01","x":"1 Supported claims\na Students make a claim, to be supported by evidence, to support or refute an explanation or model for a\ngiven phenomenon. Students include the following idea in their claim: that increases in the size of\nthe human population and per-capita consumption of natural resources affect Earth systems.","k":"Core"},{"c":"ESS-G6–8-T12-LO02","x":"2 Identifying scientific evidence\na Students identify evidence to support the claim from the given materials, including:\ni. Changes in the size of human population(s) in a given region or ecosystem over a given timespan.\nii. Per-capita consumption of resources by humans in a given region or ecosystem over a given\ntimespan.\niii. Changes in Earth systems in a given region or ecosystem over a given timespan.\niv. The ways engineered solutions have altered the effects of human activities on Earth’s systems.","k":"Core"},{"c":"ESS-G6–8-T12-LO03","x":"3 Evaluating and critiquing evidence\na Students evaluate the evidence for its necessity and sufficiency for supporting the claim.","k":"Core"},{"c":"ESS-G6–8-T12-LO04","x":"b Students determine whether the evidence is sufficient to determine causal relationships between\nconsumption of natural resources and the impact on Earth systems.\nc Students consider alternative interpretations of the evidence and describe* why the evidence supports\nthe claim they are making, as opposed to any alternative claims.","k":"Core"},{"c":"ESS-G6–8-T12-LO05","x":"4 Reasoning and synthesis\na Students use reasoning to connect the evidence and evaluation to the claim. In their arguments,\nstudents describe* a chain of reasoning that includes:\ni. Increases in the size of the human population or in the per-capita consumption of a given\npopulation cause increases in the consumption of natural resources.","k":"Core"}]},{"id":"SCI-G6-U2-L3","sub":"Science","g":6,"u":2,"un":"Resources & human impact","l":3,"t":"Population, consumption and Earth's systems — Part 2","role":"Part 2 of 2","topic":"ESS-G6-8-T12","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories, 14. Science and Society","tim":"","pis":"","cls":"Core","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Resources & human impact","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSl-GRADE-6-8-YEAR 7-9","stmt":"Construct an argument supported by evidence for how increases in human population and per-capita consumption of natural resources impact Earth's systems — building on Earth as a source of limited resources. [Clarification Statement: Examples of evidence include grade-appropriate databases on human populations and the rates of consumption of food and natural resources (such as freshwater, mineral, and energy). Examples of impacts can include changes to the appearance, composition, and structure of Earth’s systems as well as the rates at which they change. The consequences of increases in human populations and consumption of natural resources are described by science, but science does not make the decisions for the actions society takes.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T12-LO06","x":"ii. Natural resource consumption causes changes in Earth systems.\niii. Because human population growth affects natural resource consumption and natural resource\nconsumption has an effect on Earth systems, changes in human populations have a causal role in\nchanging Earth systems.\niv. Engineered solutions alter the effects of human populations on Earth systems by changing the\nrate of natural resource consumption or mitigating the effects of changes in Earth systems.","k":"Core"}]},{"id":"SCI-G6-U3-L1","sub":"Science","g":6,"u":3,"un":"Space & the solar system","l":1,"t":"Earth, sun and moon: phases, eclipses and seasons","role":"Single lesson","topic":"ESS-G6-8-T13","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"Core","big":"6. The Universe","dom":"Earth & Space Sciences","area":"Space & the solar system","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ESSm-GRADE-6-8-YEAR 7-9","stmt":"Develop and use a model of the Earth-sun-moon system to describe the cyclic patterns of lunar phases, eclipses of the sun and moon, and seasons — by explaining the seasons through the Earth's tilt. [Clarification Statement: Examples of models can be physical, graphical, or conceptual.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T13-LO01","x":"1 Components of the model\na To make sense of a given phenomenon involving, students develop a model (e.g., physical, conceptual,\ngraphical) of the Earth-moon-sun system in which they identify the relevant components, including:\ni. Earth, including the tilt of its axis of rotation.\nii. Sun.\niii. Moon.\niv. Solar energy.","k":"Core"},{"c":"ESS-G6–8-T13-LO02","x":"b Students indicate the accuracy of size and distance (scale) relationships within the model, including\nany scale limitations within the model.","k":"Core"},{"c":"ESS-G6–8-T13-LO03","x":"2 Relationships\na In their model, students describe* the relationships between components, including:\ni. Earth rotates on its tilted axis once an Earth day.\nii. The moon rotates on its axis approximately once a month.\niii. Relationships between Earth and the moon: 1. The moon orbits Earth approximately once a month.\n2. The moon rotates on its axis at the same rate at which it orbits Earth so that the side of\nthe moon that faces Earth remains the same as it orbits. 3. The moon’s orbital plane is tilted\nwith respect to the plane of the Earth’s orbit around the sun.\niv. Relationships between the Earth-moon system and the sun: 1. Earth-moon system orbits the sun\nonce an Earth year. 2. Solar energy travels in a straight line from the sun to Earth and the\nmoon so that the side of Earth or the moon that faces the sun is illuminated. 3. Solar energy\nreflects off of the side of the moon that faces the sun and can travel to Earth. 4. The distance\nbetween Earth and the sun stays relatively constant throughout the Earth’s orbit. 5. Solar\nenergy travels in a straight line from the sun and hits different parts of the curved Earth at\ndifferent angles — more directly at the equator and less directly at the poles. 6. The Earth’s\nrotation axis is tilted with respect to its orbital plane around the sun. Earth maintains the\nsame relative orientation in space, with its North Pole pointed toward the North Star throughout\nits orbit.","k":"Core"},{"c":"ESS-G6–8-T13-LO04","x":"3 Connections\na Students use patterns observed from their model to provide causal accounts for events, including:\ni. Moon phases: 1. Solar energy coming from the sun bounces off of the moon and is viewed on Earth\nas the bright part of the moon. 2. The visible proportion of the illuminated part of the moon\n(as viewed from Earth) changes over the course of a month as the location of the moon relative\nto Earth and the sun changes. 3. The moon appears to become more fully illuminated until “full”\nand then less fully illuminated until dark, or “new,” in a pattern of change that corresponds to\nwhat proportion of the illuminated part of the moon is visible from Earth.\nii. Eclipses: 1. Solar energy is prevented from reaching the Earth during a solar eclipse because\nthe moon is located between the sun and Earth. 2. Solar energy is prevented from reaching the\nmoon (and thus reflecting off of the moon to Earth) during a lunar eclipse because Earth is\nlocated between the sun and moon. 3. Because the moon’s orbital plane is tilted with respect to\nthe plane of the Earth’s orbit around the sun, for a majority of time during an Earth month, the\nmoon is not in a position to block solar energy from reaching Earth, and Earth is not in a\nposition to block solar energy from reaching the moon.\niii. Seasons: 1. Because the Earth’s axis is tilted, the most direct and intense solar energy occurs\nover the summer months, and the least direct and intense solar energy occurs over the winter\nmonths. 2. The change in season at a given place on Earth is directly related to the orientation\nof the tilted Earth and the position of Earth in its orbit around the sun because of the change\nin the directness and intensity of the solar energy at that place over the course of the year.\na. Summer occurs in the Northern Hemisphere at times in the Earth’s orbit when the northern axis\nof Earth is tilted toward the sun. Summer occurs in the Southern Hemisphere at times in the\nEarth’s orbit when the southern axis of Earth is tilted toward the sun. b. Winter occurs in the\nNorthern Hemisphere at times in the Earth’s orbit when the northern axis of Earth is tilted away\nfrom the sun. Winter occurs in the Southern Hemisphere at times in the Earth’s orbit when the\nsouthern axis of Earth is tilted away from the sun.","k":"Core"},{"c":"ESS-G6–8-T13-LO05","x":"b Students use their model to predict:\ni. The phase of the moon when given the relative locations of the Earth, sun, and moon.\nii. The relative positions of the Earth, sun, and moon when given a moon phase.\niii. Whether an eclipse will occur, given the relative locations of the Earth, sun, and moon and a\nposition on Earth from which the moon or sun can be viewed (depending on the type of eclipse).\niv. The relative positions of the Earth, sun, and moon, given a type of eclipse and a position on\nEarth from which the moon/sun can be viewed.\nv. The season on Earth, given the relative positions of Earth and the sun (including the\norientation of the Earth’s axis) and a position on Earth.\nvi. The relative positions of Earth and the sun when given a season and a relative position (e.g.\nfar north, far south, equatorial) on Earth.","k":"Core"}]},{"id":"SCI-G6-U4-L1","sub":"Science","g":6,"u":4,"un":"Weather & climate","l":1,"t":"The water cycle driven by the sun and gravity","role":"Single lesson","topic":"ESS-G6-8-T5","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"Essential","pis":"","cls":"Core","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Weather & climate","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-ESSe-GRADE-6-8-YEAR 7-9","stmt":"Develop a model to describe the cycling of water through Earth's systems driven by energy from the sun and the force of gravity — modelling our Sun as a star supplying the energy, and gravity as a non-contact force acting at a distance on Earth, returning water through precipitation and downhill flow. Note on alignment: the water-cycle processes (evaporation, condensation, precipitation) are NC Y4 content, not restated at KS3 — carried here as recall at greater depth. [Clarification Statement: Emphasis is on the ways water changes its state as it moves through the multiple pathways of the hydrologic cycle. Examples of models can be conceptual or physical.] [Assessment Boundary: A quantitative understanding of the latent heats of vaporization and fusion is not assessed.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T5-LO01","x":"1 Components of the model\na To make sense of a phenomenon, students develop a model in which they identify the relevant\ncomponents:\ni. Water (liquid, solid, and in the atmosphere).\nii. Energy in the form of sunlight.\niii. Gravity.\niv. Atmosphere.\nv. Landforms.\nvi. Plants and other living things.","k":"Core"},{"c":"ESS-G6–8-T5-LO02","x":"2 Relationships\na In their model, students describe* the relevant relationships between components, including:\ni. Energy transfer from the sun warms water on Earth, which can evaporate into the atmosphere.\nii. Water vapor in the atmosphere forms clouds, which can cool and condense to produce precipitation\nthat falls to the surface of Earth.\niii. Gravity causes water on land to move downhill (e.g., rivers and glaciers) and much of it\neventually flows into oceans.\niv. Some liquid and solid water remains on land in the form of bodies of water and ice sheets.\nv. Some water remains in the tissues of plants and other living organisms, and this water is\nreleased when the tissues decompose.","k":"Core"},{"c":"ESS-G6–8-T5-LO03","x":"3 Connections\na Students use the model to account for both energy from light and the force of gravity driving water\ncycling between oceans, the atmosphere, and land, including that:\ni. Energy from the sun drives the movement of water from the Earth (e.g., oceans, landforms,\nplants) into the atmosphere through transpiration and evaporation.\nii. Water vapor in the atmosphere can cool and condense to form rain or crystallize to form snow or\nice, which returns to Earth when pulled down by gravity.","k":"Core"},{"c":"ESS-G6–8-T5-LO04","x":"iii. Some rain falls back into the ocean, and some rain falls on land. Water that falls on land can:\n1. Be pulled down by gravity to form surface waters such as rivers, which join together and\ngenerally flow back into the ocean. 2. Evaporate back into the atmosphere. 3. Be taken up by\nplants, which release it through transpiration and also eventually through decomposition. 4. Be\ntaken up by animals, which release it through respiration and also eventually through\ndecomposition. 5. Freeze (crystallize) and/or collect in frozen form, in some cases forming\nglaciers or ice sheets. 6. Be stored on land in bodies of water or below ground in aquifers.","k":"Core"},{"c":"ESS-G6–8-T5-LO05","x":"b Students use the model to describe* that the transfer of energy between water and its environment\ndrives the phase changes that drive water cycling through evaporation, transpiration, condensation,\ncrystallization, and precipitation.\nc Students use the model to describe* how gravity interacts with water in different phases and locations\nto drive water cycling between the Earth’s surface and the atmosphere.","k":"Core"}]},{"id":"SCI-G6-U4-L2","sub":"Science","g":6,"u":4,"un":"Weather & climate","l":2,"t":"Causes of global temperature rise","role":"Single lesson","topic":"ESS-G6-8-T8","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories, 14. Science and Society","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Weather & climate","seg":"Exact top-level parsing","code":"ADEK-SCIENCE-ESSh-GRADE-6-8-YEAR 7-9","stmt":"Ask questions to clarify evidence of the factors that have caused the rise in global temperatures over the past century — by examining the production of carbon dioxide by human activity and its impact on climate through exploring the carbon cycle. [Clarification Statement: Examples of factors include human activities (such as fossil fuel combustion, cement production, and agricultural activity) and natural processes (such as changes in incoming solar radiation or volcanic activity). Examples of evidence can include tables, graphs, and maps of global and regional temperatures, atmospheric levels of gases such as carbon dioxide and methane, and the rates of human activities. Emphasis is on the major role that human activities play in causing the rise in global temperatures.]","pdfm":[],"xchk":"","src":"Sciences 6-8.pdf, ADEK Common Core Standards, printed pp. 32–70; ACS Sciences Mapping (source index)","los":[{"c":"ESS-G6–8-T8-LO01","x":"1 Addressing phenomena of the natural world\na Students examine a given claim and the given supporting evidence as a basis for formulating questions.\nStudents ask questions that would identify and clarify the evidence, including:\ni. The relevant ways in which natural processes and/or human activities may have affected the\npatterns of change in global temperatures over the past century.\nii. The influence of natural processes and/or human activities on a gradual or sudden change in\nglobal temperatures in natural systems (e.g., glaciers and arctic ice, and plant and animal\nseasonal movements and life cycle activities).\niii. The influence of natural processes and/or human activities on changes in the concentration of\ncarbon dioxide and other greenhouse gases in the atmosphere over the past century.","k":"Core"},{"c":"ESS-G6–8-T8-LO02","x":"2 Identifying the scientific nature of the question\na Students questions can be answered by examining evidence for:\ni. Patterns in data that connect natural processes and human activities to changes in global\ntemperatures over the past century.\nii. Patterns in data that connect the changes in natural processes and/or human activities related\nto greenhouse gas production to changes in the concentrations of carbon dioxide and other\ngreenhouse gases in the atmosphere.","k":"Core"}]},{"id":"SCI-G6-U5-L1","sub":"Science","g":6,"u":5,"un":"Engineering design","l":1,"t":"Defining a design problem; predictions, risk and how science develops — Part 1","role":"Part 1 of 2","topic":"ETS-G6-8-T1","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"Essential","pis":"","cls":"Core + UK Requirement","big":"13. Science and Technology","dom":"Engineering & Technology","area":"Engineering design","seg":"Provisional segmentation — specialist review","code":"ADEK-SCIENCE-ETSa-GRADE-6-8-YEAR 7-9","stmt":"Define the criteria and constraints of a design problem with sufficient precision to ensure a successful solution, taking into account relevant scientific principles and the potential impacts on people and the natural environment. Furthermore, make predictions using scientific knowledge and understanding; evaluate risks and select appropriate methods for safe and reliable investigations; and recognise that scientific methods, explanations and theories develop as new evidence and ideas emerge, including through the communication, publication and peer review of scientific findings. Experimental skills and investigations: Ask questions and develop a line of enquiry based on observations of the real world, alongside prior knowledge and experience Experimental skills and investigations: Select, plan and carry out the most appropriate types of scientific enquiries to test predictions, including identifying independent, dependent and con
