 organisms led to a drastic change in Earth’s\natmosphere and oceans in which the free oxygen produced caused worldwide deposition of iron\noxide formations, increased weathering due to an oxidizing atmosphere and the evolution of\nanimal life that depends on oxygen for respiration; and\nii. Identify causal links and feedback mechanisms between changes in the biosphere and changes in\nEarth’s other systems.","k":"Core"}]},{"id":"SCI-G9-U2-L1","sub":"Science","g":9,"u":2,"un":"Resources & human impact","l":1,"t":"Natural resources, hazards and human activity — Part 1","role":"Part 1 of 2","topic":"ESS-G9-10-T8","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories, 14. Science and Society","tim":"","pis":"","cls":"Core + UK Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Resources & human impact","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSh-GRADE-9-10-YEAR 10-11","stmt":"Construct an explanation based on evidence for how the availability of natural resources, occurrence of natural hazards, and changes in climate have influenced human activity; achieved through carbon compounds as fuels and feedstock with competing demands for limited resources, and the Earth's water resources. Furthermore, fractional distillation of crude oil and cracking to make more useful materials. Clarification Statement: Examples of key natural resources include access to fresh water (such as rivers, lakes, and groundwater), regions of fertile soils such as river deltas, and high concentrations of minerals and fossil fuels. Examples of natural hazards can be from interior processes (such as volcanic eruptions and earthquakes), surface processes (such as tsunamis, mass wasting and soil erosion), and severe weather (such as hurricanes, floods, and droughts). Examples of the results of changes in climate that can affect populations or drive mass migrations include changes to sea level, regional patterns of temperature and precipitation, and the types of crops and livestock that can be raised.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 43; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T8-LO01","x":"1 Articulating the explanation of phenomena\na Students construct an explanation that includes:\ni. Specific cause and effect relationships between environmental factors (natural hazards, changes\nin climate, and the availability of natural resources) and features of human societies including\npopulation size and migration patterns; and\nii. That technology in modern civilization has mitigated some of the effects of natural hazards,\nclimate, and the availability of natural resources on human activity.","k":"Core"},{"c":"ESS-G9–10-T8-LO02","x":"2 Evidence\na Students identify and describe* the evidence to construct their explanation, including:\ni. Natural hazard occurrences that can affect human activity and have significantly altered the\nsizes and distributions of human populations in particular regions;\nii. Changes in climate that affect human activity (e.g., agriculture) and human populations, and\nthat can drive mass migrations;\niii. Features of human societies that have been affected by the availability of natural resources;\nand\niv. Evidence of the dependence of human populations on technological systems to acquire natural\nresources and to modify physical settings.","k":"Core"},{"c":"ESS-G9–10-T8-LO03","x":"b Students use a variety of valid and reliable sources for the evidence, potentially including theories,\nsimulations, peer review, or students’ own investigations.","k":"Core"},{"c":"ESS-G9–10-T8-LO04","x":"3 Reasoning\na Students use reasoning that connects the evidence, along with the assumption that theories and laws\nthat describe the natural world operate today as they did in the past and will continue to do so in\nthe future, to describe*:\ni. The effect of natural hazards, changes in climate, and the availability of natural resources on\nfeatures of human societies, including population size and migration patterns; and\nii. How technology has changed the cause and effect relationship between the development of human\nsociety and natural hazards, climate, and natural resources.","k":"Core"},{"c":"ESS-G9–10-T8-LO05","x":"b Students describe* reasoning for how the evidence allows for the distinction between causal and\ncorrelational relationships between environmental factors and human activity.\nFurthermore (UK Requirement):","k":"UK Requirement"}]},{"id":"SCI-G9-U2-L2","sub":"Science","g":9,"u":2,"un":"Resources & human impact","l":2,"t":"Natural resources, hazards and human activity — Part 2","role":"Part 2 of 2","topic":"ESS-G9-10-T8","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories, 14. Science and Society","tim":"","pis":"","cls":"Core + UK Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Resources & human impact","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSh-GRADE-9-10-YEAR 10-11","stmt":"Construct an explanation based on evidence for how the availability of natural resources, occurrence of natural hazards, and changes in climate have influenced human activity; achieved through carbon compounds as fuels and feedstock with competing demands for limited resources, and the Earth's water resources. Furthermore, fractional distillation of crude oil and cracking to make more useful materials. Clarification Statement: Examples of key natural resources include access to fresh water (such as rivers, lakes, and groundwater), regions of fertile soils such as river deltas, and high concentrations of minerals and fossil fuels. Examples of natural hazards can be from interior processes (such as volcanic eruptions and earthquakes), surface processes (such as tsunamis, mass wasting and soil erosion), and severe weather (such as hurricanes, floods, and droughts). Examples of the results of changes in climate that can affect populations or drive mass migrations include changes to sea level, regional patterns of temperature and precipitation, and the types of crops and livestock that can be raised.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 43; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T8-LO06","x":"• explain the fractional distillation of crude oil, naming the fractions in order of boiling point and relating each to its use","k":"UK Requirement"},{"c":"ESS-G9–10-T8-LO07","x":"• explain why cracking is carried out, and describe how it converts longer-chain, less useful fractions into shorter-chain alkanes and alkenes that are in higher demand","k":"UK Requirement"}]},{"id":"SCI-G9-U2-L3","sub":"Science","g":9,"u":2,"un":"Resources & human impact","l":3,"t":"Technology that reduces human impact — Part 1","role":"Part 1 of 2","topic":"ESS-G9-10-T10","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology, 14. Science and Society","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Resources & human impact","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSj-GRADE-9-10-YEAR 10-11","stmt":"Evaluate or refine a technological solution that reduces impacts of human activities on natural systems; achieved through mitigation of increased levels of carbon dioxide and methane on the Earth's climate. Furthermore, common atmospheric pollutants - sulphur dioxide, oxides of nitrogen and particulates - and their sources. [Clarification Statement: Examples of data on the impacts of human activities could include the quantities and types of pollutants released, changes to biomass and species diversity, or areal changes in land surface use (such as for urban development, agriculture and livestock, or surface mining). Examples for limiting future impacts could range from local efforts (such as reducing, reusing, and recycling resources) to large-scale geoengineering design solutions (such as altering global temperatures by making large changes to the atmosphere or ocean).]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 44; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T10-LO01","x":"1 Using scientific knowledge to generate the design solution\na Students use scientific information to generate a number of possible refinements to a given\ntechnological solution. Students:\ni. Describe* the system being impacted and how the human activity is affecting that system;\nii. Identify the scientific knowledge and reasoning on which the solution is based;\niii. Describe* how the technological solution functions and may be stabilizing or destabilizing the\nnatural system;\niv. Refine a given technological solution that reduces human impacts on natural systems; and\nv. Describe* that the solution being refined comes from scientists and engineers in the real world\nwho develop technologies to solve problems of environmental degradation.","k":"Core"},{"c":"ESS-G9–10-T10-LO02","x":"2 Describing criteria and constraints, including quantification when appropriate\na Students describe* and quantify (when appropriate):\ni. Criteria and constraints for the solution to the problem; and\nii. The tradeoffs in the solution, considering priorities and other kinds of research-driven\ntradeoffs in explaining why this particular solution is or is not needed.","k":"Core"},{"c":"ESS-G9–10-T10-LO03","x":"3 Evaluating potential refinements\na In their evaluation, students describe* how the refinement will improve the solution to increase\nbenefits and/or decrease costs or risks to people and the environment.","k":"Core"},{"c":"ESS-G9–10-T10-LO04","x":"b Students evaluate the proposed refinements for:\ni. Their effects on the overall stability of and changes in natural systems; and\nii. Cost, safety, aesthetics, and reliability, as well as cultural and environmental impacts.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"ESS-G9–10-T10-LO05","x":"• name the common atmospheric pollutants sulphur dioxide, oxides of nitrogen and particulates, and state the source of each","k":"UK Requirement"}]},{"id":"SCI-G9-U2-L4","sub":"Science","g":9,"u":2,"un":"Resources & human impact","l":4,"t":"Technology that reduces human impact — Part 2","role":"Part 2 of 2","topic":"ESS-G9-10-T10","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"13. Science and Technology, 14. Science and Society","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Resources & human impact","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSj-GRADE-9-10-YEAR 10-11","stmt":"Evaluate or refine a technological solution that reduces impacts of human activities on natural systems; achieved through mitigation of increased levels of carbon dioxide and methane on the Earth's climate. Furthermore, common atmospheric pollutants - sulphur dioxide, oxides of nitrogen and particulates - and their sources. [Clarification Statement: Examples of data on the impacts of human activities could include the quantities and types of pollutants released, changes to biomass and species diversity, or areal changes in land surface use (such as for urban development, agriculture and livestock, or surface mining). Examples for limiting future impacts could range from local efforts (such as reducing, reusing, and recycling resources) to large-scale geoengineering design solutions (such as altering global temperatures by making large changes to the atmosphere or ocean).]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 44; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T10-LO06","x":"• explain how sulphur dioxide and oxides of nitrogen arise from combustion, one from sulphur impurities in the fuel and the other from nitrogen and oxygen reacting at high temperature in the engine or furnace","k":"UK Requirement"},{"c":"ESS-G9–10-T10-LO07","x":"• describe the consequences of each pollutant, distinguishing acid deposition and respiratory harm from the warming effect of greenhouse gases","k":"UK Requirement"},{"c":"ESS-G9–10-T10-LO08","x":"• evaluate a mitigation measure for its effect on these pollutants as well as on carbon dioxide, and say where the two aims pull in different directions","k":"UK Requirement"}]},{"id":"SCI-G9-U3-L1","sub":"Science","g":9,"u":3,"un":"Space & the solar system","l":1,"t":"The life span of the sun and nuclear fusion","role":"Single lesson","topic":"ESS-G9-10-T1","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core","big":"6. The Universe","dom":"Earth & Space Sciences","area":"Space & the solar system","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSa-GRADE-9-10-YEAR 10-11","stmt":"Develop a model based on evidence to illustrate the life span of the sun and the role of nuclear fusion in the sun's core to release energy that eventually reaches Earth in the form of radiation; achieved through nuclear fusion and our Sun's energy. Clarification Statement: Emphasis is on the energy transfer mechanisms that allow energy from nuclear fusion in the sun’s core to reach Earth. Examples of evidence for the model include observations of the masses and lifetimes of other stars, as well as the ways that the sun’s radiation varies due to sudden solar flares (“space weather”), the 11-year sunspot cycle, and non-cyclic variations over centuries.] [Assessment Boundary: Assessment does not include details of the atomic and sub-atomic processes involved with the sun’s nuclear fusion.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 40; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T1-LO01","x":"1 Components of the model\na Students use evidence to develop a model in which they identify and describe* the relevant components,","k":"Core"},{"c":"ESS-G9–10-T1-LO02","x":"including:\ni. Hydrogen as the sun’s fuel;\nii. Helium and energy as the products of fusion processes in the sun; and\niii. That the sun, like all stars, has a life span based primarily on its initial mass, and that the\nsun’s lifespan is about 10 billion years.","k":"Core"},{"c":"ESS-G9–10-T1-LO03","x":"2 Relationships\na In the model, students describe* relationships between the components, including a description* of the\nprocess of radiation, and how energy released by the sun reaches Earth’s system.","k":"Core"},{"c":"ESS-G9–10-T1-LO04","x":"3 Connections\na Students use the model to predict how the relative proportions of hydrogen to helium change as the sun\nages.","k":"Core"},{"c":"ESS-G9–10-T1-LO05","x":"b Students use the model to qualitatively describe* the scale of the energy released by the fusion\nprocess as being much larger than the scale of the energy released by chemical processes.\nc Students use the model to explicitly identify that chemical processes are unable to produce the amount\nof energy flowing out of the sun over long periods of time, thus requiring fusion processes as the\nmechanism for energy release in the sun.","k":"Core"}]},{"id":"SCI-G9-U4-L1","sub":"Science","g":9,"u":4,"un":"Weather & climate","l":1,"t":"Energy flow and changes in climate — Part 1","role":"Part 1 of 2","topic":"ESS-G9-10-T3","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 14. Science and Society","tim":"","pis":"Essential","cls":"Core + US Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Weather & climate","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSc-GRADE-9-10-YEAR 10-11","stmt":"Use a model to describe how variations in the flow of energy into and out of Earth's systems result in changes in climate; achieved through the potential effects of increased levels of carbon dioxide and methane on the Earth's climate. In addition, model climate variation over timescales from decades to millions of years, driven by changes in incoming solar radiation, ocean circulation and human activity. [Clarification Statement: Examples of the causes of climate change differ by timescale, over 1-10 years: large volcanic eruption, ocean circulation; 10-100s of years: changes in human activity, ocean circulation, solar output; 10-100s of thousands of years: changes to Earth's orbit and the orientation of its axis; and 10-100s of millions of years: long-term changes in atmospheric composition.] [Assessment Boundary: Assessment of the results of changes in climate is limited to changes in surface temperatures, precipitation patterns, glacial ice volumes, sea levels, and biosphere distribution.].","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 40; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T3-LO01","x":"1 Components of the model:\na From the given model, students identify and describe* the components of the model relevant for their\nmechanistic descriptions. Given models include at least one factor that affects the input of energy,\nat least one factor that affects the output of energy, and at least one factor that affects the\nstorage and redistribution of energy. Factors are derived from the following list:\ni. Changes in Earth’s orbit and the orientation of its axis;\nii. Changes in the sun’s energy output;\niii. Configuration of continents resulting from tectonic activity;\niv. Ocean circulation;\nv. Atmospheric composition (including amount of water vapor and CO 2);\nvi. Atmospheric circulation;\nvii. Volcanic activity;\nviii. Glaciation;\nix. Changes in extent or type of vegetation cover; and\nx. Human activities.","k":"Core"},{"c":"ESS-G9–10-T3-LO02","x":"b From the given model, students identify the relevant different time scales on which the factors\noperate.","k":"Core"},{"c":"ESS-G9–10-T3-LO03","x":"2 Relationships\na Students identify and describe* the relationships between components of the given model, and organize\nthe factors from the given model into three groups:\ni. Those that affect the input of energy;\nii. Those that affect the output of energy; and\niii. Those that affect the storage and redistribution of energy","k":"Core"},{"c":"ESS-G9–10-T3-LO04","x":"b Students describe* the relationships between components of the model as either causal or\ncorrelational.","k":"Core"},{"c":"ESS-G9–10-T3-LO05","x":"3 Connections\na Students use the given model to provide a mechanistic account of the relationship between energy flow\nin Earth’s systems and changes in climate, including:\ni. The specific cause and effect relationships between the factors and the effect on energy flow\ninto and out of Earth’s systems; and\nii. The net effect of all of the competing factors in changing the climate.\nIn addition (US Requirement):","k":"US Requirement"}]},{"id":"SCI-G9-U4-L2","sub":"Science","g":9,"u":4,"un":"Weather & climate","l":2,"t":"Energy flow and changes in climate — Part 2","role":"Part 2 of 2","topic":"ESS-G9-10-T3","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 14. Science and Society","tim":"","pis":"Essential","cls":"Core + US Requirement","big":"5. Earth Systems","dom":"Earth & Space Sciences","area":"Weather & climate","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-ESSc-GRADE-9-10-YEAR 10-11","stmt":"Use a model to describe how variations in the flow of energy into and out of Earth's systems result in changes in climate; achieved through the potential effects of increased levels of carbon dioxide and methane on the Earth's climate. In addition, model climate variation over timescales from decades to millions of years, driven by changes in incoming solar radiation, ocean circulation and human activity. [Clarification Statement: Examples of the causes of climate change differ by timescale, over 1-10 years: large volcanic eruption, ocean circulation; 10-100s of years: changes in human activity, ocean circulation, solar output; 10-100s of thousands of years: changes to Earth's orbit and the orientation of its axis; and 10-100s of millions of years: long-term changes in atmospheric composition.] [Assessment Boundary: Assessment of the results of changes in climate is limited to changes in surface temperatures, precipitation patterns, glacial ice volumes, sea levels, and biosphere distribution.].","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 40; ACS Sciences Mapping","los":[{"c":"ESS-G9–10-T3-LO06","x":"• model climate variation over decades, attributing it to changes in human activity, in ocean circulation and in the Sun's output","k":"US Requirement"},{"c":"ESS-G9–10-T3-LO07","x":"• model climate variation over centuries, thousands of years and millions of years, and match each driver to the time scale on which it acts","k":"US Requirement"},{"c":"ESS-G9–10-T3-LO08","x":"• compare the size and direction of the change produced by each driver on its stated time scale, and justify which one dominates there","k":"US Requirement"},{"c":"ESS-G9–10-T3-LO09","x":"• explain why a short-term driver such as a large volcanic eruption or an ocean circulation shift cannot account for a trend sustained over a century","k":"US Requirement"}]},{"id":"SCI-G9-U5-L1","sub":"Science","g":9,"u":5,"un":"Body systems & health — Part 1","l":1,"t":"Interacting body systems — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T2","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-Science-BIOb-GRADE-9-10-YEAR 10-11","stmt":"Develop and use a model of the hierarchical organization of interacting body systems that provide specific functions; achieved through the need for transport systems in multicellular organisms including plants, and the structure and function of the human circulatory and nervous systems. Furthermore, explore the structure and function of a reflex arc. [Clarification Statement: Emphasis is on functions at the organism system level such as nutrient uptake, water delivery, and organism movement in response to neural stimuli. An example of an interacting system could be an artery depending on the proper function of elastic tissue and smooth muscle to regulate and deliver the proper amount of blood within the circulatory system.] [Assessment Boundary: Assessment does not include interactions and functions at the molecular or chemical reaction level.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 22; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T2-LO01","x":"1 Components of the model\na Students develop a model in which they identify and describe* the relevant parts (e.g., organ system,\norgans, and their component tissues) and processes (e.g., transport of fluids, motion) of body systems\nin multicellular organisms.","k":"Core"},{"c":"BIO-G9–10-T2-LO02","x":"2 Relationships\na In the model, students describe* the relationships between components, including:\ni. The functions of at least two major body systems in terms of contributions to overall function\nof an organism;\nii. Ways the functions of two different systems affect one another; and\niii. A system’s function and how that relates both to the system’s parts and to the overall function\nof the organism.","k":"Core"},{"c":"BIO-G9–10-T2-LO03","x":"3 Connections\na Students use the model to illustrate how the interaction between systems provides specific functions\nin multicellular organisms.","k":"Core"},{"c":"BIO-G9–10-T2-LO04","x":"b Students make a distinction between the accuracy of the model and actual body systems and functions it\nrepresents.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"BIO-G9–10-T2-LO05","x":"• describe the structure of a reflex arc and the sequence of events in order — stimulus, receptor, sensory neurone, relay neurone in the spinal cord, motor neurone, effector, response","k":"UK Requirement"}]},{"id":"SCI-G9-U5-L2","sub":"Science","g":9,"u":5,"un":"Body systems & health — Part 1","l":2,"t":"Interacting body systems — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T2","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-Science-BIOb-GRADE-9-10-YEAR 10-11","stmt":"Develop and use a model of the hierarchical organization of interacting body systems that provide specific functions; achieved through the need for transport systems in multicellular organisms including plants, and the structure and function of the human circulatory and nervous systems. Furthermore, explore the structure and function of a reflex arc. [Clarification Statement: Emphasis is on functions at the organism system level such as nutrient uptake, water delivery, and organism movement in response to neural stimuli. An example of an interacting system could be an artery depending on the proper function of elastic tissue and smooth muscle to regulate and deliver the proper amount of blood within the circulatory system.] [Assessment Boundary: Assessment does not include interactions and functions at the molecular or chemical reaction level.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 22; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T2-LO06","x":"• explain why a reflex is rapid and involuntary, and why this protects the body from damage","k":"UK Requirement"},{"c":"BIO-G9–10-T2-LO07","x":"• compare a reflex response with a voluntary response that is coordinated by the brain, stating the advantage and the limitation of each","k":"UK Requirement"},{"c":"BIO-G9–10-T2-LO08","x":"• model a reflex arc and use the model to predict the effect of a break in the pathway at a named point","k":"UK Requirement"}]},{"id":"SCI-G9-U5-L3","sub":"Science","g":9,"u":5,"un":"Body systems & health — Part 1","l":3,"t":"Health, disease and communicable diseases — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T24","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 14. Science and Society","tim":"","pis":"Essential","cls":"Core* (TIMSS/PISA)","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-Science-BIOx-GRADE-9-10-YEAR 10-11","stmt":"Explain the relationship between health and disease; describe communicable diseases in humans and non-communicable diseases; and identify bacteria, viruses and fungi as pathogens in animals and plants","pdfm":[],"xchk":"Classification review – Core* (TIMSS/PISA) vs UK Requirement","src":"ADEK CORE STANDARDS 9-10.pdf, p. 29; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T24-LO01","x":"Furthermore (UK Requirement):\n• explain the relationship between health and disease, stating that health is a state of physical and mental wellbeing rather than the mere absence of disease, and that disease is a major cause of ill health","k":"UK Requirement"},{"c":"BIO-G9–10-T24-LO02","x":"• explain how different types of disease may interact, including that defects in the immune system raise the likelihood of infectious disease, that some viruses living in cells can trigger cancers, that immune reactions to a pathogen can trigger allergies, and that severe physical ill health can lead to mental ill health","k":"Core"},{"c":"BIO-G9–10-T24-LO03","x":"• describe communicable diseases in humans, explaining that they are caused by pathogens that can be passed from one host to another, and name the routes by which they spread","k":"Core"},{"c":"BIO-G9–10-T24-LO04","x":"• describe non-communicable diseases, explaining that they are not transmitted between people, and relate their incidence to risk factors such as diet, inactivity, smoking and obesity","k":"Core"},{"c":"BIO-G9–10-T24-LO05","x":"• identify bacteria, viruses and fungi as pathogens of animals and of plants, and state for each group how it causes the symptoms of disease","k":"Core"}]},{"id":"SCI-G9-U5-L4","sub":"Science","g":9,"u":5,"un":"Body systems & health — Part 1","l":4,"t":"Health, disease and communicable diseases — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T24","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 14. Science and Society","tim":"","pis":"Essential","cls":"Core* (TIMSS/PISA)","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-Science-BIOx-GRADE-9-10-YEAR 10-11","stmt":"Explain the relationship between health and disease; describe communicable diseases in humans and non-communicable diseases; and identify bacteria, viruses and fungi as pathogens in animals and plants","pdfm":[],"xchk":"Classification review – Core* (TIMSS/PISA) vs UK Requirement","src":"ADEK CORE STANDARDS 9-10.pdf, p. 29; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T24-LO06","x":"• classify a given disease as communicable or non-communicable and justify the classification by reference to its cause","k":"Core"}]},{"id":"SCI-G9-U5-L5","sub":"Science","g":9,"u":5,"un":"Body systems & health — Part 1","l":5,"t":"Developing medicines and the effects of lifestyle — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T26","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories, 13. Science and Technology, 14. Science and Society","tim":"","pis":"","cls":"UK Requirement","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-Science-BIOz-GRADE-9-10-YEAR 10-11","stmt":"Describe the process of discovery and development of new medicines; evaluate the impact of lifestyle factors on the incidence of non-communicable diseases; and discuss the potential impact of genomics on medicine.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 29; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T26-LO01","x":"Furthermore (UK Requirement):\n• describe how new medicines have been discovered, from compounds extracted from plants and microorganisms to the synthesis and screening of compounds by the pharmaceutical industry","k":"UK Requirement"},{"c":"BIO-G9–10-T26-LO02","x":"• describe the stages by which a new medicine is developed and tested, explaining that preclinical testing on cells, tissues and animals is followed by clinical trials on healthy volunteers and then on patients","k":"UK Requirement"},{"c":"BIO-G9–10-T26-LO03","x":"• explain what each stage of testing is for, naming toxicity, efficacy and the optimum dose, and explain why a double-blind trial with a placebo and random allocation is used","k":"UK Requirement"},{"c":"BIO-G9–10-T26-LO04","x":"• explain the role of peer review and publication in establishing that a medicine works before it is licensed","k":"UK Requirement"},{"c":"BIO-G9–10-T26-LO05","x":"• evaluate the impact of lifestyle factors on the incidence of non-communicable disease, using data to distinguish a factor with an established causal mechanism from one that is only correlated","k":"UK Requirement"}]},{"id":"SCI-G9-U6-L1","sub":"Science","g":9,"u":6,"un":"Body systems & health — Part 2","l":1,"t":"Developing medicines and the effects of lifestyle — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T26","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories, 13. Science and Technology, 14. Science and Society","tim":"","pis":"","cls":"UK Requirement","big":"7. Cells and Life","dom":"Life Sciences","area":"Body systems & health","seg":"Exact top-level parsing","code":"ADEK-Science-BIOz-GRADE-9-10-YEAR 10-11","stmt":"Describe the process of discovery and development of new medicines; evaluate the impact of lifestyle factors on the incidence of non-communicable diseases; and discuss the potential impact of genomics on medicine.","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 29; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T26-LO06","x":"• discuss the potential impact of genomics on medicine, including the identification of genes linked to disease, the understanding and treatment of inherited disorders, and the use of genomic information to tailor treatment, together with the concerns this raises","k":"UK Requirement"}]},{"id":"SCI-G9-U7-L1","sub":"Science","g":9,"u":7,"un":"Cells & organisation","l":1,"t":"DNA, proteins and enzymes — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T1","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"7. Cells and Life","dom":"Life Sciences","area":"Cells & organisation","seg":"Exact top-level parsing","code":"ADEK-Science-BIOa-GRADE-9-10-YEAR 10-11","stmt":"Construct an explanation for how the structure of DNA determines the structure of proteins that carry out the essential functions of life; achieved through the genome as the entire genetic material and proteins among the key biological molecules. Furthermore, enzymes as biological catalysts and factors affecting the rate of enzymatic reactions. [Assessment Boundary: Assessment does not include identification of specific cell or tissue types, whole body systems, specific protein structures and functions, or the biochemistry of protein synthesis.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 22; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T1-LO01","x":"1 Articulating the explanation of phenomena\na Students construct an explanation that includes the idea that regions of DNA called genes determine\nthe structure of proteins, which carry out the essential functions of life through systems of\nspecialized cells.","k":"Core"},{"c":"BIO-G9–10-T1-LO02","x":"2 Evidence\na Students identify and describe* the evidence to construct their explanation, including that:\ni. All cells contain DNA;\nii. DNA contains regions that are called genes;\niii. The sequence of genes contains instructions that code for proteins; and\niv. Groups of specialized cells (tissues) use proteins to carry out functions that are essential to\nthe organism.","k":"Core"},{"c":"BIO-G9–10-T1-LO03","x":"b Students use a variety of valid and reliable sources for the evidence (e.g., theories, simulations,\npeer review, students’ own investigations).","k":"Core"},{"c":"BIO-G9–10-T1-LO04","x":"3 Reasoning\na Students use reasoning to connect evidence, along with the assumption that theories and laws that\ndescribe the natural world operate today as they did in the past and will continue to do so in the\nfuture, to construct the explanation. Students describe* the following chain of reasoning in their\nexplanation:\ni. Because all cells contain DNA, all cells contain genes that can code for the formation of\nproteins.\nii. Body tissues are systems of specialized cells with similar structures and functions, each of\nwhose functions are mainly carried out by the proteins they produce.\niii. Proper function of many proteins is necessary for the proper functioning of the cells.\niv. Gene sequence affects protein function, which in turn affects the function of body tissues.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"BIO-G9–10-T1-LO05","x":"• explain that enzymes are biological catalysts, which increase the rate of a reaction without being used up, and relate the specificity of an enzyme to the shape of its active site","k":"UK Requirement"}]},{"id":"SCI-G9-U7-L2","sub":"Science","g":9,"u":7,"un":"Cells & organisation","l":2,"t":"DNA, proteins and enzymes — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T1","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"7. Cells and Life","dom":"Life Sciences","area":"Cells & organisation","seg":"Exact top-level parsing","code":"ADEK-Science-BIOa-GRADE-9-10-YEAR 10-11","stmt":"Construct an explanation for how the structure of DNA determines the structure of proteins that carry out the essential functions of life; achieved through the genome as the entire genetic material and proteins among the key biological molecules. Furthermore, enzymes as biological catalysts and factors affecting the rate of enzymatic reactions. [Assessment Boundary: Assessment does not include identification of specific cell or tissue types, whole body systems, specific protein structures and functions, or the biochemistry of protein synthesis.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 22; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T1-LO06","x":"• plan and carry out an investigation into one factor affecting the rate of an enzyme-controlled reaction, controlling the other variables, and present the results as a rate","k":"UK Requirement"},{"c":"BIO-G9–10-T1-LO07","x":"• explain the effect of temperature, pH and substrate concentration on the rate of an enzyme-controlled reaction, including the position of the optimum and what happens beyond it","k":"UK Requirement"},{"c":"BIO-G9–10-T1-LO08","x":"• explain denaturation as a change in the shape of the active site, and connect it back to the core claim that the shape of a protein, and therefore its function, was determined by the base sequence of the gene","k":"UK Requirement"}]},{"id":"SCI-G9-U7-L3","sub":"Science","g":9,"u":7,"un":"Cells & organisation","l":3,"t":"Cells as the unit of life and their adaptations — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T23","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core* (TIMSS/PISA)","big":"7. Cells and Life","dom":"Life Sciences","area":"Cells & organisation","seg":"Exact top-level parsing","code":"ADEK-Science-BIOw-GRADE-9-10-YEAR 10-11","stmt":"Describe cells as the basic structural unit of all organisms; relate adaptations of cells to their functions; and identify the main sub-cellular structures of eukaryotic and prokaryotic cells","pdfm":["Core* in ADEK PDF: required for TIMSS/PISA; framework-specific attribution not stated"],"xchk":"Classification review – Core* (TIMSS/PISA) vs Core*","src":"ADEK CORE STANDARDS 9-10.pdf, p. 29; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T23-LO01","x":"• describe the cell as the basic structural unit from which all living organisms are built, and state that organisms are either single cells or assemblies of cells","k":"Core"},{"c":"BIO-G9–10-T23-LO02","x":"• relate the structure of a specialised cell to the function it performs, identifying the feature that makes the function possible","k":"Core"},{"c":"BIO-G9–10-T23-LO03","x":"• explain how a named adaptation of a cell — a large surface area, many mitochondria, a dense packing of one protein, cilia or an elongated shape — serves the work that cell does for the organism","k":"Core"},{"c":"BIO-G9–10-T23-LO04","x":"• identify the main sub-cellular structures of a eukaryotic cell, namely the nucleus, cytoplasm, cell membrane, mitochondria and ribosomes, together with the chloroplasts, permanent vacuole and cellulose cell wall found in plant cells, and state the function of each","k":"Core"},{"c":"BIO-G9–10-T23-LO05","x":"• identify the main sub-cellular structures of a prokaryotic cell and state which eukaryotic structures it lacks, including the absence of a nucleus and of membrane-bound organelles","k":"Core"}]},{"id":"SCI-G9-U7-L4","sub":"Science","g":9,"u":7,"un":"Cells & organisation","l":4,"t":"Cells as the unit of life and their adaptations — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T23","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core* (TIMSS/PISA)","big":"7. Cells and Life","dom":"Life Sciences","area":"Cells & organisation","seg":"Exact top-level parsing","code":"ADEK-Science-BIOw-GRADE-9-10-YEAR 10-11","stmt":"Describe cells as the basic structural unit of all organisms; relate adaptations of cells to their functions; and identify the main sub-cellular structures of eukaryotic and prokaryotic cells","pdfm":["Core* in ADEK PDF: required for TIMSS/PISA; framework-specific attribution not stated"],"xchk":"Classification review – Core* (TIMSS/PISA) vs Core*","src":"ADEK CORE STANDARDS 9-10.pdf, p. 29; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T23-LO06","x":"• compare eukaryotic and prokaryotic cells by structure and by order of magnitude of size, using appropriate units","k":"Core"}]},{"id":"SCI-G9-U8-L1","sub":"Science","g":9,"u":8,"un":"Ecosystems & food webs — Part 1","l":1,"t":"Energy flow and matter cycling in ecosystems — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T8","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOh-GRADE-9-10-YEAR 10-11","stmt":"Use mathematical representations to support claims for the cycling of matter and flow of energy among organisms in an ecosystem, including the inefficiency of transfer between trophic levels achieved through levels of organisation within an ecosystem. [Clarification Statement: Emphasis is on using a mathematical model of stored energy in biomass to describe the transfer of energy from one trophic level to another and that matter and energy are conserved as matter cycles and energy flows through ecosystems. Emphasis is on atoms and molecules such as carbon, oxygen, hydrogen and nitrogen being conserved as they move through an ecosystem.] [Assessment Boundary: Assessment is limited to proportional reasoning to describe the cycling of matter and flow of energy.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 24; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T8-LO01","x":"1 Representation\na Students identify and describe* the components in the mathematical representations that are relevant\nto supporting the claims. The components could include relative quantities related to organisms,\nmatter, energy, and the food web in an ecosystem.","k":"Core"},{"c":"BIO-G9–10-T8-LO02","x":"b Students identify the claims about the cycling of matter and energy flow among organisms in an\necosystem.","k":"Core"},{"c":"BIO-G9–10-T8-LO03","x":"2 Mathematical modeling\na Students describe* how the claims can be expressed as a mathematical relationship in the mathematical\nrepresentations of the components of an ecosystem","k":"Core"},{"c":"BIO-G9–10-T8-LO04","x":"b Students use the mathematical representation(s) of the food web to:\ni. Describe* the transfer of matter (as atoms and molecules) and flow of energy upward between\norganisms and their environment;","k":"Core"},{"c":"BIO-G9–10-T8-LO05","x":"ii. Identify the transfer of energy and matter between tropic levels; and\niii. Identify the relative proportion of organisms at each trophic level by correctly identifying\nproducers as the lowest trophic level having the greatest biomass and energy and consumers\ndecreasing in numbers at higher trophic levels.","k":"Core"}]},{"id":"SCI-G9-U8-L2","sub":"Science","g":9,"u":8,"un":"Ecosystems & food webs — Part 1","l":2,"t":"Energy flow and matter cycling in ecosystems — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T8","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOh-GRADE-9-10-YEAR 10-11","stmt":"Use mathematical representations to support claims for the cycling of matter and flow of energy among organisms in an ecosystem, including the inefficiency of transfer between trophic levels achieved through levels of organisation within an ecosystem. [Clarification Statement: Emphasis is on using a mathematical model of stored energy in biomass to describe the transfer of energy from one trophic level to another and that matter and energy are conserved as matter cycles and energy flows through ecosystems. Emphasis is on atoms and molecules such as carbon, oxygen, hydrogen and nitrogen being conserved as they move through an ecosystem.] [Assessment Boundary: Assessment is limited to proportional reasoning to describe the cycling of matter and flow of energy.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 24; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T8-LO06","x":"3 Analysis\na Students use the mathematical representation(s) to support the claims that include the idea that\nmatter flows between organisms and their environment.","k":"Core"},{"c":"BIO-G9–10-T8-LO07","x":"b Students use the mathematical representation(s) to support the claims that include the idea that\nenergy flows from one trophic level to another as well as through the environment.\nc Students analyze and use the mathematical representation(s) to account for the energy not transferred\nto higher trophic levels but which is instead used for growth, maintenance, or repair, and/or\ntransferred to the environment, and the inefficiencies in transfer of matter and energy.","k":"Core"}]},{"id":"SCI-G9-U8-L3","sub":"Science","g":9,"u":8,"un":"Ecosystems & food webs — Part 1","l":3,"t":"Carrying capacity of ecosystems — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T10","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 14. Science and Society","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOj-GRADE-9-10-YEAR 10-11","stmt":"Use mathematical and/or computational representations to support explanations of factors that affect the carrying capacity of ecosystems at different scales. Emphasis is on quantitative analysis and comparison of the relationships among interdependent factors, including boundaries, resources, climate, and competition. Furthermore, use mathematical and/or computational representations to explore some abiotic and biotic factors that affect communities and the importance of interactions between organisms in a community. [Clarification Statement: Emphasis is on quantitative analysis and comparison of the relationships among interdependent factors including boundaries, resources, climate, and competition. Examples of mathematical comparisons could include graphs, charts, histograms, and population changes gathered from simulations or historical data sets.] [Assessment Boundary: Assessment does not include deriving mathematical equations to make comparisons.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 25; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T10-LO01","x":"1 Representation\na Students identify and describe* the components in the given mathematical and/or computational\nrepresentations (e.g., trends, averages, histograms, graphs, spreadsheets) that are relevant to\nsupporting given explanations of factors that affect carrying capacities of ecosystems at different\nscales. The components include:\ni. The population changes gathered from historical data or simulations of ecosystems at different\nscales; and\nii. Data on numbers and types of organisms as well as boundaries, resources, and climate.","k":"Core"},{"c":"BIO-G9–10-T10-LO02","x":"b Students identify the given explanation(s) to be supported, which include the following ideas: Factors\n(including boundaries, resources, climate, and competition) affect carrying capacity of an ecosystem,\nand:\ni. Some factors have larger effects than do other factors.\nii. Factors are interrelated.\niii. The significance of a factor is dependent on the scale (e.g., a pond vs. an ocean) at which it\noccurs.","k":"Core"},{"c":"BIO-G9–10-T10-LO03","x":"2 Mathematical and/or computational modeling\na Students use given mathematical and/or computational representations (e.g., trends, averages,\nhistograms, graphs, spreadsheets) of ecosystem factors to identify changes over time in the numbers\nand types of organisms in ecosystems of different scales.","k":"Core"},{"c":"BIO-G9–10-T10-LO04","x":"3 Analysis\na Students analyze and use the given mathematical and/or computational representations\ni. To identify the interdependence of factors (both living and nonliving) and resulting effect on\ncarrying capacity; and\nii. As evidence to support the explanation and identify the factors that have the largest effect on\nthe carrying capacity of an ecosystem for a given population.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"BIO-G9–10-T10-LO05","x":"• use mathematical or computational representations to compare the effect of named abiotic factors — light intensity, temperature, moisture, soil pH and mineral content, wind, and carbon dioxide and oxygen availability — on a community","k":"UK Requirement"}]},{"id":"SCI-G9-U8-L4","sub":"Science","g":9,"u":8,"un":"Ecosystems & food webs — Part 1","l":4,"t":"Carrying capacity of ecosystems — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T10","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 14. Science and Society","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOj-GRADE-9-10-YEAR 10-11","stmt":"Use mathematical and/or computational representations to support explanations of factors that affect the carrying capacity of ecosystems at different scales. Emphasis is on quantitative analysis and comparison of the relationships among interdependent factors, including boundaries, resources, climate, and competition. Furthermore, use mathematical and/or computational representations to explore some abiotic and biotic factors that affect communities and the importance of interactions between organisms in a community. [Clarification Statement: Emphasis is on quantitative analysis and comparison of the relationships among interdependent factors including boundaries, resources, climate, and competition. Examples of mathematical comparisons could include graphs, charts, histograms, and population changes gathered from simulations or historical data sets.] [Assessment Boundary: Assessment does not include deriving mathematical equations to make comparisons.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 25; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T10-LO06","x":"• use the same kinds of representation to compare the effect of named biotic factors — availability of food, arrival of a new predator, a new pathogen, and competition between species — on a community","k":"UK Requirement"},{"c":"BIO-G9–10-T10-LO07","x":"• explain from the data why interactions between organisms in a community, including competition, predation and interdependence, matter to the numbers and types of organisms the community can hold","k":"UK Requirement"}]},{"id":"SCI-G9-U8-L5","sub":"Science","g":9,"u":8,"un":"Ecosystems & food webs — Part 1","l":5,"t":"Stability and change in ecosystems — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T12","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOl-GRADE-9-10-YEAR 10-11","stmt":"Evaluate the claims, evidence, and reasoning that complex interactions in ecosystems maintain relatively consistent numbers and types of organisms in stable conditions, but that changing conditions may result in a new ecosystem. Explore how organisms are interdependent and adapted to their environment, and the positive and negative effects of human interactions with ecosystems. [Clarification Statement: Examples of changes in ecosystem conditions could include modest biological or physical changes, such as moderate hunting or a seasonal flood; and extreme changes, such as volcanic eruption or sea level rise.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 25; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T12-LO01","x":"1 Identifying the given explanation and the supporting claims, evidence, and reasoning.\na Students identify the given explanation that is supported by the claims, evidence, and reasoning to be\nevaluated, and which includes the following idea: The complex interactions in ecosystems maintain\nrelatively consistent numbers and types of organisms in stable conditions, but changing conditions may\nresult in a new ecosystem.","k":"Core"},{"c":"BIO-G9–10-T12-LO02","x":"b From the given materials, students identify:\ni. The given claims to be evaluated;\nii. The given evidence to be evaluated; and\niii. The given reasoning to be evaluated.","k":"Core"},{"c":"BIO-G9–10-T12-LO03","x":"2 Identifying any potential additional evidence that is relevant to the evaluation\na Students identify and describe* additional evidence (in the form of data, information, or other\nappropriate forms) that was not provided but is relevant to the explanation and to evaluating the\ngiven claims, evidence, and reasoning:\ni. The factors that affect biodiversity;\nii. The relationships between species and the physical environment in an ecosystem; and\niii. Changes in the numbers of species and organisms in an ecosystem that has been subject to a\nmodest or extreme change in ecosystem conditions.","k":"Core"},{"c":"BIO-G9–10-T12-LO04","x":"3 Evaluating and critiquing\na Students describe* the strengths and weaknesses of the given claim in accurately explaining a\nparticular response of biodiversity to a changing condition, based on an understanding of the factors\nthat affect biodiversity and the relationships between species and the physical environment in an\necosystem.","k":"Core"},{"c":"BIO-G9–10-T12-LO05","x":"b Students use their additional evidence to assess the validity and reliability of the given evidence\nand its ability to support the argument that resiliency of an ecosystem is subject to the degree of\nchange in the biological and physical environment of an ecosystem.\nc Students assess the logic of the reasoning, including the relationship between degree of change and\nstability in ecosystems, and the utility of the reasoning in supporting the explanation of how:","k":"Core"}]},{"id":"SCI-G9-U9-L1","sub":"Science","g":9,"u":9,"un":"Ecosystems & food webs — Part 2","l":1,"t":"Stability and change in ecosystems — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T12","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Ecosystems & food webs","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOl-GRADE-9-10-YEAR 10-11","stmt":"Evaluate the claims, evidence, and reasoning that complex interactions in ecosystems maintain relatively consistent numbers and types of organisms in stable conditions, but that changing conditions may result in a new ecosystem. Explore how organisms are interdependent and adapted to their environment, and the positive and negative effects of human interactions with ecosystems. [Clarification Statement: Examples of changes in ecosystem conditions could include modest biological or physical changes, such as moderate hunting or a seasonal flood; and extreme changes, such as volcanic eruption or sea level rise.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 25; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T12-LO06","x":"i. Modest biological or physical disturbances in an ecosystem result in maintenance of relatively\nconsistent numbers and types of organisms.\nii. Extreme fluctuations in conditions or the size of any population can challenge the functioning\nof ecosystems in terms of resources and habitat availability, and can even result in a new\necosystem.","k":"Core"}]},{"id":"SCI-G9-U10-L1","sub":"Science","g":9,"u":10,"un":"Genetics & inheritance","l":1,"t":"DNA, chromosomes and the coding of traits","role":"Single lesson","topic":"BIO-G9-10-T15","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"9. Inheritance","dom":"Life Sciences","area":"Genetics & inheritance","seg":"Exact top-level parsing","code":"ADEK-Science-BIOo-GRADE-9-10-YEAR 10-11","stmt":"Ask questions to clarify relationships about the role of DNA and chromosomes in coding the instructions for characteristic traits passed from parents to offspring; achieved through single gene inheritance and single gene crosses with dominant and recessive phenotypes. Furthermore, sex determination in humans (Female or Male), and how the genome and its interaction with the environment influence the development of the phenotype [Assessment Boundary: Assessment does not include the phases of meiosis or the biochemical mechanism of specific steps in the process.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 26; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T15-LO01","x":"1 Addressing phenomena or scientific theories\na Students use models of DNA to formulate questions, the answers to which would clarify:\ni. The cause and effect relationships (including distinguishing between causal and correlational\nrelationships) between DNA, the proteins it codes for, and the resulting traits observed in an\norganism;\nii. That the DNA and chromosomes that are used by the cell can be regulated in multiple ways; and\niii. The relationship between the non-protein coding sections of DNA and their functions (e.g.,\nregulatory functions) in an organism.","k":"Core"},{"c":"BIO-G9–10-T15-LO02","x":"2 Evaluating empirical testability\na Students’ questions are empirically testable by scientists.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"BIO-G9–10-T15-LO03","x":"• explain how sex is determined in humans by the X and Y chromosomes, and use a Punnett square to show why the expected ratio of female to male offspring is 1:1","k":"UK Requirement"},{"c":"BIO-G9–10-T15-LO04","x":"• explain how the genome interacts with the environment to influence the development of the phenotype, giving a case in which the same genotype produces different phenotypes under different conditions","k":"UK Requirement"}]},{"id":"SCI-G9-U10-L2","sub":"Science","g":9,"u":10,"un":"Genetics & inheritance","l":2,"t":"Statistics and probability of traits — Part 1","role":"Part 1 of 2","topic":"BIO-G9-10-T17","pt":"Optional","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"Core + UK Requirement","big":"9. Inheritance","dom":"Life Sciences","area":"Genetics & inheritance","seg":"Exact top-level parsing","code":"ADEK-Science-BIOq-GRADE-9-10-YEAR 10-11","stmt":"Apply concepts of statistics and probability to explain the variation and distribution of expressed traits in a population. Furthermore, apply concepts of statistics to explore how most phenotypic features result from multiple genes rather than a single gene. [Clarification Statement: Emphasis is on the use of mathematics to describe the probability of traits as it relates to genetic and environmental factors in the expression of traits.] [Assessment Boundary: Assessment does not include Hardy-Weinberg calculations.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 27; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T17-LO01","x":"1 Organizing data\na Students organize the given data by the frequency, distribution, and variation of expressed traits in\nthe population.","k":"Core"},{"c":"BIO-G9–10-T17-LO02","x":"2 Identifying relationships\na Students perform and use appropriate statistical analyses of data, including probability measures, to\ndetermine the relationship between a trait’s occurrence within a population and environmental factors.","k":"Core"},{"c":"BIO-G9–10-T17-LO03","x":"3 Interpreting data\na Students analyze and interpret data to explain the distribution of expressed traits, including:\ni. Recognition and use of patterns in the statistical analysis to predict changes in trait\ndistribution within a population if environmental variables change; and\nii. Description* of the expression of a chosen trait and its variations as causative or\ncorrelational to some environmental factor based on reliable evidence.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"BIO-G9–10-T17-LO04","x":"• distinguish discontinuous variation, which falls into a small number of discrete categories, from continuous variation, which spreads across a range of values, using the shape of a data set as the evidence","k":"UK Requirement"},{"c":"BIO-G9–10-T17-LO05","x":"• use statistics on real trait data to show that a continuously varying feature is the outcome of many genes of small individual effect acting together, not of one gene","k":"UK Requirement"}]},{"id":"SCI-G9-U10-L3","sub":"Science","g":9,"u":10,"un":"Genetics & inheritance","l":3,"t":"Statistics and probability of traits — Part 2","role":"Part 2 of 2","topic":"BIO-G9-10-T17","pt":"Recommended","pri":"Supporting","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"","cls":"Core + UK Requirement","big":"9. Inheritance","dom":"Life Sciences","area":"Genetics & inheritance","seg":"Exact top-level parsing","code":"ADEK-Science-BIOq-GRADE-9-10-YEAR 10-11","stmt":"Apply concepts of statistics and probability to explain the variation and distribution of expressed traits in a population. Furthermore, apply concepts of statistics to explore how most phenotypic features result from multiple genes rather than a single gene. [Clarification Statement: Emphasis is on the use of mathematics to describe the probability of traits as it relates to genetic and environmental factors in the expression of traits.] [Assessment Boundary: Assessment does not include Hardy-Weinberg calculations.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 27; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T17-LO06","x":"• explain why a single-gene model cannot account for a bell-shaped distribution of a phenotype, while a many-gene model can","k":"UK Requirement"},{"c":"BIO-G9–10-T17-LO07","x":"• describe, with data, how an environmental factor modifies the expression of a polygenic trait and so widens or shifts its distribution","k":"UK Requirement"}]},{"id":"SCI-G9-U11-L1","sub":"Science","g":9,"u":11,"un":"Photosynthesis & respiration","l":1,"t":"Photosynthesis as an energy transformation","role":"Single lesson","topic":"BIO-G9-10-T4","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Photosynthesis & respiration","seg":"Exact top-level parsing","code":"ADEK-Science-BIOd-GRADE-9-10-YEAR 10-11","stmt":"Use a model as word equations or formal chemical symbolic equation to illustrate how photosynthesis transforms light energy into stored chemical energy; achieved through the process of photosynthesis, the factors affecting its rate, and photosynthesis as the key process for food production and therefore biomass for life. [Clarification Statement: Emphasis is on illustrating inputs and outputs of matter and the transfer and transformation of energy in photosynthesis by plants and other photosynthesizing organisms. Examples of models could include diagrams, chemical equations, and conceptual models.] [Assessment Boundary: Assessment does not include specific biochemical steps.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 23; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T4-LO01","x":"1 Components of the model\na From the given model, students identify and describe* the components of the model relevant for\nillustrating that photosynthesis transforms light energy into stored chemical energy by converting\ncarbon dioxide plus water into sugars plus released oxygen, including:\ni. Energy in the form of light;\nii. Breaking of chemical bonds to absorb energy;\niii. Formation of chemical bonds to release energy; and\niv. Matter in the form of carbon dioxide, water, sugar, and oxygen.","k":"Core"},{"c":"BIO-G9–10-T4-LO02","x":"2 Relationships\na Students identify the following relationship between components of the given model: Sugar and oxygen\nare produced by carbon dioxide and water by the process of photosynthesis.","k":"Core"},{"c":"BIO-G9–10-T4-LO03","x":"3 Connections\nc Students use the given model to illustrate:\ni. The transfer of matter and flow of energy between the organism and its environment during\nphotosynthesis; and\nii. Photosynthesis as resulting in the storage of energy in the difference between the energies of\nthe chemical bonds of the inputs (carbon dioxide and water) and outputs (sugar and oxygen).","k":"Core"}]},{"id":"SCI-G9-U11-L2","sub":"Science","g":9,"u":11,"un":"Photosynthesis & respiration","l":2,"t":"Aerobic and anaerobic respiration","role":"Single lesson","topic":"BIO-G9-10-T6","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"","tim":"","pis":"Essential","cls":"Core","big":"8. Energy and Interdependence","dom":"Life Sciences","area":"Photosynthesis & respiration","seg":"Exact top-level parsing","code":"ADEK-Science-BIOf-GRADE-9-10-YEAR 10-11","stmt":"Use a model (e.g., a word summary of anaerobic respiration and/or a balanced symbol equation for aerobic respiration, and a worked equation only for anaerobic respiration) to illustrate that cellular respiration is a chemical process in which the bonds of food and oxygen molecules are broken and new bonds form, releasing energy; achieved through exploring the importance of cellular respiration and the processes of aerobic and anaerobic respiration [Clarification Statement:Emphasis is on the conceptual understanding of the inputs and outputs of the process of cellular respiration.] [Assessment Boundary: Assessment should not include identification of the steps or specific processes involved in cellular respiration.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 23; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T6-LO01","x":"1 Components of the model\na From a given model, students identify and describe* the components of the model relevant for their\nillustration of cellular respiration, including:\ni. Matter in the form of food molecules, oxygen, and the products of their reaction (e.g., water\nand CO2);\nii. The breaking and formation of chemical bonds; and\niii. Energy from the chemical reactions.","k":"Core"},{"c":"BIO-G9–10-T6-LO02","x":"2 Relationships\na From the given model, students describe* the relationships between components, including:\ni. Carbon dioxide and water are produced from sugar and oxygen by the process of cellular\nrespiration; and\nii. The process of cellular respiration releases energy because the energy released when the bonds\nthat are formed in CO2 and water is greater than the energy required to break the bonds of sugar\nand oxygen.","k":"Core"},{"c":"BIO-G9–10-T6-LO03","x":"3 Connections\na Students use the given model to illustrate that:\ni. The chemical reaction of oxygen and food molecules releases energy as the matter is rearranged,\nexisting chemical bonds are broken, and new chemical bonds are formed, but matter and energy are\nneither created nor destroyed.\nii. Food molecules and oxygen transfer energy to the cell to sustain life’s processes, including the\nmaintenance of body temperature despite ongoing energy transfer to the surrounding environment.","k":"Core"}]},{"id":"SCI-G9-U12-L1","sub":"Science","g":9,"u":12,"un":"Variation & natural selection","l":1,"t":"Evolution by natural selection","role":"Single lesson","topic":"BIO-G9-10-T19","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes, 12. Evidence and Theories","tim":"","pis":"Essential","cls":"Core","big":"10. Diversity of Life","dom":"Life Sciences","area":"Variation & natural selection","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOs-GRADE-9-10-YEAR 10-11","stmt":"Construct an explanation that evolution by natural selection results primarily from variation, heritability, competition and differential survival. [Clarification Statement: Emphasis is on using evidence to explain the influence each of the four factors has on number of organisms, behaviors, morphology, or physiology in terms of ability to compete for limited resources and subsequent survival of individuals and adaptation of species. Examples of evidence could include mathematical models such as simple distribution graphs and proportional reasoning.] [Assessment Boundary: Assessment does not include other mechanisms of evolution, such as genetic drift, gene flow through migration, and co-evolution.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 28; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T19-LO01","x":"1 Articulating the explanation of phenomena\na Students construct an explanation that includes a description* that evolution is caused primarily by\none or more of the four factors: (1) the potential for a species to increase in number, (2) the\nheritable genetic variation of individuals in a species due to mutation and sexual reproduction, (3)\ncompetition for limited resources, and (4) the proliferation of those organisms that are better able\nto survive and reproduce in the environment.","k":"Core"},{"c":"BIO-G9–10-T19-LO02","x":"2 Evidence\na Students identify and describe* evidence to construct their explanation, including that:\ni. As a species grows in number, competition for limited resources can arise.\nii. Individuals in a species have genetic variation (through mutations and sexual reproduction) that\nis passed on to their offspring.\niii. Individuals can have specific traits that give them a competitive advantage relative to other\nindividuals in the species.","k":"Core"},{"c":"BIO-G9–10-T19-LO03","x":"b Students use a variety of valid and reliable sources for the evidence (e.g., data from investigations,\ntheories, simulations, peer review).","k":"Core"},{"c":"BIO-G9–10-T19-LO04","x":"3 Reasoning\na Students use reasoning to connect the evidence, along with the assumption that theories and laws that\ndescribe the natural world operate today as they did in the past and will continue to do so in the\nfuture, to construct the explanation. Students describe* the following chain of reasoning for their\nexplanation:\ni. Genetic variation can lead to variation of expressed traits in individuals in a population.\nii. Individuals with traits that give competitive advantages can survive and reproduce at higher\nrates than individuals without the traits because of the competition for limited resources.\niii. Individuals that survive and reproduce at a higher rate will provide their specific genetic\nvariations to a greater proportion of individuals in the next generation.\niv. Over many generations, groups of individuals with particular traits that enable them to survive\nand reproduce in distinct environments using distinct resources can evolve into a different\nspecies.","k":"Core"},{"c":"BIO-G9–10-T19-LO05","x":"b Students use the evidence to describe* the following in their explanation:\ni. The difference between natural selection and biological evolution (natural selection is a\nprocess, and biological evolution can result from that process); and\nii. The cause and effect relationship between genetic variation, the selection of traits that\nprovide comparative advantages, and the evolution of populations that all express the trait.","k":"Core"}]},{"id":"SCI-G9-U12-L2","sub":"Science","g":9,"u":12,"un":"Variation & natural selection","l":2,"t":"Natural selection leads to adaptation","role":"Single lesson","topic":"BIO-G9-10-T21","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"12. Evidence and Theories, 14. Science and Society","tim":"","pis":"Essential","cls":"Core","big":"10. Diversity of Life","dom":"Life Sciences","area":"Variation & natural selection","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-BIOu-GRADE-9-10-YEAR 10-11","stmt":"Construct an explanation based on evidence for how natural selection leads to adaptation of populations, exploring how organisms are interdependent and adapted to their environment. [Clarification Statement: Emphasis is on using data to provide evidence for how specific biotic and abiotic differences in ecosystems (such as ranges of seasonal temperature, long-term climate change, acidity, light, geographic barriers, or evolution of other organisms) contribute to a change in gene frequency over time, leading to adaptation of populations.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 28; ACS Sciences Mapping","los":[{"c":"BIO-G9–10-T21-LO01","x":"1 Articulating the explanation of phenomena\na Students construct an explanation that identifies the cause and effect relationship between natural\nselection and adaptation.","k":"Core"},{"c":"BIO-G9–10-T21-LO02","x":"2 Evidence\na Students identify and describe* the evidence to construct their explanation, including:\ni. Changes in a population when some feature of the environment changes;\nii. Relative survival rates of organisms with different traits in a specific environment;\niii. The fact that individuals in a species have genetic variation (through mutations and sexual\nreproduction) that is passed on to their offspring; and\niv. The fact that individuals can have specific traits that give them a competitive advantage\nrelative to other individuals in the species.","k":"Core"},{"c":"BIO-G9–10-T21-LO03","x":"b Students use a variety of valid and reliable sources for the evidence (e.g., theories, simulations,\npeer review, students’ own investigations)","k":"Core"},{"c":"BIO-G9–10-T21-LO04","x":"3 Reasoning\na Students use reasoning to synthesize the valid and reliable evidence to distinguish between cause and\ncorrelation to construct the explanation about how natural selection provides a mechanism for species\nto adapt to changes in their environment, including the following elements:\ni. Biotic and abiotic differences in ecosystems contribute to changes in gene frequency over time\nthrough natural selection.\nii. Increasing gene frequency in a population results in an increasing fraction of the population in\neach successive generation that carries a particular gene and expresses a particular trait.\niii. Over time, this process leads to a population that is adapted to a particular environment by the\nwidespread expression of a trait that confers a competitive advantage in that environment.","k":"Core"}]},{"id":"SCI-G9-U13-L1","sub":"Science","g":9,"u":13,"un":"Atoms & the Periodic Table","l":1,"t":"The Periodic Table and electron patterns — Part 1","role":"Part 1 of 2","topic":"CHE-G9-10-T1","pt":"Optional","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Atoms & the Periodic Table","seg":"Provisional segmentation — specialist review","code":"ADEK-Science-CHEa-GRADE-9-10-YEAR 10-11","stmt":"Use the periodic table as a model to predict the relative properties of elements based on the patterns of electrons in the outermost energy level of atoms; achieved through exploring the simple atomic model (nucleus, electrons, relative atomic mass, isotopes), the modern Periodic Table arranged by atomic number, and trends in properties within groups. Furthermore, explore the characteristic properties of metals and non-metals. [Clarification Statement: Examples of properties that could be predicted from patterns could include reactivity of metals, types of bonds formed, numbers of bonds formed, and reactions with oxygen.] [Assessment Boundary: Assessment is limited to main group elements. Assessment does not include quantitative understanding of ionization energy beyond relative trends.]","pdfm":[],"xchk":"","src":"ADEK CORE STANDARDS 9-10.pdf, p. 30; ACS Sciences Mapping","los":[{"c":"CHE-G9–10-T1-LO01","x":"1 Components of the model\na From the given model, students identify and describe* the components of the model that are relevant\nfor their predictions, including:\ni. Elements and their arrangement in the periodic table;\nii. A positively-charged nucleus composed of both protons and neutrons, surrounded by\nnegatively-charged electrons;\niii. Electrons in the outermost energy level of atoms (i.e., valence electrons); and\niv. The number of protons in each element.","k":"Core"},{"c":"CHE-G9–10-T1-LO02","x":"2 Relationships\na Students identify and describe* the following relationships between components in the given model,\nincluding:\ni. The arrangement of the main groups of the periodic table reflects the patterns of outermost\nelectrons.\nii. Elements in the periodic table are arranged by the numbers of protons in atoms.","k":"Core"},{"c":"CHE-G9–10-T1-LO03","x":"3 Connections\na Students use the periodic table to predict the patterns of behavior of the elements based on the\nattraction and repulsion between electrically charged particles and the patterns of outermost\nelectrons that determine the typical reactivity of an atom.","k":"Core"},{"c":"CHE-G9–10-T1-LO04","x":"b Students predict the following patterns of properties:\ni. The number and types of bonds formed (i.e. ionic, covalent, metallic) by an element and between\nelements;\nii. The number and charges in stable ions that form from atoms in a group of the periodic table;\niii. The trend in reactivity and electronegativity of atoms down a group, and across a row in the\nperiodic table, based on attractions of outermost (valence) electrons to the nucleus; and\niv. The relative sizes of atoms both across a row and down a group in the periodic table.\nFurthermore (UK Requirement):","k":"UK Requirement"},{"c":"CHE-G9–10-T1-LO05","x":"• describe the characteristic properties of metals — lustre, malleability, electrical and thermal conductivity, and the tendency to lose electrons and form positive ions","k":"UK Requirement"}]},{"id":"SCI-G9-U13-L2","sub":"Science","g":9,"u":13,"un":"Atoms & the Periodic Table","l":2,"t":"The Periodic Table and electron patterns — Part 2","role":"Part 2 of 2","topic":"CHE-G9-10-T1","pt":"Recommended","pri":"Essential","prov":true,"win":"To be scheduled","added":false,"ideas":"11. Seeking Causes","tim":"","pis":"Essential","cls":"Core + UK Requirement","big":"1. Particles","dom":"Physical Sciences — Chemistry","area":"Atoms & the Periodic Table","seg":"Provisional segmentation — specialist review","code":"ADEK-Sc
